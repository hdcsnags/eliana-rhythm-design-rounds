drop').classList.remove('active');\n    document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('open'));\n  }\n\n  /* ========================================================\n     THEME CYCLING (Obsidian -> Lapis -> Dawn)\n     ======================================================== */\n  const themes = ['obsidian', 'lapis', 'dawn'];\n  let currentThemeIdx = 0;\n\n  function cycleTheme() {\n    currentThemeIdx = (currentThemeIdx + 1) % themes.length;\n    const nextTheme = themes[currentThemeIdx];\n    document.body.setAttribute('data-theme', nextTheme);\n  }\n\n  /* ========================================================\n     TRANSLATION TOGGLE\n     ======================================================== */\n  const translations = ['BSB', '\u2726 Eliana', 'KJV', 'ASV'];\n  let transIdx = 0;\n\n  function cycleTranslation() {\n    transIdx = (transIdx + 1) % translations.length;\n    document.getElementById('trans-label').textContent = translations[transIdx];\n  }\n\n  function toggleHebrewVod(btn) {\n    const block = document.getElementById('vod-hebrew-block');\n    if (block.style.display === 'none') {\n      block.style.display = 'block';\n      btn.classList.add('active');\n    } else {\n      block.style.display = 'none';\n      btn.classList.remove('active');\n    }\n  }\n\n  /* ========================================================\n     ELIANA CHAT INTERACTIVITY\n     ======================================================== */\n  function sendChatMessage() {\n    const input = document.getElementById('chat-input-field');\n    const text = input.value.trim();\n    if (!text) return;\n    input.value = '';\n\n    simulateUserAsk(text);\n  }\n\n  function simulateUserAsk(text) {\n    const stream = document.getElementById('chat-stream');\n\n    // Add user message\n    const userBubble = document.createElement('div');\n    userBubble.className = 'chat-bubble user';\n    userBubble.textContent = text;\n    stream.appendChild(userBubble);\n\n    // Add streaming reply\n    setTimeout(() => {\n      const elianaBubble = document.createElement('div');\n      elianaBubble.className = 'chat-bubble eliana';\n      \n      if (text.includes('pray') || text.includes('Prayer')) {\n        elianaBubble.innerHTML = \"<em>Lord God of the unformed waters,<\/em><br><br>Where my life feels scattered and hurried today, let Your Ruach hover in stillness. Speak Your light into my quiet tasks, and teach my heart to rest in the rhythm of Your grace. Amen.\";\n      } else if (text.includes('tohu')) {\n        elianaBubble.innerHTML = \"In ancient Semitic thought, <em>tohu va-vohu<\/em> represents desert chaos waiting for sanctuary architecture. Genesis 1 is the temple building of the cosmos: God constructing a home where He and humanity may dwell together in holy rhythm.\";\n      } else {\n        elianaBubble.innerHTML = \"The deeper you descend into the original Hebrew, Michael, the more you discover that Scripture is not an argument\u2014it is an encounter. Let us sit with <span class='chat-scripture-ref' onclick='switchTab(\\\"bible\\\")'>Genesis 1:2<\/span> and allow its ancient rhythm to quiet your day.\";\n      }\n\n      stream.appendChild(elianaBubble);\n      stream.scrollTop = stream.scrollHeight;\n    }, 450);\n  }\n<\/script>\n\n<\/body>\n<\/html>\n<!--\nIdea:\nEliana's Rhythm moves from a utilitarian reader into an illuminated nocturnal sanctuary: replacing punitive streak counters with an organic diurnal 'Rhythm of Grace', and elevating Michael's original dark-and-gold vision from flat contrast into an atmospheric illuminated manuscript. By seamlessly fusing classical flowing Bible reading, interactive four-layer interlinear Hebrew scholarship (where every word is a portal into Strong's grammar), and Eliana's ambient pastoral companionship, Scripture becomes an intimate rhythm of life rather than a study chore.\n-->\n"}, {"letter": "C", "seat": "argon", "file": "mockup.html", "html": "<!-- Model: Gemini 4 Argon (High) -->\n<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"night-watch\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=5.0\" />\n  <title>Eliana's Rhythm \u2014 The Meridian &amp; The Polyglot Margin<\/title>\n  <style>\n    /* ==========================================================================\n       ELIANA'S RHYTHM \u2014 NEXT STEP FORWARD\n       Visual Architecture: \"Lapis Nocturne & The Polyglot Margin\"\n       - Rejects generic beige/terracotta/sage templates.\n       - Evolves Michael's dark-and-gold instinct into a deep astronomical lapis\n         sanctuary (#0A0E17 -> #121A2B) with warm bone vellum ink (#F3EFE6),\n         starlight electrum reserved for \u2726 Eliana (#E4C17A), rubric cinnabar\n         for Scripture Chains \u26d3 (#E07A5F), and lapis-azure for Hebrew/Greek\n         morphology (#7AB3E0).\n       - Includes all 4 live Settings themes (Night Watch, First Light, Codex,\n         High Contrast).\n       ========================================================================== */\n\n    :root,\n    [data-theme=\"night-watch\"] {\n      --bg-outer: #05080E;\n      --bg-canvas: #0A0E17;\n      --bg-elevated: #111827;\n      --bg-card: #141D2F;\n      --bg-card-alt: #182338;\n      --bg-subtle: rgba(255, 255, 255, 0.035);\n      --bg-glass: rgba(12, 17, 29, 0.90);\n      --bg-eliana-wash: rgba(228, 193, 122, 0.075);\n      --bg-azure-wash: rgba(122, 179, 224, 0.09);\n      --bg-cinnabar-wash: rgba(224, 122, 95, 0.10);\n      --bg-teal-wash: rgba(104, 176, 171, 0.10);\n\n      --ink-primary: #F3EFE6;\n      --ink-secondary: #C6D0DF;\n      --ink-muted: #7F8EA5;\n      --ink-faint: #4F5D73;\n\n      --gold: #E4C17A;\n      --gold-bright: #F3D79B;\n      --gold-dim: rgba(228, 193, 122, 0.25);\n      --cinnabar: #E07A5F;\n      --azure: #7AB3E0;\n      --teal: #68B0AB;\n\n      --border-hairline: rgba(243, 239, 230, 0.08);\n      --border-gold: rgba(228, 193, 122, 0.28);\n      --border-azure: rgba(122, 179, 224, 0.28);\n      --border-cinnabar: rgba(224, 122, 95, 0.30);\n\n      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.45);\n      --scripture-scale: 1;\n    }\n\n    /* Theme 2: First Light (Cool Dawn Limestone, Prussian Navy & Ultramarine) */\n    [data-theme=\"first-light\"] {\n      --bg-outer: #DCE3EE;\n      --bg-canvas: #EEF2F7;\n      --bg-elevated: #F8FAFC;\n      --bg-card: #FFFFFF;\n      --bg-card-alt: #E6ECF5;\n      --bg-subtle: rgba(15, 26, 44, 0.04);\n      --bg-glass: rgba(238, 242, 247, 0.92);\n      --bg-eliana-wash: rgba(158, 107, 28, 0.07);\n      --bg-azure-wash: rgba(34, 87, 158, 0.08);\n      --bg-cinnabar-wash: rgba(186, 74, 52, 0.08);\n      --bg-teal-wash: rgba(35, 116, 112, 0.08);\n\n      --ink-primary: #0F1A2C;\n      --ink-secondary: #2E3E57;\n      --ink-muted: #5C6E87;\n      --ink-faint: #8FA0B8;\n\n      --gold: #9E6B1C;\n      --gold-bright: #7D5210;\n      --gold-dim: rgba(158, 107, 28, 0.25);\n      --cinnabar: #BA4A34;\n      --azure: #22579E;\n      --teal: #237470;\n\n      --border-hairline: rgba(15, 26, 44, 0.10);\n      --border-gold: rgba(158, 107, 28, 0.28);\n      --border-azure: rgba(34, 87, 158, 0.25);\n      --border-cinnabar: rgba(186, 74, 52, 0.25);\n\n      --shadow-soft: 0 8px 24px rgba(15, 26, 44, 0.08);\n    }\n\n    /* Theme 3: Polyglot Codex (Monastery Vellum, Iron-Gall & Rubric) */\n    [data-theme=\"codex\"] {\n      --bg-outer: #E2D9C8;\n      --bg-canvas: #F3EDE0;\n      --bg-elevated: #FAF6EE;\n      --bg-card: #FDFBF7;\n      --bg-card-alt: #EAE1D0;\n      --bg-subtle: rgba(32, 25, 18, 0.045);\n      --bg-glass: rgba(243, 237, 224, 0.92);\n      --bg-eliana-wash: rgba(148, 102, 25, 0.08);\n      --bg-azure-wash: rgba(41, 86, 128, 0.08);\n      --bg-cinnabar-wash: rgba(168, 58, 43, 0.09);\n      --bg-teal-wash: rgba(46, 107, 98, 0.08);\n\n      --ink-primary: #1D1814;\n      --ink-secondary: #3F372F;\n      --ink-muted: #706458;\n      --ink-faint: #9E9183;\n\n      --gold: #8F6114;\n      --gold-bright: #6E490A;\n      --gold-dim: rgba(143, 97, 20, 0.26);\n      --cinnabar: #A83A2B;\n      --azure: #295680;\n      --teal: #2E6B62;\n\n      --border-hairline: rgba(29, 24, 20, 0.11);\n      --border-gold: rgba(143, 97, 20, 0.30);\n      --border-azure: rgba(41, 86, 128, 0.25);\n      --border-cinnabar: rgba(168, 58, 43, 0.28);\n\n      --shadow-soft: 0 8px 24px rgba(29, 24, 20, 0.08);\n    }\n\n    /* Theme 4: High Contrast (Settings Accessibility OLED Mode) */\n    [data-theme=\"high-contrast\"] {\n      --bg-outer: #000000;\n      --bg-canvas: #000000;\n      --bg-elevated: #090C12;\n      --bg-card: #0E131D;\n      --bg-card-alt: #161E2E;\n      --bg-subtle: rgba(255, 255, 255, 0.07);\n      --bg-glass: rgba(0, 0, 0, 0.95);\n      --bg-eliana-wash: rgba(255, 212, 96, 0.13);\n      --bg-azure-wash: rgba(92, 200, 255, 0.14);\n      --bg-cinnabar-wash: rgba(255, 128, 102, 0.14);\n      --bg-teal-wash: rgba(86, 227, 211, 0.14);\n\n      --ink-primary: #FFFFFF;\n      --ink-secondary: #E6ECF5;\n      --ink-muted: #A9B7CC;\n      --ink-faint: #6D7D96;\n\n      --gold: #FFD460;\n      --gold-bright: #FFE394;\n      --gold-dim: rgba(255, 212, 96, 0.45);\n      --cinnabar: #FF8566;\n      --azure: #5CC8FF;\n      --teal: #56E3D3;\n\n      --border-hairline: rgba(255, 255, 255, 0.22);\n      --border-gold: rgba(255, 212, 96, 0.55);\n      --border-azure: rgba(92, 200, 255, 0.55);\n      --border-cinnabar: rgba(255, 133, 102, 0.55);\n\n      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.8);\n    }\n\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n      -webkit-tap-highlight-color: transparent;\n    }\n\n    html {\n      scroll-behavior: smooth;\n      background: var(--bg-outer);\n      color: var(--ink-primary);\n      font-family: -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Inter\", \"Segoe UI\", Roboto, sans-serif;\n      -webkit-font-smoothing: antialiased;\n    }\n\n    body {\n      width: 100%;\n      max-width: 390px;\n      margin: 0 auto;\n      min-height: 844px;\n      background: var(--bg-canvas);\n      color: var(--ink-primary);\n      overflow-x: hidden;\n      position: relative;\n      padding-bottom: 86px;\n      box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);\n    }\n\n    /* Typography Families */\n    .font-serif {\n      font-family: \"Iowan Old Style\", \"Palatino Linotype\", Palatino, \"Charter\", \"Book Antiqua\", Georgia, serif;\n    }\n    .font-mono {\n      font-family: \"SF Mono\", \"JetBrains Mono\", Menlo, Consolas, monospace;\n    }\n    .font-hebrew {\n      font-family: \"SBL Hebrew\", \"Ezra SIL\", \"New Peninim MT\", \"Corsiva Hebrew\", \"Times New Roman\", \"Geeza Pro\", serif;\n    }\n    .font-greek {\n      font-family: \"SBL Greek\", \"Gentium Plus\", \"Palatino Linotype\", Palatino, \"Iowan Old Style\", Georgia, serif;\n    }\n\n    /* ==========================================================================\n       STICKY STATUS & THEME / CONCEPT BAR\n       ========================================================================== */\n    .app-topbar {\n      position: sticky;\n      top: 0;\n      z-index: 100;\n      background: var(--bg-glass);\n      backdrop-filter: blur(14px);\n      -webkit-backdrop-filter: blur(14px);\n      border-bottom: 1px solid var(--border-hairline);\n      padding: 8px 14px 7px;\n    }\n\n    .topbar-row-1 {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 6px;\n    }\n\n    .brand-mark {\n      display: flex;\n      align-items: center;\n      gap: 6px;\n      font-size: 13px;\n      font-weight: 600;\n      letter-spacing: 0.03em;\n      color: var(--ink-primary);\n    }\n\n    .brand-sigil {\n      color: var(--gold);\n      font-size: 14px;\n      line-height: 1;\n    }\n\n    .brand-sub {\n      font-size: 10px;\n      font-weight: 500;\n      color: var(--ink-muted);\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n      margin-left: 2px;\n    }\n\n    .top-utilities {\n      display: flex;\n      align-items: center;\n      gap: 4px;\n    }\n\n    .theme-pill {\n      appearance: none;\n      border: 1px solid var(--border-hairline);\n      background: var(--bg-subtle);\n      color: var(--ink-muted);\n      font-size: 10px;\n      font-weight: 600;\n      padding: 3px 7px;\n      border-radius: 999px;\n      cursor: pointer;\n      transition: all 0.18s ease;\n    }\n\n    .theme-pill.active {\n      border-color: var(--border-gold);\n      background: var(--bg-eliana-wash);\n      color: var(--gold);\n    }\n\n    .scale-btn {\n      appearance: none;\n      border: 1px solid var(--border-hairline);\n      background: var(--bg-subtle);\n      color: var(--ink-secondary);\n      font-size: 10px;\n      font-weight: 700;\n      padding: 3px 6px;\n      border-radius: 6px;\n      cursor: pointer;\n    }\n\n    /* Quick Screen Jump Ribbon inside Sticky Header */\n    .screen-jump-bar {\n      display: flex;\n      align-items: center;\n      gap: 4px;\n      overflow-x: auto;\n      scrollbar-width: none;\n    }\n    .screen-jump-bar::-webkit-scrollbar {\n      display: none;\n    }\n\n    .jump-chip {\n      appearance: none;\n      border: none;\n      background: transparent;\n      color: var(--ink-muted);\n      font-size: 10.5px;\n      font-weight: 600;\n      padding: 3px 8px;\n      border-radius: 6px;\n      white-space: nowrap;\n      cursor: pointer;\n      text-decoration: none;\n      transition: all 0.15s ease;\n    }\n\n    .jump-chip.active,\n    .jump-chip:hover {\n      background: var(--bg-eliana-wash);\n      color: var(--gold);\n    }\n\n    /* ==========================================================================\n       SCREEN SECTION CONTAINERS (390x844 Chapters)\n       ========================================================================== */\n    .screen-chapter {\n      position: relative;\n      min-height: 844px;\n      padding: 16px 14px 28px;\n      border-bottom: 1px solid var(--border-hairline);\n    }\n\n    .chapter-flag {\n      display: inline-flex;\n      align-items: center;\n      gap: 6px;\n      font-size: 10px;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n      color: var(--gold);\n      background: var(--bg-eliana-wash);\n      border: 1px solid var(--border-gold);\n      padding: 3px 9px;\n      border-radius: 999px;\n      margin-bottom: 10px;\n    }\n\n    .chapter-flag.azure {\n      color: var(--azure);\n      background: var(--bg-azure-wash);\n      border-color: var(--border-azure);\n    }\n\n    .chapter-flag.cinnabar {\n      color: var(--cinnabar);\n      background: var(--bg-cinnabar-wash);\n      border-color: var(--border-cinnabar);\n    }\n\n    /* ==========================================================================\n       SCREEN 1: HOME \u2014 \"THE DAILY RHYTHM\" (MERIDIAN THREAD)\n       ========================================================================== */\n    .horizon-header {\n      position: relative;\n      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-canvas) 100%);\n      border: 1px solid var(--border-hairline);\n      border-radius: 16px;\n      padding: 14px 14px 13px;\n      margin-bottom: 14px;\n      overflow: hidden;\n    }\n\n    .horizon-svg {\n      width: 100%;\n      height: 34px;\n      display: block;\n      margin-bottom: 4px;\n    }\n\n    .hour-row {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 6px;\n    }\n\n    .hour-tag {\n      font-size: 10.5px;\n      font-weight: 600;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n      color: var(--gold);\n      display: flex;\n      align-items: center;\n      gap: 5px;\n    }\n\n    .hour-switcher {\n      display: flex;\n      gap: 3px;\n    }\n\n    .hour-btn {\n      appearance: none;\n      border: 1px solid var(--border-hairline);\n      background: var(--bg-subtle);\n      color: var(--ink-muted);\n      font-size: 9.5px;\n      padding: 2px 6px;\n      border-radius: 99px;\n      cursor: pointer;\n    }\n\n    .hour-btn.active {\n      color: var(--gold);\n      border-color: var(--border-gold);\n      background: var(--bg-eliana-wash);\n    }\n\n    .greeting-title {\n      font-size: 22px;\n      font-weight: 500;\n      line-height: 1.22;\n      color: var(--ink-primary);\n      margin-bottom: 4px;\n    }\n\n    .greeting-sub {\n      font-size: 12.5px;\n      line-height: 1.45;\n      color: var(--ink-secondary);\n    }\n\n    /* The Meridian Thread Layout */\n    .meridian-flow {\n      position: relative;\n      padding-left: 26px;\n    }\n\n    .meridian-flow::before {\n      content: \"\";\n      position: absolute;\n      left: 9px;\n      top: 12px;\n      bottom: 18px;\n      width: 1.5px;\n      background: linear-gradient(\n        180deg,\n        var(--teal) 0%,\n        var(--gold) 32%,\n        var(--cinnabar) 68%,\n        var(--azure) 100%\n      );\n      opacity: 0.55;\n    }\n\n    .rhythm-beat {\n      position: relative;\n      margin-bottom: 14px;\n    }\n\n    .beat-node {\n      position: absolute;\n      left: -25px;\n      top: 13px;\n      width: 18px;\n      height: 18px;\n      border-radius: 50%;\n      background: var(--bg-canvas);\n      border: 1.5px solid var(--gold);\n      color: var(--gold);\n      font-size: 9px;\n      font-weight: 700;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      z-index: 2;\n    }\n\n    .beat-node.teal {\n      border-color: var(--teal);\n      color: var(--teal);\n    }\n    .beat-node.cinnabar {\n      border-color: var(--cinnabar);\n      color: var(--cinnabar);\n    }\n    .beat-node.azure {\n      border-color: var(--azure);\n      color: var(--azure);\n    }\n\n    .beat-card {\n      background: var(--bg-card);\n      border: 1px solid var(--border-hairline);\n      border-radius: 14px;\n      padding: 13px 13px 12px;\n      box-shadow: var(--shadow-soft);\n    }\n\n    .beat-card.featured-word {\n      border-color: var(--border-gold);\n      background: linear-gradient(165deg, var(--bg-card) 0%, var(--bg-card-alt) 100%);\n    }\n\n    .beat-header {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 7px;\n      gap: 6px;\n    }\n\n    .beat-kicker {\n      font-size: 10px;\n      font-weight: 700;\n      letter-spacing: 0.1em;\n      text-transform: uppercase;\n      color: var(--ink-muted);\n    }\n\n    .beat-kicker.gold { color: var(--gold); }\n    .beat-kicker.teal { color: var(--teal); }\n    .beat-kicker.cinnabar { color: var(--cinnabar); }\n    .beat-kicker.azure { color: var(--azure); }\n\n    .badge-pill {\n      display: inline-flex;\n      align-items: center;\n      gap: 4px;\n      font-size: 10px;\n      font-weight: 600;\n      padding: 2px 7px;\n      border-radius: 999px;\n      border: 1px solid var(--border-hairline);\n      background: var(--bg-subtle);\n      color: var(--ink-secondary);\n      text-decoration: none;\n      cursor: pointer;\n    }\n\n    .badge-pill.chain {\n      color: var(--cinnabar);\n      border-color: var(--border-cinnabar);\n      background: var(--bg-cinnabar-wash);\n    }\n\n    .badge-pill.gold {\n      color: var(--gold);\n      border-color: var(--border-gold);\n      background: var(--bg-eliana-wash);\n    }\n\n    .badge-pill.teal {\n      color: var(--teal);\n      border-color: rgba(104, 176, 171, 0.35);\n      background: var(--bg-teal-wash);\n    }\n\n    /* Beat 1: Stillness Inline Pause */\n    .stillness-row {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 10px;\n    }\n\n    .stillness-copy h4 {\n      font-size: 14px;\n      font-weight: 600;\n      color: var(--ink-primary);\n      margin-bottom: 2px;\n    }\n\n    .stillness-copy p {\n      font-size: 12px;\n      color: var(--ink-secondary);\n      line-height: 1.38;\n    }\n\n    .breath-orb-btn {\n      appearance: none;\n      border: 1px solid rgba(104, 176, 171, 0.45);\n      background: var(--bg-teal-wash);\n      color: var(--teal);\n      border-radius: 999px;\n      padding: 7px 11px;\n      font-size: 11px;\n      font-weight: 600;\n      display: inline-flex;\n      align-items: center;\n      gap: 6px;\n      cursor: pointer;\n      white-space: nowrap;\n      transition: all 0.25s ease;\n    }\n\n    .breath-dot {\n      width: 8px;\n      height: 8px;\n      border-radius: 50%;\n      background: var(--teal);\n      box-shadow: 0 0 8px var(--teal);\n      animation: pulseOrb 4s infinite ease-in-out;\n    }\n\n    @keyframes pulseOrb {\n      0%, 100% { transform: scale(0.85); opacity: 0.6; }\n      50% { transform: scale(1.35); opacity: 1; }\n    }\n\n    /* Beat 2: Day's Verse + Continue Loop */\n    .home-verse-ref {\n      font-size: 12px;\n      font-weight: 600;\n      color: var(--ink-primary);\n      margin-bottom: 6px;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n    }\n\n    .home-verse-canonical {\n      font-size: calc(17px * var(--scripture-scale));\n      line-height: 1.55;\n      color: var(--ink-primary);\n      margin-bottom: 10px;\n    }\n\n    .eliana-gloss-box {\n      background: var(--bg-eliana-wash);\n      border-left: 2px solid var(--gold);\n      border-radius: 0 10px 10px 0;\n      padding: 8px 10px;\n      margin-bottom: 10px;\n    }\n\n    .eliana-gloss-label {\n      font-size: 10px;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n      color: var(--gold);\n      margin-bottom: 3px;\n      display: flex;\n      align-items: center;\n      gap: 4px;\n    }\n\n    .eliana-gloss-text {\n      font-size: calc(14.5px * var(--scripture-scale));\n      font-style: italic;\n      line-height: 1.5;\n      color: var(--ink-primary);\n    }\n\n    .home-root-preview {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      background: var(--bg-azure-wash);\n      border: 1px solid var(--border-azure);\n      border-radius: 9px;\n      padding: 6px 10px;\n      margin-bottom: 10px;\n      cursor: pointer;\n      text-decoration: none;\n    }\n\n    .root-heb {\n      font-size: 17px;\n      color: var(--ink-primary);\n      direction: rtl;\n    }\n\n    .root-meta {\n      font-size: 11px;\n      color: var(--azure);\n      font-weight: 500;\n    }\n\n    /* Continue Loop Stepper inside Beat 2 */\n    .continue-strip {\n      border-top: 1px solid var(--border-hairline);\n      padding-top: 10px;\n      margin-top: 4px;\n    }\n\n    .continue-top {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 6px;\n    }\n\n    .continue-label {\n      font-size: 10.5px;\n      font-weight: 600;\n      color: var(--ink-secondary);\n    }\n\n    .continue-step-tag {\n      font-size: 10.5px;\n      font-weight: 700;\n      color: var(--gold);\n    }\n\n    .loop-track {\n      display: grid;\n      grid-template-columns: repeat(5, 1fr);\n      gap: 4px;\n      margin-bottom: 9px;\n    }\n\n    .loop-segment {\n      text-align: center;\n      padding: 4px 2px;\n      border-radius: 6px;\n      background: var(--bg-subtle);\n      border: 1px solid var(--border-hairline);\n      font-size: 9.5px;\n      color: var(--ink-muted);\n      cursor: pointer;\n    }\n\n    .loop-segment.done {\n      border-color: rgba(104, 176, 171, 0.4);\n      color: var(--teal);\n    }\n\n    .loop-segment.current {\n      background: var(--bg-eliana-wash);\n      border-color: var(--border-gold);\n      color: var(--gold);\n      font-weight: 700;\n    }\n\n    .primary-action-row {\n      display: flex;\n      gap: 6px;\n    }\n\n    .btn-gold {\n      flex: 1;\n      appearance: none;\n      border: 1px solid var(--border-gold);\n      background: var(--bg-eliana-wash);\n      color: var(--gold);\n      font-size: 12px;\n      font-weight: 600;\n      padding: 8px 11px;\n      border-radius: 9px;\n      cursor: pointer;\n      text-align: center;\n      text-decoration: none;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      gap: 5px;\n    }\n\n    .btn-ghost {\n      appearance: none;\n      border: 1px solid var(--border-hairline);\n      background: var(--bg-subtle);\n      color: var(--ink-secondary);\n      font-size: 11.5px;\n      font-weight: 500;\n      padding: 8px 10px;\n      border-radius: 9px;\n      cursor: pointer;\n      text-decoration: none;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      gap: 4px;\n    }\n\n    /* Beat 3: One Study Path (Library Shelf Preview) */\n    .path-switcher {\n      display: flex;\n      gap: 4px;\n      margin-bottom: 8px;\n    }\n\n    .path-tab {\n      appearance: none;\n      border: 1px solid var(--border-hairline);\n      background: var(--bg-subtle);\n      color: var(--ink-muted);\n      font-size: 10px;\n      font-weight: 600;\n      padding: 3px 8px;\n      border-radius: 6px;\n      cursor: pointer;\n    }\n\n    .path-tab.active {\n      border-color: var(--border-cinnabar);\n      background: var(--bg-cinnabar-wash);\n      color: var(--cinnabar);\n    }\n\n    .path-title {\n      font-size: 15px;\n      font-weight: 600;\n      color: var(--ink-primary);\n      margin-bottom: 4px;\n    }\n\n    .path-desc {\n      font-size: 12.5px;\n      line-height: 1.45;\n      color: var(--ink-secondary);\n      margin-bottom: 9px;\n    }\n\n    /* Beat 4: Threshold Portals (Throne Room, Journal, Eliana, Library) */\n    .portal-grid {\n      display: grid;\n      grid-template-columns: repeat(2, 1fr);\n      gap: 7px;\n      margin-top: 7px;\n    }\n\n    .portal-tile {\n      background: var(--bg-subtle);\n      border: 1px solid var(--border-hairline);\n      border-radius: 10px;\n      padding: 9px 10px;\n      text-decoration: none;\n      color: var(--ink-primary);\n      display: flex;\n      flex-direction: column;\n      gap: 2px;\n      cursor: pointer;\n      transition: border-color 0.15s ease;\n    }\n\n    .portal-tile:hover {\n      border-color: var(--border-gold);\n    }\n\n    .portal-name {\n      font-size: 12px;\n      font-weight: 600;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n    }\n\n    .portal-sub {\n      font-size: 10.5px;\n      color: var(--ink-muted);\n      line-height: 1.3;\n    }\n\n    /* Journey Tapestry (Progress Kept Without Streaks) */\n    .journey-weave-card {\n      margin-top: 4px;\n      background: var(--bg-card);\n      border: 1px solid var(--border-hairline);\n      border-radius: 14px;\n      padding: 12px 13px;\n    }\n\n    .weave-dots {\n      display: grid;\n      grid-template-columns: repeat(14, 1fr);\n      gap: 5px;\n      margin: 9px 0;\n    }\n\n    .weave-knot {\n      height: 16px;\n      border-radius: 4px;\n      background: var(--bg-subtle);\n      border: 1px solid var(--border-hairline);\n      position: relative;\n    }\n\n    .weave-knot.word {\n      background: var(--bg-eliana-wash);\n      border-color: var(--border-gold);\n    }\n    .weave-knot.chain {\n      background: var(--bg-cinnabar-wash);\n      border-color: var(--border-cinnabar);\n    }\n    .weave-knot.root {\n      background: var(--bg-azure-wash);\n      border-color: var(--border-azure);\n    }\n    .weave-knot.today {\n      background: var(--gold);\n      border-color: var(--gold-bright);\n      box-shadow: 0 0 8px var(--gold-dim);\n    }\n\n    .weave-metrics {\n      display: flex;\n      justify-content: space-between;\n      font-size: 10.5px;\n      color: var(--ink-secondary);\n      border-top: 1px solid var(--border-hairline);\n      padding-top: 7px;\n    }\n\n    /* ==========================================================================\n       SCREEN 2 & 3: BIBLE READER (READ MODE & STUDY MODE)\n       ========================================================================== */\n    .reader-chrome {\n      background: var(--bg-card);\n      border: 1px solid var(--border-hairline);\n      border-radius: 14px;\n      padding: 11px 12px;\n      margin-bottom: 12px;\n    }\n\n    .reader-top-row {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 9px;\n      gap: 6px;\n    }\n\n    .passage-title-block {\n      display: flex;\n      flex-direction: column;\n    }\n\n    .passage-book {\n      font-size: 18px;\n      font-weight: 600;\n      color: var(--ink-primary);\n      line-height: 1.15;\n    }\n\n    .passage-meta {\n      font-size: 10.5px;\n      color: var(--ink-muted);\n    }\n\n    /* Read vs Study Mode Segmented Switch */\n    .mode-switch {\n      display: inline-flex;\n      background: var(--bg-canvas);\n      border: 1px solid var(--border-hairline);\n      border-radius: 999px;\n      padding: 2px;\n    }\n\n    .mode-seg {\n      appearance: none;\n      border: none;\n      background: transparent;\n      color: var(--ink-muted);\n      font-size: 11px;\n      font-weight: 600;\n      padding: 4px 11px;\n      border-radius: 999px;\n      cursor: pointer;\n      text-decoration: none;\n    }\n\n    .mode-seg.active {\n      background: var(--bg-eliana-wash);\n      color: var(--gold);\n      border: 1px solid var(--border-gold);\n    }\n\n    /* Translation Pills: BSB, KJV, ASV, \u2726 Eliana */\n    .translation-bar {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 4px;\n      padding-top: 8px;\n      border-top: 1px solid var(--border-hairline);\n    }\n\n    .trans-group {\n      display: flex;\n      gap: 4px;\n    }\n\n    .trans-pill {\n      appearance: none;\n      border: 1px solid var(--border-hairline);\n      background: var(--bg-subtle);\n      color: var(--ink-secondary);\n      font-size: 10.5px;\n      font-weight: 600;\n      padding: 3px 8px;\n      border-radius: 6px;\n      cursor: pointer;\n    }\n\n    .trans-pill.active {\n      border-color: var(--border-gold);\n      background: var(--bg-eliana-wash);\n      color: var(--gold);\n    }\n\n    .whisper-toggle {\n      appearance: none;\n      border: 1px dashed var(--border-gold);\n      background: transparent;\n      color: var(--gold);\n      font-size: 10px;\n      font-weight: 600;\n      padding: 3px 7px;\n      border-radius: 6px;\n      cursor: pointer;\n    }\n\n    .whisper-toggle.active {\n      background: var(--bg-eliana-wash);\n      border-style: solid;\n    }\n\n    /* READ MODE: The Sanctuary Page (Flowing Printed-Bible Layout) */\n    .read-sanctuary-page {\n      background: var(--bg-card);\n      border: 1px solid var(--border-hairline);\n      border-radius: 16px;\n      padding: 16px 14px 16px 10px;\n      box-shadow: var(--shadow-soft);\n    }\n\n    .psalm-superscription {\n      padding-left: 36px;\n      font-size: 12px;\n      font-style: italic;\n      color: var(--ink-muted);\n      margin-bottom: 12px;\n      letter-spacing: 0.02em;\n    }\n\n    .read-stanza {\n      margin-bottom: 14px;\n    }\n\n    .read-verse-row {\n      display: grid;\n      grid-template-columns: 34px 1fr;\n      align-items: baseline;\n      padding: 3px 4px;\n      border-radius: 8px;\n      transition: background 0.15s ease;\n    }\n\n    .read-verse-row.active-dwell {\n      background: var(--bg-eliana-wash);\n      border: 1px solid var(--border-gold);\n      padding: 7px 6px 7px 4px;\n      margin: 4px 0;\n    }\n\n    .margin-gutter {\n      display: flex;\n      flex-direction: column;\n      align-items: flex-start;\n      gap: 2px;\n      padding-top: 2px;\n      user-select: none;\n    }\n\n    .v-num {\n      font-size: 10.5px;\n      font-weight: 600;\n      color: var(--ink-muted);\n    }\n\n    .read-verse-row.active-dwell .v-num {\n      color: var(--gold);\n      font-weight: 700;\n    }\n\n    .margin-chain-dot {\n      font-size: 9px;\n      font-weight: 700;\n      color: var(--cinnabar);\n      background: var(--bg-cinnabar-wash);\n      border: 1px solid var(--border-cinnabar);\n      padding: 0 3px;\n      border-radius: 4px;\n      text-decoration: none;\n      cursor: pointer;\n    }\n\n    .read-prose {\n      font-size: calc(17.5px * var(--scripture-scale));\n      line-height: 1.68;\n      color: var(--ink-primary);\n    }\n\n    .read-whisper-gloss {\n      margin-top: 6px;\n      padding: 6px 9px;\n      border-left: 2px solid var(--gold);\n      background: rgba(228, 193, 122, 0.06);\n      border-radius: 0 8px 8px 0;\n      font-size: calc(14px * var(--scripture-scale));\n      font-style: italic;\n      line-height: 1.48;\n      color: var(--gold-bright);\n    }\n\n    [data-theme=\"first-light\"] .read-whisper-gloss,\n    [data-theme=\"codex\"] .read-whisper-gloss {\n      color: var(--gold);\n    }\n\n    .read-margin-dock {\n      margin-top: 12px;\n      padding-top: 11px;\n      border-top: 1px solid var(--border-hairline);\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 6px;\n      flex-wrap: wrap;\n    }\n\n    .dock-ref {\n      font-size: 11px;\n      font-weight: 700;\n      color: var(--gold);\n    }\n\n    .dock-actions {\n      display: flex;\n      gap: 5px;\n      flex-wrap: wrap;\n    }\n\n    /* ==========================================================================\n       SCREEN 3: BIBLE READER \u2014 STUDY MODE (\"THE POLYGLOT SCORE\")\n       ========================================================================== */\n    .layer-conductor {\n      display: flex;\n      align-items: center;\n      gap: 4px;\n      overflow-x: auto;\n      padding-top: 8px;\n      margin-top: 8px;\n      border-top: 1px solid var(--border-hairline);\n      scrollbar-width: none;\n    }\n    .layer-conductor::-webkit-scrollbar {\n      display: none;\n    }\n\n    .layer-chip {\n      appearance: none;\n      border: 1px solid var(--border-hairline);\n      background: var(--bg-subtle);\n      color: var(--ink-muted);\n      font-size: 10px;\n      font-weight: 600;\n      padding: 3px 7px;\n      border-radius: 99px;\n      white-space: nowrap;\n      cursor: pointer;\n    }\n\n    .layer-chip.on {\n      border-color: var(--border-azure);\n      background: var(--bg-azure-wash);\n      color: var(--azure);\n    }\n\n    .layer-chip.on.gold-chip {\n      border-color: var(--border-gold);\n      background: var(--bg-eliana-wash);\n      color: var(--gold);\n    }\n\n    .study-verse-score {\n      background: var(--bg-card);\n      border: 1px solid var(--border-hairline);\n      border-radius: 15px;\n      padding: 13px 13px 12px;\n      margin-bottom: 13px;\n      box-shadow: var(--shadow-soft);\n    }\n\n    .study-verse-score.active-score {\n      border-color: var(--border-gold);\n    }\n\n    .score-spine-bar {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 8px;\n      padding-bottom: 7px;\n      border-bottom: 1px solid var(--border-hairline);\n      gap: 6px;\n    }\n\n    .score-v-badge {\n      display: inline-flex;\n      align-items: center;\n      gap: 6px;\n      font-size: 12px;\n      font-weight: 700;\n      color: var(--ink-primary);\n    }\n\n    .score-canonical {\n      font-size: calc(16px * var(--scripture-scale));\n      line-height: 1.52;\n      color: var(--ink-primary);\n      margin-bottom: 10px;\n    }\n\n    /* Layer 1: Tappable Original Text (Hebrew RTL / Greek LTR) */\n    .score-layer-original {\n      background: var(--bg-elevated);\n      border: 1px solid var(--border-hairline);\n      border-radius: 11px;\n      padding: 9px 10px 8px;\n      margin-bottom: 8px;\n    }\n\n    .layer-head {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      font-size: 9.5px;\n      font-weight: 700;\n      letter-spacing: 0.09em;\n      text-transform: uppercase;\n      color: var(--ink-muted);\n      margin-bottom: 6px;\n    }\n\n    .word-token-grid {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 5px;\n    }\n\n    .word-token-grid.rtl {\n      direction: rtl;\n    }\n\n    .word-token {\n      appearance: none;\n      background: var(--bg-card);\n      border: 1px solid var(--border-hairline);\n      border-radius: 8px;\n      padding: 5px 8px 4px;\n      cursor: pointer;\n      display: inline-flex;\n      flex-direction: column;\n      align-items: center;\n      gap: 1px;\n      transition: all 0.15s ease;\n    }\n\n    .word-token:hover,\n    .word-token.selected {\n      border-color: var(--azure);\n      background: var(--bg-azure-wash);\n      transform: translateY(-1px);\n    }\n\n    .token-script-heb {\n      font-size: calc(20px * var(--scripture-scale));\n      line-height: 1.25;\n      color: var(--ink-primary);\n    }\n\n    .token-script-grk {\n      font-size: calc(17px * var(--scripture-scale));\n      line-height: 1.3;\n      color: var(--ink-primary);\n    }\n\n    .token-tl {\n      font-size: 10px;\n      color: var(--azure);\n      direction: ltr;\n    }\n\n    .token-gloss {\n      font-size: 9.5px;\n      color: var(--ink-muted);\n      direction: ltr;\n    }\n\n    /* Layer 2: Phonetic Transliteration Ribbon */\n    .score-layer-translit {\n      background: var(--bg-subtle);\n      border: 1px solid var(--border-hairline);\n      border-radius: 9px;\n      padding: 7px 10px;\n      margin-bottom: 8px;\n    }\n\n    .translit-line {\n      font-size: 13px;\n      font-style: italic;\n      line-height: 1.45;\n      color: var(--ink-secondary);\n      letter-spacing: 0.01em;\n    }\n\n    /* Layer 3: \u2726 Eliana's Rendering */\n    .score-layer-eliana {\n      background: var(--bg-eliana-wash);\n      border-left: 2.5px solid var(--gold);\n      border-radius: 0 10px 10px 0;\n      padding: 8px 10px;\n      margin-bottom: 8px;\n    }\n\n    /* Layer 4: Key Word Study */\n    .score-layer-keyword {\n      background: var(--bg-azure-wash);\n      border: 1px solid var(--border-azure);\n      border-radius: 10px;\n      padding: 9px 10px;\n    }\n\n    .kw-title {\n      font-size: 11px;\n      font-weight: 700;\n      color: var(--azure);\n      margin-bottom: 3px;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n    }\n\n    .kw-body {\n      font-size: 12.5px;\n      line-height: 1.46;\n      color: var(--ink-secondary);\n    }\n\n    /* Layer visibility toggles */\n    .hide-layer-orig .score-layer-original,\n    .hide-layer-tl .score-layer-translit,\n    .hide-layer-eliana .score-layer-eliana,\n    .hide-layer-kw .score-layer-keyword {\n      display: none;\n    }\n\n    /* ==========================================================================\n       SCREEN 4: WORD SHEET (STRONG'S / GRAMMAR) & CHAIN SHEET (\u26d3)\n       ========================================================================== */\n    .sheet-panel {\n      background: var(--bg-card);\n      border: 1px solid var(--border-azure);\n      border-radius: 16px;\n      padding: 14px 13px;\n      margin-bottom: 14px;\n      box-shadow: var(--shadow-soft);\n    }\n\n    .sheet-handle {\n      width: 34px;\n      height: 4px;\n      border-radius: 99px;\n      background: var(--border-hairline);\n      margin: 0 auto 10px;\n    }\n\n    .word-sheet-top {\n      display: flex;\n      align-items: flex-start;\n      justify-content: space-between;\n      gap: 10px;\n      padding-bottom: 10px;\n      border-bottom: 1px solid var(--border-hairline);\n      margin-bottom: 10px;\n    }\n\n    .ws-big-word {\n      font-size: 30px;\n      line-height: 1.15;\n      color: var(--ink-primary);\n    }\n\n    .ws-phonetic {\n      font-size: 13px;\n      font-style: italic;\n      color: var(--azure);\n      margin-top: 2px;\n    }\n\n    .ws-strongs-box {\n      text-align: right;\n    }\n\n    .strongs-code {\n      display: inline-block;\n      font-size: 11px;\n      font-weight: 700;\n      color: var(--azure);\n      background: var(--bg-azure-wash);\n      border: 1px solid var(--border-azure);\n      padding: 3px 8px;\n      border-radius: 6px;\n      margin-bottom: 4px;\n    }\n\n    .ws-root-label {\n      font-size: 11px;\n      color: var(--ink-muted);\n      display: block;\n    }\n\n    .grammar-box {\n      background: var(--bg-elevated);\n      border: 1px solid var(--border-hairline);\n      border-radius: 10px;\n      padding: 9px 10px;\n      margin-bottom: 10px;\n    }\n\n    .grammar-parse {\n      font-size: 12px;\n      font-weight: 700;\n      color: var(--gold);\n      margin-bottom: 3px;\n    }\n\n    .grammar-explain {\n      font-size: 12px;\n      line-height: 1.45;\n      color: var(--ink-secondary);\n    }\n\n    .ws-meaning {\n      font-size: 12.5px;\n      line-height: 1.48;\n      color: var(--ink-primary);\n      margin-bottom: 10px;\n    }\n\n    .occurrences-list {\n      display: flex;\n      flex-direction: column;\n      gap: 6px;\n    }\n\n    .occ-item {\n      background: var(--bg-subtle);\n      border: 1px solid var(--border-hairline);\n      border-radius: 9px;\n      padding: 7px 9px;\n      font-size: 12px;\n      line-height: 1.42;\n      color: var(--ink-secondary);\n    }\n\n    .occ-ref {\n      font-weight: 700;\n      color: var(--azure);\n      margin-right: 5px;\n    }\n\n    /* Chain Sheet (\u26d3 Numbered Scripture Chain) */\n    .chain-sheet-panel {\n      background: var(--bg-card);\n      border: 1px solid var(--border-cinnabar);\n      border-radius: 16px;\n      padding: 14px 13px;\n      box-shadow: var(--shadow-soft);\n    }\n\n    .chain-ladder {\n      position: relative;\n      padding-left: 20px;\n      margin: 10px 0;\n    }\n\n    .chain-ladder::before {\n      content: \"\";\n      position: absolute;\n      left: 6px;\n      top: 8px;\n      bottom: 8px;\n      width: 1.5px;\n      background: var(--cinnabar);\n      opacity: 0.45;\n    }\n\n    .chain-stop {\n      position: relative;\n      padding: 7px 9px;\n      border-radius: 9px;\n      background: var(--bg-subtle);\n      border: 1px solid var(--border-hairline);\n      margin-bottom: 6px;\n    }\n\n    .chain-stop.here {\n      background: var(--bg-cinnabar-wash);\n      border-color: var(--border-cinnabar);\n    }\n\n    .chain-stop::before {\n      content: \"\";\n      position: absolute;\n      left: -17px;\n      top: 12px;\n      width: 7px;\n      height: 7px;\n      border-radius: 50%;\n      background: var(--bg-card);\n      border: 1.5px solid var(--cinnabar);\n    }\n\n    .chain-stop.here::before {\n      background: var(--cinnabar);\n    }\n\n    .chain-stop-ref {\n      font-size: 11px;\n      font-weight: 700;\n      color: var(--cinnabar);\n      margin-bottom: 2px;\n      display: flex;\n      justify-content: space-between;\n    }\n\n    .chain-stop-text {\n      font-size: 12px;\n      line-height: 1.4;\n      color: var(--ink-secondary);\n    }\n\n    /* ==========================================================================\n       SCREEN 5: 5-PART VERSE STUDY, ELIANA (\u2726 CHAT) & SANCTUARY ROOMS\n       ========================================================================== */\n    .study-5-stack {\n      display: flex;\n      flex-direction: column;\n      gap: 8px;\n      margin-bottom: 14px;\n    }\n\n    .study-sec-card {\n      background: var(--bg-card);\n      border: 1px solid var(--border-hairline);\n      border-radius: 13px;\n      padding: 11px 12px;\n    }\n\n    .study-sec-card.active-sec {\n      border-color: var(--border-gold);\n    }\n\n    .sec-head {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 5px;\n      cursor: pointer;\n    }\n\n    .sec-num-title {\n      display: flex;\n      align-items: center;\n      gap: 7px;\n      font-size: 12.5px;\n      font-weight: 700;\n      color: var(--ink-primary);\n    }\n\n    .sec-num {\n      font-size: 10px;\n      color: var(--gold);\n      background: var(--bg-eliana-wash);\n      border: 1px solid var(--border-gold);\n      padding: 1px 6px;\n      border-radius: 5px;\n    }\n\n    .sec-body {\n      font-size: 13px;\n      line-height: 1.52;\n      color: var(--ink-secondary);\n    }\n\n    .journal-bridge-box {\n      margin-top: 9px;\n      background: var(--bg-elevated);\n      border: 1px solid var(--border-gold);\n      border-radius: 10px;\n      padding: 9px 10px;\n    }\n\n    .journal-input {\n      width: 100%;\n      background: transparent;\n      border: none;\n      color: var(--ink-primary);\n      font-size: 12.5px;\n      line-height: 1.45;\n      resize: none;\n      outline: none;\n      font-family: inherit;\n      margin: 5px 0 7px;\n    }\n\n    /* Eliana (Chat Companion) */\n    .eliana-chat-card {\n      background: var(--bg-card);\n      border: 1px solid var(--border-gold);\n      border-radius: 15px;\n      padding: 13px 12px;\n      margin-bottom: 14px;\n      box-shadow: var(--shadow-soft);\n    }\n\n    .chat-user-bubble {\n      background: var(--bg-elevated);\n      border: 1px solid var(--border-hairline);\n      border-radius: 12px 12px 3px 12px;\n      padding: 8px 10px;\n      font-size: 12.5px;\n      color: var(--ink-primary);\n      margin-bottom: 9px;\n    }\n\n    .chat-eliana-stream {\n      background: var(--bg-eliana-wash);\n      border-left: 2.5px solid var(--gold);\n      border-radius: 0 12px 12px 0;\n      padding: 10px 11px;\n      font-size: 13px;\n      line-height: 1.54;\n      color: var(--ink-primary);\n      margin-bottom: 9px;\n    }\n\n    .scripture-ref-tap {\n      display: inline-flex;\n      align-items: center;\n      gap: 3px;\n      font-size: 11px;\n      font-weight: 600;\n      color: var(--gold);\n      background: rgba(228, 193, 122, 0.14);\n      border: 1px solid var(--border-gold);\n      padding: 0 6px;\n      border-radius: 5px;\n      cursor: pointer;\n      text-decoration: none;\n    }\n\n    .ref-popover-preview {\n      background: var(--bg-elevated);\n      border: 1px solid var(--border-gold);\n      border-radius: 9px;\n      padding: 7px 9px;\n      font-size: 11.5px;\n      line-height: 1.42;\n      color: var(--ink-secondary);\n      margin-bottom: 9px;\n    }\n\n    /* Library Shelf & Throne Room */\n    .shelf-books {\n      display: flex;\n      flex-direction: column;\n      gap: 7px;\n      margin-bottom: 14px;\n    }\n\n    .book-spine-card {\n      background: var(--bg-card);\n      border: 1px solid var(--border-hairline);\n      border-left: 3.5px solid var(--gold);\n      border-radius: 10px;\n      padding: 10px 11px;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 8px;\n    }\n\n    .book-spine-card.aliyah { border-left-color: var(--cinnabar); }\n    .book-spine-card.foundations { border-left-color: var(--azure); }\n\n    .throne-card {\n      background: var(--bg-card);\n      border: 1px solid var(--border-hairline);\n      border-radius: 14px;\n      padding: 12px 13px;\n    }\n\n    /* ==========================================================================\n       STICKY BOTTOM NAVIGATION DOCK (3 PLACES + \u2726 ELIANA)\n       ========================================================================== */\n    .bottom-nav-dock {\n      position: fixed;\n      bottom: 0;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 100%;\n      max-width: 390px;\n      z-index: 120;\n      background: var(--bg-glass);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      border-top: 1px solid var(--border-hairline);\n      padding: 6px 10px 10px;\n      display: grid;\n      grid-template-columns: repeat(5, 1fr);\n      gap: 4px;\n    }\n\n    .nav-tab {\n      appearance: none;\n      border: none;\n      background: transparent;\n      color: var(--ink-muted);\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      gap: 2px;\n      padding: 4px 2px;\n      border-radius: 10px;\n      cursor: pointer;\n      text-decoration: none;\n      font-size: 9.5px;\n      font-weight: 600;\n    }\n\n    .nav-tab.active {\n      color: var(--gold);\n      background: var(--bg-eliana-wash);\n    }\n\n    .nav-icon {\n      font-size: 13px;\n      line-height: 1;\n    }\n  <\/style>\n<\/head>\n<body>\n\n  <!-- ========================================================================\n       STICKY TOP CHROME: BRAND + LIVE 4-THEME SWITCHER + QUICK JUMP\n       ======================================================================== -->\n  <header class=\"app-topbar\">\n    <div class=\"topbar-row-1\">\n      <div class=\"brand-mark\">\n        <span class=\"brand-sigil\">\u2726<\/span>\n        <span class=\"font-serif\">Eliana\u2019s Rhythm<\/span>\n      <\/div>\n      <div class=\"top-utilities\" aria-label=\"Settings Themes and Text Scale\">\n        <button class=\"theme-pill active\" onclick=\"setTheme('night-watch', this)\">Night<\/button>\n        <button class=\"theme-pill\" onclick=\"setTheme('first-watch', this)\">Dawn<\/button>\n        <button class=\"theme-pill\" onclick=\"setTheme('codex', this)\">Codex<\/button>\n        <button class=\"theme-pill\" onclick=\"setTheme('high-contrast', this)\">Hi-C<\/button>\n        <button class=\"scale-btn\" onclick=\"cycleScale()\" title=\"Cycle Text Size\">A\u00b1<\/button>\n      <\/div>\n    <\/div>\n    <nav class=\"screen-jump-bar\" aria-label=\"Jump to Section\">\n      <a href=\"#screen-home\" class=\"jump-chip active\" onclick=\"activateNav(0)\">I \u00b7 Home Rhythm<\/a>\n      <a href=\"#screen-read\" class=\"jump-chip\" onclick=\"activateNav(1)\">II \u00b7 Bible: Read<\/a>\n      <a href=\"#screen-study\" class=\"jump-chip\" onclick=\"activateNav(2)\">III \u00b7 Bible: Study<\/a>\n      <a href=\"#screen-wordsheet\" class=\"jump-chip\" onclick=\"activateNav(3)\">IV \u00b7 Word &amp; Chain<\/a>\n      <a href=\"#screen-eliana\" class=\"jump-chip\" onclick=\"activateNav(4)\">V \u00b7 5-Part &amp; \u2726 Eliana<\/a>\n    <\/nav>\n  <\/header>\n\n  <!-- ========================================================================\n       SCREEN 1: HOME \u2014 \"THE DAILY RHYTHM\" (ONE MERIDIAN THREAD)\n       ======================================================================== -->\n  <section id=\"screen-home\" class=\"screen-chapter\">\n    <div class=\"chapter-flag\">\n      <span>\u2726 Screen 1 \u00b7 Home<\/span>\n      <span>\u00b7<\/span>\n      <span>The Daily Meridian<\/span>\n    <\/div>\n\n    <!-- Time-of-Day Greeting Header -->\n    <div class=\"horizon-header\">\n      <svg class=\"horizon-svg\" viewBox=\"0 0 340 34\" fill=\"none\" aria-hidden=\"true\">\n        <path d=\"M8 30 Q 170 -6 332 30\" stroke=\"currentColor\" stroke-opacity=\"0.18\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\" />\n        <circle id=\"horizon-body\" cx=\"272\" cy=\"15\" r=\"5\" fill=\"var(--gold)\" />\n        <circle id=\"horizon-glow\" cx=\"272\" cy=\"15\" r=\"11\" fill=\"var(--gold)\" fill-opacity=\"0.22\" />\n      <\/svg>\n      <div class=\"hour-row\">\n        <div class=\"hour-tag\" id=\"greeting-kicker\">\n          <span>\u263e Evening Watch<\/span>\n          <span>\u00b7<\/span>\n          <span>8:42 PM<\/span>\n        <\/div>\n        <div class=\"hour-switcher\">\n          <button class=\"hour-btn\" onclick=\"setGreeting('morning', this)\">Morning<\/button>\n          <button class=\"hour-btn\" onclick=\"setGreeting('midday', this)\">Midday<\/button>\n          <button class=\"hour-btn active\" onclick=\"setGreeting('evening', this)\">Evening<\/button>\n        <\/div>\n      <\/div>\n      <h1 class=\"greeting-title font-serif\" id=\"greeting-headline\">Rest in the quiet, Michael.<\/h1>\n      <p class=\"greeting-sub\" id=\"greeting-subline\">\n        One thread holds your stillness, today\u2019s verse, your study path, and your prayer\u2014without streaks.\n      <\/p>\n    <\/div>\n\n    <!-- THE MERIDIAN THREAD: 4 Connected Beats instead of disconnected dashboard cards -->\n    <div class=\"meridian-flow\">\n\n      <!-- BEAT 1: STILLNESS (Inline Guided Pause at the Threshold) -->\n      <div class=\"rhythm-beat\">\n        <div class=\"beat-node teal\">I<\/div>\n        <div class=\"beat-card\">\n          <div class=\"beat-header\">\n            <span class=\"beat-kicker teal\">I \u00b7 Threshold \u00b7 Stillness<\/span>\n            <span class=\"badge-pill teal\" id=\"breath-status-pill\">60s Guided Pause<\/span>\n          <\/div>\n          <div class=\"stillness-row\">\n            <div class=\"stillness-copy\">\n              <h4 class=\"font-serif\" id=\"breath-title\">Three breaths before the Word<\/h4>\n              <p id=\"breath-instruction\">Set down the day\u2019s hurry. Inhale 4s \u00b7 Hold 2s \u00b7 Exhale 6s.<\/p>\n            <\/div>\n            <button class=\"breath-orb-btn\" onclick=\"toggleStillness()\">\n              <span class=\"breath-dot\"><\/span>\n              <span id=\"breath-btn-text\">Pause<\/span>\n            <\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- BEAT 2: THE DAY'S VERSE + CONTINUE (Braided together as the living center) -->\n      <div class=\"rhythm-beat\">\n        <div class=\"beat-node\">II<\/div>\n        <div class=\"beat-card featured-word\">\n          <div class=\"beat-header\">\n            <span class=\"beat-kicker gold\">II \u00b7 Today\u2019s Verse &amp; Daily Loop<\/span>\n            <a href=\"#screen-wordsheet\" class=\"badge-pill chain\">\u26d3 Chain 07 \u00b7 Face of God<\/a>\n          <\/div>\n\n          <div class=\"home-verse-ref\">\n            <span class=\"font-serif\">Psalm 27:8 \u00b7 Berean Standard Bible<\/span>\n            <a href=\"#screen-study\" class=\"badge-pill gold\">Open in Study \u2192<\/a>\n          <\/div>\n\n          <p class=\"home-verse-canonical font-serif\">\n            \u201cMy heart said of You, \u2018Seek My face.\u2019 Your face, O LORD, I will seek.\u201d\n          <\/p>\n\n          <!-- Eliana's \u2726 Rendering right on Home -->\n          <div class=\"eliana-gloss-box\">\n            <div class=\"eliana-gloss-label\">\n              <span>\u2726 Eliana\u2019s Rendering<\/span>\n            <\/div>\n            <p class=\"eliana-gloss-text font-serif\">\n              \u201cMy heart echoes Your own invitation back to You: \u2018Come look for My face.\u2019 It is Your face, Lord\u2014Your presence itself\u2014that I am looking for.\u201d\n            <\/p>\n          <\/div>\n\n          <!-- Tappable Original Root Chip -->\n          <a href=\"#screen-wordsheet\" class=\"home-root-preview\" onclick=\"selectWord('baqqeshu')\">\n            <span class=\"root-meta\">Tap root: <strong>baqq\u0259\u0161\u016b p\u0304\u0101n\u0101y<\/strong> (H1245 \u00b7 Piel Impv. Pl.)<\/span>\n            <span class=\"root-heb font-hebrew\">\u05d1\u05b7\u05bc\u05e7\u05b0\u05bc\u05e9\u05c1\u05d5\u05bc \u05e4\u05b8\u05e0\u05b8\u05d9<\/span>\n          <\/a>\n\n          <!-- CONTINUE: Where you left off in the 5-step daily loop -->\n          <div class=\"continue-strip\">\n            <div class=\"continue-top\">\n              <span class=\"continue-label\">CONTINUE WHERE YOU LEFT OFF<\/span>\n              <span class=\"continue-step-tag\" id=\"home-loop-label\">Beat 3 of 5 \u00b7 Deeper Lens<\/span>\n            <\/div>\n            <div class=\"loop-track\">\n              <div class=\"loop-segment done\" onclick=\"previewLoopBeat(1, 'Beat 1 of 5 \u00b7 Scripture (Original)')\">1 \u00b7 Text \u2713<\/div>\n              <div class=\"loop-segment done\" onclick=\"previewLoopBeat(2, 'Beat 2 of 5 \u00b7 \u2726 Fresh Rendering')\">2 \u00b7 \u2726 Fresh \u2713<\/div>\n              <div class=\"loop-segment current\" id=\"loop-seg-3\" onclick=\"previewLoopBeat(3, 'Beat 3 of 5 \u00b7 Deeper Lens')\">3 \u00b7 Lens \u25cf<\/div>\n              <div class=\"loop-segment\" onclick=\"previewLoopBeat(4, 'Beat 4 of 5 \u00b7 Everyday Insight')\">4 \u00b7 Insight<\/div>\n              <div class=\"loop-segment\" onclick=\"previewLoopBeat(5, 'Beat 5 of 5 \u00b7 Practice \u2192 Journal')\">5 \u00b7 Practice<\/div>\n            <\/div>\n            <div class=\"primary-action-row\">\n              <a href=\"#screen-eliana\" class=\"btn-gold\">Continue Verse Study \u2192<\/a>\n              <a href=\"#screen-read\" class=\"btn-ghost\">Read Psalm 27<\/a>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- BEAT 3: ONE STUDY PATH (Next day of a Library book / Aliyah / Foundations) -->\n      <div class=\"rhythm-beat\">\n        <div class=\"beat-node cinnabar\">III<\/div>\n        <div class=\"beat-card\">\n          <div class=\"beat-header\">\n            <span class=\"beat-kicker cinnabar\">III \u00b7 Study Path \u00b7 From the Library<\/span>\n            <span class=\"badge-pill\" id=\"path-day-badge\">Day 4 of 7<\/span>\n          <\/div>\n          <div class=\"path-switcher\">\n            <button class=\"path-tab active\" onclick=\"switchStudyPath('aliyah', this)\">Aliyah: The Ascent<\/button>\n            <button class=\"path-tab\" onclick=\"switchStudyPath('journal', this)\">Eliana\u2019s Journal<\/button>\n            <button class=\"path-tab\" onclick=\"switchStudyPath('foundations', this)\">The Foundations<\/button>\n          <\/div>\n          <h3 class=\"path-title font-serif\" id=\"path-title\">Chain 07 \u00b7 The Face of God (Peniel to Jerusalem)<\/h3>\n          <p class=\"path-desc\" id=\"path-desc\">\n            Traces six linked passages across Scripture where seeking God\u2019s face transforms from trembling at Peniel (Gen 32:30) to David\u2019s tent of song (Ps 27:8).\n          <\/p>\n          <div class=\"primary-action-row\">\n            <a href=\"#chain-sheet-anchor\" class=\"btn-ghost\" style=\"flex:1;\">Open Today\u2019s Path Reading \u2192<\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- BEAT 4: RESPONSE & SANCTUARY PORTALS (Quick links reimagined with context) -->\n      <div class=\"rhythm-beat\" style=\"margin-bottom: 6px;\">\n        <div class=\"beat-node azure\">IV<\/div>\n        <div class=\"beat-card\">\n          <div class=\"beat-header\">\n            <span class=\"beat-kicker azure\">IV \u00b7 Response &amp; Inner Rooms<\/span>\n            <span class=\"badge-pill gold\">Anchored to Ps 27:8<\/span>\n          <\/div>\n          <p style=\"font-size: 12px; color: var(--ink-secondary); line-height: 1.4;\">\n            Carry this verse directly into conversation, prayer, or your journal:\n          <\/p>\n          <div class=\"portal-grid\">\n            <a href=\"#eliana-chat-anchor\" class=\"portal-tile\">\n              <span class=\"portal-name\"><span>\u2726 Ask Eliana<\/span><span>\u2192<\/span><\/span>\n              <span class=\"portal-sub\">Start a conversation from Psalm 27:8<\/span>\n            <\/a>\n            <a href=\"#throne-room-anchor\" class=\"portal-tile\">\n              <span class=\"portal-name\"><span>Throne Room<\/span><span>\u2192<\/span><\/span>\n              <span class=\"portal-sub\">Weave a prayer or pray saved favourites<\/span>\n            <\/a>\n            <a href=\"#journal-anchor\" class=\"portal-tile\">\n              <span class=\"portal-name\"><span>Journal<\/span><span>\u2192<\/span><\/span>\n              <span class=\"portal-sub\">Guided prompt or free entry tied to verse<\/span>\n            <\/a>\n            <a href=\"#library-shelf-anchor\" class=\"portal-tile\">\n              <span class=\"portal-name\"><span>Library Shelf<\/span><span>\u2192<\/span><\/span>\n              <span class=\"portal-sub\">3 Rooms: Journal, Aliyah, Foundations<\/span>\n            <\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- JOURNEY: Progress Across Reading & Reflection Over Time, Kept Without Streaks -->\n    <div class=\"journey-weave-card\">\n      <div class=\"beat-header\" style=\"margin-bottom: 3px;\">\n        <span class=\"beat-kicker\">Journey \u00b7 Kept Without Streaks<\/span>\n        <span style=\"font-size: 10.5px; color: var(--gold); font-weight: 600;\">Season of Autumn \u00b7 19 Dwellings<\/span>\n      <\/div>\n      <p style=\"font-size: 11.5px; color: var(--ink-muted); line-height: 1.38;\">\n        Every return adds a knot to the weave\u2014resting days never break the loom.\n      <\/p>\n      <div class=\"weave-dots\" aria-label=\"28-day non-streak journey tapestry\">\n        <span class=\"weave-knot word\" title=\"Psalm 23\"><\/span>\n        <span class=\"weave-knot root\" title=\"H7462 Ra'ah\"><\/span>\n        <span class=\"weave-knot\"><\/span>\n        <span class=\"weave-knot word\" title=\"Psalm 24\"><\/span>\n        <span class=\"weave-knot chain\" title=\"Chain 04\"><\/span>\n        <span class=\"weave-knot word\" title=\"Psalm 25\"><\/span>\n        <span class=\"weave-knot\"><\/span>\n        <span class=\"weave-knot root\" title=\"H2617 Chesed\"><\/span>\n        <span class=\"weave-knot word\" title=\"Psalm 26\"><\/span>\n        <span class=\"weave-knot chain\" title=\"Chain 06\"><\/span>\n        <span class=\"weave-knot\"><\/span>\n        <span class=\"weave-knot word\" title=\"Isaiah 30:15\"><\/span>\n        <span class=\"weave-knot root\" title=\"H8252 Shaqat\"><\/span>\n        <span class=\"weave-knot word\" title=\"John 1:1\"><\/span>\n        <span class=\"weave-knot\"><\/span>\n        <span class=\"weave-knot word\" title=\"John 1:4\"><\/span>\n        <span class=\"weave-knot chain\" title=\"Chain 07\"><\/span>\n        <span class=\"weave-knot word\" title=\"Psalm 27:1\"><\/span>\n        <span class=\"weave-knot root\" title=\"H216 Or\"><\/span>\n        <span class=\"weave-knot\"><\/span>\n        <span class=\"weave-knot word\" title=\"Psalm 27:4\"><\/span>\n        <span class=\"weave-knot chain\" title=\"Chain 03\"><\/span>\n        <span class=\"weave-knot\"><\/span>\n        <span class=\"weave-knot word\" title=\"Psalm 27:5\"><\/span>\n        <span class=\"weave-knot root\" title=\"H5643 Seter\"><\/span>\n        <span class=\"weave-knot word\" title=\"Psalm 27:7\"><\/span>\n        <span class=\"weave-knot chain\" title=\"Chain 07\"><\/span>\n        <span class=\"weave-knot today\" title=\"Today \u00b7 Psalm 27:8\"><\/span>\n      <\/div>\n      <div class=\"weave-metrics\">\n        <span>\u2726 19 Passages Read<\/span>\n        <span>\u26d3 4 Chains Walked<\/span>\n        <span>\u05d0 14 Roots Studied<\/span>\n        <span>\u2605 11 Prayers Kept<\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ========================================================================\n       SCREEN 2: BIBLE READER \u2014 MODE 1: READ MODE (\"THE SANCTUARY PAGE\")\n       Flowing paragraphs like a fine printed Bible, marginal verse numerals,\n       marginal Chain sigils (\u26d3), BSB / KJV / ASV / \u2726 Eliana switcher.\n       ======================================================================== -->\n  <section id=\"screen-read\" class=\"screen-chapter\">\n    <div class=\"chapter-flag\">\n      <span>\ud83d\udcd6 Screen 2 \u00b7 Bible Reader<\/span>\n      <span>\u00b7<\/span>\n      <span>Mode 1: Read (Flowing Page)<\/span>\n    <\/div>\n\n    <div class=\"reader-chrome\">\n      <div class=\"reader-top-row\">\n        <div class=\"passage-title-block\">\n          <span class=\"passage-book font-serif\">Psalm 27<\/span>\n          <span class=\"passage-meta\">Book I \u00b7 Of David \u00b7 14 Verses<\/span>\n        <\/div>\n        <div class=\"mode-switch\" aria-label=\"Bible Reader Mode\">\n          <a href=\"#screen-read\" class=\"mode-seg active\">Read<\/a>\n          <a href=\"#screen-study\" class=\"mode-seg\">Study \u00b7 4 Layers<\/a>\n        <\/div>\n      <\/div>\n\n      <!-- Translation Selector: BSB, KJV, ASV, \u2726 Eliana + Whisper \u2726 -->\n      <div class=\"translation-bar\">\n        <div class=\"trans-group\" role=\"tablist\" aria-label=\"Bible Translations\">\n          <button class=\"trans-pill active\" onclick=\"setReadTranslation('BSB', this)\">BSB<\/button>\n          <button class=\"trans-pill\" onclick=\"setReadTranslation('KJV', this)\">KJV<\/button>\n          <button class=\"trans-pill\" onclick=\"setReadTranslation('ASV', this)\">ASV<\/button>\n          <button class=\"trans-pill\" onclick=\"setReadTranslation('ELIANA', this)\">\u2726 Eliana<\/button>\n        <\/div>\n        <button class=\"whisper-toggle active\" id=\"whisper-btn\" onclick=\"toggleWhisperGloss()\">\n          \u2726 Whisper Gloss: On\n        <\/button>\n      <\/div>\n    <\/div>\n\n    <!-- Flowing Printed-Bible Sanctuary Page -->\n    <div class=\"read-sanctuary-page\">\n      <div class=\"psalm-superscription font-serif\">A Psalm of David.<\/div>\n\n      <div class=\"read-stanza\">\n        <div class=\"read-verse-row\">\n          <div class=\"margin-gutter\">\n            <span class=\"v-num font-mono\">1<\/span>\n          <\/div>\n          <p class=\"read-prose font-serif\" id=\"read-v1\">\n            The LORD is my light and my salvation\u2014whom shall I fear? The LORD is the stronghold of my life\u2014of whom shall I be afraid?\n          <\/p>\n        <\/div>\n\n        <div class=\"read-verse-row\">\n          <div class=\"margin-gutter\">\n            <span class=\"v-num font-mono\">2<\/span>\n          <\/div>\n          <p class=\"read-prose font-serif\" id=\"read-v2\">\n            When the wicked came upon me to devour my flesh, my enemies and foes stumbled and fell.\n          <\/p>\n        <\/div>\n\n        <div class=\"read-verse-row\">\n          <div class=\"margin-gutter\">\n            <span class=\"v-num font-mono\">3<\/span>\n          <\/div>\n          <p class=\"read-prose font-serif\" id=\"read-v3\">\n            Though an army encamp against me, my heart will not fear; though a war break out against me, I will keep my trust.\n          <\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"read-stanza\">\n        <div class=\"read-verse-row\">\n          <div class=\"margin-gutter\">\n            <span class=\"v-num font-mono\">4<\/span>\n            <a href=\"#chain-sheet-anchor\" class=\"margin-chain-dot font-mono\" title=\"Chain 03: The House of the Lord\">\u26d303<\/a>\n          <\/div>\n          <p class=\"read-prose font-serif\" id=\"read-v4\">\n            One thing I have asked of the LORD; this is what I desire: to dwell in the house of the LORD all the days of my life, to gaze on the beauty of the LORD and seek Him in His temple.\n          <\/p>\n        <\/div>\n\n        <div class=\"read-verse-row\">\n          <div class=\"margin-gutter\">\n            <span class=\"v-num font-mono\">5<\/span>\n          <\/div>\n          <p class=\"read-prose font-serif\" id=\"read-v5\">\n            For in the day of trouble He will hide me in His shelter; He will conceal me under the cover of His tent; He will set me high upon a rock.\n          <\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"read-stanza\">\n        <div class=\"read-verse-row\">\n          <div class=\"margin-gutter\">\n            <span class=\"v-num font-mono\">7<\/span>\n          <\/div>\n          <p class=\"read-prose font-serif\" id=\"read-v7\">\n            Hear, O LORD, my voice when I call; be merciful to me and answer me.\n          <\/p>\n        <\/div>\n\n        <!-- Verse 8: Active Dwelling Verse with Marginal Chain 07 + Optional Whisper \u2726 -->\n        <div class=\"read-verse-row active-dwell\">\n          <div class=\"margin-gutter\">\n            <span class=\"v-num font-mono\">8<\/span>\n            <a href=\"#chain-sheet-anchor\" class=\"margin-chain-dot font-mono\" title=\"Chain 07: The Face of God\">\u26d307<\/a>\n          <\/div>\n          <div>\n            <p class=\"read-prose font-serif\" id=\"read-v8\">\n              My heart said of You, \u201cSeek My face.\u201d Your face, O LORD, I will seek.\n            <\/p>\n            <div class=\"read-whisper-gloss font-serif\" id=\"read-v8-whisper\">\n              \u2726 \u201cMy heart echoes Your own invitation back to You: \u2018Come look for My face.\u2019 It is Your face, Lord\u2014Your presence itself\u2014that I am looking for.\u201d\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"read-verse-row\">\n          <div class=\"margin-gutter\">\n            <span class=\"v-num font-mono\">9<\/span>\n          <\/div>\n          <p class=\"read-prose font-serif\" id=\"read-v9\">\n            Hide not Your face from me, nor turn Your servant away in anger. You have been my helper; do not reject me or forsake me, O God of my salvation.\n          <\/p>\n        <\/div>\n      <\/div>\n\n      <!-- Quiet Margin Dock at the foot of Read Mode -->\n      <div class=\"read-margin-dock\">\n        <span class=\"dock-ref\">\u2726 Psalm 27:8 Selected<\/span>\n        <div class=\"dock-actions\">\n          <a href=\"#screen-study\" class=\"badge-pill gold\">Open 4-Layer Study \u2193<\/a>\n          <a href=\"#chain-sheet-anchor\" class=\"badge-pill chain\">\u26d3 Chain 07<\/a>\n          <a href=\"#eliana-chat-anchor\" class=\"badge-pill\">\u2726 Ask Eliana<\/a>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ========================================================================\n       SCREEN 3: BIBLE READER \u2014 MODE 2: STUDY MODE (\"THE POLYGLOT SCORE\")\n       Shows all 4 layers clearly on each verse:\n       1. Original Text (Hebrew OT & Greek NT) where each word can be tapped\n       2. Transliteration\n       3. Eliana's own rendering marked with \u2726\n       4. Key Word Study\n       ======================================================================== -->\n  <section id=\"screen-study\" class=\"screen-chapter\">\n    <div class=\"chapter-flag azure\">\n      <span>\u05d0/\u03a9 Screen 3 \u00b7 Bible Reader<\/span>\n      <span>\u00b7<\/span>\n      <span>Mode 2: Study (4-Layer Score)<\/span>\n    <\/div>\n\n    <div class=\"reader-chrome\">\n      <div class=\"reader-top-row\">\n        <div class=\"passage-title-block\">\n          <span class=\"passage-book font-serif\">Psalm 27:8 &amp; John 1:1<\/span>\n          <span class=\"passage-meta\">Polyglot Study \u00b7 OT Hebrew &amp; NT Greek<\/span>\n        <\/div>\n        <div class=\"mode-switch\">\n          <a href=\"#screen-read\" class=\"mode-seg\">Read<\/a>\n          <a href=\"#screen-study\" class=\"mode-seg active\">Study \u25cf<\/a>\n        <\/div>\n      <\/div>\n\n      <!-- Layer Conductor Bar: Toggle any of the 4 layers on/off -->\n      <div class=\"layer-conductor\" aria-label=\"Toggle Study Layers\">\n        <button class=\"layer-chip on\" id=\"toggle-orig\" onclick=\"toggleStudyLayer('orig', this)\">1 \u00b7 Original \u05d0/\u03a9 \u2713<\/button>\n        <button class=\"layer-chip on\" id=\"toggle-tl\" onclick=\"toggleStudyLayer('tl', this)\">2 \u00b7 Transliteration \u2713<\/button>\n        <button class=\"layer-chip on gold-chip\" id=\"toggle-eliana\" onclick=\"toggleStudyLayer('eliana', this)\">3 \u00b7 \u2726 Eliana \u2713<\/button>\n        <button class=\"layer-chip on\" id=\"toggle-kw\" onclick=\"toggleStudyLayer('kw', this)\">4 \u00b7 Key Word \u2713<\/button>\n      <\/div>\n    <\/div>\n\n    <div id=\"study-scores-container\">\n\n      <!-- ====================================================================\n           VERSE SCORE 1: OLD TESTAMENT HEBREW (PSALM 27:8)\n           ==================================================================== -->\n      <article class=\"study-verse-score active-score\">\n        <div class=\"score-spine-bar\">\n          <div class=\"score-v-badge\">\n            <span class=\"font-mono\" style=\"color: var(--gold);\">PSALM 27:8<\/span>\n            <a href=\"#chain-sheet-anchor\" class=\"badge-pill chain\">\u26d3 Chain 07 \u00b7 Face of God<\/a>\n          <\/div>\n          <div style=\"display:flex; gap:4px;\">\n            <a href=\"#screen-eliana\" class=\"badge-pill gold\">5-Part Study \u2192<\/a>\n          <\/div>\n        <\/div>\n\n        <!-- Canonical Anchor Line -->\n        <p class=\"score-canonical font-serif\">\n          \u201cMy heart said of You, \u2018Seek My face.\u2019 Your face, O LORD, I will seek.\u201d <span style=\"font-size:11px; color:var(--ink-muted);\">(BSB)<\/span>\n        <\/p>\n\n        <!-- LAYER 1: ORIGINAL TEXT (HEBREW RTL \u2014 EVERY WORD TAPPABLE) -->\n        <div class=\"score-layer-original\">\n          <div class=\"layer-head\">\n            <span>Layer 1 \u00b7 Original Hebrew (RTL \u00b7 Tap any word for Word Sheet)<\/span>\n            <span class=\"font-mono\" style=\"color: var(--azure);\">WLC \u00b7 OT<\/span>\n          <\/div>\n          <div class=\"word-token-grid rtl\">\n            <button class=\"word-token\" onclick=\"selectWord('lekha', this)\">\n              <span class=\"token-script-heb font-hebrew\">\u05dc\u05b0\u05da\u05b8<\/span>\n              <span class=\"token-tl font-mono\">l\u0259\u00b7\u1e35\u0101<\/span>\n              <span class=\"token-gloss\">to You<\/span>\n            <\/button>\n            <button class=\"word-token\" onclick=\"selectWord('amar', this)\">\n              <span class=\"token-script-heb font-hebrew\">\u05d0\u05b8\u05de\u05b7\u05e8<\/span>\n              <span class=\"token-tl font-mono\">\u2019\u0101\u00b7mar<\/span>\n              <span class=\"token-gloss\">said<\/span>\n            <\/button>\n            <button class=\"word-token\" onclick=\"selectWord('libbi', this)\">\n              <span class=\"token-script-heb font-hebrew\">\u05dc\u05b4\u05d1\u05b4\u05bc\u05d9<\/span>\n              <span class=\"token-tl font-mono\">lib\u00b7b\u00ee<\/span>\n              <span class=\"token-gloss\">my heart<\/span>\n            <\/button>\n            <button class=\"word-token selected\" id=\"default-token-baqqeshu\" onclick=\"selectWord('baqqeshu', this)\">\n              <span class=\"token-script-heb font-hebrew\">\u05d1\u05b7\u05bc\u05e7\u05b0\u05bc\u05e9\u05c1\u05d5\u05bc<\/span>\n              <span class=\"token-tl font-mono\">baq\u00b7q\u0259\u00b7\u0161\u016b<\/span>\n              <span class=\"token-gloss\">seek [pl.]<\/span>\n            <\/button>\n            <button class=\"word-token\" onclick=\"selectWord('panay', this)\">\n              <span class=\"token-script-heb font-hebrew\">\u05e4\u05b8\u05e0\u05b8\u05d9<\/span>\n              <span class=\"token-tl font-mono\">p\u0304\u0101\u00b7n\u0101y<\/span>\n              <span class=\"token-gloss\">My face<\/span>\n            <\/button>\n            <button class=\"word-token\" onclick=\"selectWord('panekha', this)\">\n              <span class=\"token-script-heb font-hebrew\">\u05d0\u05b6\u05ea\u05be\u05e4\u05b8\u05bc\u05e0\u05b6\u05d9\u05da\u05b8<\/span>\n              <span class=\"token-tl font-mono\">\u2019e\u1e6f-p\u0101\u00b7ne\u00b7\u1e35\u0101<\/span>\n              <span class=\"token-gloss\">Your face<\/span>\n            <\/button>\n            <button class=\"word-token\" onclick=\"selectWord('yhwh', this)\">\n              <span class=\"token-script-heb font-hebrew\">\u05d9\u05b0\u05d4\u05d5\u05b8\u05d4<\/span>\n              <span class=\"token-tl font-mono\">YHWH<\/span>\n              <span class=\"token-gloss\">O LORD<\/span>\n            <\/button>\n            <button class=\"word-token\" onclick=\"selectWord('avaqqesh', this)\">\n              <span class=\"token-script-heb font-hebrew\">\u05d0\u05b2\u05d1\u05b7\u05e7\u05b5\u05bc\u05e9\u05c1<\/span>\n              <span class=\"token-tl font-mono\">\u2019\u0103\u00b7\u1e07aq\u00b7q\u0113\u0161<\/span>\n              <span class=\"token-gloss\">I will seek<\/span>\n            <\/button>\n          <\/div>\n        <\/div>\n\n        <!-- LAYER 2: TRANSLITERATION -->\n        <div class=\"score-layer-translit\">\n          <div class=\"layer-head\" style=\"margin-bottom:3px;\">\n            <span>Layer 2 \u00b7 Phonetic Transliteration<\/span>\n          <\/div>\n          <p class=\"translit-line font-serif\">\n            l\u0259\u00b7\u1e35\u0101 \u2019\u0101\u00b7mar lib\u00b7b\u00ee, \u201cbaq\u00b7q\u0259\u00b7\u0161\u016b p\u0304\u0101\u00b7n\u0101y\u201d \u2014 \u2019e\u1e6f-p\u0101\u00b7ne\u00b7\u1e35\u0101 YHWH \u2019\u0103\u00b7\u1e07aq\u00b7q\u0113\u0161.\n          <\/p>\n        <\/div>\n\n        <!-- LAYER 3: \u2726 ELIANA'S OWN RENDERING -->\n        <div class=\"score-layer-eliana\">\n          <div class=\"eliana-gloss-label\">\n            <span>Layer 3 \u00b7 \u2726 Eliana\u2019s Rendering<\/span>\n          <\/div>\n          <p class=\"eliana-gloss-text font-serif\">\n            \u2726 \u201cMy heart echoes Your own invitation back to You: \u2018Come look for My face.\u2019 It is Your face, Lord\u2014Your presence itself\u2014that I am seeking.\u201d\n          <\/p>\n        <\/div>\n\n        <!-- LAYER 4: KEY WORD STUDY -->\n        <div class=\"score-layer-keyword\">\n          <div class=\"kw-title\">\n            <span>Layer 4 \u00b7 Key Word Study \u00b7 \u05d1\u05b8\u05bc\u05e7\u05b7\u05e9\u05c1 (b\u0101qa\u0161, H1245) &amp; \u05e4\u05b8\u05bc\u05e0\u05b4\u05d9\u05dd (p\u0101n\u00eem, H6440)<\/span>\n            <a href=\"#screen-wordsheet\" style=\"color:var(--azure); text-decoration:none; font-size:10px;\">Word Sheet \u2193<\/a>\n          <\/div>\n          <p class=\"kw-body\">\n            Notice the grammatical turn inside the verse: God\u2019s call <em>baqq\u0259\u0161\u016b<\/em> is <strong>Piel imperative plural<\/strong> (\u201cseek, all of you\u201d), and David\u2019s answer <em>\u2019\u0103\u1e07aqq\u0113\u0161<\/em> is <strong>Piel imperfect 1st-person singular<\/strong> (\u201cI myself will seek\u201d). Prayer begins when a wide invitation becomes a first-person singular response.\n          <\/p>\n        <\/div>\n      <\/article>\n\n      <!-- ====================================================================\n           VERSE SCORE 2: NEW TESTAMENT GREEK (JOHN 1:1)\n           Demonstrating Greek LTR support in Study Mode alongside OT Hebrew\n           ==================================================================== -->\n      <article class=\"study-verse-score\">\n        <div class=\"score-spine-bar\">\n          <div class=\"score-v-badge\">\n            <span class=\"font-mono\" style=\"color: var(--azure);\">JOHN 1:1 \u00b7 GREEK NT<\/span>\n            <a href=\"#chain-sheet-anchor\" class=\"badge-pill chain\">\u26d3 Chain 01 \u00b7 The Word<\/a>\n          <\/div>\n          <span class=\"badge-pill\">NT Greek Layer<\/span>\n        <\/div>\n\n        <p class=\"score-canonical font-serif\">\n          \u201cIn the beginning was the Word, and the Word was with God, and the Word was God.\u201d <span style=\"font-size:11px; color:var(--ink-muted);\">(BSB)<\/span>\n        <\/p>\n\n        <!-- LAYER 1: ORIGINAL GREEK (LTR \u2014 TAPPABLE WORDS) -->\n        <div class=\"score-layer-original\">\n          <div class=\"layer-head\">\n            <span>Layer 1 \u00b7 Original Greek (LTR \u00b7 Tap any word for Word Sheet)<\/span>\n            <span class=\"font-mono\" style=\"color: var(--azure);\">SBLGNT \u00b7 NT<\/span>\n          <\/div>\n          <div class=\"word-token-grid\">\n            <button class=\"word-token\" onclick=\"selectWord('arche', this)\">\n              <span class=\"token-script-grk font-greek\">\u1f18\u03bd \u1f00\u03c1\u03c7\u1fc7<\/span>\n              <span class=\"token-tl font-mono\">En arch\u0113<\/span>\n              <span class=\"token-gloss\">In beginning<\/span>\n            <\/button>\n            <button class=\"word-token\" onclick=\"selectWord('en_verb', this)\">\n              <span class=\"

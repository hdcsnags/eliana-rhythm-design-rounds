#F6D28B;\n    font-size: 11.5px;\n    font-weight: 600;\n    padding: 4px 10px;\n    border-radius: 999px;\n    margin-bottom: 8px;\n  }\n\n  .chat-stream {\n    padding: 14px 16px;\n    display: flex;\n    flex-direction: column;\n    gap: 12px;\n  }\n\n  .msg {\n    max-width: 88%;\n    padding: 12px 14px;\n    border-radius: 16px;\n    font-size: 14px;\n    line-height: 1.55;\n  }\n\n  .msg.user {\n    align-self: flex-end;\n    background: var(--bg-sanctuary);\n    color: var(--text-on-sanctuary);\n    border-bottom-right-radius: 5px;\n  }\n\n  .msg.eliana {\n    align-self: flex-start;\n    background: var(--bg-surface);\n    border: 1px solid var(--border);\n    border-bottom-left-radius: 5px;\n    box-shadow: var(--shadow-card);\n  }\n\n  .msg-eliana-badge {\n    font-size: 11px;\n    font-weight: 700;\n    color: var(--spark-text);\n    margin-bottom: 5px;\n    display: flex;\n    align-items: center;\n    gap: 5px;\n  }\n\n  .ref-chip {\n    display: inline-flex;\n    align-items: center;\n    gap: 3px;\n    padding: 1px 7px;\n    border-radius: 6px;\n    background: var(--accent-soft);\n    color: var(--accent);\n    font-weight: 700;\n    font-size: 12.5px;\n    margin: 0 2px;\n    cursor: pointer;\n  }\n\n  .prompt-chips {\n    display: flex;\n    gap: 7px;\n    overflow-x: auto;\n    padding: 4px 16px 10px;\n    scrollbar-width: none;\n  }\n\n  .prompt-chips::-webkit-scrollbar { display: none; }\n\n  .prompt-chip {\n    white-space: nowrap;\n    padding: 7px 11px;\n    border-radius: 999px;\n    background: var(--bg-surface);\n    border: 1px solid var(--border-strong);\n    font-size: 12px;\n    font-weight: 600;\n    color: var(--text-secondary);\n  }\n\n  .chat-composer {\n    margin: 0 16px 14px;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    background: var(--bg-surface);\n    border: 1px solid var(--border-strong);\n    border-radius: 14px;\n    padding: 6px 6px 6px 12px;\n  }\n\n  .chat-composer input {\n    flex: 1;\n    border: none;\n    background: none;\n    outline: none;\n    font-size: 13.5px;\n  }\n\n  .send-btn {\n    width: 34px;\n    height: 34px;\n    border-radius: 10px;\n    background: var(--bg-sanctuary);\n    color: var(--text-on-sanctuary);\n    display: grid;\n    place-items: center;\n  }\n\n  /* ==================== BOTTOM NAVIGATION ==================== */\n  .bottom-nav {\n    position: fixed;\n    bottom: 0;\n    left: 50%;\n    transform: translateX(-50%);\n    width: 100%;\n    max-width: 390px;\n    z-index: 45;\n    background: var(--nav-bg);\n    backdrop-filter: blur(14px);\n    -webkit-backdrop-filter: blur(14px);\n    border-top: 1px solid var(--border);\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    padding: 7px 8px 10px;\n  }\n\n  .nav-item {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 3px;\n    padding: 5px 4px;\n    color: var(--text-muted);\n    font-size: 11px;\n    font-weight: 600;\n    border-radius: 12px;\n    transition: color 0.15s ease;\n  }\n\n  .nav-item.active {\n    color: var(--accent);\n  }\n\n  .nav-item.eliana-tab.active {\n    color: var(--spark-text);\n  }\n\n  /* ==================== SHEETS / MODALS ==================== */\n  .sheet-backdrop {\n    position: fixed;\n    inset: 0;\n    z-index: 80;\n    background: rgba(8, 13, 28, 0.56);\n    backdrop-filter: blur(3px);\n    display: none;\n    align-items: flex-end;\n    justify-content: center;\n  }\n\n  .sheet-backdrop.open {\n    display: flex;\n  }\n\n  .sheet-panel {\n    width: 100%;\n    max-width: 390px;\n    max-height: 84vh;\n    overflow-y: auto;\n    background: var(--bg-surface);\n    color: var(--text-primary);\n    border-top-left-radius: 24px;\n    border-top-right-radius: 24px;\n    padding: 12px 18px 26px;\n    box-shadow: 0 -10px 36px rgba(0, 0, 0, 0.22);\n    animation: slideUp 0.2s ease-out;\n  }\n\n  @keyframes slideUp {\n    from { transform: translateY(24px); opacity: 0.5; }\n    to { transform: translateY(0); opacity: 1; }\n  }\n\n  .sheet-handle {\n    width: 38px;\n    height: 4px;\n    border-radius: 99px;\n    background: var(--border-strong);\n    margin: 0 auto 14px;\n  }\n\n  .sheet-head {\n    display: flex;\n    align-items: flex-start;\n    justify-content: space-between;\n    gap: 12px;\n    margin-bottom: 12px;\n  }\n\n  .close-x {\n    width: 30px;\n    height: 30px;\n    border-radius: 99px;\n    background: var(--bg-surface-2);\n    color: var(--text-secondary);\n    display: grid;\n    place-items: center;\n    font-size: 16px;\n    font-weight: 700;\n    flex-shrink: 0;\n  }\n\n  .strongs-badge {\n    display: inline-block;\n    font-size: 11.5px;\n    font-weight: 700;\n    padding: 3px 9px;\n    border-radius: 999px;\n    background: var(--accent-soft);\n    color: var(--accent);\n    margin-bottom: 6px;\n  }\n\n  .word-big {\n    font-family: var(--font-serif);\n    font-size: 30px;\n    font-weight: 700;\n    margin: 0 0 2px;\n  }\n\n  .grammar-pill {\n    display: inline-block;\n    font-size: 12px;\n    font-weight: 600;\n    padding: 5px 10px;\n    border-radius: 9px;\n    background: var(--spark-soft);\n    color: var(--spark-text);\n    margin: 8px 0 12px;\n  }\n\n  .occurrence-chip {\n    display: inline-flex;\n    align-items: center;\n    gap: 5px;\n    padding: 6px 10px;\n    border-radius: 10px;\n    background: var(--bg-surface-2);\n    border: 1px solid var(--border);\n    font-size: 12px;\n    font-weight: 600;\n    margin: 0 6px 6px 0;\n  }\n\n  /* 5-Section Verse Study Page */\n  .study-section-card {\n    padding: 12px 13px;\n    border-radius: 14px;\n    background: var(--bg-app);\n    border: 1px solid var(--border);\n    margin-bottom: 10px;\n  }\n\n  .study-section-num {\n    font-size: 10.5px;\n    font-weight: 800;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--accent);\n    margin-bottom: 4px;\n  }\n\n  .study-section-card p {\n    margin: 0;\n    font-size: 13.5px;\n    line-height: 1.55;\n    color: var(--text-primary);\n  }\n\n  /* Stillness Overlay */\n  .stillness-modal {\n    position: fixed;\n    inset: 0;\n    z-index: 95;\n    background: radial-gradient(circle at 50% 35%, #1A2D63 0%, #091024 100%);\n    color: #F4F7FF;\n    display: none;\n    flex-direction: column;\n    align-items: center;\n    justify-content: space-between;\n    padding: 44px 26px 40px;\n    max-width: 390px;\n    margin: 0 auto;\n  }\n\n  .stillness-modal.open {\n    display: flex;\n    animation: fadeUp 0.25s ease;\n  }\n\n  .breath-orb {\n    width: 164px;\n    height: 164px;\n    border-radius: 50%;\n    background: radial-gradient(circle, rgba(217, 155, 56, 0.34) 0%, rgba(155, 184, 255, 0.14) 65%, transparent 100%);\n    border: 1px solid rgba(255, 255, 255, 0.22);\n    display: grid;\n    place-items: center;\n    animation: breatheOrb 8s ease-in-out infinite;\n  }\n\n  @keyframes breatheOrb {\n    0%, 100% { transform: scale(0.88); }\n    50% { transform: scale(1.12); }\n  }\n\n  /* Theme Swatch Grid */\n  .theme-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 8px;\n    margin: 10px 0 16px;\n  }\n\n  .theme-option {\n    padding: 10px;\n    border-radius: 13px;\n    border: 2px solid var(--border);\n    text-align: left;\n    display: flex;\n    align-items: center;\n    gap: 9px;\n    font-size: 12.5px;\n    font-weight: 700;\n  }\n\n  .theme-option.active {\n    border-color: var(--accent);\n    background: var(--accent-soft);\n  }\n\n  .swatch {\n    width: 24px;\n    height: 24px;\n    border-radius: 7px;\n    flex-shrink: 0;\n    border: 1px solid rgba(128, 128, 128, 0.3);\n  }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"phone-shell\">\n  <!-- TOP BAR -->\n  <header class=\"top-bar\" id=\"topBar\">\n    <div class=\"brand-lockup\">\n      <div class=\"brand-mark\">\u2726<\/div>\n      <span class=\"brand-name\">Eliana's Rhythm<\/span>\n    <\/div>\n    <div class=\"top-actions\">\n      <button class=\"pill-btn-sm\" onclick=\"switchTab('bible', 'study')\" title=\"Jump to Study Mode\">\n        <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"/><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/><\/svg>\n        Study Lens\n      <\/button>\n      <button class=\"icon-btn\" onclick=\"openSheet('settingsSheet')\" aria-label=\"Settings and themes\">\n        <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"/><\/svg>\n      <\/button>\n    <\/div>\n  <\/header>\n\n  <main class=\"views-wrap\">\n\n    <!-- ==================== VIEW 1: HOME (THE 3-BEAT RHYTHM) ==================== -->\n    <section class=\"view active\" id=\"view-home\">\n      <div class=\"sanctuary-hero\">\n        <div class=\"time-row\">\n          <div class=\"time-switcher\" role=\"group\" aria-label=\"Time of day\">\n            <button class=\"time-chip active\" onclick=\"setTimeOfDay('morning', this)\">Morning<\/button>\n            <button class=\"time-chip\" onclick=\"setTimeOfDay('midday', this)\">Midday<\/button>\n            <button class=\"time-chip\" onclick=\"setTimeOfDay('evening', this)\">Evening<\/button>\n          <\/div>\n          <button class=\"stillness-trigger\" onclick=\"openStillness()\">\n            <span class=\"breath-dot\"><\/span>\n            Stillness \u00b7 1m\n          <\/button>\n        <\/div>\n\n        <h1 class=\"greeting-title\" id=\"greetingTitle\">Good morning, Michael<\/h1>\n        <p class=\"greeting-sub\" id=\"greetingSub\">A quiet three-beat rhythm for today. No streaks, no rush \u2014 step in wherever you are.<\/p>\n\n        <!-- 3-Beat Rhythm Arc -->\n        <div class=\"rhythm-arc\">\n          <button class=\"beat-step active\" onclick=\"scrollToBeat('beat1')\">\n            <span class=\"beat-num\">1 \u00b7 Receive <span>\u2713<\/span><\/span>\n            <span class=\"beat-label\">Day's Word<\/span>\n            <div class=\"beat-bar\"><span style=\"width:100%\"><\/span><\/div>\n          <\/button>\n          <button class=\"beat-step\" onclick=\"scrollToBeat('beat2')\">\n            <span class=\"beat-num\">2 \u00b7 Walk<\/span>\n            <span class=\"beat-label\">Aliyah 14<\/span>\n            <div class=\"beat-bar\"><span style=\"width:45%\"><\/span><\/div>\n          <\/button>\n          <button class=\"beat-step\" onclick=\"scrollToBeat('beat3')\">\n            <span class=\"beat-num\">3 \u00b7 Answer<\/span>\n            <span class=\"beat-label\">Pray &amp; Note<\/span>\n            <div class=\"beat-bar\"><span style=\"width:15%\"><\/span><\/div>\n          <\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"home-stack\">\n        <!-- BEAT 1: TODAY'S VERSE -->\n        <div id=\"beat1\">\n          <div class=\"section-kicker\">\n            <span>Beat 1 \u00b7 Receive the Word<\/span>\n            <span>John 1 \u00b7 Light<\/span>\n          <\/div>\n          <div class=\"card\">\n            <div class=\"verse-card-head\">\n              <span class=\"verse-ref-badge\">\n                <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M12 2v20M2 12h20\"/><\/svg>\n                John 1:5\n              <\/span>\n              <div class=\"mini-seg\">\n                <button class=\"active\" id=\"homeBsbBtn\" onclick=\"toggleHomeVerse('bsb')\">BSB<\/button>\n                <button id=\"homeElianaBtn\" onclick=\"toggleHomeVerse('eliana')\">\u2726 Eliana<\/button>\n              <\/div>\n            <\/div>\n\n            <p class=\"home-verse-text\" id=\"homeVerseText\">\n              \u201cThe light shines in the darkness, and the darkness has not overcome it.\u201d\n            <\/p>\n\n            <div class=\"card-action-row\">\n              <button class=\"btn-primary\" onclick=\"openReaderFromHome('read')\">\n                Read John 1\n              <\/button>\n              <button class=\"btn-soft\" onclick=\"openReaderFromHome('study')\">\n                Study Mode\n              <\/button>\n              <button class=\"btn-spark\" onclick=\"askElianaFromVerse('John 1:5')\">\n                \u2726 Ask\n              <\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- BEAT 2: CONTINUE YOUR WALK (LIBRARY ROOM) -->\n        <div id=\"beat2\">\n          <div class=\"section-kicker\">\n            <span>Beat 2 \u00b7 Continue Your Walk<\/span>\n            <button style=\"color:var(--accent);font-weight:700;font-size:11px;\" onclick=\"switchTab('journey')\">All Rooms \u2192<\/button>\n          <\/div>\n          <div class=\"card walk-card\">\n            <div class=\"book-spine\">\n              <span>Day<\/span>\n              <strong>14<\/strong>\n              <span>of 40<\/span>\n            <\/div>\n            <div class=\"walk-body\">\n              <div class=\"walk-eyebrow\">ALIYAH, THE ASCENT \u00b7 CHAIN 14<\/div>\n              <h3 class=\"walk-title\">Light That Cannot Be Extinguished<\/h3>\n              <p class=\"walk-meta\">4 linked passages from Genesis 1 to John 1 \u00b7 4 min reading<\/p>\n              <div class=\"walk-footer\">\n                <div class=\"progress-track\"><div class=\"progress-fill\" style=\"width: 35%;\"><\/div><\/div>\n                <button class=\"resume-link\" onclick=\"openRoomPreview('aliyah')\">Continue \u2192<\/button>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- BEAT 3: ANSWER (THRONE ROOM + JOURNAL + ELIANA) -->\n        <div id=\"beat3\">\n          <div class=\"section-kicker\">\n            <span>Beat 3 \u00b7 Answer &amp; Rest<\/span>\n            <span>Throne Room &amp; Journal<\/span>\n          <\/div>\n          <div class=\"card\">\n            <div style=\"font-size:14.5px;font-weight:700;margin-bottom:3px;\">Carry today's reading into prayer or writing<\/div>\n            <div style=\"font-size:12.5px;color:var(--text-secondary);\">Everything you write stays quietly anchored to the verse.<\/div>\n            <div class=\"answer-grid\">\n              <button class=\"answer-tile\" onclick=\"openJourneySub('throne')\">\n                <div class=\"answer-tile-icon\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\"><path d=\"M12 21s-7-4.5-7-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.5-7 10-7 10z\"/><\/svg>\n                <\/div>\n                <strong>Throne Room<\/strong>\n                <span>Shape a prayer from what you're carrying<\/span>\n              <\/button>\n              <button class=\"answer-tile\" onclick=\"openJourneySub('journal')\">\n                <div class=\"answer-tile-icon\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z\"/><\/svg>\n                <\/div>\n                <strong>Journal \u00b7 John 1:5<\/strong>\n                <span>Guided prompt or free page<\/span>\n              <\/button>\n              <button class=\"answer-tile\" onclick=\"openVerseStudySheet('john1_5')\">\n                <div class=\"answer-tile-icon\" style=\"color:var(--spark-text);\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/><\/svg>\n                <\/div>\n                <strong>5-Part Verse Study<\/strong>\n                <span>Deeper lens &amp; take-home practice<\/span>\n              <\/button>\n              <button class=\"answer-tile\" onclick=\"askElianaFromVerse('John 1:5')\">\n                <div class=\"answer-tile-icon\" style=\"color:var(--spark-text);\">\u2726<\/div>\n                <strong>Sit with Eliana<\/strong>\n                <span>Explore questions in live stream<\/span>\n              <\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- ==================== VIEW 2: BIBLE READER (READ & STUDY MODES) ==================== -->\n    <section class=\"view\" id=\"view-bible\">\n      <div class=\"reader-toolbar\">\n        <div class=\"reader-controls-row\">\n          <div class=\"reader-pickers\">\n            <button class=\"picker-pill\" id=\"bookPickerBtn\" onclick=\"toggleChapter()\">\n              <span id=\"bookPickerLabel\">John 1<\/span>\n              <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"m6 9 6 6 6-6\"/><\/svg>\n            <\/button>\n            <button class=\"picker-pill\" id=\"transPickerBtn\" onclick=\"cycleTranslation()\">\n              <span id=\"transPickerLabel\">BSB<\/span>\n            <\/button>\n          <\/div>\n\n          <!-- Remembered Read / Study Mode Toggle -->\n          <div class=\"mode-switch\" role=\"tablist\" aria-label=\"Bible reader mode\">\n            <button class=\"mode-btn active\" id=\"modeReadBtn\" onclick=\"setReaderMode('read')\">\n              Read\n            <\/button>\n            <button class=\"mode-btn\" id=\"modeStudyBtn\" onclick=\"setReaderMode('study')\">\n              Study\n            <\/button>\n          <\/div>\n        <\/div>\n\n        <!-- Layer controls shown when in Study Mode -->\n        <div class=\"layer-filter-bar\" id=\"studyLayerBar\" style=\"display:none;\">\n          <button class=\"layer-chip on\" data-layer=\"original\" onclick=\"toggleLayer('original', this)\">Original (Grk/Heb)<\/button>\n          <button class=\"layer-chip on\" data-layer=\"translit\" onclick=\"toggleLayer('translit', this)\">Translit<\/button>\n          <button class=\"layer-chip spark-chip on\" data-layer=\"eliana\" onclick=\"toggleLayer('eliana', this)\">\u2726 Eliana<\/button>\n          <button class=\"layer-chip on\" data-layer=\"keyword\" onclick=\"toggleLayer('keyword', this)\">Key Word<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"reader-canvas\" id=\"readerCanvas\">\n        <!-- Rendered dynamically by JS for John 1 (Greek) or Psalm 100 (Hebrew) in Read or Study mode -->\n      <\/div>\n    <\/section>\n\n    <!-- ==================== VIEW 3: JOURNEY, ROOMS, THRONE ROOM & JOURNAL ==================== -->\n    <section class=\"view\" id=\"view-journey\">\n      <div class=\"sub-tabs\">\n        <button class=\"sub-tab-btn active\" id=\"subBtn-rooms\" onclick=\"switchJourneySub('rooms')\">Journey &amp; Rooms<\/button>\n        <button class=\"sub-tab-btn\" id=\"subBtn-throne\" onclick=\"switchJourneySub('throne')\">Throne Room<\/button>\n        <button class=\"sub-tab-btn\" id=\"subBtn-journal\" onclick=\"switchJourneySub('journal')\">Journal<\/button>\n      <\/div>\n\n      <!-- SUB-PANEL A: JOURNEY & LIBRARY ROOMS -->\n      <div class=\"journey-panel active\" id=\"panel-rooms\">\n        <div class=\"constellation-card\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n            <div>\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#9BB8FF;\">Rhythm Over Time<\/div>\n              <div style=\"font-size:18px;font-weight:700;margin-top:2px;\">19 quiet mornings \u00b7 3 chains<\/div>\n            <\/div>\n            <span style=\"font-size:11px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,0.1);color:var(--text-on-sanctuary-muted);\">No streaks<\/span>\n          <\/div>\n          <div class=\"constellation-grid\" id=\"constellationGrid\"><\/div>\n          <div class=\"constellation-legend\">\n            <span>Last 30 days<\/span>\n            <span>\u25cf Read &nbsp; <span style=\"color:var(--spark);\">\u25cf<\/span> Study &amp; Reflection<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"section-kicker\">\n          <span>Library Rooms<\/span>\n          <span>Each book opens its own room<\/span>\n        <\/div>\n\n        <button class=\"room-card\" onclick=\"openRoomPreview('eliana')\">\n          <div class=\"room-badge\" style=\"background:linear-gradient(155deg,#8F5D14,#D99B38);\">\u2726<\/div>\n          <div class=\"room-info\">\n            <strong>Eliana's Journal<\/strong>\n            <span>Day 42 \u00b7 \"When the Room Feels Small\" \u00b7 Read one day at a time<\/span>\n          <\/div>\n          <span style=\"color:var(--text-muted);font-weight:700;\">\u203a<\/span>\n        <\/button>\n\n        <button class=\"room-card\" onclick=\"openRoomPreview('aliyah')\">\n          <div class=\"room-badge\" style=\"background:linear-gradient(155deg,#10214B,#274EC4);\">\u26d3<\/div>\n          <div class=\"room-info\">\n            <strong>Aliyah, The Ascent<\/strong>\n            <span>Day 14 of 40 \u00b7 Studies built from Scripture Chains<\/span>\n          <\/div>\n          <span style=\"color:var(--text-muted);font-weight:700;\">\u203a<\/span>\n        <\/button>\n\n        <button class=\"room-card\" onclick=\"openRoomPreview('foundations')\">\n          <div class=\"room-badge\" style=\"background:linear-gradient(1 between;\">\n            <strong style=\"font-size:14.5px;\">New Reflection<\/strong>\n            <span class=\"verse-ref-badge\" style=\"font-size:11px;\">Tied to John 1:5<\/span>\n          <\/div>\n          <div style=\"font-size:12px;color:var(--text-secondary);margin-top:6px;\">\n            <em>Guided prompt:<\/em> Where do you need light to outlast the noise today?\n          <\/div>\n          <textarea class=\"clean-textarea\" id=\"journalInput\" placeholder=\"Write freely...\"><\/textarea>\n          <button class=\"btn-primary\" style=\"width:100%;\" onclick=\"addJournalEntry()\">Save Entry to John 1:5<\/button>\n        <\/div>\n\n        <div class=\"section-kicker\"><span>Past Entries<\/span><\/div>\n        <input class=\"search-input\" id=\"journalSearch\" placeholder=\"Search journal by word or verse...\" oninput=\"renderJournal()\" />\n        <div id=\"journalList\"><\/div>\n      <\/div>\n    <\/section>\n\n    <!-- ==================== VIEW 4: ELIANA (STREAMING AI COMPANION) ==================== -->\n    <section class=\"view\" id=\"view-eliana\">\n      <div class=\"eliana-header-card\">\n        <div class=\"anchor-pill\" id=\"elianaAnchorPill\">\n          \u2726 Anchored to John 1:5 \u00b7 Study Context\n        <\/div>\n        <div style=\"font-size:17px;font-weight:700;letter-spacing:-0.01em;\">Ask Eliana<\/div>\n        <div style=\"font-size:12.5px;color:var(--text-on-sanctuary-muted);margin-top:2px;\">Tap any Scripture reference in a reply to open it directly in the Reader.<\/div>\n      <\/div>\n\n      <div class=\"chat-stream\" id=\"chatStream\">\n        <div class=\"msg user\">Why does John say the darkness has not \u201covercome\u201d the light?<\/div>\n        <div class=\"msg eliana\">\n          <div class=\"msg-eliana-badge\">\u2726 Eliana<\/div>\n          <div>\n            The Greek verb <em>katelaben<\/em> (Strong's G2638) carries a beautiful double meaning: it can mean <strong>seize / overpower<\/strong> as well as <strong>grasp / comprehend<\/strong>. John uses that tension intentionally. Even when the light enters a world that doesn't recognize it, darkness cannot put it out.\n            <br><br>\n            Compare how that echoes <span class=\"ref-chip\" onclick=\"jumpToVerseRef('psalm100', 1)\">Psalm 100:1<\/span> and <span class=\"ref-chip\" onclick=\"jumpToVerseRef('john1', 1)\">John 1:1<\/span>.\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"prompt-chips\">\n        <button class=\"prompt-chip\" onclick=\"sendPresetEliana('What does \u201cHiphil imperative\u201d mean in Psalm 100:1?')\">Psalm 100 grammar<\/button>\n        <button class=\"prompt-chip\" onclick=\"sendPresetEliana('Walk me through Chain 14 on light.')\">Explain Chain 14<\/button>\n        <button class=\"prompt-chip\" onclick=\"sendPresetEliana('Turn John 1:5 into a short prayer.')\">Pray John 1:5<\/button>\n      <\/div>\n\n      <div class=\"chat-composer\">\n        <input type=\"text\" id=\"chatInput\" placeholder=\"Ask about a verse, word, or life...\" onkeydown=\"if(event.key==='Enter')sendElianaMessage()\" />\n        <button class=\"send-btn\" onclick=\"sendElianaMessage()\" aria-label=\"Send\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"m22 2-7 20-4-9-9-4Z\"/><path d=\"M22 2 11 13\"/><\/svg>\n        <\/button>\n      <\/div>\n    <\/section>\n\n  <\/main>\n\n  <!-- BOTTOM NAVIGATION -->\n  <nav class=\"bottom-nav\" aria-label=\"Primary navigation\">\n    <button class=\"nav-item active\" id=\"nav-home\" onclick=\"switchTab('home')\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"/><\/svg>\n      <span>Home<\/span>\n    <\/button>\n    <button class=\"nav-item\" id=\"nav-bible\" onclick=\"switchTab('bible')\">\n      <svg width=\"20\" hei  <\/div>\n<\/div>\n\n<!-- ==================== CHAIN READING SHEET ==================== -->\n<div class=\"sheet-backdrop\" id=\"chainSheet\" onclick=\"if(event.target===this)closeSheet('chainSheet')\">\n  <div class=\"sheet-panel\">\n    <div class=\"sheet-handle\"><\/div>\n    <div class=\"sheet-head\">\n      <div>\n        <span class=\"strongs-badge\" id=\"csBadge\">Chain 14 \u00b7 4 Passages<\/span>\n        <h2 style=\"font-size:20px;font-weight:700;margin:4px 0 0;\" id=\"csTitle\">Light That Cannot Be Extinguished<\/h2>\n      <\/div>\n      <button class=\"close-x\" onclick=\"closeSheet('chainSheet')\">\u00d7<\/button>\n    <\/div>\n    <p style=\"font-size:13px;color:var(--text-secondary);line-height:1.5;margin:0 0 14px;\" id=\"csIntro\"><\/p>\n    <div id=\"csLinks\"><\/div>\n  <\/div>\n<\/div>\n\n<!-- ==================== 5-SECTION VERSE STUDY SHEET ==================== -->\n<div class=\"sheet-backdrop\" id=\"verseStudySheet\" onclick=\"if(event.target===this)closeSheet('verseStudySheet')\">\n  <div class=\"sheet-panel\">\n    <div class=\"sheet-handle\"><\/div>\n    <div class=\"sheet-head\">\n      <div>\n        <span class=\"strongs-badge\" id=\"vssRef\">John 1:5 \u00b7 5-Section Study<\/span>\n        <h2 style=\"font-size:19px;font-weight:700;margin:4px 0 0;\" id=\"vssTitle\">Light in the Uncomprehending Dark<\/h2>\n      <\/div>\n      <button class=\"close-x\" onclick=\"closeSheet('verseStudySheet')\">\u00d7<\/button>\n    <\/div>\n    <div id=\"vssSections\"><\/div>\n    <button class=\"btn-primary\" style=\"width:100%;margin-top:6px;\" onclick=\"closeSheet('verseStudySheet');openJourneySub('journal');\">\n      Bring Practice into Your Journal \u2192\n    <\/button>\n  <\/div>\n<\/div>\n\n<!-- ==================== LIBRARY ROOM PREVIEW SHEET ==================== -->\n<div class=\"sheet-backdrop\" id=\"roomSheet\" onclick=\"if(event.target===this)closeSheet('roomSheet')\">\n  <div class=\"sheet-panel\">\n    <div class=\"sheet-handle\"><\/div>\n class=\"swatch\" style=\"background:linear-gradient(135deg,#000000 50%,#FFFFFF 50%);\"><\/span>\n        High Contrast\n      <\/button>\n    <\/div>\n\n    <div class=\"section-kicker\">\n      <span>Scripture Text Size<\/span>\n      <span id=\"fontSizeLabel\">17px<\/span>\n    <\/div>\n    <input type=\"range\" min=\"15\" max=\"21\" value=\"17\" style=\"width:100%;margin-bottom:16px;\" oninput=\"setScriptureSize(this.value)\" />\n\n    <div class=\"study-section-card\" style=\"display:flex;justify-content:space-between;align-items:center;\">\n      <div>\n        <strong style=\"font-size:13.5px;display:block;\">Morning Rhythm Reminder<\/strong>\n        <span style=\"font-size:12px;color:var(--text-secondary);\">Gentle chime at 7:30 AM<\/span>\n      <\/div>\n      <span style=\"font-size:12px;font-weight:700;color:var(--accent);\">On<\/span>\n    <\/div>\n    <div class=\"study-section-card\" style=\"display:flex;justify-content:space-between;align-items:center;\">\n      <div>\n        <strong style=\"font-size:13.5px;display:block;\">Cloud Backup &amp; Account<\/strong>\n        <span style=\"font-size:12px;color:var(--text-secondary);\">michael@elianasrhythm.app \u00b7 Synced<\/span>\n      <\/div>\n      <span style=\"font-size:12px;font-weight:700;color:var(--accent);\">Synced<\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ==================== STILLNESS GUIDED PAUSE ==================== -->\n<div class=\"stillness-modal\" id=\"stillnessModal\">\n  <div style=\"text-align:center;\">\n    <div style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#F6D28B;\">Stillness \u00b7 Guided Pause<\/div>\n    <h2 style=\"font-family:var(--font-serif);font-size:24px;margin:8px 0 4px;\">Be still, and know<\/h2>\n    <div style=\"font-size:13px;color:rgba(244,247,255,0.7);\">Psalm 46:10 \u00b7 Follow the ring<\/div>\n  <\/div>\n\n  <div class=\"breath-orb\">\n    <span id=\"breathCue\" style=\"font-size:15px;font-weight:600;letter-sp e\u05d4\u05b8\u05d0\u05b8\u05e8\u05b6\u05e5\u05c3 \u2014 Make a joyful noise to the LORD, all the earth.' },\n      { k: '2 \u00b7 Fresh Rendering \u2726', t: 'Lift a jubilant, unguarded shout to the LORD \u2014 every corner of the earth!' },\n      { k: '3 \u00b7 Deeper Lens', t: '\u201cHari\u2019u\u201d is a Hiphil imperative plural: a community invitation to raise a festive trumpet-cry when a king enters.' },\n      { k: '4 \u00b7 Everyday Insight', t: 'Worship is not quiet compliance; it begins with honest gratitude spilling over into your ordinary morning.' },\n      { k: '5 \u00b7 Take-Home Practice', t: 'Before checking messages, name one concrete mercy aloud today and write a two-line thanks in your Journal.' }\n    ] : [\n      { k: '1 \u00b7 Scripture', t: '\u03ba\u03b1\u1f76 \u03c4\u1f78 \u03c6\u1ff6\u03c2 \u1f10\u03bd \u03c4\u1fc7 \u03c3\u03ba\u03bf\u03c4\u03af\u1fb3 \u03c6\u03b1\u03af\u03bd\u03b5\u03b9, \u03ba\u03b1\u1f76 \u1f21 \u03c3\u03ba\u03bf\u03c4\u03af\u03b1 \u03b1\u1f50\u03c4\u1f78 \u03bf\u1f50 \u03ba\u03b1\u03c4\u03ad\u03bb\u03b1\u03b2\u03b5\u03bd.' },\n      { k: '2 \u00b7 Fresh Rendering \u2726', t: 'That light keeps shining right inside the dark \u2014 and the dark could neither snuff it out nor grasp its secret.' },\n      { k: '3 \u00b7 Deeper Lens', t: 'John moves from past-tense eternity (v.1\u20134) into present tense (phainei, \"keeps shining\"). Illumination is active right now.' },\n      { k: '4 \u00b7 Everyday Insight', t: 'Darkness does not need to disappear before light is victorious; light simply refuses to stop shining within it.' },\n      { k: '5 \u00b7 Take-Home Practice', t: 'Name one shadowed place in your week, and bring it honestly into your Journal as a place already reached by light.' }\n    ];\n\n    document.getElementById('vssSections').innerHTML = sections.map(s => `\n      <div class=\"study-section-card\">\n        <div class=\"study-section-num\">${s.k}<\/div>\n        <p>${s.t}<\/p>\n      <\/div>\n    `).join('');\n    openSheet('verseStudySheet');\n  }\n\n  /* ==================== READER RENDERING (READ & STUDY) ==================== */\n  function renderReader() {\n    const ch = chapters[state.chapterKey];\n    const canvas = document.getElementById('readerCanvas');\n    document.getElementById('bookPickerLabel').textContent = ch.title;\n    document.getElementById('transPickerLabel').textContent = state.translation === 'Eliana' ? '\u2726 Eliana' : state.translation;\n\n    const isStudy = state.readerMode === 'study';\n    document.getElementById('modeReadBtn').classList.toggle('active', !isStudy);\n    document.getElementById('modeStudyBtn').classList.toggle('active', isStudy);\n    document.getElementById('studyLayerBar').style.display = isStudy ? 'flex' : 'none';\n\n    let html = `\n      <div class=\"chapter-heading\">\n        <div class=\"chapter-kicker\">${ch.subtitle} \u00b7 ${isStudy ? 'Study Workbench' : 'Flowing Read'}<\/div>\n        <h2 class=\"chapter-title\">${ch.title}<\/h2>\n      <\/div>\n    `;\n\n    if (!isStudy) {\n      // READ MODE: flowing paragraphs like a printed Bible\n      const spans = ch.verses.map((verse, idx) => {\n        const text = verse[state.translation] || verse.BSB;\n        const selected = idx === state.activeVerseIndex ? 'selected' : '';\n        const chainBtn = verse.chainTag\n          ? `<span class=\"chain-inline-tag\" onclick=\"event.stopPropagation();openChainSheet('${ch.chainId}')\">${verse.chainTag}<\/span>`\n          : '';\n        return `<span class=\"inline-verse ${selected}\" onclick=\"selectReadVerse(${idx})\"><sup class=\"v-num\">${verse.v}<\/sup>${text}${chainBtn}<\/span> `;\n      }).join('');\n\n      const activeV = ch.verses[state.activeVerseIndex] || ch.verses[0];\n      html += `\n        <div class=\"read-prose\">\n          <p class=\"read-paragraph\">${spans}<\/p>\n        <\/div>\n        <div class=\"read-verse-bar\">\n          <div>\n            <div style=\"font-size:11px;font-weight:700;color:var(--accent);\">${ch.title}:${activeV.v} selected<\/div>\n            <div style=\"font-size:12px;color:var(--text-secondary);\">Tap any verse to study layers or ask Eliana<\/div>\n          <\/div>\n          <div style=\"display:flex;gap:6px;\">\n            <button class=\"btn-soft\" style=\"padding:8px 11px;font-size:12px;\" onclick=\"setReaderMode('study')\">Study<\/button>\n            <button class=\"btn-spark\" style=\"padding:8px 11px;font-size:12px;\" onclick=\"askElianaFromVerse('${ch.title}:${activeV.v}')\">\u2726 Ask<\/button>\n          <\/div>\n        <\/div>\n      `;\n    } else {\n      // STUDY MODE: surrounding verses compact + active verse in Deep Study Lens\n      html += `<div class=\"study-list\">` + ch.verses.map((verse, idx) => {\n        if (idx !== state.activeVerseIndex) {\n          return `\n            <div class=\"study-verse-compact\" onclick=\"focusStudyVerse(${idx})\">\n              <div class=\"study-compact-head\">\n                <span class=\"study-compact-ref\">${ch.title}:${verse.v}<\/span>\n                <span style=\"font-size:11px;color:var(--text-muted);\">Tap to open 4 layers \u203a<\/span>\n              <\/div>\n              <p class=\"study-compact-text\">${verse[state.translation] || verse.BSB}<\/p>\n            <\/div>\n          `;\n        }\n\n        const tokensHtml = verse.tokens.map(t =>\n          `<button class=\"word-token ${t.key ? 'key-word' : ''}\" onclick=\"lookupWord('${t.wordKey}', '${t.text}')\">${t.text}<\/button>`\n        ).join('');\n\n        return `\n          <div class=\"study-lens\">\n            <div class=\"lens-head\">\n              <span class=\"lens-ref\">${ch.title}:${verse.v} \u00b7 ${state.translation}<\/span>\n              <button class=\"chain-pill-dark\" onclick=\"openChainSheet('${ch.chainId}')\">\n                ${verse.chainTag || '\u26d3 Linked Chain'}\n              <\/button>\n            <\/div>\n\n            <p class=\"lens-translation-text\">${verse[state.translation] || verse.BSB}<\/p>\n\n            <div class=\"layer-block ${state.layers.original ? '' : 'hidden'}\">\n              <div class=\"layer-label\">\n                <span>1 \u00b7 Original (${ch.rtl ? 'Hebrew' : 'Greek'})<\/span>\n                <span class=\"tap-hint\">Tap any word<\/span>\n              <\/div>\n              <div class=\"original-tokens ${ch.rtl ? 'rtl' : ''}\">${tokensHtml}<\/div>\n            <\/div>\n\n            <div class=\"layer-block ${state.layers.translit ? '' : 'hidden'}\">\n              <div class=\"layer-label\"><span>2 \u00b7 Transliteration<\/span><\/div>\n              <p class=\"translit-line\">${verse.translit}<\/p>\n            <\/div>\n\n            <div class=\"layer-block eliana-layer ${state.layers.eliana ? '' : 'hidden'}\">\n              <div class=\"layer-label\"><span>3 \u00b7 \u2726 Eliana's Rendering<\/span><\/div>\n              <p class=\"eliana-render-text\">${verse.elianaRender}<\/p>\n            <\/div>\n\n            <div class=\"layer-block ${state.layers.keyword ? '' : 'hidden'}\">\n              <div class=\"layer-label\"><span>4 \u00b7 Key Word Study<\/span><\/div>\n              <div class=\"keyword-summary\">\n                <div class=\"keyword-info\">\n                  <strong>${verse.keyWord.token}<\/strong>\n                  <span>${verse.keyWord.summary}<\/span>\n                <\/div>\n                <button class=\"chain-pill-dark\" onclick=\"lookupWord('${verse.tokens.find(t=>t.key)?.wordKey || 'phainei'}', '${verse.keyWord.token}')\">Word Sheet<\/button>\n              <\/div>\n            <\/div>\n\n            <div class=\"lens-footer-actions\">\n              <button class=\"lens-btn primary\" onclick=\"openVerseStudySheet('${state.chapterKey}_v${verse.v}')\">5-Part Study<\/button>\n              <button class=\"lens-btn spark\" onclick=\"askElianaFromVerse('${ch.title}:${verse.v}')\">\u2726 Ask Eliana<\/button>\n            <\/div>\n          <\/div>\n        `;\n      }).join('') + `<\/div>`;\n    }\n\n    canvas.innerHTML = html;\n  }\n\n  function setReaderMode(mode) {\n    state.readerMode = mode;\n    renderReader();\n  }\n\n  function toggleChapter() {\n    state.chapterKey = state.chapterKey === 'john1' ? 'psalm100' : 'john1';\n    state.activeVerseIndex = state.chapterKey === 'john1' ? 4 : 0;\n    renderReader();\n  }\n\n  function cycleTranslation() {\n    const order = ['BSB', 'KJV', 'ASV', 'Eliana'];\n    state.translation = order[(order.indexOf(state.translation) + 1) % order.length];\n    renderReader();\n  }\n\n  function toggleLayer(layer, btn) {\n    state.layers[layer] = !state.layers[layer];\n    btn.classList.toggle('on', state.layers[layer]);\n    renderReader();\n  }\n\n  function selectReadVerse(idx) {\n    state.activeVerseIndex = idx;\n    renderReader();\n  }\n\n  function focusStudyVerse(idx) {\n    state.activeVerseIndex = idx;\n    renderReader();\n  }\n\n  /* ==================== NAVIGATION & HOME ==================== */\n  function switchTab(tab, forcedReaderMode) {\n    state.activeTab = tab;\n    if (forcedReaderMode) state.readerMode = forcedReaderMode;\n\n    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));\n    document.getElementById('view-' + tab).classList.add('active');\n\n    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));\n    document.getElementById('nav-' + tab).classList.add('active');\n\n    document.getElementById('topBar').classList.toggle('light-mode', tab === 'bible' || tab === 'journey');\n\n    if (tab === 'bible') renderReader();\n    window.scrollTo({ top: 0, behavior: 'smooth' });\n  }\n\n  function openReaderFromHome(mode) {\n    state.chapterKey = 'john1';\n    state.activeVerseIndex = 4;\n    switchTab('bible', mode);\n  }\n\n  function setTimeOfDay(tod, btn) {\n    state.timeOfDay = tod;\n    document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('active'));\n    btn.classList.add('active');\n    const copy = {\n      morning: ['Good morning, Michael', 'A quiet three-beat rhythm for today. No streaks, no rush \u2014 step in wherever you are.'],\n      midday: ['Peace in the midday, Michael', 'Pause between hours. Return to the morning word or carry a brief prayer.'],\n      evening: ['Good evening, Michael', 'Lay down what the day asked of you. End in stillness, reflection, and rest.']\n    }[tod];\n    document.getElementById('greetingTitle').textContent = copy[0];\n    document.getElementById('greetingSub').textContent = copy[1];\n  }\n\n  function toggleHomeVerse(mode) {\n    state.homeVerseMode = mode;\n    document.getElementById('homeBsbBtn').classList.toggle('active', mode === 'bsb');\n    document.getElementById('homeElianaBtn').classList.toggle('active', mode === 'eliana');\n    const el = document.getElementById('homeVerseText');\n    if (mode === 'eliana') {\n      el.classList.add('eliana-voice');\n      el.innerHTML = `<span class=\"spark-tag\">\u2726<\/span> \u201cThat light keeps shining right inside the dark \u2014 and the dark could neither snuff it out nor grasp its secret.\u201d`;\n    } else {\n      el.classList.remove('eliana-voice');\n      el.textContent = '\u201cThe light shines in the darkness, and the darkness has not overcome it.\u201d';\n    }\n  }\n\n  function scrollToBeat(id) {\n    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'center' });\n  }\n\n  /* ==================== JOURNEY, THRONE ROOM, JOURNAL & ROOMS ==================== */\n  function switchJourneySub(panel) {\n    ['rooms', 'throne', 'journal'].forEach(k => {\n      document.getElementById('subBtn-' + k).classList.toggle('active', k === panel);\n      document.getElementById('panel-' + k).classList.toggle('active', k === panel);\n    });\n  }\n\n  function openJourneySub(panel) {\n    switchTab('journey');\n    switchJourneySub(panel);\n  }\n\n  function initConstellation() {\n    const pattern = [\n      1,2,1,0,1,2,1,1,0,2,\n      1,1,2,1,0,1,2,2,1,0,\n      1,2,0,1,1,2,1,2,2,2\n    ];\n    document.getElementById('constellationGrid').innerHTML = pattern.map(p => {\n      const cls = p === 2 ? 'deep' : p === 1 ? 'read' : '';\n      return `<div class=\"rhythm-node ${cls}\"><\/div>`;\n    }).join('');\n  }\n\n  const savedPrayers = [\n    { id: 1, title: 'Morning Anchor (Curated)', body: 'Lord, be the steady lamp ahead of my next step today \u2014 quiet the urge to hurry.', fav: true, tag: 'Curated' },\n    { id: 2, title: 'For Eliana', body: 'Keep her heart bright, curious, and anchored in kindness that outlasts noise.', fav: true, tag: 'Saved' },\n    { id: 3, title: 'Before Hard Conversations', body: 'Give me ears slower than my tongue and patience deeper than my pride.', fav: false, tag: 'Curated' }\n  ];\n\n  function renderPrayers() {\n    const q = (document.getElementById('prayerSearch')?.value || '').toLowerCase();\n    const list = savedPrayers.filter(p => p.title.toLowerCase().includes(q) || p.body.toLowerCase().includes(q));\n    document.getElementById('prayersList').innerHTML = list.map(p => `\n      <div class=\"saved-item\">\n        <div class=\"saved-item-head\">\n          <strong style=\"font-size:13.5px;\">${p.title} <span style=\"font-size:10.5px;color:var(--text-muted);font-weight:600;\">\u00b7 ${p.tag}<\/span><\/strong>\n          <button class=\"fav-btn ${p.fav ? 'faved' : ''}\" onclick=\"toggleFav(${p.id})\">${p.fav ? '\u2605' : '\u2606'}<\/button>\n        <\/div>\n        <div style=\"font-size:13px;color:var(--text-secondary);line-height:1.5;\">${p.body}<\/div>\n      <\/div>\n    `).join('');\n  }\n\n  function toggleFav(id) {\n    const item = savedPrayers.find(p => p.id === id);\n    if (item) item.fav = !item.fav;\n    renderPrayers();\n  }\n\n  let lastGeneratedPrayer = '';\n  function generatePrayer() {\n    const need = document.getElementById('prayerNeedInput').value.trim() || 'wisdom and quiet steadiness for what lies ahead';\n    lastGeneratedPrayer = `Father of light, You already see what I am carrying around ${need.replace(/\\.$/, '')}. Meet me inside this hour not with pressure, but with Your unhurried presence. Let the light of John 1:5 steady my mind, and teach me to trust what You are growing in the unseen. Amen.`;\n    const box = document.getElementById('generatedPrayerBox');\n    box.textContent = lastGeneratedPrayer;\n    box.classList.add('show');\n    document.getElementById('savePrayerBtn').style.display = 'inline-flex';\n  }\n\n  function saveGeneratedPrayer() {\n    if (!lastGeneratedPrayer) return;\n    savedPrayers.unshift({ id: Date.now(), title: 'Personal Prayer \u00b7 Today', body: lastGeneratedPrayer, fav: true, tag: 'Saved' });\n    document.getElementById('prayerNeedInput').value = '';\n    document.getElementById('savePrayerBtn').style.display = 'none';\n    renderPrayers();\n  }\n\n  const journalEntries = [\n    { ref: 'John 1:5', date: 'Today \u00b7 Morning', text: 'I keep noticing \"phainei\" is present tense \u2014 the light does not wait until conditions improve.' },\n    { ref: 'Psalm 100:1', date: 'Nov 16', text: 'Gladness as a starting posture rather than a reward after everything goes right.' }\n  ];\n\n  function renderJournal() {\n    const q = (document.getElementById('journalSearch')?.value || '').toLowerCase();\n    const list = journalEntries.filter(j => j.text.toLowerCase().includes(q) || j.ref.toLowerCase().includes(q));\n    document.getElementById('journalList').innerHTML = list.map(j => `\n      <div class=\"saved-item\">\n        <div class=\"saved-item-head\">\n          <span class=\"verse-ref-badge\" style=\"font-size:11px;\">${j.ref}<\/span>\n          <span style=\"font-size:11px;color:var(--text-muted);\">${j.date}<\/span>\n        <\/div>\n        <div style=\"font-size:13.5px;line-height:1.55;\">${j.text}<\/div>\n      <\/div>\n    `).join('');\n  }\n\n  function addJournalEntry() {\n    const txt = document.getElementById('journalInput').value.trim();\n    if (!txt) return;\n    journalEntries.unshift({ ref: 'John 1:5', date: 'Just now', text: txt });\n    document.getElementById('journalInput').value = '';\n    renderJournal();\n  }\n\n  function openRoomPreview(room) {\n    const rooms = {\n      eliana: {\n        badge: \"Eliana's Journal \u00b7 Day 42\",\n        title: 'When the Room Feels Small',\n        body: `<p style=\"font-family:var(--font-serif);font-size:16px;\">\u201cFaith rarely asks us to pretend the room is bigger than it is. Most days it simply places one clear lamp on the table.\u201d<\/p><p>Today's devotional reflection pairs with <strong>Psalm 27:1<\/strong> and leaves quiet margin for one honest sentence before work begins.<\/p>`\n      },\n      aliyah: {\n        badge: 'Aliyah, The Ascent \u00b7 Day 14',\n        title: 'Light That Cannot Be Extinguished',\n        body: `<p><strong>Aliyah<\/strong> ascends through Scripture along numbered Chains \u2014 letting Genesis, the Psalms, the Prophets, and the Gospels answer one another.<\/p><p>Today's step connects <strong>Chain 14<\/strong> directly into the Bible Study Lens.<\/p>`\n      },\n      foundations: {\n        badge: 'The Foundations \u00b7 Chapter 3',\n        title: 'How the Manuscripts Reached Us',\n        body: `<p>Before verse numbers or printed bindings, Scripture lived in scrolls copied by hand across centuries. Understanding how Koine Greek and Biblical Hebrew were preserved turns word study into gratitude.<\/p>`\n      }\n    }[room];\n    document.getElementById('rmBadge').textContent = rooms.badge;\n    document.getElementById('rmTitle').textContent = rooms.title;\n    document.getElementById('rmBody').innerHTML = rooms.body;\n    openSheet('roomSheet');\n  }\n\n  /* ==================== ELIANA STREAMING CHAT ==================== */\n  function askElianaFromVerse(ref) {\n    document.getElementById('elianaAnchorPill').textContent = `\u2726 Anchored to ${ref} \u00b7 Study Context`;\n    switchTab('eliana');\n  }\n\n  function jumpToVerseRef(chKey, verseNum) {\n    state.chapterKey = chKey;\n    state.activeVerseIndex = Math.max(0, verseNum - 1);\n    switchTab('bible', 'study');\n  }\n\n  function sendPresetEliana(text) {\n    document.getElementById('chatInput').value = text;\n    sendElianaMessage();\n  }\n\n  function sendElianaMessage() {\n    const input = document.getElementById('chatInput');\n    const q = input.value.trim();\n    if (!q) return;\n    input.value = '';\n\n    const stream = document.getElementById('chatStream');\n    stream.insertAdjacentHTML('beforeend', `<div class=\"msg user\">${escapeHtml(q)}<\/div>`);\n\n    const msgEl = document.createElement('div');\n    msgEl.className = 'msg eliana';\n    msgEl.innerHTML = `<div class=\"msg-eliana-badge\">\u2726 Eliana \u00b7 Streaming<\/div><div class=\"stream-target\"><\/div>`;\n    stream.appendChild(msgEl);\n    const target = msgEl.querySelector('.stream-target');\n\n    let replyWords = [];\n    let refHtml = '';\n    if (q.toLowerCase().includes('psalm') || q.toLowerCase().includes('hiphil')) {\n      replyWords = \"In Hebrew, a Hiphil imperative plural is an active, shared invitation \u2014 literally 'cause a joyful sound to ring out together.' It turns praise from private duty into common joy.\".split(' ');\n      refHtml = ` <span class=\"ref-chip\" onclick=\"jumpToVerseRef('psalm100', 1)\">Psalm 100:1<\/span>`;\n    } else if (q.toLowerCase().includes('pray')) {\n      replyWords = \"Lord Jesus, Living Word, keep shining inside the places I cannot untangle on my own. Let Your quiet light outlast my worry today. Amen.\".split(' ');\n      refHtml = ` <span class=\"ref-chip\" onclick=\"jumpToVerseRef('john1', 5)\">John 1:5<\/span>`;\n    } else {\n      replyWords = \"Scripture often answers itself across centuries. When you follow Chain 14 from Genesis into John's prologue, light is never reactive \u2014 it speaks first and stays steady.\".split(' ');\n      refHtml = ` <span class=\"ref-chip\" onclick=\"jumpToVerseRef('john1', 5)\">John 1:5<\/span>`;\n    }\n\n    let i = 0;\n    const timer = setInterval(() => {\n      if (i < replyWords.length) {\n        target.textContent += (i === 0 ? '' : ' ') + replyWords[i];\n        i++;\n      } else {\n        clearInterval(timer);\n        target.insertAdjacentHTML('beforeend', refHtml);\n        msgEl.querySelector('.msg-eliana-badge').textContent = '\u2726 Eliana';\n      }\n      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });\n    }, 45);\n  }\n\n  function escapeHtml(s) {\n    return s.replace(/[&<>\"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;' }[m]));\n  }\n\n  /* ==================== SHEETS, STILLNESS & SETTINGS ==================== */\n  function openSheet(id) {\n    document.getElementById(id).classList.add('open');\n  }\n\n  function closeSheet(id) {\n    document.getElementById(id).classList.remove('open');\n  }\n\n  function openStillness() {\n    const modal = document.getElementById('stillnessModal');\n    modal.classList.add('open');\n    let phase = 0;\n    const cues = ['Breathe in \u00b7 4s', 'Hold softly', 'Breathe out \u00b7 4s', 'Rest'];\n    document.getElementById('breathCue').textContent = cues[0];\n    clearInterval(state.breathInterval);\n    state.breathInterval = setInterval(() => {\n      phase = (phase + 1) % cues.length;\n      document.getElementById('breathCue').textContent = cues[phase];\n    }, 2000);\n  }\n\n  function closeStillness() {\n    clearInterval(state.breathInterval);\n    document.getElementById('stillnessModal').classList.remove('open');\n  }\n\n  function setTheme(theme) {\n    document.documentElement.setAttribute('data-theme', theme);\n    document.querySelectorAll('.theme-option').forEach(el => el.classList.remove('active'));\n    document.getElementById('th-' + theme).classList.add('active');\n  }\n\n  function setScriptureSize(px) {\n    document.documentElement.style.setProperty('--scripture-size', px + 'px');\n    document.getElementById('fontSizeLabel').textContent = px + 'px';\n  }\n\n  /* Initialize dynamic views */\n  initConstellation();\n  renderPrayers();\n  renderJournal();\n<\/script>\n<\/body>\n<\/html>\n<!--\nVision: Replace the scattered menu grid with a three-beat Daily Rhythm (Receive, Walk, Answer) in Lapis Indigo and Mineral Alabaster, with burnished amber (\u2726) reserved for Eliana's voice.\nIn the Bible reader, Read stays pure flowing prose while Study transforms the active verse into a collapsible 4-layer optical lens with tappable Hebrew/Greek words, Chains, and a 5-part study into Journal.\nEliana shifts from an isolated chatbot tab into a contextual companion woven across verses, Throne Room prayer, and streak-free Journey continuity.\n-->\n"}];

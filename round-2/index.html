token-script-grk font-greek\">\u1f26\u03bd<\/span>\n              <span class=\"token-tl font-mono\">\u0113n<\/span>\n              <span class=\"token-gloss\">was [cont.]<\/span>\n            <\/button>\n            <button class=\"word-token\" onclick=\"selectWord('logos', this)\">\n              <span class=\"token-script-grk font-greek\">\u1f41 \u039b\u03cc\u03b3\u03bf\u03c2<\/span>\n              <span class=\"token-tl font-mono\">ho Logos<\/span>\n              <span class=\"token-gloss\">the Word<\/span>\n            <\/button>\n            <button class=\"word-token\" onclick=\"selectWord('pros_ton_theon', this)\">\n              <span class=\"token-script-grk font-greek\">\u03c0\u03c1\u1f78\u03c2 \u03c4\u1f78\u03bd \u0398\u03b5\u03cc\u03bd<\/span>\n              <span class=\"token-tl font-mono\">pros ton Theon<\/span>\n              <span class=\"token-gloss\">face-to-face with God<\/span>\n            <\/button>\n          <\/div>\n        <\/div>\n\n        <!-- LAYER 2: TRANSLITERATION -->\n        <div class=\"score-layer-translit\">\n          <div class=\"layer-head\" style=\"margin-bottom:3px;\">\n            <span>Layer 2 \u00b7 Phonetic Transliteration<\/span>\n          <\/div>\n          <p class=\"translit-line font-serif\">\n            En arch\u0113 \u0113n ho Logos, kai ho Logos \u0113n pros ton Theon, kai Theos \u0113n ho Logos.\n          <\/p>\n        <\/div>\n\n        <!-- LAYER 3: \u2726 ELIANA'S RENDERING -->\n        <div class=\"score-layer-eliana\">\n          <div class=\"eliana-gloss-label\">\n            <span>Layer 3 \u00b7 \u2726 Eliana\u2019s Rendering<\/span>\n          <\/div>\n          <p class=\"eliana-gloss-text font-serif\">\n            \u2726 \u201cBefore the first beginning began, the Living Expression already was\u2014turned face-to-face toward God, and everything God is, the Word was.\u201d\n          <\/p>\n        <\/div>\n\n        <!-- LAYER 4: KEY WORD STUDY -->\n        <div class=\"score-layer-keyword\">\n          <div class=\"kw-title\">\n            <span>Layer 4 \u00b7 Key Word Study \u00b7 \u03c0\u03c1\u1f78\u03c2 (pros, G4314) &amp; \u039b\u03cc\u03b3\u03bf\u03c2 (Logos, G3056)<\/span>\n            <a href=\"#screen-wordsheet\" onclick=\"selectWord('pros_ton_theon')\" style=\"color:var(--azure); text-decoration:none; font-size:10px;\">Inspect \u03c0\u03c1\u1f78\u03c2 \u2193<\/a>\n          <\/div>\n          <p class=\"kw-body\">\n            With the accusative (<em>pros ton Theon<\/em>), <strong>\u03c0\u03c1\u1f78\u03c2<\/strong> means not merely \u201cbeside\u201d but <em>turned toward in active communion<\/em>\u2014linking John 1:1 directly to the \u201cface-to-face\u201d theme of Chain 07.\n          <\/p>\n        <\/div>\n      <\/article>\n    <\/div>\n  <\/section>\n\n  <!-- ========================================================================\n       SCREEN 4: THE WORD SHEET & THE CHAIN SHEET (\u26d3)\n       Tapping any original Hebrew or Greek word updates the Word Sheet live.\n       ======================================================================== -->\n  <section id=\"screen-wordsheet\" class=\"screen-chapter\">\n    <div class=\"chapter-flag azure\">\n      <span>\ud83d\udd0d Screen 4 \u00b7 Lexical &amp; Canonical Threads<\/span>\n      <span>\u00b7<\/span>\n      <span>Word Sheet &amp; Chains<\/span>\n    <\/div>\n\n    <!-- WORD SHEET: Strong's number, grammar, meaning, and other places it appears -->\n    <div class=\"sheet-panel\" id=\"word-sheet-card\">\n      <div class=\"sheet-handle\"><\/div>\n      <div class=\"beat-header\" style=\"margin-bottom:6px;\">\n        <span class=\"beat-kicker azure\">Word Sheet \u00b7 Tapped Original Word<\/span>\n        <span style=\"font-size:10px; color:var(--ink-muted);\">Tap any Hebrew/Greek token above to switch<\/span>\n      <\/div>\n\n      <div class=\"word-sheet-top\">\n        <div>\n          <div class=\"ws-big-word font-hebrew\" id=\"ws-script\">\u05d1\u05b7\u05bc\u05e7\u05b0\u05bc\u05e9\u05c1\u05d5\u05bc<\/div>\n          <div class=\"ws-phonetic font-serif\" id=\"ws-translit\">baq\u00b7q\u0259\u00b7\u0161\u016b \u00b7 \u201cSeek!\u201d<\/div>\n        <\/div>\n        <div class=\"ws-strongs-box\">\n          <span class=\"strongs-code font-mono\" id=\"ws-strongs\">Strong\u2019s H1245<\/span>\n          <span class=\"ws-root-label\" id=\"ws-lemma\">Root: \u05d1\u05b8\u05bc\u05e7\u05b7\u05e9\u05c1 (b\u0101qa\u0161)<\/span>\n        <\/div>\n      <\/div>\n\n      <!-- Grammar / Morphology -->\n      <div class=\"grammar-box\">\n        <div class=\"grammar-parse font-mono\" id=\"ws-grammar\">\n          Verb \u00b7 Piel Imperative \u00b7 Masculine Plural\n        <\/div>\n        <p class=\"grammar-explain\" id=\"ws-grammar-note\">\n          The <strong>Piel stem<\/strong> intensifies the root action: not a casual glance, but a whole-heart, intentional search. As an <strong>imperative plural<\/strong>, it records God\u2019s open call to the worshipping community before David answers in the singular (<em>\u2019\u0103\u1e07aqq\u0113\u0161<\/em>, \u201cI will seek\u201d).\n        <\/p>\n      <\/div>\n\n      <!-- Meaning -->\n      <div class=\"ws-meaning\" id=\"ws-meaning\">\n        <strong>Meaning &amp; Lexical Range:<\/strong> To seek earnestly, desire, strive after, request audience with a king, or pursue living presence (225 occurrences in the Hebrew Bible).\n      <\/div>\n\n      <!-- Other Places It Appears -->\n      <div class=\"beat-kicker\" style=\"margin-bottom:6px;\">Other Places It Appears Across Scripture<\/div>\n      <div class=\"occurrences-list\" id=\"ws-occurrences\">\n        <div class=\"occ-item\">\n          <span class=\"occ-ref\">Deut 4:29<\/span>\n          \u201cFrom there you will <strong>seek<\/strong> (<em>\u016b\u00b7\u1e07iq\u00b7qa\u0161\u00b7tem<\/em>) the LORD your God, and you will find Him if you search with all your heart\u2026\u201d\n        <\/div>\n        <div class=\"occ-item\">\n          <span class=\"occ-ref\">Psalm 24:6<\/span>\n          \u201cSuch is the generation of those who <strong>seek<\/strong> Him, who <strong>seek<\/strong> (<em>m\u0259\u00b7\u1e07aq\u00b7\u0161\u00ea<\/em>) Your face, O God of Jacob.\u201d\n        <\/div>\n        <div class=\"occ-item\">\n          <span class=\"occ-ref\">Jeremiah 29:13<\/span>\n          \u201cYou will <strong>seek<\/strong> (<em>\u016b\u00b7\u1e07iq\u00b7qa\u0161\u00b7tem<\/em>) Me and find Me when you search for Me with all your heart.\u201d\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- NUMBERED CHAIN SHEET: Passages linked across Scripture + Short Reading -->\n    <div class=\"chain-sheet-panel\" id=\"chain-sheet-anchor\">\n      <div class=\"beat-header\">\n        <span class=\"beat-kicker cinnabar\">\u26d3 Chain 07 \u00b7 Linked Across Scripture<\/span>\n        <span class=\"badge-pill chain\">6 Linked Passages \u00b7 Aliyah<\/span>\n      <\/div>\n      <h3 class=\"font-serif\" style=\"font-size:17px; margin-bottom:4px;\">\n        Chain 07: \u201cThe Face of God\u201d (P\u0101n\u00eem \u2192 Pros\u014dpon)\n      <\/h3>\n      <p style=\"font-size:12px; color:var(--ink-secondary); line-height:1.44; margin-bottom:8px;\">\n        In Hebrew, <em>p\u0101n\u00eem<\/em> (\u201cface\u201d) is always plural because a face is never static\u2014it is the whole turned attention of a person. Walk the chain from Genesis to Revelation:\n      <\/p>\n\n      <div class=\"chain-ladder\">\n        <div class=\"chain-stop\">\n          <div class=\"chain-stop-ref\">\n            <span>01 \u00b7 Genesis 32:30 \u2014 Peniel<\/span>\n            <span>OT \u00b7 Torah<\/span>\n          <\/div>\n          <p class=\"chain-stop-text\">\u201cJacob called the place Peniel, saying, \u2018I have seen God <strong>face to face<\/strong>, and yet my life was spared.\u2019\u201d<\/p>\n        <\/div>\n\n        <div class=\"chain-stop\">\n          <div class=\"chain-stop-ref\">\n            <span>02 \u00b7 Exodus 33:11 \u2014 The Tent of Meeting<\/span>\n            <span>OT \u00b7 Torah<\/span>\n          <\/div>\n          <p class=\"chain-stop-text\">\u201cThe LORD would speak to Moses <strong>face to face<\/strong>, as a man speaks with his friend.\u201d<\/p>\n        <\/div>\n\n        <div class=\"chain-stop\">\n          <div class=\"chain-stop-ref\">\n            <span>03 \u00b7 Numbers 6:25\u201326 \u2014 The Priestly Blessing<\/span>\n            <span>OT \u00b7 Torah<\/span>\n          <\/div>\n          <p class=\"chain-stop-text\">\u201cThe LORD make His <strong>face<\/strong> shine upon you\u2026 The LORD lift up His <strong>face<\/strong> toward you and give you peace.\u201d<\/p>\n        <\/div>\n\n        <div class=\"chain-stop here\">\n          <div class=\"chain-stop-ref\">\n            <span>04 \u00b7 Psalm 27:8 \u2014 David\u2019s Echo (Current Verse)<\/span>\n            <span>\u2726 Here<\/span>\n          <\/div>\n          <p class=\"chain-stop-text\">\u201cMy heart said of You, \u2018Seek My <strong>face<\/strong>.\u2019 Your <strong>face<\/strong>, O LORD, I will seek.\u201d<\/p>\n        <\/div>\n\n        <div class=\"chain-stop\">\n          <div class=\"chain-stop-ref\">\n            <span>05 \u00b7 2 Corinthians 4:6 \u2014 The New Creation<\/span>\n            <span>NT \u00b7 Epistle<\/span>\n          <\/div>\n          <p class=\"chain-stop-text\">\u201c\u2026to give the light of the knowledge of the glory of God in the <strong>face<\/strong> (<em>pros\u014dp\u014d<\/em>) of Jesus Christ.\u201d<\/p>\n        <\/div>\n\n        <div class=\"chain-stop\" style=\"margin-bottom:0;\">\n          <div class=\"chain-stop-ref\">\n            <span>06 \u00b7 Revelation 22:4 \u2014 The New Jerusalem<\/span>\n            <span>NT \u00b7 Apocalypse<\/span>\n          <\/div>\n          <p class=\"chain-stop-text\">\u201cThey will see His <strong>face<\/strong>, and His name will be on their foreheads.\u201d<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ========================================================================\n       SCREEN 5: 5-PART VERSE STUDY, ELIANA (\u2726 CHAT) & SANCTUARY ROOMS\n       - 5-Section Verse Study: Scripture, Fresh Rendering, Deeper Lens,\n         Everyday Insight, Take-Home Practice -> into Journal\n       - Eliana (chat): streaming answers, tappable Scripture references\n       - Library Shelf (3 books) & Throne Room (Prayer)\n       ======================================================================== -->\n  <section id=\"screen-eliana\" class=\"screen-chapter\">\n    <div class=\"chapter-flag\">\n      <span>\u2726 Screen 5 \u00b7 Deep Reflection &amp; Companion<\/span>\n      <span>\u00b7<\/span>\n      <span>Verse Study \u00b7 Eliana \u00b7 Rooms<\/span>\n    <\/div>\n\n    <!-- 5-SECTION VERSE STUDY PAGE FOR PSALM 27:8 -->\n    <div style=\"margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;\">\n      <span class=\"beat-kicker gold\">Verse Study Page \u00b7 Psalm 27:8 (5 Sections)<\/span>\n      <span class=\"badge-pill\">Tap any section to focus<\/span>\n    <\/div>\n\n    <div class=\"study-5-stack\">\n      <!-- 1. Scripture (the original text) -->\n      <div class=\"study-sec-card\" onclick=\"highlightStudySec(this)\">\n        <div class=\"sec-head\">\n          <div class=\"sec-num-title\">\n            <span class=\"sec-num font-mono\">01<\/span>\n            <span class=\"font-serif\">Scripture (The Original Text)<\/span>\n          <\/div>\n          <span class=\"font-hebrew\" style=\"font-size:16px; color:var(--gold);\">\u05dc\u05b0\u05da\u05b8 \u05d0\u05b8\u05de\u05b7\u05e8 \u05dc\u05b4\u05d1\u05b4\u05bc\u05d9 \u05d1\u05b7\u05bc\u05e7\u05b0\u05bc\u05e9\u05c1\u05d5\u05bc \u05e4\u05b8\u05e0\u05b8\u05d9<\/span>\n        <\/div>\n        <p class=\"sec-body\">\n          In Hebrew, the verse opens abruptly without a conjunction: <em>\u201cTo You \u2014 said my heart \u2014 \u2018Seek My face!\u2019\u201d<\/em> The compressed syntax sounds like someone reminding God of a promise whispered in the dark.\n        <\/p>\n      <\/div>\n\n      <!-- 2. Fresh Rendering -->\n      <div class=\"study-sec-card\" onclick=\"highlightStudySec(this)\">\n        <div class=\"sec-head\">\n          <div class=\"sec-num-title\">\n            <span class=\"sec-num font-mono\">02<\/span>\n            <span class=\"font-serif\">\u2726 Fresh Rendering<\/span>\n          <\/div>\n          <span style=\"font-size:10.5px; color:var(--gold);\">Eliana\u2019s Voice<\/span>\n        <\/div>\n        <p class=\"sec-body font-serif\" style=\"font-style:italic; color:var(--ink-primary);\">\n          \u2726 \u201cMy heart holds Your own invitation back up to You: \u2018Come look for My face.\u2019 It is Your face, Lord\u2014not merely relief from the siege\u2014that I am looking for.\u201d\n        <\/p>\n      <\/div>\n\n      <!-- 3. Deeper Lens -->\n      <div class=\"study-sec-card active-sec\" onclick=\"highlightStudySec(this)\">\n        <div class=\"sec-head\">\n          <div class=\"sec-num-title\">\n            <span class=\"sec-num font-mono\">03<\/span>\n            <span class=\"font-serif\">Deeper Lens<\/span>\n          <\/div>\n          <span class=\"badge-pill gold\">Where You Left Off<\/span>\n        <\/div>\n        <p class=\"sec-body\">\n          In the ancient Near East, to \u201csee the king\u2019s face\u201d meant intimate admission into the throne room. Surrounded by adversaries in verses 1\u20133, David refuses to reduce God to a military shield. He asks for God\u2019s <em>face<\/em>\u2014unhurried communion inside the tent.\n        <\/p>\n      <\/div>\n\n      <!-- 4. Everyday Insight -->\n      <div class=\"study-sec-card\" onclick=\"highlightStudySec(this)\">\n        <div class=\"sec-head\">\n          <div class=\"sec-num-title\">\n            <span class=\"sec-num font-mono\">04<\/span>\n            <span class=\"font-serif\">Everyday Insight<\/span>\n          <\/div>\n        <\/div>\n        <p class=\"sec-body\">\n          Anxiety trains us to seek God\u2019s <em>hand<\/em> (outcomes, fixes, certainty). Psalm 27:8 gently pivots the soul back to seeking God\u2019s <em>face<\/em> (attentive presence before the outcome arrives).\n        <\/p>\n      <\/div>\n\n      <!-- 5. Take-Home Practice -> Way into the Journal -->\n      <div class=\"study-sec-card\" id=\"journal-anchor\" onclick=\"highlightStudySec(this)\">\n        <div class=\"sec-head\">\n          <div class=\"sec-num-title\">\n            <span class=\"sec-num font-mono\">05<\/span>\n            <span class=\"font-serif\">Take-Home Practice \u2192 Journal<\/span>\n          <\/div>\n          <span class=\"badge-pill teal\">Tied to Ps 27:8<\/span>\n        <\/div>\n        <p class=\"sec-body\">\n          <strong>Practice:<\/strong> Before asking God to resolve one pressing situation today, pause for ten seconds and whisper: <em>\u201cYour face, Lord, I will seek inside this.\u201d<\/em>\n        <\/p>\n        <div class=\"journal-bridge-box\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center;\">\n            <span class=\"beat-kicker gold\">Journal Entry \u00b7 Tied to Psalm 27:8<\/span>\n            <button class=\"hour-btn\" onclick=\"cycleJournalPrompt(event)\">Try Guided Prompt \u21bb<\/button>\n          <\/div>\n          <textarea class=\"journal-input\" id=\"journal-textarea\" rows=\"2\">Lord, I have been asking for an answer about the months ahead, but tonight I want to look for Your face first...<\/textarea>\n          <div style=\"display:flex; justify-content:space-between; align-items:center;\">\n            <span style=\"font-size:10px; color:var(--ink-muted);\" id=\"journal-save-state\">14 past entries \u00b7 Searchable<\/span>\n            <button class=\"badge-pill gold\" onclick=\"saveJournalEntry(event)\">Save to Journal \u2713<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- ELIANA (CHAT): Streaming answers, tappable Scripture references, starts from a verse -->\n    <div class=\"eliana-chat-card\" id=\"eliana-chat-anchor\">\n      <div class=\"beat-header\">\n        <span class=\"beat-kicker gold\">\u2726 Eliana \u00b7 Companion Conversation<\/span>\n        <span class=\"badge-pill gold\">Started from Psalm 27:8<\/span>\n      <\/div>\n\n      <div class=\"chat-user-bubble\">\n        \u201cEliana, why does Psalm 27:8 start with \u2018To You my heart said, Seek My face\u2019? Who is speaking to whom?\u201d\n      <\/div>\n\n      <div class=\"chat-eliana-stream\" id=\"eliana-stream-box\">\n        <strong>\u2726 Eliana:<\/strong> In the Hebrew (<span class=\"font-hebrew\">\u05dc\u05b0\u05da\u05b8 \u05d0\u05b8\u05de\u05b7\u05e8 \u05dc\u05b4\u05d1\u05b4\u05bc\u05d9<\/span>), David\u2019s heart is quoting God\u2019s own words back to Him\u2014like holding up a signet ring. God had first invited His people in <button class=\"scripture-ref-tap\" onclick=\"showRefPreview('Deut 4:29', '\u201cBut from there you will seek the LORD your God, and you will find Him if you search after Him with all your heart and with all your soul.\u201d')\">Deut 4:29<\/button> and <button class=\"scripture-ref-tap\" onclick=\"showRefPreview('Psalm 105:4', '\u201cSeek out the LORD and His strength; seek His face always.\u201d')\">Psalm 105:4<\/button> to seek His face. Now, in the dark, David\u2019s heart answers: <em>\u201cYou told us \u2018Seek My face\u2019\u2014so here I am, seeking Yours.\u201d<\/em> That same face-to-face intimacy culminates in <button class=\"scripture-ref-tap\" onclick=\"showRefPreview('2 Cor 4:6', '\u201cFor God, who said, \u2018Let light shine out of darkness,\u2019 made His light shine in our hearts to give us the light of the knowledge of God\u2019s glory displayed in the face of Christ.\u201d')\">2 Cor 4:6<\/button>.\n      <\/div>\n\n      <!-- Tapped Scripture Reference Inline Preview -->\n      <div class=\"ref-popover-preview\" id=\"chat-ref-popover\">\n        <strong style=\"color:var(--gold);\" id=\"pop-ref-title\">Psalm 105:4 (Tapped Reference)<\/strong> \u2014\n        <span id=\"pop-ref-text\">\u201cSeek out the LORD and His strength; seek His face always.\u201d<\/span>\n      <\/div>\n\n      <div class=\"primary-action-row\">\n        <button class=\"btn-gold\" onclick=\"streamNewElianaReply()\">\u2726 Stream Follow-Up Answer<\/button>\n        <a href=\"#throne-room-anchor\" class=\"btn-ghost\">Turn into Prayer \u2193<\/a>\n      <\/div>\n    <\/div>\n\n    <!-- LIBRARY SHELF: 3 Books, Each Opening Its Own Room -->\n    <div id=\"library-shelf-anchor\" style=\"margin-bottom:14px;\">\n      <div class=\"beat-header\" style=\"margin-bottom:7px;\">\n        <span class=\"beat-kicker\">Library \u00b7 A Shelf of Living Rooms<\/span>\n        <span style=\"font-size:10px; color:var(--ink-muted);\">3 Books \u00b7 More Joining<\/span>\n      <\/div>\n      <div class=\"shelf-books\">\n        <div class=\"book-spine-card\">\n          <div>\n            <div style=\"font-size:13px; font-weight:700; color:var(--ink-primary);\" class=\"font-serif\">I \u00b7 Eliana\u2019s Journal<\/div>\n            <div style=\"font-size:11.5px; color:var(--ink-secondary);\">A devotional book read one day at a time \u00b7 Day 42: \u201cThe Unhurried Answer\u201d<\/div>\n          <\/div>\n          <span class=\"badge-pill gold\">Day 42 \u2192<\/span>\n        <\/div>\n\n        <div class=\"book-spine-card aliyah\">\n          <div>\n            <div style=\"font-size:13px; font-weight:700; color:var(--ink-primary);\" class=\"font-serif\">II \u00b7 Aliyah, The Ascent<\/div>\n            <div style=\"font-size:11.5px; color:var(--ink-secondary);\">Studies built from the numbered Scripture chains \u00b7 Chain 07 Active<\/div>\n          <\/div>\n          <span class=\"badge-pill chain\">\u26d3 12 Chains \u2192<\/span>\n        <\/div>\n\n        <div class=\"book-spine-card foundations\">\n          <div>\n            <div style=\"font-size:13px; font-weight:700; color:var(--ink-primary);\" class=\"font-serif\">III \u00b7 The Foundations<\/div>\n            <div style=\"font-size:11.5px; color:var(--ink-secondary);\">On what Scripture is and how it reached us \u00b7 Dead Sea to Masoretic Text<\/div>\n          <\/div>\n          <span class=\"badge-pill\" style=\"color:var(--azure); border-color:var(--border-azure);\">Part 3 \u2192<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- THRONE ROOM: Prayer writer + curated prayers + saved prayers with favourites -->\n    <div class=\"throne-card\" id=\"throne-room-anchor\">\n      <div class=\"beat-header\">\n        <span class=\"beat-kicker gold\">Throne Room \u00b7 The Prayer Room<\/span>\n        <span class=\"badge-pill\">\u2605 11 Saved \u00b7 Search<\/span>\n      <\/div>\n      <p style=\"font-size:12px; color:var(--ink-secondary); margin-bottom:8px;\">\n        Share what you are carrying, and weave a prayer anchored in today\u2019s verse:\n      <\/p>\n      <div class=\"eliana-gloss-box\" id=\"woven-prayer-box\" style=\"margin-bottom:9px;\">\n        <div class=\"eliana-gloss-label\">\n          <span>\u2726 Prayer Woven from Psalm 27:8<\/span>\n          <span>\u00b7<\/span>\n          <span>\u2605 Favourite<\/span>\n        <\/div>\n        <p class=\"eliana-gloss-text font-serif\" id=\"woven-prayer-text\">\n          \u201cFather, when my thoughts race toward tomorrow\u2019s uncertainties, quiet my heart until it hears Your invitation again: \u2018Seek My face.\u2019 Before I ask for the path to clear, let me rest in Your presence tonight. Amen.\u201d\n        <\/p>\n      <\/div>\n      <div class=\"primary-action-row\">\n        <button class=\"btn-gold\" onclick=\"weaveAnotherPrayer()\">\u2726 Weave Prayer from Heart<\/button>\n        <button class=\"btn-ghost\" onclick=\"toggleSavedPrayers()\">\u2605 Saved &amp; Curated (11)<\/button>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ========================================================================\n       STICKY BOTTOM DOCK: 4 CLEAR PLACES + \u2726 ELIANA\n       ======================================================================== -->\n  <nav class=\"bottom-nav-dock\" aria-label=\"Primary App Navigation\">\n    <a href=\"#screen-home\" class=\"nav-tab active\" onclick=\"activateNav(0)\">\n      <span class=\"nav-icon\">\u25ce<\/span>\n      <span>Rhythm<\/span>\n    <\/a>\n    <a href=\"#screen-read\" class=\"nav-tab\" onclick=\"activateNav(1)\">\n      <span class=\"nav-icon\">\ud83d\udcd6<\/span>\n      <span>Read<\/span>\n    <\/a>\n    <a href=\"#screen-study\" class=\"nav-tab\" onclick=\"activateNav(2)\">\n      <span class=\"nav-icon\">\u05d0/\u03a9<\/span>\n      <span>Study 4L<\/span>\n    <\/a>\n    <a href=\"#screen-wordsheet\" class=\"nav-tab\" onclick=\"activateNav(3)\">\n      <span class=\"nav-icon\">\u26d3<\/span>\n      <span>Word/Chain<\/span>\n    <\/a>\n    <a href=\"#screen-eliana\" class=\"nav-tab\" onclick=\"activateNav(4)\">\n      <span class=\"nav-icon\" style=\"color:var(--gold);\">\u2726<\/span>\n      <span>Eliana/Rooms<\/span>\n    <\/a>\n  <\/nav>\n\n  <!-- ========================================================================\n       INTERACTIVE LOGIC (100% Self-Contained)\n       ======================================================================== -->\n  <script>\n    // 1. Live 4-Theme Switcher (Night Watch, First Light, Codex, High Contrast)\n    function setTheme(themeKey, btn) {\n      const resolved = themeKey === 'first-watch' ? 'first-light' : themeKey;\n      document.documentElement.setAttribute('data-theme', resolved);\n      document.querySelectorAll('.theme-pill').forEach(b => b.classList.remove('active'));\n      if (btn) btn.classList.add('active');\n    }\n\n    // 2. Text Size Scaling (Settings A\u00b1)\n    const scales = [1, 1.1, 1.18, 0.94];\n    let scaleIndex = 0;\n    function cycleScale() {\n      scaleIndex = (scaleIndex + 1) % scales.length;\n      document.documentElement.style.setProperty('--scripture-scale', scales[scaleIndex]);\n    }\n\n    // 3. Time-of-Day Greeting Switcher on Home\n    const greetings = {\n      morning: {\n        kicker: '\u2600 First Light \u00b7 6:24 AM',\n        headline: 'Good morning, Michael.',\n        subline: 'Begin at the threshold before the noise rises\u2014one thread from stillness to the Word.',\n        cx: 68, cy: 16\n      },\n      midday: {\n        kicker: '\u263c Noonday Pause \u00b7 12:30 PM',\n        headline: 'Pause at midday, Michael.',\n        subline: 'Step inside the tent of Psalm 27 for five quiet minutes in the middle of the day.',\n        cx: 170, cy: 7\n      },\n      evening: {\n        kicker: '\u263e Evening Watch \u00b7 8:42 PM',\n        headline: 'Rest in the quiet, Michael.',\n        subline: 'One thread holds your stillness, today\u2019s verse, your study path, and your prayer\u2014without streaks.',\n        cx: 272, cy: 15\n      }\n    };\n\n    function setGreeting(period, btn) {\n      const g = greetings[period];\n      document.getElementById('greeting-kicker').textContent = g.kicker;\n      document.getElementById('greeting-headline').textContent = g.headline;\n      document.getElementById('greeting-subline').textContent = g.subline;\n      document.getElementById('horizon-body').setAttribute('cx', g.cx);\n      document.getElementById('horizon-body').setAttribute('cy', g.cy);\n      document.getElementById('horizon-glow').setAttribute('cx', g.cx);\n      document.getElementById('horizon-glow').setAttribute('cy', g.cy);\n      document.querySelectorAll('.hour-btn').forEach(b => b.classList.remove('active'));\n      if (btn) btn.classList.add('active');\n    }\n\n    // 4. Stillness Guided Breath Toggle\n    let stillnessActive = false;\n    let stillnessTimer = null;\n    const breathPhases = [\n      'Inhale slowly through the nose\u2026 (4s)',\n      'Hold gently in stillness\u2026 (2s)',\n      'Exhale and release the day\u2019s weight\u2026 (6s)'\n    ];\n    let phaseIdx = 0;\n\n    function toggleStillness() {\n      stillnessActive = !stillnessActive;\n      const btnText = document.getElementById('breath-btn-text');\n      const instr = document.getElementById('breath-instruction');\n      const pill = document.getElementById('breath-status-pill');\n      if (stillnessActive) {\n        btnText.textContent = 'End Pause';\n        pill.textContent = 'Breathing Active \u25cf';\n        instr.textContent = breathPhases[0];\n        stillnessTimer = setInterval(() => {\n          phaseIdx = (phaseIdx + 1) % breathPhases.length;\n          instr.textContent = breathPhases[phaseIdx];\n        }, 3200);\n      } else {\n        clearInterval(stillnessTimer);\n        btnText.textContent = 'Pause';\n        pill.textContent = '60s Guided Pause';\n        instr.textContent = 'Set down the day\u2019s hurry. Inhale 4s \u00b7 Hold 2s \u00b7 Exhale 6s.';\n      }\n    }\n\n    // 5. Home Daily Loop Beat Selector\n    function previewLoopBeat(num, label) {\n      document.getElementById('home-loop-label').textContent = label;\n      const segs = document.querySelectorAll('.loop-segment');\n      segs.forEach((s, idx) => {\n        s.classList.remove('current');\n        if (idx + 1 === num) s.classList.add('current');\n      });\n    }\n\n    // 6. Home Library Study Path Switcher\n    const studyPaths = {\n      aliyah: {\n        day: 'Day 4 of 7',\n        title: 'Chain 07 \u00b7 The Face of God (Peniel to Jerusalem)',\n        desc: 'Traces six linked passages across Scripture where seeking God\u2019s face transforms from trembling at Peniel (Gen 32:30) to David\u2019s tent of song (Ps 27:8).'\n      },\n      journal: {\n        day: 'Day 42 of 90',\n        title: 'Eliana\u2019s Journal \u00b7 \u201cWhen the Answer Is Presence\u201d',\n        desc: 'A quiet daily devotional reading exploring why Eliana\u2019s name (\u201cMy God has answered\u201d) points first to God\u2019s nearness rather than instant explanations.'\n      },\n      foundations: {\n        day: 'Part 3 of 8',\n        title: 'The Foundations \u00b7 How the Hebrew Text Reached Us',\n        desc: 'How the Masoretic scribes preserved every consonant and added vowel pointing (niqqud) so we can still hear the shift from plural to singular in Psalm 27:8.'\n      }\n    };\n\n    function switchStudyPath(key, btn) {\n      const p = studyPaths[key];\n      document.getElementById('path-day-badge').textContent = p.day;\n      document.getElementById('path-title').textContent = p.title;\n      document.getElementById('path-desc').textContent = p.desc;\n      document.querySelectorAll('.path-tab').forEach(b => b.classList.remove('active'));\n      if (btn) btn.classList.add('active');\n    }\n\n    // 7. Bible Reader \u2014 Read Mode Translation Switcher (BSB, KJV, ASV, \u2726 Eliana)\n    const translations = {\n      BSB: {\n        v1: 'The LORD is my light and my salvation\u2014whom shall I fear? The LORD is the stronghold of my life\u2014of whom shall I be afraid?',\n        v2: 'When the wicked came upon me to devour my flesh, my enemies and foes stumbled and fell.',\n        v3: 'Though an army encamp against me, my heart will not fear; though a war break out against me, I will keep my trust.',\n        v4: 'One thing I have asked of the LORD; this is what I desire: to dwell in the house of the LORD all the days of my life, to gaze on the beauty of the LORD and seek Him in His temple.',\n        v5: 'For in the day of trouble He will hide me in His shelter; He will conceal me under the cover of His tent; He will set me high upon a rock.',\n        v7: 'Hear, O LORD, my voice when I call; be merciful to me and answer me.',\n        v8: 'My heart said of You, \u201cSeek My face.\u201d Your face, O LORD, I will seek.',\n        v9: 'Hide not Your face from me, nor turn Your servant away in anger. You have been my helper; do not reject me or forsake me, O God of my salvation.'\n      },\n      KJV: {\n        v1: 'The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?',\n        v2: 'When the wicked, even mine enemies and my foes, came upon me to eat up my flesh, they stumbled and fell.',\n        v3: 'Though an host should encamp against me, my heart shall not fear: though war should rise against me, in this will I be confident.',\n        v4: 'One thing have I desired of the LORD, that will I seek after; that I may dwell in the house of the LORD all the days of my life, to behold the beauty of the LORD, and to enquire in his temple.',\n        v5: 'For in the time of trouble he shall hide me in his pavilion: in the secret of his tabernacle shall he hide me; he shall set me up upon a rock.',\n        v7: 'Hear, O LORD, when I cry with my voice: have mercy also upon me, and answer me.',\n        v8: 'When thou saidst, Seek ye my face; my heart said unto thee, Thy face, LORD, will I seek.',\n        v9: 'Hide not thy face far from me; put not thy servant away in anger: thou hast been my help; leave me not, neither forsake me, O God of my salvation.'\n      },\n      ASV: {\n        v1: 'Jehovah is my light and my salvation; Whom shall I fear? Jehovah is the strength of my life; Of whom shall I be afraid?',\n        v2: 'When evil-doers came upon me to eat up my flesh, Even mine adversaries and my foes, they stumbled and fell.',\n        v3: 'Though a host should encamp against me, My heart shall not fear: Though war should rise against me, Even then will I be confident.',\n        v4: 'One thing have I asked of Jehovah, that will I seek after: That I may dwell in the house of Jehovah all the days of my life, To behold the beauty of Jehovah, And to inquire in his temple.',\n        v5: 'For in the day of trouble he will keep me secretly in his pavilion: In the covert of his tabernacle will he hide me; He will lift me up upon a rock.',\n        v7: 'Hear, O Jehovah, when I cry with my voice: Have mercy also upon me, and answer me.',\n        v8: 'When thou saidst, Seek ye my face; My heart said unto thee, Thy face, Jehovah, will I seek.',\n        v9: 'Hide not thy face from me; Put not thy servant away in anger: Thou hast been my help; Cast me not off, neither forsake me, O God of my salvation.'\n      },\n      ELIANA: {\n        v1: '\u2726 The Lord Himself is my daybreak and my rescue\u2014who is left to dread? The Lord is the fortress wall around my life\u2014before whom could I tremble?',\n        v2: '\u2726 When fierce men closed in to tear me down, it was my pursuers themselves who lost their footing and fell.',\n        v3: '\u2726 Even if a whole siege-line surrounds me, my heart stays steady; even if conflict breaks into the open, this remains my quiet confidence.',\n        v4: '\u2726 One single desire I have laid before the Lord, and this is what I keep pursuing: to feel at home in the Lord\u2019s presence every day I live, to linger over the beauty of who He is and ponder in His sanctuary.',\n        v5: '\u2726 For on the dark day He tucks me inside His own shelter; He conceals me in the inner hush of His tent and lifts me onto high rock out of reach.',\n        v7: '\u2726 Listen, Lord, when my voice rises out loud to You; lean toward me in tenderness and answer.',\n        v8: '\u2726 My heart echoes Your own invitation back to You: \u201cCome look for My face.\u201d It is Your face, Lord\u2014Your presence itself\u2014that I am seeking.',\n        v9: '\u2726 Do not turn Your face away from me or dismiss Your servant in displeasure; You have always been my help\u2014do not let go of me now, God of my rescue.'\n      }\n    };\n\n    function setReadTranslation(code, btn) {\n      const t = translations[code];\n      ['v1', 'v2', 'v3', 'v4', 'v5', 'v7', 'v8', 'v9'].forEach(k => {\n        const el = document.getElementById('read-' + k);\n        if (el) el.textContent = t[k];\n      });\n      document.querySelectorAll('.trans-pill').forEach(b => b.classList.remove('active'));\n      if (btn) btn.classList.add('active');\n    }\n\n    let whisperOn = true;\n    function toggleWhisperGloss() {\n      whisperOn = !whisperOn;\n      const box = document.getElementById('read-v8-whisper');\n      const btn = document.getElementById('whisper-btn');\n      box.style.display = whisperOn ? 'block' : 'none';\n      btn.classList.toggle('active', whisperOn);\n      btn.textContent = whisperOn ? '\u2726 Whisper Gloss: On' : '\u2726 Whisper Gloss: Off';\n    }\n\n    // 8. Study Mode Layer Conductor Toggles\n    function toggleStudyLayer(layer, btn) {\n      const container = document.getElementById('study-scores-container');\n      container.classList.toggle('hide-layer-' + layer);\n      btn.classList.toggle('on');\n    }\n\n    // 9. Lexical Word Sheet Dictionary for Every Hebrew & Greek Word Token\n    const lexicon = {\n      lekha: {\n        script: '\u05dc\u05b0\u05da\u05b8',\n        translit: 'l\u0259\u00b7\u1e35\u0101 \u00b7 \u201cTo You\u201d',\n        strongs: 'Prep + 2ms Suffix',\n        lemma: 'Preposition \u05dc\u05b0 (l\u0259)',\n        grammar: 'Preposition \u00b7 2nd Person Masculine Singular Suffix',\n        note: 'Placed at the very front of the Hebrew clause for emphasis (\u201cUnto You\u2014and no other\u2014my heart spoke\u201d), establishing intimate direct address before the verb even appears.',\n        meaning: 'To You, toward You, belonging to You, in Your direction.',\n        occ: [\n          ['Psalm 51:4', '\u201cAgainst You (l\u0259\u00b7\u1e35\u0101), You only, have I sinned\u2026\u201d'],\n          ['Psalm 62:11', '\u201c\u2026that power belongs to You (l\u0259\u00b7\u1e35\u0101), O God.\u201d'],\n          ['Psalm 143:9', '\u201cDeliver me, O LORD, from my enemies; in You (\u0113\u00b7le\u00b7\u1e35\u0101) I take shelter.\u201d']\n        ]\n      },\n      amar: {\n        script: '\u05d0\u05b8\u05de\u05b7\u05e8',\n        translit: '\u2019\u0101\u00b7mar \u00b7 \u201csaid / spoke\u201d',\n        strongs: 'Strong\u2019s H559',\n        lemma: 'Root: \u05d0\u05b8\u05de\u05b7\u05e8 (\u2019\u0101mar)',\n        grammar: 'Verb \u00b7 Qal Perfect \u00b7 3rd Person Masculine Singular',\n        note: 'In Hebrew narrative and poetry, \u2019\u0101mar frequently denotes interior speech (\u201cmy heart said\u201d)\u2014the silent dialogue of conscience and memory before God.',\n        meaning: 'To say, speak, utter, declare within one\u2019s heart, command, or promise (5,316x in OT).',\n        occ: [\n          ['Genesis 1:3', '\u201cAnd God said (way\u00b7y\u014d\u00b7mer), \u2018Let there be light\u2026\u2019\u201d'],\n          ['Psalm 14:1', '\u201cThe fool has said (\u2019\u0101\u00b7mar) in his heart\u2026\u201d'],\n          ['Psalm 16:2', '\u201cI said (\u2019\u0101\u00b7mar\u00b7t\u00ee) to the LORD, \u2018You are my Lord\u2026\u2019\u201d']\n        ]\n      },\n      libbi: {\n        script: '\u05dc\u05b4\u05d1\u05b4\u05bc\u05d9',\n        translit: 'lib\u00b7b\u00ee \u00b7 \u201cmy heart\u201d',\n        strongs: 'Strong\u2019s H3820',\n        lemma: 'Root: \u05dc\u05b5\u05d1 (l\u0113\u1e07)',\n        grammar: 'Noun \u00b7 Masculine Singular Construct + 1st Common Singular Suffix',\n        note: 'In Hebrew anthropology, the heart (l\u0113\u1e07) is not merely emotion\u2014it is the seat of intellect, memory, will, and moral decision.',\n        meaning: 'Inner person, mind, will, heart, understanding, courage (598x in OT).',\n        occ: [\n          ['Psalm 27:3', '\u201cThough an army encamp against me, my heart (lib\u00b7b\u00ee) will not fear\u2026\u201d'],\n          ['Psalm 73:26', '\u201cMy flesh and my heart (\u016b\u00b7l\u00ea\u00b7\u1e07\u0101\u00b7\u1e07\u00ee) may fail, but God is the strength of my heart\u2026\u201d'],\n          ['Proverbs 4:23', '\u201cGuard your heart (lib\u00b7b\u0259\u00b7\u1e35\u0101) with all diligence\u2026\u201d']\n        ]\n      },\n      baqqeshu: {\n        script: '\u05d1\u05b7\u05bc\u05e7\u05b0\u05bc\u05e9\u05c1\u05d5\u05bc',\n        translit: 'baq\u00b7q\u0259\u00b7\u0161\u016b \u00b7 \u201cSeek!\u201d',\n        strongs: 'Strong\u2019s H1245',\n        lemma: 'Root: \u05d1\u05b8\u05bc\u05e7\u05b7\u05e9\u05c1 (b\u0101qa\u0161)',\n        grammar: 'Verb \u00b7 Piel Imperative \u00b7 Masculine Plural',\n        note: 'The Piel stem intensifies the root action: not a casual glance, but a whole-heart, intentional search. As an imperative plural, it records God\u2019s open call to the worshipping community before David answers in the singular (\u2019\u0103\u1e07aqq\u0113\u0161, \u201cI will seek\u201d).',\n        meaning: 'To seek earnestly, desire, strive after, request audience with a king, or pursue living presence (225x in OT).',\n        occ: [\n          ['Deut 4:29', '\u201cFrom there you will seek (\u016b\u00b7\u1e07iq\u00b7qa\u0161\u00b7tem) the LORD your God, and you will find Him\u2026\u201d'],\n          ['Psalm 24:6', '\u201cSuch is the generation of those who seek Him, who seek (m\u0259\u00b7\u1e07aq\u00b7\u0161\u00ea) Your face\u2026\u201d'],\n          ['Jeremiah 29:13', '\u201cYou will seek (\u016b\u00b7\u1e07iq\u00b7qa\u0161\u00b7tem) Me and find Me when you search with all your heart.\u201d']\n        ]\n      },\n      panay: {\n        script: '\u05e4\u05b8\u05e0\u05b8\u05d9',\n        translit: 'p\u0304\u0101\u00b7n\u0101y \u00b7 \u201cMy face\u201d',\n        strongs: 'Strong\u2019s H6440',\n        lemma: 'Root: \u05e4\u05b8\u05bc\u05e0\u05b4\u05d9\u05dd (p\u0101n\u00eem)',\n        grammar: 'Noun \u00b7 Masculine Plural Construct + 1st Common Singular Suffix',\n        note: 'Always plural in Hebrew (p\u0101n\u00eem) because the human or divine countenance has many facets and expressions; idiomatically it means \u201cMy personal presence.\u201d',\n        meaning: 'Face, countenance, presence, turned attention, front (2,128x in OT).',\n        occ: [\n          ['Exodus 33:14', '\u201cMy Presence (p\u0101\u00b7nay, lit. \u2018My face\u2019) will go with you, and I will give you rest.\u201d'],\n          ['Exodus 33:20', '\u201cYou cannot see My face (p\u0101\u00b7n\u0101y), for no one may see Me and live.\u201d'],\n          ['Psalm 105:4', '\u201cSeek the LORD and His strength; seek His face (p\u0101\u00b7n\u0101w) always.\u201d']\n        ]\n      },\n      panekha: {\n        script: '\u05d0\u05b6\u05ea\u05be\u05e4\u05b8\u05bc\u05e0\u05b6\u05d9\u05da\u05b8',\n        translit: '\u2019e\u1e6f-p\u0101\u00b7ne\u00b7\u1e35\u0101 \u00b7 \u201cYour face\u201d',\n        strongs: 'Strong\u2019s H853 + H6440',\n        lemma: 'Direct Object Marker \u05d0\u05b5\u05ea + \u05e4\u05b8\u05bc\u05e0\u05b4\u05d9\u05dd',\n        grammar: 'Direct Object Marker + Noun Masculine Plural + 2ms Suffix',\n        note: 'Fronted before the verb (\u2019\u0103\u1e07aqq\u0113\u0161) for emphatic contrast: \u201cIt is YOUR face\u2014nothing less\u2014that I will seek.\u201d',\n        meaning: 'Your own face, Your personal presence and favour.',\n        occ: [\n          ['Psalm 27:9', '\u201cHide not Your face (p\u0101\u00b7ne\u00b7\u1e35\u0101) from me\u2026\u201d'],\n          ['Psalm 31:16', '\u201cMake Your face (p\u0101\u00b7ne\u00b7\u1e35\u0101) shine upon Your servant\u2026\u201d'],\n          ['Psalm 67:1', '\u201cMay God be gracious to us and bless us and cause His face (p\u0101\u00b7n\u0101w) to shine\u2026\u201d']\n        ]\n      },\n      yhwh: {\n        script: '\u05d9\u05b0\u05d4\u05d5\u05b8\u05d4',\n        translit: 'YHWH \u00b7 \u201cO LORD\u201d',\n        strongs: 'Strong\u2019s H3068',\n        lemma: 'Root: \u05d4\u05b8\u05d9\u05b8\u05d4 (h\u0101y\u0101h, \u201cto be\u201d)',\n        grammar: 'Proper Noun \u00b7 Covenant Name of God (Tetragrammaton)',\n        note: 'The personal covenant name revealed to Moses at the burning bush (Exod 3:14\u201315)\u2014God as the self-existent, faithful One who is actively present with His people.',\n        meaning: 'YHWH \u2014 The LORD, \u201cHe Who Is / Will Be Faithfully Present\u201d (6,828x in OT).',\n        occ: [\n          ['Exodus 3:15', '\u201cThe LORD (YHWH), the God of your fathers\u2026 this is My name forever.\u201d'],\n          ['Exodus 34:6', '\u201cThe LORD, the LORD (YHWH, YHWH), compassionate and gracious\u2026\u201d'],\n          ['Psalm 27:1', '\u201cThe LORD (YHWH) is my light and my salvation\u2014whom shall I fear?\u201d']\n        ]\n      },\n      avaqqesh: {\n        script: '\u05d0\u05b2\u05d1\u05b7\u05e7\u05b5\u05bc\u05e9\u05c1',\n        translit: '\u2019\u0103\u00b7\u1e07aq\u00b7q\u0113\u0161 \u00b7 \u201cI will seek\u201d',\n        strongs: 'Strong\u2019s H1245',\n        lemma: 'Root: \u05d1\u05b8\u05bc\u05e7\u05b7\u05e9\u05c1 (b\u0101qa\u0161)',\n        grammar: 'Verb \u00b7 Piel Imperfect (Cohortative Force) \u00b7 1st Common Singular',\n        note: 'Echoes the exact verb of God\u2019s command (baqq\u0259\u0161\u016b) but shifts from 2nd-person plural to 1st-person singular: \u201cYou said to all of us, \u2018Seek\u2019; I answer for myself, \u2018I will seek.\u2019\u201d',\n        meaning: 'I myself will earnestly seek, pursue, and keep looking for.',\n        occ: [\n          ['Psalm 27:4', '\u201cOne thing I have asked of the LORD; this is what I will seek (\u2019\u0103\u00b7\u1e07aq\u00b7q\u0113\u0161)\u2026\u201d'],\n          ['Psalm 122:9', '\u201cFor the sake of the house of the LORD our God, I will seek (\u2019\u0103\u00b7\u1e07aq\u00b7\u0161\u0101h) your good.\u201d'],\n          ['Song 3:2', '\u201cI will rise now and go about the city\u2026 I will seek (\u2019\u0103\u00b7\u1e07aq\u00b7\u0161\u0101h) him whom my soul loves.\u201d']\n        ]\n      },\n      arche: {\n        script: '\u1f18\u03bd \u1f00\u03c1\u03c7\u1fc7',\n        translit: 'En arch\u0113 \u00b7 \u201cIn [the] beginning\u201d',\n        strongs: 'Strong\u2019s G1722 + G746',\n        lemma: '\u1f00\u03c1\u03c7\u03ae (arch\u0113)',\n        grammar: 'Preposition + Noun \u00b7 Dative Feminine Singular',\n        note: 'Deliberately echoes the Septuagint opening of Genesis 1:1 (\u1f18\u03bd \u1f00\u03c1\u03c7\u1fc7 \u1f10\u03c0\u03bf\u03af\u03b7\u03c3\u03b5\u03bd \u1f41 \u0398\u03b5\u03cc\u03c2), grounding the Gospel inside the primordial horizon of creation.',\n        meaning: 'Beginning, origin, first cause, sovereign foundation (55x in NT).',\n        occ: [\n          ['Genesis 1:1 (LXX)', '\u201cIn the beginning (En arch\u0113) God created the heavens and the earth.\u201d'],\n          ['1 John 1:1', '\u201cThat which was from the beginning (ap\u2019 arch\u0113s), which we have heard\u2026\u201d'],\n          ['Revelation 22:13', '\u201cI am the Alpha and the Omega, the First and the Last, the Beginning (h\u0113 arch\u0113) and the End.\u201d']\n        ]\n      },\n      en_verb: {\n        script: '\u1f26\u03bd',\n        translit: '\u0113n \u00b7 \u201cwas [already existing]\u201d',\n        strongs: 'Strong\u2019s G1510',\n        lemma: '\u03b5\u1f30\u03bc\u03af (eimi)',\n        grammar: 'Verb \u00b7 Imperfect Active Indicative \u00b7 3rd Person Singular',\n        note: 'Unlike \u1f10\u03b3\u03ad\u03bd\u03b5\u03c4\u03bf (\u201ccame into being\u201d in v.3), the imperfect \u1f26\u03bd expresses continuous, timeless existence prior to creation: when the beginning began, the Word already was.',\n        meaning: 'Was continually, existed timelessly, abided.',\n        occ: [\n          ['John 1:2', '\u201cHe was (\u0113n) in the beginning with God.\u201d'],\n          ['John 1:4', '\u201cIn Him was (\u0113n) life, and that life was (\u0113n) the light of men.\u201d'],\n          ['John 8:58', '\u201cBefore Abraham came into being, I am (eg\u014d eimi).\u201d']\n        ]\n      },\n      logos: {\n        script: '\u1f41 \u039b\u03cc\u03b3\u03bf\u03c2',\n        translit: 'ho Logos \u00b7 \u201cthe Word\u201d',\n        strongs: 'Strong\u2019s G3056',\n        lemma: '\u03bb\u03cc\u03b3\u03bf\u03c2 (logos)',\n        grammar: 'Definite Article + Noun \u00b7 Nominative Masculine Singular',\n        note: 'Unites the Hebrew d\u0101\u1e07\u0101r (God\u2019s creative, prophetic Word that accomplishes what He speaks, Ps 33:6) with Greek philosophical reason\u2014now revealed as a living Person.',\n        meaning: 'Word, living expression, utterance, wisdom, self-revelation of God (330x in NT).',\n        occ: [\n          ['John 1:14', '\u201cAnd the Word (ho Logos) became flesh and dwelt among us\u2026\u201d'],\n          ['1 John 1:1', '\u201c\u2026concerning the Word (tou Logou) of life.\u201d'],\n          ['Revelation 19:13', '\u201c\u2026and His name is called The Word (ho Logos) of God.\u201d']\n        ]\n      },\n      pros_ton_theon: {\n        script: '\u03c0\u03c1\u1f78\u03c2 \u03c4\u1f78\u03bd \u0398\u03b5\u03cc\u03bd',\n        translit: 'pros ton Theon \u00b7 \u201cface-to-face with God\u201d',\n        strongs: 'Strong\u2019s G4314 + G2316',\n        lemma: '\u03c0\u03c1\u03cc\u03c2 (pros) + \u0398\u03b5\u03cc\u03c2 (Theos)',\n        grammar: 'Preposition + Accusative Masculine Singular',\n        note: 'With the accusative case, \u03c0\u03c1\u03cc\u03c2 indicates dynamic orientation toward another person\u2014\u201cturned face-to-face toward God\u201d in eternal fellowship.',\n        meaning: 'Toward, face-to-face with, in active communion with God.',\n        occ: [\n          ['John 1:2', '\u201cHe was in the beginning face-to-face with God (pros ton Theon).\u201d'],\n          ['1 Cor 13:12', '\u201cFor now we see in a mirror dimly, but then face to face (pros\u014dpon pros pros\u014dpon).\u201d'],\n          ['1 John 1:2', '\u201c\u2026the eternal life which was with the Father (pros ton Patera)\u2026\u201d']\n        ]\n      }\n    };\n\n    function selectWord(key, btn) {\n      const data = lexicon[key];\n      if (!data) return;\n      document.querySelectorAll('.word-token').forEach(t => t.classList.remove('selected'));\n      if (btn) btn.classList.add('selected');\n\n      const scriptEl = document.getElementById('ws-script');\n      scriptEl.textContent = data.script;\n      document.getElementById('ws-translit').textContent = data.translit;\n      document.getElementById('ws-strongs').textContent = data.strongs;\n      document.getElementById('ws-lemma').textContent = data.lemma;\n      document.getElementById('ws-grammar').textContent = data.grammar;\n      document.getElementById('ws-grammar-note').textContent = data.note;\n      document.getElementById('ws-meaning').innerHTML = '<strong>Meaning &amp; Lexical Range:<\/strong> ' + data.meaning;\n\n      const occContainer = document.getElementById('ws-occurrences');\n      occContainer.innerHTML = data.occ.map(item =>\n        `<div class=\"occ-item\"><span class=\"occ-ref\">${item[0]}<\/span>${item[1]}<\/div>`\n      ).join('');\n    }\n\n    // 10. 5-Part Verse Study Section Highlighting & Journal Prompt Cycling\n    function highlightStudySec(card) {\n      document.querySelectorAll('.study-sec-card').forEach(c => c.classList.remove('active-sec'));\n      card.classList.add('active-sec');\n    }\n\n    const journalPrompts = [\n      'Lord, I have been asking for an answer about the months ahead, but tonight I want to look for Your face first...',\n      'Guided Prompt 1: Where in my life have I been seeking God\u2019s hand (an outcome) while forgetting to seek His face (His presence)?',\n      'Guided Prompt 2: When my heart repeats God\u2019s own words back to Him\u2014\u201cSeek My face\u201d\u2014what fear begins to quiet down?'\n    ];\n    let promptIdx = 0;\n\n    function cycleJournalPrompt(e) {\n      if (e) e.stopPropagation();\n      promptIdx = (promptIdx + 1) % journalPrompts.length;\n      document.getElementById('journal-textarea').value = journalPrompts[promptIdx];\n    }\n\n    function saveJournalEntry(e) {\n      if (e) e.stopPropagation();\n      const state = document.getElementById('journal-save-state');\n      state.textContent = 'Saved to Journal \u00b7 Linked to Psalm 27:8 \u2713';\n      state.style.color = 'var(--gold)';\n    }\n\n    // 11. Eliana Chat: Tappable Scripture Reference Preview & Streaming Simulation\n    function showRefPreview(ref, text) {\n      document.getElementById('pop-ref-title').textContent = ref + ' (Tapped Reference)';\n      document.getElementById('pop-ref-text').textContent = text;\n    }\n\n    const followUpChunks = [\n      '<strong>\u2726 Eliana:<\/strong> Notice too how verse 8 bridges into verse 9: ',\n      '<em>\u201cHide not Your face from me.\u201d<\/em> ',\n      'Because the Hebrew word for face (<strong>p\u0101n\u00eem<\/strong>, H6440) is always plural, ',\n      'seeking God\u2019s face means welcoming every expression of His presence\u2014both His comfort in the tent (v.5) ',\n      'and His steadying light when armies gather (v.1\u20133). ',\n      'Would you like to carry this into the Throne Room as a prayer tonight?'\n    ];\n\n    function streamNewElianaReply() {\n      const box = document.getElementById('eliana-stream-box');\n      box.innerHTML = '<strong>\u2726 Eliana:<\/strong> <span style=\"color:var(--gold);\">\u25cf<\/span>';\n      let i = 0;\n      let built = '';\n      const interval = setInterval(() => {\n        if (i < followUpChunks.length) {\n          built += followUpChunks[i];\n          box.innerHTML = built + ' <span style=\"color:var(--gold);\">\u258d<\/span>';\n          i++;\n        } else {\n          box.innerHTML = built;\n          clearInterval(interval);\n        }\n      }, 220);\n    }\n\n    // 12. Throne Room Prayer Weaver\n    const wovenPrayers = [\n      '\u201cFather, when my thoughts race toward tomorrow\u2019s uncertainties, quiet my heart until it hears Your invitation again: \u2018Seek My face.\u2019 Before I ask for the path to clear, let me rest in Your presence tonight. Amen.\u201d',\n      '\u201cLord of Light and Salvation, like David inside Your tent, I bring the unfinished questions of this week before You. Teach my heart to echo Your own voice back to You: Your face, O Lord, I will seek. Amen.\u201d',\n      '\u201cGod Who Answers (Eliana), thank You that You invite us to look for Your face before we even know what words to pray. Let Your countenance shine on our household tonight in peace. Amen.\u201d'\n    ];\n    let prayerIdx = 0;\n\n    function weaveAnotherPrayer() {\n      prayerIdx = (prayerIdx + 1) % wovenPrayers.length;\n      document.getElementById('woven-prayer-text').textContent = wovenPrayers[prayerIdx];\n    }\n\n    function toggleSavedPrayers() {\n      weaveAnotherPrayer();\n    }\n\n    // 13. Navigation Highlighting\n    function activateNav(index) {\n      document.querySelectorAll('.bottom-nav-dock .nav-tab').forEach((t, i) => {\n        t.classList.toggle('active', i === index);\n      });\n      document.querySelectorAll('.screen-jump-bar .jump-chip').forEach((c, i) => {\n        c.classList.toggle('active', i === index);\n      });\n    }\n  <\/script>\n<\/body>\n<\/html>\n<!--\nIdea: Re-envision Eliana's Rhythm from a stack of dashboard widgets and heavy card boxes into \"The Meridian & The Polyglot Margin\"\u2014a deep lapis-and-starlight sanctuary where Home unfolds as a single vertical thread (Stillness \u2192 Day's Verse with \u2726 Eliana & Continue \u2192 Library Path \u2192 Response & non-streak Journey weave).\nIn the Bible Reader, Read Mode flows like a fine nocturnal press page with verse numbers and Chain sigils (\u26d3) tucked into a quiet margin spine, while Study Mode arranges the 4 layers (tappable RTL Hebrew / LTR Greek tokens, transliteration, \u2726 Eliana's rendering, and Key Word study) like a polyglot musical score that opens directly into the live Word Sheet, Chain ladder, 5-part Verse Study, and Eliana companion.\n-->"}, {"letter": "D", "seat": "opus", "file": "mockup.html", "html": "<!-- Model: Claude Opus 5.5 (claude-opus-5-5) -->\n<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Eliana's Rhythm \u00b7 Sky<\/title>\n<style>\n:root{\n  --font: -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Inter\", \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --display: -apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"Inter\", \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --hebrew: \"SBL Hebrew\", \"Ezra SIL\", \"Taamey Frank CLM\", \"Arial Hebrew\", \"Noto Sans Hebrew\", \"Times New Roman\", serif;\n  --r: 22px;\n}\n/* ---------- the four hours ---------- */\n[data-hour=\"dawn\"]{\n  --sky: linear-gradient(180deg,#26254f 0%,#5b3f78 34%,#c46a80 66%,#f3b48c 100%);\n  --ink:#fff6ef; --ink2:rgba(255,240,232,.72); --ink3:rgba(255,240,232,.5);\n  --glass:rgba(255,255,255,.10); --glass2:rgba(255,255,255,.16); --line:rgba(255,255,255,.18);\n  --accent:#ffd29e; --accentInk:#3a2141; --sun:#ffd9a8;\n  --read:#221e3d; --readInk:#f7ece6; --nav:rgba(36,30,66,.72); --stars:0;\n}\n[data-hour=\"day\"]{\n  --sky: linear-gradient(180deg,#6fa8e0 0%,#a9cdef 40%,#dcebf8 75%,#f1f6fb 100%);\n  --ink:#0d2140; --ink2:rgba(13,33,64,.70); --ink3:rgba(13,33,64,.48);\n  --glass:rgba(255,255,255,.55); --glass2:rgba(255,255,255,.78); --line:rgba(13,33,64,.12);\n  --accent:#1d4fd8; --accentInk:#ffffff; --sun:#fff3c4;\n  --read:#f3f7fc; --readInk:#0d2140; --nav:rgba(240,246,252,.82); --stars:0;\n}\n[data-hour=\"dusk\"]{\n  --sky: linear-gradient(180deg,#141631 0%,#3a2a5e 38%,#8a4a6e 70%,#e07f57 100%);\n  --ink:#fdf0ea; --ink2:rgba(253,236,228,.72); --ink3:rgba(253,236,228,.48);\n  --glass:rgba(255,255,255,.09); --glass2:rgba(255,255,255,.15); --line:rgba(255,255,255,.16);\n  --accent:#ffb48a; --accentInk:#2a1530; --sun:#ffb27f;\n  --read:#1b1730; --readInk:#f5e9e4; --nav:rgba(24,20,46,.74); --stars:.35;\n}\n[data-hour=\"night\"]{\n  --sky: linear-gradient(180deg,#03050c 0%,#0a1028 45%,#16204a 85%,#1e2b5c 100%);\n  --ink:#e8ecfa; --ink2:rgba(222,229,250,.70); --ink3:rgba(222,229,250,.45);\n  --glass:rgba(160,180,255,.08); --glass2:rgba(160,180,255,.14); --line:rgba(180,195,255,.14);\n  --accent:#a9bcff; --accentInk:#0a1028; --sun:#e9eeff;\n  --read:#080c1c; --readInk:#dfe5f7; --nav:rgba(8,12,30,.78); --stars:1;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{background:#0a1028}\nbody{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;transition:color .6s}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\n.sky{position:fixed;inset:0;background:var(--sky);z-index:0;transition:opacity .8s}\n.stars{position:fixed;inset:0;z-index:0;opacity:var(--stars);transition:opacity .8s;pointer-events:none;\n  background-image:\n   radial-gradient(1px 1px at 12% 8%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 33% 15%,#fff 50%,transparent 51%),\n   radial-gradient(1.5px 1.5px at 72% 6%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 86% 22%,#fff 50%,transparent 51%),\n   radial-gradient(1px 1px at 55% 28%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 20% 34%,#fff 50%,transparent 51%),\n   radial-gradient(1.5px 1.5px at 92% 40%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 6% 52%,#fff 50%,transparent 51%),\n   radial-gradient(1px 1px at 44% 46%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 66% 58%,#fff 50%,transparent 51%);}\n.app{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:0 0 120px}\n.screen{display:none;animation:rise .45s ease both}\n.screen.on{display:block}\n@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n.pad{padding:0 20px}\n.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}\n.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}\n.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:550;color:var(--ink)}\n.chip.on{background:var(--ink);color:var(--read);border-color:transparent}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:99px;background:var(--accent);color:var(--accentInk);font-weight:650;font-size:15px}\n.btn.ghost{background:var(--glass2);color:var(--ink);border:1px solid var(--line)}\n.star{color:var(--accent)}\nsvg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}\n\n/* ---------- top bar ---------- */\n.top{display:flex;align-items:center;justify-content:space-between;padding:58px 20px 6px}\n.avatar{width:36px;height:36px;border-radius:50%;background:var(--glass2);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:650}\n.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line)}\n\n/* ---------- HOME ---------- */\n.greet{font-family:var(--display);font-size:38px;line-height:1.04;font-weight:700;letter-spacing:-.025em;margin-top:14px}\n.greet span{display:block;color:var(--ink2);font-weight:400}\n.arcwrap{position:relative;margin:18px 0 0;height:178px}\n.arcwrap svg{width:100%;height:100%;overflow:visible}\n.station{position:absolute;transform:translate(-50%,0);text-align:center;font-size:11.5px;font-weight:600;color:var(--ink2);width:76px}\n.station b{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:2px}\n.station.done{color:var(--ink)}\n.station.next{color:var(--accent)}\n.continue{display:flex;gap:14px;align-items:center;padding:16px 16px 16px 18px;margin-top:6px}\n.continue .ring{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accentInk);display:grid;place-items:center}\n.continue h3{font-size:17px;font-weight:650;letter-spacing:-.01em}\n.continue p{font-size:13.5px;color:var(--ink2);margin-top:2px}\n.verseday{margin-top:34px}\n.verseday blockquote{font-family:var(--display);font-size:31px;line-height:1.14;font-weight:650;letter-spacing:-.022em;margin:12px 0 10px}\n.verseday cite{font-style:normal;font-size:14px;color:var(--ink2);font-weight:550}\n.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}\n.path{margin-top:34px;padding:18px;display:flex;gap:16px;align-items:stretch}\n.cover{flex:none;width:68px;border-radius:12px;background:linear-gradient(160deg,#f6c99b,#c4677f 55%,#3d2b66);position:relative;overflow:hidden;min-height:96px}\n.cover::after{content:\"\";position:absolute;left:10px;right:10px;bottom:12px;height:2px;background:rgba(255,255,255,.7);border-radius:2px}\n.cover.aliyah{background:linear-gradient(170deg,#9fb6ff,#3b4fa8 60%,#0e1430)}\n.cover.found{background:linear-gradient(170deg,#e9e4d6,#8c8a7b 60%,#2c2b28)}\n.path h3{font-size:18px;font-weight:650;letter-spacing:-.01em;margin-top:4px}\n.path p{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.4}\n.bar{height:4px;border-radius:4px;background:var(--line);margin-top:12px;overflow:hidden}\n.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}\n.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}\n.quick button{padding:16px;text-align:left;border-radius:18px;background:var(--glass);border:1px solid var(--line);min-height:92px;display:flex;flex-direction:column;justify-content:space-between}\n.quick b{font-size:15px;font-weight:650}\n.quick small{display:block;font-size:12px;color:var(--ink2);margin-top:2px}\n.hourpick{margin:36px 20px 0;padding:14px;border-radius:18px;border:1px dashed var(--line)}\n.hourpick .row{margin-top:10px}\n\n/* ---------- BIBLE ---------- */\n.reader{background:var(--read);color:var(--readInk);min-height:100vh;transition:background .6s}\n.reader .top{padding-top:54px}\n.bk{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}\n.bk small{font-size:14px;font-weight:500;opacity:.6}\n.rtools{position:sticky;top:0;z-index:5;background:var(--read);padding:10px 20px 12px;border-bottom:1px solid var(--line);transition:background .6s}\n.depth{position:relative;display:grid;grid-template-columns:1fr 1fr;height:44px;border-radius:99px;background:var(--glass);border:1px solid var(--line);padding:4px}\n.depth .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:var(--readInk);transition:transform .35s cubic-bezier(.3,.8,.3,1)}\n.depth.study .thumb{transform:translateX(100%)}\n.depth button{position:relative;z-index:1;font-size:14px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--readInk);transition:color .3s}\n.depth:not(.study) button:first-of-type,.depth.study button:last-of-type{color:var(--read)}\n.trans{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}\n.trans .chip{height:28px;font-size:12px;color:var(--readInk)}\n.trans .chip.on{background:var(--readInk);color:var(--read)}\n.readtext{padding:26px 22px 40px;font-size:19px;line-height:1.72;letter-spacing:.002em}\n.readtext h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;font-weight:650;margin:0 0 12px}\n.readtext p{margin-bottom:20px}\n.readtext sup{font-size:11px;font-weight:700;opacity:.45;margin:0 3px 0 2px;vertical-align:6px}\n.chainmark{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 38%,transparent) 62%);cursor:pointer}\n.chaintag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 7px;vertical-align:2px;margin-left:4px}\n.selah{display:block;text-align:right;font-size:12px;letter-spacing:.2em;opacity:.45;font-weight:650;margin-top:-12px;margin-bottom:18px}\n\n.layers{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}\n.layers .chip{height:28px;font-size:12px;color:var(--readInk)}\n.layers .chip.on{background:transparent;border-color:var(--accent);color:var(--accent)}\n.studylist{padding:18px 16px 40px}\n.vcard{border-radius:24px;background:var(--glass);border:1px solid var(--line);margin-bottom:14px;overflow:hidden}\n.vhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}\n.vnum{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.03em;opacity:.9}\n.vhead .tools{display:flex;gap:6px}\n.vhead .tools button{height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--readInk)}\n.stratum{padding:12px 16px;border-top:1px solid var(--line);position:relative}\n.stratum:first-of-type{border-top:0}\n.stratum .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}\n.heb{direction:rtl;display:flex;flex-wrap:wrap;gap:6px 6px}\n.w{display:flex;flex-direction:column;align-items:center;padding:6px 8px 5px;border-radius:12px;background:var(--glass2);border:1px solid transparent;transition:border-color .2s,transform .2s}\n.w:active{transform:scale(.96)}\n.w.hot{border-color:var(--accent)}\n.w .h{font-family:var(--hebrew);font-size:25px;line-height:1.25}\n.w .g{direction:ltr;font-size:10.5px;opacity:.6;margin-top:1px;font-weight:550}\n.translit{font-size:15px;font-style:italic;opacity:.75;line-height:1.5}\n.render{font-size:18px;line-height:1.5;font-weight:550;letter-spacing:-.005em}\n.render .star{margin-right:6px}\n.base{font-size:15px;line-height:1.55;opacity:.72}\n.kw{display:flex;gap:12px;align-items:flex-start}\n.kw .bigh{font-family:var(--hebrew);font-size:30px;line-height:1;color:var(--accent);flex:none}\n.kw p{font-size:14px;line-height:1.5;opacity:.85}\n.kw p b{font-weight:700}\n.chainrow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:13px;font-weight:600}\n.chainrow .knot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:800}\n.chainrow span{opacity:.75;font-weight:500}\n.hidden-layer{display:none}\n\n/* ---------- SHEET ---------- */\n.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}\n.scrim.on{opacity:1;pointer-events:auto}\n.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;transform:translate(-50%,105%);z-index:41;background:var(--read);color:var(--readInk);border-radius:28px 28px 0 0;padding:10px 20px 34px;transition:transform .42s cubic-bezier(.25,.9,.3,1);max-height:86vh;overflow:auto;border-top:1px solid var(--line)}\n.sheet.on{transform:translate(-50%,0)}\n.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}\n.sheet .hero{display:flex;justify-content:space-between;align-items:flex-end}\n.sheet .hero .h{font-family:var(--hebrew);font-size:56px;line-height:1.1;direction:rtl}\n.strongs{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:3px 9px}\n.lemma{font-size:20px;font-weight:650;margin-top:4px}\n.lemma span{opacity:.6;font-weight:450;font-style:italic;margin-left:6px}\n.gram{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}\n.gram span{font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--glass2)}\n.meaning{font-size:16px;line-height:1.55;margin-top:18px}\n.occ{margin-top:22px}\n.occ li{list-style:none;padding:13px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}\n.occ li b{display:block;font-size:12px;font-weight:700;opacity:.55;margin-bottom:2px;letter-spacing:.02em}\n.occ li em{font-style:normal;color:var(--accent);font-weight:650}\n\n/* ---------- VERSE STUDY ---------- */\n.descent{position:relative;padding:8px 20px 20px 52px}\n.descent::before{content:\"\";position:absolute;left:31px;top:20px;bottom:40px;width:2px;background:linear-gradient(var(--accent),transparent)}\n.lvl{position:relative;margin-bottom:30px}\n.lvl .dot{position:absolute;left:-28px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--read);border:2px solid var(--accent)}\n.lvl h5{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:8px}\n.lvl p{font-size:16px;line-height:1.6}\n.lvl .bighead{font-family:var(--hebrew);font-size:30px;direction:rtl;text-align:right;line-height:1.5}\n.lvl .fresh{font-family:var(--display);font-size:24px;line-height:1.25;font-weight:650;letter-spacing:-.015em}\n.practice{padding:18px;border-radius:20px;background:var(--glass2);border:1px solid var(--line)}\n.practice ol{padding-left:18px;margin-top:8px}\n.practice li{font-size:15px;line-height:1.55;margin-bottom:6px}\n\n/* ---------- ELIANA ---------- */\n.chat{padding:8px 16px 140px}\n.ctx{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;font-size:13px}\n.ctx b{font-weight:650}\n.msg{margin-top:18px;font-size:16px;line-height:1.6}\n.msg.me{margin-left:auto;max-width:82%;padding:12px 16px;border-radius:20px 20px 6px 20px;background:var(--accent);color:var(--accentInk);font-weight:500;width:fit-content}\n.msg.el .who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}\n.orb{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--accent) 45%,transparent 72%);box-shadow:0 0 16px var(--accent)}\n.ref{color:var(--accent);font-weight:650;border-bottom:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);cursor:pointer}\n.caret{display:inline-block;width:8px;height:17px;background:var(--accent);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(2) infinite}\n@keyframes blink{50%{opacity:0}}\n.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;width:calc(100% - 32px);max-width:398px;display:flex;gap:8px;align-items:center;padding:6px 6px 6px 18px;border-radius:99px;background:var(--nav);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:20}\n.composer input{flex:1;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;outline:none}\n.composer input::placeholder{color:var(--ink3)}\n.send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accentInk);display:grid;place-items:center}\n\n/* ---------- SHELF / JOURNEY ---------- */\n.h1{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.05;margin-top:10px}\n.shelf{display:flex;gap:14px;overflow-x:auto;padding:22px 20px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}\n.book{flex:none;width:200px;scroll-snap-align:start}\n.book .cv{height:270px;border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;position:relative;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.25)}\n.book .cv h3{font-family:var(--display);font-size:24px;line-height:1.05;font-weight:700;letter-spacing:-.02em}\n.book .cv small{font-size:12px;opacity:.8;margin-top:6px;display:block}\n.book .cv .mark{position:absolute;top:18px;left:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.75}\n.book p{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.4}\n.skylog{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:14px}\n.skylog i{aspect-ratio:1;border-radius:4px;background:var(--line)}\n.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink2)}\n.legend span{display:flex;align-items:center;gap:6px}\n.legend i{width:10px;height:10px;border-radius:3px}\n.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:22px}\n.stats div{padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}\n.stats b{display:block;font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em}\n.stats small{font-size:12px;color:var(--ink2)}\n.lately li{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line);font-size:14.5px}\n.lately li small{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px}\n.lately .tod{flex:none;width:34px;height:34px;border-radius:50%}\n\n/* ---------- NAV ---------- */\nnav{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:calc(100% - 24px);max-width:406px;height:68px;border-radius:34px;background:var(--nav);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;z-index:30;color:var(--ink)}\nnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;opacity:.55;transition:opacity .2s}\nnav button.on{opacity:1}\nnav .eliana{opacity:1}\nnav .eliana .core{width:54px;height:54px;border-radius:50%;margin-top:-26px;display:grid;place-items:center;background:radial-gradient(circle at 38% 32%,#fff 0%,var(--accent) 42%,color-mix(in srgb,var(--accent) 40%,#000) 100%);box-shadow:0 0 0 5px var(--nav),0 8px 30px color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accentInk);font-size:22px}\n.reader-on nav{color:var(--readInk)}\n<\/style>\n<\/head>\n<body data-hour=\"dusk\">\n<div class=\"sky\"><\/div><div class=\"stars\"><\/div>\n\n<div class=\"app\" id=\"app\">\n\n<!-- =================== TODAY =================== -->\n<section class=\"screen on\" id=\"s-home\">\n  <div class=\"top\">\n    <div class=\"eyebrow\" id=\"dateLine\">Thursday \u00b7 19 November<\/div>\n    <button class=\"avatar\" aria-label=\"Settings\">M<\/button>\n  <\/div>\n  <div class=\"pad\">\n    <h1 class=\"greet\" id=\"greet\">Good evening. <span>The day is folding in.<\/span><\/h1>\n\n    <!-- the day's arc: the daily loop placed on the sky -->\n    <div class=\"arcwrap\" id=\"arc\">\n      <svg viewBox=\"0 0 350 178\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n        <path d=\"M15 150 Q175 -40 335 150\" stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"2 6\" stroke-linecap=\"round\"/>\n        <path id=\"arcDone\" d=\"M15 150 Q175 -40 335 150\" stroke=\"var(--accent)\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\" pathLength=\"100\" stroke-dasharray=\"72 100\"/>\n        <line x1=\"0\" y1=\"150\" x2=\"350\" y2=\"150\" stroke=\"var(--line)\" stroke-width=\"1\"/>\n        <circle id=\"sunGlow\" cx=\"270\" cy=\"70\" r=\"26\" fill=\"var(--sun)\" opacity=\".22\"/>\n        <circle id=\"sun\" cx=\"270\" cy=\"70\" r=\"10\" fill=\"var(--sun)\"/>\n        <g fill=\"var(--accent)\">\n          <circle cx=\"42\" cy=\"111\" r=\"5\"/><circle cx=\"130\" cy=\"55\" r=\"5\"/>\n        <\/g>\n        <circle cx=\"232\" cy=\"64\" r=\"7\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2.5\"/>\n        <circle cx=\"310\" cy=\"114\" r=\"5\" fill=\"none\" stroke=\"var(--ink3)\" stroke-width=\"1.5\"/>\n      <\/svg>\n      <div class=\"station done\" style=\"left:12%;top:124px\"><b>Dawn<\/b>Verse<\/div>\n      <div class=\"station done\" style=\"left:37%;top:66px\"><b>Midday<\/b>Study<\/div>\n      <div class=\"station next\" style=\"left:66%;top:80px\"><b>Dusk<\/b>Reflect<\/div>\n      <div class=\"station\" style=\"left:89%;top:126px\"><b>Night<\/b>Pray<\/div>\n    <\/div>\n\n    <button class=\"continue glass\" style=\"width:100%;text-align:left\" onclick=\"go('study')\">\n      <div class=\"ring\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M8 5l11 7-11 7z\" fill=\"currentColor\" stroke=\"none\"/><\/svg><\/div>\n      <div><div class=\"eyebrow\" style=\"color:var(--accent)\">Continue \u00b7 Reflect<\/div>\n        <h3>Sit with Psalm 46:10<\/h3><p>Deeper Lens, then a practice \u00b7 about 6 min<\/p><\/div>\n    <\/button>\n\n    <div class=\"verseday\">\n      <div class=\"eyebrow\">Today's word<\/div>\n      <blockquote>\u201cBe still, and know that I am God.\u201d<\/blockquote>\n      <cite>Psalm 46:10 \u00b7 KJV<\/cite>\n      <div class=\"row\">\n        <button class=\"chip\" onclick=\"go('bible','study')\"><span class=\"star\">\u2726<\/span> Study it<\/button>\n        <button class=\"chip\" onclick=\"go('eliana')\">Ask Eliana<\/button>\n        <button class=\"chip\">Journal<\/button>\n      <\/div>\n    <\/div>\n\n    <button class=\"path glass\" style=\"width:100%;text-align:left\" onclick=\"go('shelf')\">\n      <div class=\"cover\"><\/div>\n      <div style=\"flex:1\">\n        <div class=\"eyebrow\">Your path \u00b7 Eliana's Journal<\/div>\n        <h3>Day 12: The Quiet Hands<\/h3>\n        <p>What it means to stop striving, and why the psalmist says it in a war song.<\/p>\n        <div class=\"bar\"><i style=\"width:30%\"><\/i><\/div>\n      <\/div>\n    <\/button>\n\n    <div class=\"quick\">\n      <button><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M4 20h16M6 20V10l6-5 6 5v10M10 20v-5h4v5\"/><\/svg><div><b>Throne Room<\/b><small>Pray, or rest in a saved prayer<\/small><\/div><\/button>\n      <button><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><circle cx=\"12\" cy=\"12\" r=\"8\" opacity=\".5\"/><\/svg><div><b>Stillness<\/b><small>Three quiet minutes<\/small><\/div><\/button>\n      <button><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M5 4h11l3 3v13H5z\"/><path d=\"M9 10h6M9 14h6\"/><\/svg><div><b>Journal<\/b><small>2 entries this week<\/small><\/div><\/button>\n      <button onclick=\"go('eliana')\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 3c1 5 4 8 9 9-5 1-8 4-9 9-1-5-4-8-9-9 5-1 8-4 9-9z\"/><\/svg><div><b>Prayer<\/b><small>Tell Eliana what is on you<\/small><\/div><\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"hourpick\">\n    <div class=\"eyebrow\">Mockup control \u00b7 the sky follows the clock<\/div>\n    <div class=\"row\" id=\"hourRow\">\n      <button class=\"chip\" data-h=\"dawn\">Dawn<\/button>\n      <button class=\"chip\" data-h=\"day\">Day<\/button>\n      <button class=\"chip on\" data-h=\"dusk\">Dusk<\/button>\n      <button class=\"chip\" data-h=\"night\">Night<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- =================== BIBLE =================== -->\n<section class=\"screen reader\" id=\"s-bible\">\n  <div class=\"top\">\n    <button class=\"bk\">Psalm 46 <small>\u25be<\/small><\/button>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"iconbtn\" aria-label=\"Search\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"11\" cy=\"11\" r=\"6\"/><path d=\"M20 20l-4-4\"/><\/svg><\/button>\n      <button class=\"iconbtn\" aria-label=\"Text size\"><span style=\"font-weight:700;font-size:14px\">Aa<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"rtools\">\n    <div class=\"depth\" id=\"depth\">\n      <div class=\"thumb\"><\/div>\n      <button data-m=\"read\">Read<\/button>\n      <button data-m=\"study\"><span>\u2726<\/span> Study<\/button>\n    <\/div>\n    <div class=\"trans\" id=\"transRow\">\n      <button class=\"chip\">BSB<\/button><button class=\"chip on\">KJV<\/button><button class=\"chip\">ASV<\/button><button class=\"chip\"><span class=\"star\">\u2726<\/span>&nbsp;Eliana<\/button>\n    <\/div>\n    <div class=\"layers\" id=\"layerRow\" style=\"display:none\">\n      <button class=\"chip on\" data-l=\"orig\">Hebrew<\/button>\n      <button class=\"chip on\" data-l=\"sound\">Sound<\/button>\n      <button class=\"chip on\" data-l=\"render\">\u2726 Rendering<\/button>\n      <button class=\"chip on\" data-l=\"word\">Key word<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- READ -->\n  <div class=\"

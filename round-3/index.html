ord\">\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0<\/div>\n    <div class=\"ws-translit\" id=\"wsTranslit\">b\u0101r\u0101<\/div>\n    <div class=\"ws-meta-row\">\n      <span class=\"ws-pill strongs\" id=\"wsStrongs\">Strong\u2019s H1254<\/span>\n      <span class=\"ws-pill\" id=\"wsParsing\">Qal Perfect \u00b7 3rd Masc. Sing.<\/span>\n    <\/div>\n    <div style=\"font-size:13.5px;color:var(--text-secondary);margin-bottom:14px\" id=\"wsGloss\">BSB gloss: \u201ccreated\u201d<\/div>\n    <hr class=\"hairline-rule\" style=\"margin-bottom:14px\">\n    <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:8px\">\n      <span style=\"color:var(--gold)\">\u2726<\/span>\n      <span style=\"font-size:12.5px;font-weight:700;letter-spacing:0.04em;color:var(--text)\">Eliana Word Study<\/span>\n    <\/div>\n    <p style=\"font-size:14px;line-height:1.65;color:var(--text);opacity:0.9;margin:0 0 16px\" id=\"wsEssay\"><\/p>\n    <div class=\"eyebrow\" style=\"margin-bottom:8px;color:var(--text-secondary)\">Other Uses in Scripture<\/div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:7px\" id=\"wsOccurrences\"><\/div>\n  <\/div>\n\n  <!-- Passage & Translation Picker Sheet -->\n  <div class=\"bottom-sheet\" id=\"sheet-picker\">\n    <div class=\"sheet-handle\"><\/div>\n    <div class=\"eyebrow\" style=\"margin-bottom:10px\">Passage Demo<\/div>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px\">\n      <button class=\"room-card\" style=\"padding:12px\" onclick=\"selectDemoPassage('genesis1')\">\n        <div class=\"eyebrow\" style=\"font-size:9.5px\">Hebrew \u00b7 OT<\/div>\n        <div class=\"serif\" style=\"font-size:17px;margin-top:3px\">Genesis 1<\/div>\n        <div style=\"font-size:11.5px;color:var(--text-secondary)\">In the Beginning<\/div>\n      <\/button>\n      <button class=\"room-card\" style=\"padding:12px\" onclick=\"selectDemoPassage('john3')\">\n        <div class=\"eyebrow\" style=\"font-size:9.5px\">Greek \u00b7 NT<\/div>\n        <div class=\"serif\" style=\"font-size:17px;margin-top:3px\">John 3<\/div>\n        <div style=\"font-size:11.5px;color:var(--text-secondary)\">Born from Above<\/div>\n      <\/button>\n    <\/div>\n\n    <div class=\"eyebrow\" style=\"margin-bottom:10px\">Translation<\/div>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\" id=\"versionPickerGrid\">\n      <button class=\"dock-chip primary\" data-ver=\"BSB\" onclick=\"selectVersion('BSB')\" style=\"justify-content:center\">BSB<\/button>\n      <button class=\"dock-chip\" data-ver=\"KJV\" onclick=\"selectVersion('KJV')\" style=\"justify-content:center\">KJV<\/button>\n      <button class=\"dock-chip\" data-ver=\"ASV\" onclick=\"selectVersion('ASV')\" style=\"justify-content:center\">ASV<\/button>\n      <button class=\"dock-chip\" data-ver=\"ELIANA\" onclick=\"selectVersion('ELIANA')\" style=\"justify-content:center\">\u2726 Eliana<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- Compare Translations Sheet -->\n  <div class=\"bottom-sheet\" id=\"sheet-compare\">\n    <div class=\"sheet-handle\"><\/div>\n    <div class=\"eyebrow\" style=\"margin-bottom:4px\">Compare Translations<\/div>\n    <div class=\"serif\" style=\"font-size:19px;margin-bottom:14px\" id=\"compareRefTitle\">Genesis 1:1<\/div>\n    <div id=\"compareList\" style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:16px\"><\/div>\n    <button class=\"btn-primary\" style=\"width:100%\" onclick=\"closeAllSheets(); switchTab('eliana')\">\u2726 Ask Eliana about these differences<\/button>\n  <\/div>\n\n  <!-- Chain Sheet -->\n  <div class=\"bottom-sheet\" id=\"sheet-chain\">\n    <div class=\"sheet-handle\"><\/div>\n    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\">\n      <span class=\"chain-badge\">Chain \u21163<\/span>\n      <span class=\"eyebrow\" style=\"color:var(--text-secondary)\">Linked Across Scripture<\/span>\n    <\/div>\n    <div class=\"serif\" style=\"font-size:22px;margin-bottom:4px\">Out of Egypt<\/div>\n    <p style=\"font-size:13.5px;color:var(--text-secondary);margin:0 0 16px;line-height:1.55\">\n      Matthew keeps Hosea\u2019s singular \u201cmy son\u201d where the Greek Septuagint read \u201chis children\u201d \u2014 tracing Israel\u2019s road straight into the Messiah.\n    <\/p>\n    <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:18px\">\n      <div class=\"list-tile\" style=\"margin:0\">\n        <div><div style=\"font-size:12px;color:var(--gold);font-weight:600\">Exodus 4:22<\/div><div class=\"serif\" style=\"font-size:14.5px\">\u201cIsrael is My firstborn son.\u201d<\/div><\/div>\n      <\/div>\n      <div class=\"list-tile\" style=\"margin:0\">\n        <div><div style=\"font-size:12px;color:var(--gold);font-weight:600\">Hosea 11:1<\/div><div class=\"serif\" style=\"font-size:14.5px\">\u201cOut of Egypt I called My son.\u201d<\/div><\/div>\n      <\/div>\n      <div class=\"list-tile\" style=\"margin:0\">\n        <div><div style=\"font-size:12px;color:var(--gold);font-weight:600\">Matthew 2:15<\/div><div class=\"serif\" style=\"font-size:14.5px\">\u201cSo that what the Lord had spoken through the prophet would be fulfilled\u2026\u201d<\/div><\/div>\n      <\/div>\n    <\/div>\n    <button class=\"btn-primary\" style=\"width:100%\" onclick=\"closeAllSheets(); openOverlay('overlay-aliyah')\">Read the Aliyah Study \u203a<\/button>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n       FULL OVERLAYS: VERSE STUDY \u00b7 ALIYAH \u00b7 STILLNESS \u00b7 THEME ATELIER \u00b7 JOURNAL \u00b7 PRAYER\n       \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n\n  <!-- Full 5-Section Verse Study Page -->\n  <div class=\"overlay-page\" id=\"overlay-verse-study\">\n    <div class=\"overlay-bar\">\n      <button class=\"icon-btn\" onclick=\"closeOverlay('overlay-verse-study')\" aria-label=\"Back\">\n        <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"15 18 9 12 15 6\"/><\/svg>\n      <\/button>\n      <span class=\"serif\" style=\"font-size:16.5px;font-weight:600\" id=\"vsHeaderRef\">John 3:16<\/span>\n      <button id=\"vsOpenBibleBtn\" style=\"font-size:12px;font-weight:600;color:var(--gold);padding:4px 8px\" onclick=\"closeOverlay('overlay-verse-study'); openPassage('john3','study')\">Open in Bible<\/button>\n    <\/div>\n    <div class=\"overlay-body\" id=\"vsBody\"><\/div>\n  <\/div>\n\n  <!-- Aliyah Study Reader -->\n  <div class=\"overlay-page\" id=\"overlay-aliyah\">\n    <div class=\"overlay-bar\">\n      <button class=\"icon-btn\" onclick=\"closeOverlay('overlay-aliyah')\" aria-label=\"Back\">\n        <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"15 18 9 12 15 6\"/><\/svg>\n      <\/button>\n      <span class=\"eyebrow\" style=\"color:var(--text-secondary)\">Aliyah \u2014 The Ascent<\/span>\n      <span class=\"chain-badge\">\u21163<\/span>\n    <\/div>\n    <div class=\"overlay-body\">\n      <h1 class=\"serif\" style=\"font-size:29px;font-weight:400;margin:0 0 4px;color:var(--gold)\">Out of Egypt<\/h1>\n      <div class=\"serif\" style=\"font-style:italic;font-size:16px;color:var(--text-secondary);margin-bottom:8px\">The Fulfillment That Looks Backward<\/div>\n      <div style=\"font-size:11.5px;color:var(--gold);letter-spacing:0.06em;margin-bottom:16px\">Matthew 2:13\u201318 \u00b7 Hosea 11 \u00b7 Exodus 4:22<\/div>\n      <p class=\"serif\" style=\"font-style:italic;font-size:15.5px;line-height:1.68;color:var(--text);opacity:0.86;margin:0 0 22px\">\n        In his second chapter, Matthew says a verse was fulfilled \u2014 and the verse he quotes is Hosea remembering the Exodus, with the whole nation of Israel as God\u2019s son. Every hearer who knew Hosea could see that. So \u201cfulfill\u201d means something bigger than \u201ccame true\u201d: the Son walks Israel\u2019s road, and the road reaches its end in him.\n      <\/p>\n\n      <h2 class=\"serif\" style=\"font-size:21px;font-weight:500;margin:0 0 12px\">The Sentence That Shouldn\u2019t Be There<\/h2>\n\n      <button class=\"orig-plate\" style=\"width:100%;text-align:left\" onclick=\"closeOverlay('overlay-aliyah'); openPassage('john3','study')\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:8px\">\n          <span style=\"font-size:11.5px;font-weight:600;color:var(--gold)\">Matthew 2:15<\/span>\n          <span style=\"font-size:11px;color:var(--gold)\">Open in Bible \u203a<\/span>\n        <\/div>\n        <div style=\"font-family:var(--font-greek);font-size:18px;line-height:1.6;color:var(--text)\">\n          \u1f35\u03bd\u03b1 \u03c0\u03bb\u03b7\u03c1\u03c9\u03b8\u1fc7 \u03c4\u1f78 \u1fe5\u03b7\u03b8\u1f72\u03bd \u1f51\u03c0\u1f78 \u03ba\u03c5\u03c1\u03af\u03bf\u03c5 \u03b4\u03b9\u1f70 \u03c4\u03bf\u1fe6 \u03c0\u03c1\u03bf\u03c6\u03ae\u03c4\u03bf\u03c5 \u03bb\u03ad\u03b3\u03bf\u03bd\u03c4\u03bf\u03c2\u00b7 \u1f18\u03be \u0391\u1f30\u03b3\u03cd\u03c0\u03c4\u03bf\u03c5 \u1f10\u03ba\u03ac\u03bb\u03b5\u03c3\u03b1 \u03c4\u1f78\u03bd \u03c5\u1f31\u03cc\u03bd \u03bc\u03bf\u03c5.\n        <\/div>\n        <div style=\"font-family:var(--font-serif);font-style:italic;font-size:13px;color:var(--text-secondary);margin-top:6px\">\n          hina pl\u0113r\u014dth\u0113 to rh\u0113then hypo kyriou dia tou proph\u0113tou legontos: Ex Aigyptou ekalesa ton huion mou.\n        <\/div>\n      <\/button>\n\n      <p style=\"font-size:15px;line-height:1.72;color:var(--text);opacity:0.9;margin:14px 0 24px\">\n        Notice Matthew\u2019s quiet precision: the Greek Septuagint of Hosea 11:1 translated the Hebrew as <em>ta tekna autou<\/em> (\u201chis children\u201d). Matthew reaches past it straight back to the Hebrew singular \u2014 <em>ton huion mou<\/em>, \u201cmy son\u201d \u2014 because he wants you to hear the Exodus covenant ringing inside the infancy of Yeshua.\n      <\/p>\n\n      <div style=\"text-align:center;font-family:var(--font-serif);font-style:italic;color:var(--text-tertiary);padding:16px 0\">\n        \u2014 We ascend by digging. \u2014\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Sacred Stillness Overlay -->\n  <div class=\"overlay-page\" id=\"overlay-stillness\">\n    <div class=\"stillness-stage\">\n      <div style=\"width:100%;display:flex;justify-content:space-between;align-items:center\">\n        <span class=\"eyebrow\">Sacred Stillness<\/span>\n        <button class=\"icon-btn\" onclick=\"closeStillness()\" aria-label=\"Close Stillness\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/><\/svg>\n        <\/button>\n      <\/div>\n\n      <div style=\"max-width:290px\">\n        <p class=\"serif\" style=\"font-size:21px;line-height:1.5;color:var(--text);margin:0 0 8px\">\n          \u201cBe still, and know that I am God.\u201d\n        <\/p>\n        <div style=\"font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold)\">Psalm 46:10<\/div>\n      <\/div>\n\n      <div class=\"breath-circle-outer\">\n        <div class=\"breath-circle-inner\"><\/div>\n      <\/div>\n\n      <div>\n        <div class=\"serif\" id=\"breathCue\" style=\"font-size:19px;color:var(--gold);margin-bottom:6px\">Breathe in slowly\u2026<\/div>\n        <div style=\"font-size:12px;color:var(--text-secondary)\">Let the hurry fall away before you open the Word.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Theme Atelier & Settings Overlay -->\n  <div class=\"overlay-page\" id=\"overlay-atelier\">\n    <div class=\"overlay-bar\">\n      <button class=\"icon-btn\" onclick=\"closeOverlay('overlay-atelier')\" aria-label=\"Back\">\n        <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"15 18 9 12 15 6\"/><\/svg>\n      <\/button>\n      <span class=\"serif\" style=\"font-size:17px;font-weight:500\">Appearance &amp; Edition<\/span>\n      <span style=\"width:36px\"><\/span>\n    <\/div>\n    <div class=\"overlay-body\">\n      <div class=\"eyebrow\">Five Authored Editions<\/div>\n      <p style=\"font-size:13.5px;color:var(--text-secondary);margin:6px 0 4px;line-height:1.5\">\n        Each theme is crafted like a physical edition of Scripture \u2014 with its own paper, ink, and gold leaf.\n      <\/p>\n\n      <div class=\"atelier-grid\" id=\"atelierGrid\">\n        <button class=\"theme-card-preview selected\" data-atelier=\"sanctuary\" style=\"background:#080C15;color:#EDE8DC\" onclick=\"setTheme('sanctuary')\">\n          <div class=\"tc-name\" style=\"color:#D8B458\">Sanctuary<\/div>\n          <div class=\"tc-sample\" style=\"background:#101624;border-left:2px solid #D8B458\">\u2726 John 1:1<br>In the beginning was the Word\u2026<\/div>\n          <div class=\"tc-tag\">Antique gold on midnight<\/div>\n        <\/button>\n\n        <button class=\"theme-card-preview\" data-atelier=\"shekinah\" style=\"background:#000000;color:#EAE6DF\" onclick=\"setTheme('shekinah')\">\n          <div class=\"tc-name\" style=\"color:#E8B838\">Shekinah<\/div>\n          <div class=\"tc-sample\" style=\"background:#0E0E10;border-left:2px solid #E8B838\">\u2726 John 1:1<br>In the beginning was the Word\u2026<\/div>\n          <div class=\"tc-tag\">22k gold on OLED black<\/div>\n        <\/button>\n\n        <button class=\"theme-card-preview\" data-atelier=\"ivory\" style=\"background:#F6F4EE;color:#1E1C18;box-shadow:inset 0 0 0 1px rgba(30,28,24,0.12)\" onclick=\"setTheme('ivory')\">\n          <div class=\"tc-name\" style=\"color:#8A6612\">Ivory<\/div>\n          <div class=\"tc-sample\" style=\"background:#FFFFFF;border-left:2px solid #8A6612\">\u2726 John 1:1<br>In the beginning was the Word\u2026<\/div>\n          <div class=\"tc-tag\">Limestone, ink &amp; gold leaf<\/div>\n        <\/button>\n\n        <button class=\"theme-card-preview\" data-atelier=\"crisp\" style=\"background:#F4F6F8;color:#171A1F;box-shadow:inset 0 0 0 1px rgba(23,26,31,0.12)\" onclick=\"setTheme('crisp')\">\n          <div class=\"tc-name\" style=\"color:#7E5E10\">Crisp Print<\/div>\n          <div class=\"tc-sample\" style=\"background:#FFFFFF;border-left:2px solid #7E5E10\">\u2726 John 1:1<br>In the beginning was the Word\u2026<\/div>\n          <div class=\"tc-tag\">Archival print &amp; gilt<\/div>\n        <\/button>\n\n        <button class=\"theme-card-preview\" data-atelier=\"selah\" style=\"background:#0A141C;color:#E6ECEE;grid-column:span 2\" onclick=\"setTheme('selah')\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center\">\n            <div class=\"tc-name\" style=\"color:#6BB8B3\">Selah<\/div>\n            <span style=\"font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:#6BB8B3;padding:2px 7px;border-radius:99px;background:rgba(107,184,179,0.14)\">2027 New<\/span>\n          <\/div>\n          <div class=\"tc-sample\" style=\"background:#111F2A;border-left:2px solid #6BB8B3\">\u2726 Psalm 23:2 \u2014 He leads me beside still waters; He restores my soul.<\/div>\n          <div class=\"tc-tag\">Dawn sea-glass teal on abyssal slate<\/div>\n        <\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Sacred Journal Overlay -->\n  <div class=\"overlay-page\" id=\"overlay-journal\">\n    <div class=\"overlay-bar\">\n      <button class=\"icon-btn\" onclick=\"closeOverlay('overlay-journal')\" aria-label=\"Back\">\n        <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"15 18 9 12 15 6\"/><\/svg>\n      <\/button>\n      <span class=\"serif\" style=\"font-size:17px\">Sacred Journal<\/span>\n      <button style=\"font-size:12.5px;font-weight:600;color:var(--gold);padding:4px 8px\" onclick=\"closeOverlay('overlay-journal'); showToast('Entry kept in your Journal')\">Save<\/button>\n    <\/div>\n    <div class=\"overlay-body\">\n      <div class=\"folio-quote-wrap\" id=\"journalQuoteBox\" style=\"margin:0 0 18px\">\n        <div class=\"folio-provenance\" id=\"journalVerseRef\">\u2726 Galatians 2:20<\/div>\n        <p class=\"folio-verse\" style=\"font-size:16px\" id=\"journalVerseText\">\u201cI have been crucified with Christ, and I no longer live, but Christ lives in me\u2026\u201d<\/p>\n      <\/div>\n      <div class=\"eyebrow\" style=\"margin-bottom:8px\">Your Reflection<\/div>\n      <textarea class=\"journal-input\" id=\"journalTextarea\" placeholder=\"Write freely here\u2026 let your heart speak. There is no wrong way to journal.\"><\/textarea>\n    <\/div>\n  <\/div>\n\n  <!-- Throne Room (Prayer) Overlay -->\n  <div class=\"overlay-page\" id=\"overlay-prayer\">\n    <div class=\"overlay-bar\">\n      <button class=\"icon-btn\" onclick=\"closeOverlay('overlay-prayer')\" aria-label=\"Back\">\n        <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"15 18 9 12 15 6\"/><\/svg>\n      <\/button>\n      <span class=\"serif\" style=\"font-size:17px\">Throne Room<\/span>\n      <span style=\"width:36px\"><\/span>\n    <\/div>\n    <div class=\"overlay-body\">\n      <div class=\"eyebrow\" style=\"margin-bottom:4px\">Enter with confidence<\/div>\n      <p class=\"page-epigraph\" style=\"margin-bottom:16px\">\u201cLet us approach God\u2019s throne of grace with confidence.\u201d \u2014 Hebrews 4:16<\/p>\n\n      <div class=\"folio-card\" style=\"padding:16px;margin-bottom:18px\">\n        <div class=\"eyebrow\" style=\"margin-bottom:8px\">Help Me Pray<\/div>\n        <textarea class=\"journal-input\" id=\"prayerInput\" style=\"min-height:92px;font-size:14.5px;margin-bottom:10px\" placeholder=\"Share what is on your heart \u2014 anxiety, gratitude, someone you love\u2026\"><\/textarea>\n        <button class=\"btn-primary\" style=\"width:100%\" onclick=\"generateSamplePrayer()\">\u2726 Write a Prayer With Me<\/button>\n        <div id=\"generatedPrayerOut\" style=\"display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--hairline)\">\n          <p class=\"serif\" style=\"font-style:italic;font-size:15.5px;line-height:1.68;color:var(--text);margin:0\">\n            Heavenly Father, thank You that I do not have to carry today in my own strength. Teach me to lay down the weight of trying to be in control, and to rest in the love of Your Son who gave Himself for me. Quiet my heart and order my steps today. Amen.\n          <\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"eyebrow\" style=\"margin-bottom:10px\">Curated Prayers<\/div>\n      <button class=\"list-tile\" onclick=\"showToast('Morning Prayer opened')\">\n        <div><div class=\"serif\" style=\"font-size:16px\">Morning Prayer<\/div><div style=\"font-size:12px;color:var(--text-secondary)\">Heavenly Father, thank You for this new day\u2026<\/div><\/div>\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"color:var(--gold)\"><polyline points=\"9 18 15 12 9 6\"/><\/svg>\n      <\/button>\n      <button class=\"list-tile\" onclick=\"showToast('Mikaylah\u2019s Prayer opened')\">\n        <div><div class=\"serif\" style=\"font-size:16px\">Mikaylah\u2019s Prayer<\/div><div style=\"font-size:12px;color:var(--text-secondary)\">You are the God who sees me (Genesis 16:13)\u2026<\/div><\/div>\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"color:var(--gold)\"><polyline points=\"9 18 15 12 9 6\"/><\/svg>\n      <\/button>\n      <button class=\"list-tile\" onclick=\"showToast('Night Prayer opened')\">\n        <div><div class=\"serif\" style=\"font-size:16px\">Night Prayer<\/div><div style=\"font-size:12px;color:var(--text-secondary)\">Dear Lord, as the night falls, I thank You\u2026<\/div><\/div>\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"color:var(--gold)\"><polyline points=\"9 18 15 12 9 6\"/><\/svg>\n      <\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n<\/div>\n\n<script>\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     DATA \u2014 Authentic Scripture, Original Words (Hebrew + Greek), & Studies\n     \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n  const DAILY_WORDS = [\n    {\n      dayLabel: \"Today\",\n      ref: \"Galatians 2:20\",\n      chain: null,\n      verse: \"\u201cI have been crucified with Christ, and I no longer live, but Christ lives in me. And the life I now live in the body, I live by faith in the Son of God, who loved me and gave himself up for me.\u201d\",\n      carry: \"Ask where you are still trying to run your life as though the old self were still in charge, rather than living out of the reality that Christ\u2019s self-giving love is what holds you today.\",\n      notice: \"Paul uses the perfect passive participle synestaur\u014dmai \u2014 \u201cI have been co-crucified\u201d \u2014 an event completed in the past whose standing result continues unbroken in the present.\",\n      why: \"Faith here is not white-knuckled self-improvement; it is resting your weight on the faithfulness of the One who already gave himself for you.\",\n      studyKey: \"john3_16\"\n    },\n    {\n      dayLabel: \"Yesterday\",\n      ref: \"Exodus 3:14\",\n      chain: 7,\n      verse: \"\u201cGod said to Moses, \u2018I AM WHO I AM.\u2019 And He said, \u2018Say this to the people of Israel: I AM has sent me to you.\u2019\u201d\",\n      carry: \"When the road ahead feels too large for your own resources, remember that the One who sends you is not defined by circumstance \u2014 He simply is, and He goes with you.\",\n      notice: \"The Hebrew phrase \u02beehyeh \u02be\u0103\u0161er \u02beehyeh can be read both \u201cI am who I am\u201d and \u201cI will be who I will be\u201d \u2014 active, faithful presence rather than abstract philosophy.\",\n      why: \"Every \u201cI AM\u201d declaration of Yeshua in John\u2019s Gospel rings with the resonance of this burning-bush promise.\",\n      studyKey: \"gen1_1\"\n    },\n    {\n      dayLabel: \"Sun, Nov 15\",\n      ref: \"John 1:14\",\n      chain: 1,\n      verse: \"\u201cAnd the Word became flesh and pitched his tent among us, and we beheld his glory \u2014 glory as of the one-and-only from the Father, full of grace and truth.\u201d\",\n      carry: \"God did not stay at a safe distance and shout instructions; He moved into the neighborhood of human frailty. Bring your ordinary, unpolished day into His presence.\",\n      notice: \"The verb esk\u0113n\u014dsen literally means \u201ctabernacled\u201d or \u201cpitched a tent\u201d \u2014 deliberately echoing the wilderness dwelling where the glory cloud settled in Exodus 40.\",\n      why: \"Grace and truth are not opposites held in awkward tension; in Yeshua they arrive together, echoing the Hebrew pair \u1e25esed we\u02be\u0115met (steadfast love and faithfulness).\",\n      studyKey: \"john3_16\"\n    }\n  ];\n\n  const WORD_LEXICON = {\n    bereshit: {\n      word: \"\u05d1\u05b0\u05bc\u05e8\u05b5\u05d0\u05e9\u05b4\u05c1\u05d9\u05ea\", lang: \"heb\", translit: \"b\u0259\u00b7r\u00ea\u00b7\u0161\u00ee\u1e6f\",\n      strongs: \"Strong\u2019s H7225\", parsing: \"Noun \u00b7 Fem. Sing. Construct\",\n      gloss: \"\u201cIn the beginning\u201d\",\n      essay: \"Derived from r\u014d\u02be\u0161 (\u201chead, summit, first\u201d), b\u0259r\u00ea\u0161\u00ee\u1e6f names not merely the first tick of a clock but the inaugural threshold of God\u2019s sovereign work. In Genesis 1:1 it opens the entire canon; John 1:1 deliberately echoes its Greek counterpart en arch\u0113 to announce a new creation in the Word.\",\n      occurrences: [\"Genesis 1:1\", \"Proverbs 1:7\", \"Jeremiah 26:1\", \"John 1:1\"]\n    },\n    bara: {\n      word: \"\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0\", lang: \"heb\", translit: \"b\u0101\u00b7r\u0101\",\n      strongs: \"Strong\u2019s H1254\", parsing: \"Qal Perfect \u00b7 3rd Masc. Sing.\",\n      gloss: \"\u201ccreated\u201d\",\n      essay: \"In the Qal stem across the entire Hebrew Bible, b\u0101r\u0101 is reserved exclusively for God as its subject \u2014 never a human artisan. It marks an effortless, sovereign act that brings into being what could not exist on its own. Stated in the perfect aspect, creation stands as a settled, uncontested fact.\",\n      occurrences: [\"Genesis 1:1\", \"Genesis 1:27\", \"Psalm 51:10\", \"Isaiah 40:28\"]\n    },\n    elohim: {\n      word: \"\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd\", lang: \"heb\", translit: \"\u02be\u0115\u00b7l\u014d\u00b7h\u00eem\",\n      strongs: \"Strong\u2019s H430\", parsing: \"Noun \u00b7 Masc. Plural (Majesty)\",\n      gloss: \"\u201cGod\u201d\",\n      essay: \"Though grammatically plural in form, \u02be\u0115l\u014dh\u00eem governs the singular verb b\u0101r\u0101 (\u201cHe created\u201d). In Hebrew grammar this is a plural of fullness and majesty \u2014 expressing the infinite breadth and unshared supremacy of the one Creator.\",\n      occurrences: [\"Genesis 1:1\", \"Deuteronomy 6:4\", \"Psalm 23:1\", \"Isaiah 45:5\"]\n    },\n    hashamayim: {\n      word: \"\u05d4\u05b7\u05e9\u05b8\u05bc\u05c1\u05de\u05b7\u05d9\u05b4\u05dd\", lang: \"heb\", translit: \"ha\u0161\u00b7\u0161\u0101\u00b7ma\u00b7yim\",\n      strongs: \"Strong\u2019s H8064\", parsing: \"Def. Article + Noun \u00b7 Dual/Plural\",\n      gloss: \"\u201cthe heavens\u201d\",\n      essay: \"Paired with h\u0101\u02be\u0101re\u1e63 (\u201cthe earth\u201d), \u201cthe heavens and the earth\u201d forms a Hebrew merism \u2014 naming two opposite poles to embrace everything in between: the entire cosmos, seen and unseen.\",\n      occurrences: [\"Genesis 1:1\", \"Psalm 19:1\", \"Isaiah 65:17\"]\n    },\n    haaretz: {\n      word: \"\u05d4\u05b8\u05d0\u05b8\u05e8\u05b6\u05e5\", lang: \"heb\", translit: \"h\u0101\u00b7\u02be\u0101\u00b7re\u1e63\",\n      strongs: \"Strong\u2019s H776\", parsing: \"Def. Article + Noun \u00b7 Fem. Sing.\",\n      gloss: \"\u201cthe earth\u201d\",\n      essay: \"Names both the whole habitable world and the particular land of promise. Genesis 1 opens with an earth still unformed and unfilled, setting up the six-day rhythm of forming and filling.\",\n      occurrences: [\"Genesis 1:1\", \"Genesis 1:2\", \"Psalm 24:1\"]\n    },\n    ruach: {\n      word: \"\u05d5\u05b0\u05e8\u05d5\u05bc\u05d7\u05b7\", lang: \"heb\", translit: \"w\u0259\u00b7r\u00fb\u00b7a\u1e25\",\n      strongs: \"Strong\u2019s H7307\", parsing: \"Conjunction + Noun \u00b7 Fem. Sing.\",\n      gloss: \"\u201cand the Spirit / breath\u201d\",\n      essay: \"R\u00fba\u1e25 holds wind, breath, and Spirit in one living word. Here God\u2019s breath hovers (m\u0259ra\u1e25epe\u1e6f, like a bird sheltering its young in Deut 32:11) over the dark waters \u2014 presence brooding over chaos before a single ray of light breaks.\",\n      occurrences: [\"Genesis 1:2\", \"Exodus 14:21\", \"Ezekiel 37:9\", \"John 3:8\"]\n    },\n    or: {\n      word: \"\u05d0\u05d5\u05b9\u05e8\", lang: \"heb\", translit: \"\u02be\u00f4r\",\n      strongs: \"Strong\u2019s H216\", parsing: \"Noun \u00b7 Masc. Sing.\",\n      gloss: \"\u201clight\u201d\",\n      essay: \"The first spoken reality in Scripture \u2014 called forth before sun, moon, or stars exist. Creation begins not with violence or struggle (as in ancient Near Eastern myths), but with a calm spoken word that brings illumination.\",\n      occurrences: [\"Genesis 1:3\", \"Psalm 27:1\", \"Isaiah 60:1\", \"John 1:4\"]\n    },\n    egapesen: {\n      word: \"\u1f20\u03b3\u03ac\u03c0\u03b7\u03c3\u03b5\u03bd\", lang: \"grk\", translit: \"\u0113gap\u0113sen\",\n      strongs: \"Strong\u2019s G25\", parsing: \"Aorist Active Indicative \u00b7 3rd Sing.\",\n      gloss: \"\u201cloved\u201d\",\n      essay: \"The aorist tense looks at God\u2019s love not as a passing sentiment but as a decisive historical act \u2014 love proven in action. Coupled with hout\u014ds (\u201cin this way\u201d), John points directly to the gift of the Son as the measure of divine love.\",\n      occurrences: [\"John 3:16\", \"Romans 5:8\", \"Galatians 2:20\", \"1 John 4:10\"]\n    },\n    kosmon: {\n      word: \"\u03ba\u03cc\u03c3\u03bc\u03bf\u03bd\", lang: \"grk\", translit: \"kosmon\",\n      strongs: \"Strong\u2019s G2889\", parsing: \"Noun \u00b7 Accusative Masc. Sing.\",\n      gloss: \"\u201cthe world\u201d\",\n      essay: \"In John\u2019s Gospel, kosmos is not merely the planet; it is humanity in its estrangement and darkness \u2014 the very world that did not recognize its Maker (John 1:10). The astonishment of 3:16 is not how big the world is, but how broken it is, and yet how deeply God loved it.\",\n      occurrences: [\"John 1:10\", \"John 3:16\", \"John 3:17\", \"1 John 2:2\"]\n    },\n    monogene: {\n      word: \"\u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6\", lang: \"grk\", translit: \"monogen\u0113\",\n      strongs: \"Strong\u2019s G3439\", parsing: \"Adjective \u00b7 Accusative Masc. Sing.\",\n      gloss: \"\u201cone-and-only\u201d\",\n      essay: \"Often rendered \u201conly begotten\u201d through the Latin Vulgate\u2019s unigenitus, modern Greek lexicography shows the root is monos (sole) + genos (kind): \u201cone of a kind, unique, irreplaceable.\u201d Hebrews 11:17 uses the same word for Isaac \u2014 the unique son of promise.\",\n      occurrences: [\"John 1:14\", \"John 1:18\", \"John 3:16\", \"Hebrews 11:17\"]\n    },\n    pisteuon: {\n      word: \"\u03c0\u03b9\u03c3\u03c4\u03b5\u03cd\u03c9\u03bd\", lang: \"grk\", translit: \"pisteu\u014dn\",\n      strongs: \"Strong\u2019s G4100\", parsing: \"Present Active Participle \u00b7 Nom. Masc. Sing.\",\n      gloss: \"\u201cthe one believing / trusting\u201d\",\n      essay: \"John never uses the noun \u201cfaith\u201d (pistis) in his Gospel \u2014 only the active verb pisteu\u014d, 98 times. Faith is not a static label you possess; it is an ongoing verb of entrusting yourself to Yeshua.\",\n      occurrences: [\"John 3:16\", \"John 6:47\", \"John 11:25\"]\n    },\n    aionion: {\n      word: \"\u03b1\u1f30\u03ce\u03bd\u03b9\u03bf\u03bd\", lang: \"grk\", translit: \"ai\u014dnion\",\n      strongs: \"Strong\u2019s G166\", parsing: \"Adjective \u00b7 Accusative Fem. Sing.\",\n      gloss: \"\u201ceternal / of the age to come\u201d\",\n      essay: \"Not merely endless calendar duration, but the quality of life belonging to God\u2019s coming age \u2014 already broken open in the present for everyone who trusts the Son (John 17:3).\",\n      occurrences: [\"John 3:16\", \"John 17:3\", \"Romans 6:23\"]\n    }\n  };\n\n  const PASSAGES = {\n    genesis1: {\n      book: \"Genesis\", chapter: 1, subtitle: \"The Beginning of Creation\", lang: \"heb\",\n      verses: [\n        {\n          n: 1, chain: 1, studyKey: \"gen1_1\",\n          bsb: \"In the beginning God created the heavens and the earth.\",\n          kjv: \"In the beginning God created the heaven and the earth.\",\n          asv: \"In the beginning God created the heavens and the earth.\",\n          eliana: \"In the beginning God created the heavens and the earth.\",\n          compareNote: \"The BSB reads the same\",\n          tokens: [\n            { t: \"\u05d1\u05b0\u05bc\u05e8\u05b5\u05d0\u05e9\u05b4\u05c1\u05d9\u05ea\", tr: \"b\u0259\u00b7r\u00ea\u00b7\u0161\u00ee\u1e6f\", k: \"bereshit\" },\n            { t: \"\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0\", tr: \"b\u0101\u00b7r\u0101\", k: \"bara\" },\n            { t: \"\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd\", tr: \"\u02be\u0115\u00b7l\u014d\u00b7h\u00eem\", k: \"elohim\" },\n            { t: \"\u05d0\u05b5\u05ea\", tr: \"\u02be\u00ea\u1e6f\", k: \"elohim\" },\n            { t: \"\u05d4\u05b7\u05e9\u05b8\u05bc\u05c1\u05de\u05b7\u05d9\u05b4\u05dd\", tr: \"ha\u0161\u00b7\u0161\u0101\u00b7ma\u00b7yim\", k: \"hashamayim\" },\n            { t: \"\u05d5\u05b0\u05d0\u05b5\u05ea\", tr: \"w\u0259\u00b7\u02be\u00ea\u1e6f\", k: \"haaretz\" },\n            { t: \"\u05d4\u05b8\u05d0\u05b8\u05e8\u05b6\u05e5\u05c3\", tr: \"h\u0101\u00b7\u02be\u0101\u00b7re\u1e63\", k: \"haaretz\" }\n          ],\n          kw: { orig: \"\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0\", translit: \"b\u0101r\u0101\", short: \"The verb is a Qal perfect, third person masculine singular \u2014 a simple, completed action, stated as plain fact.\", full: \"The verb is a Qal perfect, third person masculine singular \u2014 a simple, completed action, stated as plain fact. What sets b\u0101r\u0101 apart across the Hebrew Bible is that God is always its sole subject: creation is never a struggle with rival forces, but sovereign calling into being.\" }\n        },\n        {\n          n: 2, chain: null, studyKey: \"gen1_1\",\n          bsb: \"Now the earth was formless and void, and darkness was over the surface of the deep. And the Spirit of God was hovering over the surface of the waters.\",\n          kjv: \"And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters.\",\n          asv: \"And the earth was waste and void; and darkness was upon the face of the deep: and the Spirit of God moved upon the face of the waters.\",\n          eliana: \"Now the earth was formless and empty, darkness lay over the face of the deep, and the breath of God was hovering over the face of the waters.\",\n          compareNote: \"BSB: \u201cthe Spirit of God was hovering over the surface of the waters.\u201d\",\n          tokens: [\n            { t: \"\u05d5\u05b0\u05d4\u05b8\u05d0\u05b8\u05e8\u05b6\u05e5\", tr: \"w\u0259\u00b7h\u0101\u00b7\u02be\u0101\u00b7re\u1e63\", k: \"haaretz\" },\n            { t: \"\u05d4\u05b8\u05d9\u05b0\u05ea\u05b8\u05d4\", tr: \"h\u0101\u00b7y\u0259\u00b7\u1e6f\u0101h\", k: \"bara\" },\n            { t: \"\u05ea\u05b9\u05d4\u05d5\u05bc\", tr: \"\u1e6f\u014d\u00b7h\u00fb\", k: \"haaretz\" },\n            { t: \"\u05d5\u05b8\u05d1\u05b9\u05d4\u05d5\u05bc\", tr: \"w\u0101\u00b7\u1e07\u014d\u00b7h\u00fb\", k: \"haaretz\" },\n            { t: \"\u05d5\u05b0\u05e8\u05d5\u05bc\u05d7\u05b7\", tr: \"w\u0259\u00b7r\u00fb\u00b7a\u1e25\", k: \"ruach\" },\n            { t: \"\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd\", tr: \"\u02be\u0115\u00b7l\u014d\u00b7h\u00eem\", k: \"elohim\" },\n            { t: \"\u05de\u05b0\u05e8\u05b7\u05d7\u05b6\u05e4\u05b6\u05ea\", tr: \"m\u0259\u00b7ra\u00b7\u1e25e\u00b7p\u0304e\u1e6f\", k: \"ruach\" }\n          ],\n          kw: { orig: \"\u05d5\u05b0\u05e8\u05d5\u05bc\u05d7\u05b7\", translit: \"w\u0259r\u00fba\u1e25\", short: \"\u201cBreath,\u201d \u201cwind,\u201d and \u201cSpirit\u201d share one Hebrew word \u2014 God\u2019s living presence brooding over unshaped waters.\", full: \"\u201cBreath,\u201d \u201cwind,\u201d and \u201cSpirit\u201d share one Hebrew word. Paired with m\u0259ra\u1e25epe\u1e6f (\u201chovering, brooding\u201d), the image is maternal and protective \u2014 the same verb Moses uses in Deuteronomy 32:11 of an eagle fluttering over its young.\" }\n        },\n        {\n          n: 3, chain: null, studyKey: \"gen1_1\",\n          bsb: \"And God said, \u201cLet there be light,\u201d and there was light.\",\n          kjv: \"And God said, Let there be light: and there was light.\",\n          asv: \"And God said, Let there be light: and there was light.\",\n          eliana: \"And God said, \u201cLet there be light,\u201d and light came to be.\",\n          compareNote: \"BSB: \u201cand there was light.\u201d\",\n          tokens: [\n            { t: \"\u05d5\u05b7\u05d9\u05b9\u05bc\u05d0\u05de\u05b6\u05e8\", tr: \"way\u00b7y\u014d\u00b7mer\", k: \"elohim\" },\n            { t: \"\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd\", tr: \"\u02be\u0115\u00b7l\u014d\u00b7h\u00eem\", k: \"elohim\" },\n            { t: \"\u05d9\u05b0\u05d4\u05b4\u05d9\", tr: \"y\u0259\u00b7h\u00ee\", k: \"or\" },\n            { t: \"\u05d0\u05d5\u05b9\u05e8\", tr: \"\u02be\u00f4r\", k: \"or\" },\n            { t: \"\u05d5\u05b7\u05d9\u05b0\u05d4\u05b4\u05d9\u05be\u05d0\u05d5\u05b9\u05e8\u05c3\", tr: \"way\u00b7h\u00ee-\u02be\u00f4r\", k: \"or\" }\n          ],\n          kw: { orig: \"\u05d0\u05d5\u05b9\u05e8\", translit: \"\u02be\u00f4r\", short: \"Light is spoken into existence in two Hebrew words (y\u0259h\u00ee \u02be\u00f4r) \u2014 reality answering the voice of its Maker.\", full: \"Light is spoken into existence in two Hebrew words (y\u0259h\u00ee \u02be\u00f4r) \u2014 reality answering the voice of its Maker without resistance. Paul later reads this moment as the pattern for every illuminated human heart (2 Corinthians 4:6).\" }\n        }\n      ]\n    },\n    john3: {\n      book: \"John\", chapter: 3, subtitle: \"God Loved the World in This Way\", lang: \"grk\",\n      verses: [\n        {\n          n: 16, chain: 3, studyKey: \"john3_16\",\n          bsb: \"For God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life.\",\n          kjv: \"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.\",\n          asv: \"For God so loved the world, that he gave his only begotten Son, that whosoever believeth on him should not perish, but have eternal life.\",\n          eliana: \"\u201cFor God loved the world in this way: he gave his one-and-only Son, so that everyone who believes in him would not perish but have eternal life.\u201d\",\n          compareNote: \"BSB: \u201cFor God so loved the world that He gave His one and only Son\u2026\u201d\",\n          tokens: [\n            { t: \"\u039f\u1f55\u03c4\u03c9\u03c2\", tr: \"Hout\u014ds\", k: \"egapesen\" },\n            { t: \"\u03b3\u1f70\u03c1\", tr: \"gar\", k: \"egapesen\" },\n            { t: \"\u1f20\u03b3\u03ac\u03c0\u03b7\u03c3\u03b5\u03bd\", tr: \"\u0113gap\u0113sen\", k: \"egapesen\" },\n            { t: \"\u1f41 \u0398\u03b5\u1f78\u03c2\", tr: \"ho Theos\", k: \"egapesen\" },\n            { t: \"\u03c4\u1f78\u03bd \u03ba\u03cc\u03c3\u0

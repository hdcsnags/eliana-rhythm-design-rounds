is one-and-only Son before I ever had my feet under me...<\/textarea>\n      <\/div>\n    <\/div>\n\n    <!-- JOURNEY: Progress Across Reading & Reflection Kept Without Streaks -->\n    <div class=\"surface-card\" style=\"margin-bottom:4px;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n        <span style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--teal);\">\n          \ud83c\udf3f Journey \u00b7 Kept Without Streaks\n        <\/span>\n        <span style=\"font-size:10px; color:var(--ink-muted);\">Grace-Filled Rhythm<\/span>\n      <\/div>\n      <p style=\"font-size:11.5px; color:var(--ink-secondary); line-height:1.42; margin-bottom:8px;\">\n        No broken chains or guilt counters\u2014only a quiet record of the passages, prayers, and reflections you\u2019ve walked through over time:\n      <\/p>\n      <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; text-align:center;\">\n        <div style=\"background:var(--bg-hero-inner); border-radius:10px; padding:7px;\">\n          <div style=\"font-family:var(--font-serif); font-size:16px; font-weight:700; color:var(--gold);\">42<\/div>\n          <div style=\"font-size:10px; color:var(--ink-muted);\">Chapters Read<\/div>\n        <\/div>\n        <div style=\"background:var(--bg-hero-inner); border-radius:10px; padding:7px;\">\n          <div style=\"font-family:var(--font-serif); font-size:16px; font-weight:700; color:var(--azure);\">28<\/div>\n          <div style=\"font-size:10px; color:var(--ink-muted);\">Roots Explored<\/div>\n        <\/div>\n        <div style=\"background:var(--bg-hero-inner); border-radius:10px; padding:7px;\">\n          <div style=\"font-family:var(--font-serif); font-size:16px; font-weight:700; color:var(--cinnabar);\">18<\/div>\n          <div style=\"font-size:10px; color:var(--ink-muted);\">Journal &amp; Prayers<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ========================================================================\n       SCREEN 7: \u2726 ELIANA (STREAMING CHAT) & SETTINGS (4-THEME STUDIO)\n       - Eliana Chat: streaming answers, tappable Scripture references, starts from a verse\n       - Settings: Four themes (Sacred, Shekinah, Ivory, Selah) with live visual cards\n       ======================================================================== -->\n  <section id=\"sec-eliana-themes\" class=\"screen-chapter\" style=\"border-bottom:none;\">\n    <div class=\"chapter-eyebrow\">\n      <span class=\"eyebrow-tag\">\u2726 Screen 7 \u00b7 Eliana Companion &amp; Theme Studio<\/span>\n      <span class=\"eyebrow-sub\">Streaming \u00b7 4 Themes<\/span>\n    <\/div>\n\n    <!-- ELIANA COMPANION CHAT -->\n    <div class=\"hero-card\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;\">\n        <span style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold);\">\n          \u2726 Eliana \u00b7 Spiritual Companion\n        <\/span>\n        <span style=\"font-size:10px; color:var(--ink-muted);\">Context: John 3:16 &amp; Chain \u21163<\/span>\n      <\/div>\n\n      <!-- User Prompt Bubble -->\n      <div style=\"background:var(--bg-subtle); border:1px solid var(--border-hairline); border-radius:12px 12px 4px 12px; padding:9px 11px; font-size:12.5px; color:var(--ink-primary); margin-bottom:9px;\">\n        \u201cEliana, how does <em>monogen\u0113s<\/em> in John 3:16 connect back to Abraham and Isaac in Genesis?\u201d\n      <\/div>\n\n      <!-- Streaming Eliana Answer with Tappable Scripture References -->\n      <div style=\"background:var(--bg-hero-inner); border-left:2.5px solid var(--gold); border-radius:0 12px 12px 0; padding:10px 12px; font-size:13px; line-height:1.54; color:var(--ink-primary); margin-bottom:9px;\" id=\"eliana-chat-stream\">\n        <strong>\u2726 Eliana:<\/strong> In the Hebrew of <a href=\"#sec-reader-study\" class=\"inline-scripture-door\">Genesis 22:2<\/a>, God calls Isaac Abraham\u2019s <em>y\u0101\u1e25\u00eed<\/em> \u2014 his \u201conly, cherished son.\u201d When Jewish translators rendered Genesis into Greek, they chose <em>agap\u0113tos<\/em> and <em>monogen\u0113s<\/em> (see <a href=\"#sec-reader-study\" class=\"inline-scripture-door\">Hebrews 11:17<\/a>). So when <a href=\"#sec-verse-study\" class=\"inline-scripture-door\">John 3:16<\/a> says God gave <em>ton Huion ton monogen\u0113<\/em>, every reader steeped in Scripture hears Moriah in reverse: the Father Himself provides the Beloved Son.\n      <\/div>\n\n      <div style=\"display:flex; gap:6px; flex-wrap:wrap;\">\n        <button class=\"btn-primary-gold\" style=\"flex:1;\" onclick=\"streamElianaFollowUp()\">\u2726 Stream Follow-Up<\/button>\n        <a href=\"#sec-reader-study\" class=\"btn-outline-door\">Today\u2019s word<\/a>\n        <a href=\"#sec-library-practice\" class=\"btn-outline-door\">Pray this<\/a>\n      <\/div>\n    <\/div>\n\n    <!-- SETTINGS: FOUR COLOUR THEMES (Tap any card to switch the entire app) -->\n    <div class=\"surface-card\" style=\"margin-bottom:8px;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center;\">\n        <div>\n          <div style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold);\">\n            \ud83c\udfa8 Appearance \u00b7 Four Sanctuary Themes\n          <\/div>\n          <div style=\"font-size:11.5px; color:var(--ink-secondary);\">\n            Tap any theme card below to re-illuminate the entire mockup\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"theme-studio-grid\">\n        <!-- Theme 1: Sacred -->\n        <div class=\"theme-preview-card current-theme\" id=\"tcard-sacred\" onclick=\"switchTheme('sacred')\" style=\"background:#080C14; color:#EDE6D8;\">\n          <div style=\"font-family:var(--font-serif); font-size:14px; font-weight:700; color:#D4AF37;\">Sacred<\/div>\n          <div style=\"background:#171E2E; border-radius:8px; padding:6px 8px; margin:6px 0; font-size:11px;\">\n            <span style=\"color:#D4AF37; font-weight:700;\">\u2726 John 1:1<\/span><br/>\n            In the beginning\u2026\n          <\/div>\n          <div style=\"font-size:10px; color:#9994A0;\">Antique gold on lapis midnight<\/div>\n        <\/div>\n\n        <!-- Theme 2: Shekinah -->\n        <div class=\"theme-preview-card\" id=\"tcard-shekinah\" onclick=\"switchTheme('shekinah')\" style=\"background:#000000; color:#ECE8E0;\">\n          <div style=\"font-family:var(--font-serif); font-size:14px; font-weight:700; color:#FFC233;\">Shekinah<\/div>\n          <div style=\"background:#141414; border-radius:8px; padding:6px 8px; margin:6px 0; font-size:11px;\">\n            <span style=\"color:#FFC233; font-weight:700;\">\u2726 John 1:1<\/span><br/>\n            In the beginning\u2026\n          <\/div>\n          <div style=\"font-size:10px; color:#A6A29A;\">Fire gold on true OLED black<\/div>\n        <\/div>\n\n        <!-- Theme 3: Ivory -->\n        <div class=\"theme-preview-card\" id=\"tcard-ivory\" onclick=\"switchTheme('ivory')\" style=\"background:#F9F8F4; color:#222220;\">\n          <div style=\"font-family:var(--font-serif); font-size:14px; font-weight:700; color:#8A6900;\">Ivory<\/div>\n          <div style=\"background:#FBF6E8; border-radius:8px; padding:6px 8px; margin:6px 0; font-size:11px;\">\n            <span style=\"color:#8A6900; font-weight:700;\">\u2726 John 1:1<\/span><br/>\n            In the beginning\u2026\n          <\/div>\n          <div style=\"font-size:10px; color:#62625E;\">Paper, ink, and gold leaf<\/div>\n        <\/div>\n\n        <!-- Theme 4: Selah -->\n        <div class=\"theme-preview-card\" id=\"tcard-selah\" onclick=\"switchTheme('selah')\" style=\"background:#0C1A24; color:#E8F0F2;\">\n          <div style=\"font-family:var(--font-serif); font-size:14px; font-weight:700; color:#64B8BB;\">Selah<\/div>\n          <div style=\"background:#172E3D; border-radius:8px; padding:6px 8px; margin:6px 0; font-size:11px;\">\n            <span style=\"color:#64B8BB; font-weight:700;\">\u2726 John 1:1<\/span><br/>\n            In the beginning\u2026\n          <\/div>\n          <div style=\"font-size:10px; color:#85A3B2;\">Still-waters teal &amp; electrum<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ========================================================================\n       STICKY BOTTOM NAVIGATION BAR (5 Sanctuary Destinations)\n       ======================================================================== -->\n  <nav class=\"bottom-tab-bar\" aria-label=\"Primary App Tabs\">\n    <a href=\"#sec-home\" class=\"tab-item active\" onclick=\"activateBottomTab(this)\">\n      <span class=\"tab-icon-pill\">\u2302<\/span>\n      <span>Home<\/span>\n    <\/a>\n    <a href=\"#sec-reader-read\" class=\"tab-item\" onclick=\"activateBottomTab(this)\">\n      <span class=\"tab-icon-pill\">\ud83d\udcd6<\/span>\n      <span>Bible<\/span>\n    <\/a>\n    <a href=\"#sec-reader-study\" class=\"tab-item\" onclick=\"activateBottomTab(this)\">\n      <span class=\"tab-icon-pill\">\u05d0/\u03a9<\/span>\n      <span>Study<\/span>\n    <\/a>\n    <a href=\"#sec-library-practice\" class=\"tab-item\" onclick=\"activateBottomTab(this)\">\n      <span class=\"tab-icon-pill\">\ud83d\udd6f<\/span>\n      <span>Journey<\/span>\n    <\/a>\n    <a href=\"#sec-eliana-themes\" class=\"tab-item\" onclick=\"activateBottomTab(this)\">\n      <span class=\"tab-icon-pill\" style=\"color:var(--gold);\">\u2726<\/span>\n      <span>Eliana<\/span>\n    <\/a>\n  <\/nav>\n\n  <!-- ========================================================================\n       SELF-CONTAINED INTERACTIVE SCRIPT\n       ======================================================================== -->\n  <script>\n    // 1. Live 4-Theme Switcher (Sacred, Shekinah, Ivory, Selah)\n    function switchTheme(themeName) {\n      document.documentElement.setAttribute('data-theme', themeName);\n      document.querySelectorAll('.theme-btn').forEach(btn => {\n        btn.classList.toggle('active', btn.getAttribute('data-t') === themeName);\n      });\n      ['sacred', 'shekinah', 'ivory', 'selah'].forEach(t => {\n        const card = document.getElementById('tcard-' + t);\n        if (card) card.classList.toggle('current-theme', t === themeName);\n      });\n    }\n\n    // 2. Text Scale & High Contrast Controls\n    const textScales = [1, 1.08, 1.16, 0.94];\n    let scaleIdx = 0;\n    function cycleTextScale() {\n      scaleIdx = (scaleIdx + 1) % textScales.length;\n      document.documentElement.style.setProperty('--text-scale', textScales[scaleIdx]);\n    }\n\n    function toggleHighContrast() {\n      const html = document.documentElement;\n      const isHigh = html.getAttribute('data-contrast') === 'high';\n      html.setAttribute('data-contrast', isHigh ? 'normal' : 'high');\n      document.getElementById('hc-btn').classList.toggle('active', !isHigh);\n    }\n\n    // 3. Home: Time-of-Day Greeting Cycle\n    const hours = [\n      'GOOD MORNING \u00b7 THURSDAY, NOVEMBER 19',\n      'GOOD AFTERNOON \u00b7 THURSDAY, NOVEMBER 19',\n      'GOOD EVENING \u00b7 THURSDAY, NOVEMBER 19',\n      'REST IN HIM \u00b7 THURSDAY NIGHT, NOVEMBER 19'\n    ];\n    let hourIdx = 0;\n    function cycleGreetingHour() {\n      hourIdx = (hourIdx + 1) % hours.length;\n      document.getElementById('home-greeting-line').textContent = hours[hourIdx];\n    }\n\n    // 4. Home: Sacred Word Day Stepper & More Drawer\n    const votdDays = [\n      {\n        label: 'Today',\n        ref: 'Galatians 2:20',\n        chain: 'Chain \u211614',\n        quote: '\u201cI have been crucified with Christ, and I no longer live, but Christ lives in me. And the life I now live in the body, I live by faith in the Son of God, who loved me and gave himself up for me.\u201d',\n        rootScript: '\u03c3\u03c5\u03bd\u03b5\u03c3\u03c4\u03b1\u03cd\u03c1\u03c9\u03bc\u03b1\u03b9',\n        rootMeta: '<strong>synestaur\u014dmai \u00b7 G4957<\/strong> \u00b7 Perf. Pass. Ind.<br/>\u201cCrucified together with \u2014 a completed past event with ongoing life today\u201d',\n        carry: 'Ask where you\u2019re still trying to run your life as though the old self were still in charge, rather than living out of the reality that Christ\u2019s love and self-giving for you is what defines you now.'\n      },\n      {\n        label: 'Yesterday',\n        ref: 'Psalm 27:8',\n        chain: 'Chain \u21167',\n        quote: '\u201cMy heart echoes Your own invitation back to You: \u2018Come look for My face.\u2019 It is Your face, Lord\u2014Your presence itself\u2014that I am seeking.\u201d',\n        rootScript: '\u05d1\u05b7\u05bc\u05e7\u05b0\u05bc\u05e9\u05c1\u05d5\u05bc \u05e4\u05b8\u05e0\u05b8\u05d9',\n        rootMeta: '<strong>baqq\u0259\u0161\u016b p\u0101n\u0101y \u00b7 H1245<\/strong> \u00b7 Piel Impv. Pl.<br/>\u201cSeek earnestly My face \u2014 God\u2019s open call answered in the first person\u201d',\n        carry: 'Before asking God to fix one pressing uncertainty today, pause ten seconds to seek His face first.'\n      }\n    ];\n    let votdIdx = 0;\n    function stepVotdDay(delta) {\n      votdIdx = (votdIdx + 1) % votdDays.length;\n      const d = votdDays[votdIdx];\n      document.getElementById('votd-day-label').textContent = d.label;\n      document.getElementById('votd-ref-text').textContent = d.ref;\n      document.getElementById('votd-chain-badge').textContent = d.chain;\n      document.getElementById('votd-quote-body').textContent = d.quote;\n      document.getElementById('votd-root-script').textContent = d.rootScript;\n      document.getElementById('votd-root-meta').innerHTML = d.rootMeta;\n      document.getElementById('votd-carry-text').textContent = d.carry;\n    }\n\n    function toggleVotdMore() {\n      const box = document.getElementById('votd-more-box');\n      const btn = document.getElementById('votd-more-btn');\n      const open = box.classList.toggle('open');\n      btn.textContent = open ? 'Less \u25b4' : 'More \u2014 Notice This \u00b7 Why It Matters \u25be';\n    }\n\n    function toggleStar(btn) {\n      btn.style.background = btn.style.background ? '' : 'var(--gold-wash)';\n    }\n\n    // 5. Home: Stateful Study Path Switcher\n    const paths = {\n      aliyah: {\n        col: 'Aliyah \u2014 The Ascent \u00b7 Chain \u21163',\n        title: 'Out of Egypt: The Fulfillment That Looks Backward',\n        desc: 'Resumed at Section 2: \u201cThe Sentence That Shouldn\u2019t Be There\u201d (Matthew 2:15 \u00b7 Hosea 11:1 \u00b7 Exodus 4:22).'\n      },\n      journal: {\n        col: 'Eliana\u2019s Journal \u00b7 Chapter 1',\n        title: 'Day 1: God\u2019s Unconditional Love (Romans 5:8)',\n        desc: 'Explores \u03c3\u03c5\u03bd\u03af\u03c3\u03c4\u03b7\u03c3\u03b9\u03bd (synist\u0113sin, present indicative): why the cross is standing present-tense evidence of God\u2019s love.'\n      },\n      foundations: {\n        col: 'The Foundations \u00b7 Manuscript Chain',\n        title: 'How the Words Reached You (Isaiah 40:8)',\n        desc: 'Scribes who counted letters by lamplight, Dead Sea scrolls sealed in desert jars, and the chain of custody you can inspect.'\n      }\n    };\n    function switchStudyPath(key, btn) {\n      const p = paths[key];\n      document.getElementById('home-study-collection').textContent = p.col;\n      document.getElementById('home-study-title').textContent = p.title;\n      document.getElementById('home-study-desc').textContent = p.desc;\n      document.querySelectorAll('.path-pill').forEach(b => b.classList.remove('active'));\n      if (btn) btn.classList.add('active');\n    }\n\n    // 6. Bible Reader (Read Mode): Translation Switcher, Aa Drawer, Inline Lens\n    const john3Translations = {\n      BSB: 'For God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life.',\n      KJV: 'For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.',\n      ASV: 'For God so loved the world, that he gave his only begotten Son, that whosoever believeth on him should not perish, but have eternal life.',\n      ELIANA: '\u2726 For God loved the world in this way: he gave his one-and-only Son, so that everyone who believes in him would not perish but have eternal life.'\n    };\n    function setReadVersion(ver, btn) {\n      document.getElementById('read-version-badge').textContent = ver === 'ELIANA' ? '\u2726' : ver;\n      document.getElementById('rv-16').innerHTML = '<span class=\"v-sup\">16<\/span>' + john3Translations[ver] + '<span class=\"inline-mark-star\">\u2726<\/span><span class=\"inline-mark-chain\">\u21163<\/span>';\n      btn.parentElement.querySelectorAll('.trans-chip').forEach(b => b.classList.remove('active'));\n      btn.classList.add('active');\n    }\n\n    function toggleAaDrawer(id, btn) {\n      document.getElementById(id).classList.toggle('open');\n      btn.classList.toggle('active');\n    }\n\n    function toggleOfflinePack(btn) {\n      btn.classList.toggle('active');\n      btn.textContent = btn.classList.contains('active') ? '\u2b07 Offline \u2713' : '\u2b07 Keep Offline';\n    }\n\n    function setReadLayout(mode) {\n      document.getElementById('btn-flowing').classList.toggle('active', mode === 'flowing');\n      document.getElementById('btn-vbv').classList.toggle('active', mode === 'vbv');\n    }\n\n    function setLineHeight(lh) {\n      document.querySelectorAll('.read-verse-line').forEach(el => { el.style.lineHeight = lh; });\n    }\n\n    function selectReadVerse(vNum, el) {\n      document.querySelectorAll('.read-verse-block').forEach(b => b.classList.remove('selected'));\n      el.classList.add('selected');\n      document.getElementById('vab-selected-label').textContent = 'John 3:' + vNum + ' Selected';\n    }\n\n    function toggleElianaLensInline() {\n      const lens = document.getElementById('read-inline-lens');\n      lens.style.display = lens.style.display === 'none' ? 'block' : 'none';\n    }\n\n    function toggleCompareBox() {\n      const box = document.getElementById('inline-compare-drawer');\n      box.style.display = box.style.display === 'none' ? 'block' : 'none';\n    }\n\n    function cycleVerseHighlight() {\n      const block = document.getElementById('rv-block-16');\n      block.style.borderColor = 'var(--azure)';\n    }\n\n    function promptQuickNote() {\n      const box = document.getElementById('journal-entry-box');\n      if (box) box.focus();\n    }\n\n    // 7. Study Mode Layer Toggles & Interactive Word Study Sheet\n    function toggleLayerClass(cls, btn) {\n      btn.classList.toggle('active');\n      const show = btn.classList.contains('active');\n      document.querySelectorAll('.' + cls).forEach(el => {\n        el.style.display = show ? '' : 'none';\n      });\n    }\n\n    const lexiconDB = {\n      bara: {\n        word: '\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0',\n        translit: 'b\u0101\u00b7r\u0101 \u00b7 Genesis 1:1',\n        strongs: 'Strong\u2019s H1254',\n        lemma: 'Lemma: \u05d1\u05b8\u05bc\u05e8\u05b8\u05d0 (b\u0101r\u0101\u2019)',\n        parsing: 'Verb \u00b7 Qal Perfect \u00b7 3rd Person Masculine Singular',\n        gloss: 'BSB gloss: \u201ccreated\u201d \u00b7 Subject in Qal/Niphal is exclusively God',\n        title: 'Eliana word study \u2014 from Genesis 1:1',\n        essay: 'In Hebrew, craftsmen shape existing clay or timber, but b\u0101r\u0101 is reserved exclusively for divine creation\u2014initiation without preexisting resistance. Notice that the same verb returns when David asks God to create a clean heart (Psalm 51:10).',\n        occs: ['Genesis 1:27', 'Psalm 51:10', 'Isaiah 40:26', 'Isaiah 43:1', 'Isaiah 65:17']\n      },\n      bereshit: {\n        word: '\u05d1\u05b0\u05bc\u05e8\u05b5\u05d0\u05e9\u05b4\u05c1\u05d9\u05ea',\n        translit: 'b\u0259\u00b7r\u00ea\u00b7\u0161\u00ee\u1e6f \u00b7 Genesis 1:1',\n        strongs: 'Strong\u2019s H7225',\n        lemma: 'Lemma: \u05e8\u05b5\u05d0\u05e9\u05b4\u05c1\u05d9\u05ea (r\u00ea\u2019\u0161\u00ee\u1e6f)',\n        parsing: 'Prep \u05d1\u05b0\u05bc + Noun Feminine Singular Construct',\n        gloss: 'BSB gloss: \u201cIn the beginning\u201d \u00b7 From r\u014d\u2019\u0161 (\u201chead, firstfruits, summit\u201d)',\n        title: 'Eliana word study \u2014 from Genesis 1:1',\n        essay: 'R\u00ea\u2019\u0161\u00ee\u1e6f means both the temporal beginning of time and the choicest \u201cfirstfruits\u201d of creation\u2014the exact background John echoes in John 1:1 (En arch\u0113).',\n        occs: ['Proverbs 8:22', 'Jeremiah 26:1', 'John 1:1']\n      },\n      elohim: {\n        word: '\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd',\n        translit: '\u2019\u0115\u00b7l\u014d\u00b7h\u00eem \u00b7 Genesis 1:1',\n        strongs: 'Strong\u2019s H430',\n        lemma: 'Lemma: \u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd (\u2019\u0115l\u014dh\u00eem)',\n        parsing: 'Noun \u00b7 Masculine Plural of Majesty (paired with singular verb b\u0101r\u0101)',\n        gloss: 'BSB gloss: \u201cGod\u201d \u00b7 Creator and Sovereign of the cosmos',\n        title: 'Eliana word study \u2014 from Genesis 1:1',\n        essay: 'Morphologically plural yet governed by the singular verb b\u0101r\u0101 (\u201cHe created\u201d), \u2019\u0114l\u014dh\u00eem expresses fullness of majesty and power in the One Creator.',\n        occs: ['Genesis 1:26', 'Deuteronomy 6:4', 'Psalm 19:1']\n      },\n      et_hashamayim: {\n        word: '\u05d0\u05b5\u05ea \u05d4\u05b7\u05e9\u05b8\u05bc\u05c1\u05de\u05b7\u05d9\u05b4\u05dd',\n        translit: '\u2019\u00ea\u1e6f ha\u0161\u00b7\u0161\u0101\u00b7ma\u00b7yim \u00b7 Genesis 1:1',\n        strongs: 'Strong\u2019s H853 + H8064',\n        lemma: 'Lemma: \u05e9\u05b8\u05c1\u05de\u05b7\u05d9\u05b4\u05dd (\u0161\u0101mayim)',\n        parsing: 'Direct Object Marker \u05d0\u05b5\u05ea + Def. Article + Noun Masculine Dual',\n        gloss: 'BSB gloss: \u201cthe heavens\u201d',\n        title: 'Eliana word study \u2014 from Genesis 1:1',\n        essay: 'Paired with \u201cthe earth,\u201d \u201cthe heavens and the earth\u201d is a Hebrew merism meaning the entire ordered universe from summit to soil.',\n        occs: ['Genesis 2:1', 'Psalm 19:1', 'Isaiah 65:17']\n      },\n      veet_haaretz: {\n        word: '\u05d5\u05b0\u05d0\u05b5\u05ea \u05d4\u05b8\u05d0\u05b8\u05e8\u05b6\u05e5',\n        translit: 'w\u0259\u00b7\u2019\u00ea\u1e6f h\u0101\u00b7\u2019\u0101\u00b7re\u1e63 \u00b7 Genesis 1:1',\n        strongs: 'Strong\u2019s H776',\n        lemma: 'Lemma: \u05d0\u05b6\u05e8\u05b6\u05e5 (\u2019ere\u1e63)',\n        parsing: 'Conj \u05d5\u05b0 + Object Marker \u05d0\u05b5\u05ea + Def. Article + Noun Feminine Singular',\n        gloss: 'BSB gloss: \u201cand the earth\u201d',\n        title: 'Eliana word study \u2014 from Genesis 1:1',\n        essay: 'The tangible ground prepared by God to become a temple-home where heaven and earth meet.',\n        occs: ['Genesis 1:2', 'Psalm 24:1', 'Revelation 21:1']\n      },\n      monogene: {\n        word: '\u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6',\n        translit: 'monogen\u0113 \u00b7 John 3:16',\n        strongs: 'Strong\u2019s G3439',\n        lemma: 'Lemma: \u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u03ae\u03c2 (monogen\u0113s)',\n        parsing: 'Adjective \u00b7 Accusative Singular Masculine',\n        gloss: 'BSB gloss: \u201cone and only\u201d \u00b7 Unique, one-of-a-kind, beloved without peer',\n        title: 'Eliana word study \u2014 from John 3:16',\n        essay: 'Joining monos (\u201conly\u201d) + genos (\u201ckind\u201d), monogen\u0113s translates Hebrew y\u0101\u1e25\u00eed (Isaac in Gen 22:2)\u2014signaling the Father\u2019s unrepeatable, treasured Son.',\n        occs: ['John 1:14', 'John 1:18', 'John 3:18', 'Hebrews 11:17', '1 John 4:9']\n      },\n      houtos: {\n        word: '\u039f\u1f55\u03c4\u03c9\u03c2',\n        translit: 'Hout\u014ds \u00b7 John 3:16',\n        strongs: 'Strong\u2019s G3779',\n        lemma: 'Lemma: \u03bf\u1f55\u03c4\u03c9\u03c2 (hout\u014ds)',\n        parsing: 'Adverb of Manner',\n        gloss: 'BSB gloss: \u201cso / in this way\u201d',\n        title: 'Eliana word study \u2014 from John 3:16',\n        essay: 'Points directly back to verse 14 (\u201cJust as Moses lifted up the serpent\u2026 in this way God loved the world\u201d).',\n        occs: ['John 3:14', 'Matthew 5:16', 'Romans 5:12']\n      },\n      egapesen: {\n        word: '\u1f20\u03b3\u03ac\u03c0\u03b7\u03c3\u03b5\u03bd',\n        translit: '\u0113gap\u0113sen \u00b7 John 3:16',\n        strongs: 'Strong\u2019s G25',\n        lemma: 'Lemma: \u1f00\u03b3\u03b1\u03c0\u03ac\u03c9 (agapa\u014d)',\n        parsing: 'Verb \u00b7 Aorist Active Indicative \u00b7 3rd Person Singular',\n        gloss: 'BSB gloss: \u201cloved\u201d \u00b7 Covenant self-giving love summed up in one decisive act',\n        title: 'Eliana word study \u2014 from John 3:16',\n        essay: 'The constative aorist gathers the whole eternal love of God into the historical gift of the Son.',\n        occs: ['John 13:1', 'Galatians 2:20', 'Ephesians 5:2', '1 John 4:10']\n      },\n      ton_kosmon: {\n        word: '\u03c4\u1f78\u03bd \u03ba\u03cc\u03c3\u03bc\u03bf\u03bd',\n        translit: 'ton kosmon \u00b7 John 3:16',\n        strongs: 'Strong\u2019s G2889',\n        lemma: 'Lemma: \u03ba\u03cc\u03c3\u03bc\u03bf\u03c2 (kosmos)',\n        parsing: 'Noun \u00b7 Accusative Singular Masculine',\n        gloss: 'BSB gloss: \u201cthe world\u201d',\n        title: 'Eliana word study \u2014 from John 3:16',\n        essay: 'In John, kosmos is not merely big; it is estranged humanity that turns from the light (John 1:10)\u2014yet it is the very object of God\u2019s love.',\n        occs: ['John 1:10', 'John 1:29', 'John 3:17']\n      },\n      edoken: {\n        word: '\u1f14\u03b4\u03c9\u03ba\u03b5\u03bd',\n        translit: 'ed\u014dken \u00b7 John 3:16',\n        strongs: 'Strong\u2019s G1325',\n        lemma: 'Lemma: \u03b4\u03af\u03b4\u03c9\u03bc\u03b9 (did\u014dmi)',\n        parsing: 'Verb \u00b7 Aorist Active Indicative \u00b7 3rd Person Singular',\n        gloss: 'BSB gloss: \u201cHe gave\u201d',\n        title: 'Eliana word study \u2014 from John 3:16',\n        essay: 'More than sending an envoy (apestalken in v.17), ed\u014dken is sacrificial offering.',\n        occs: ['John 6:51', 'Galatians 1:4', '1 Timothy 2:6']\n      },\n      zoen_aionion: {\n        word: '\u03b6\u03c9\u1f74\u03bd \u03b1\u1f30\u03ce\u03bd\u03b9\u03bf\u03bd',\n        translit: 'z\u014d\u0113n ai\u014dnion \u00b7 John 3:16',\n        strongs: 'Strong\u2019s G2222 + G166',\n        lemma: 'Lemma: \u03b6\u03c9\u1f74 \u03b1\u1f30\u03ce\u03bd\u03b9\u03bf\u03c2',\n        parsing: 'Noun + Adjective \u00b7 Accusative Singular Feminine',\n        gloss: 'BSB gloss: \u201ceternal life\u201d \u00b7 The life of the age to come begun now',\n        title: 'Eliana word study \u2014 from John 3:16',\n        essay: 'Literally \u201clife of the age (to come),\u201d shared in the present wherever one trusts the Son (John 17:3).',\n        occs: ['John 3:36', 'John 5:24', 'John 17:3']\n      },\n      systauroo: {\n        word: '\u03c3\u03c5\u03bd\u03b5\u03c3\u03c4\u03b1\u03cd\u03c1\u03c9\u03bc\u03b1\u03b9',\n        translit: 'synestaur\u014dmai \u00b7 Galatians 2:20',\n        strongs: 'Strong\u2019s G4957',\n        lemma: 'Lemma: \u03c3\u03c5\u03c3\u03c4\u03b1\u03c5\u03c1\u03cc\u03c9 (systauro\u014d)',\n        parsing: 'Verb \u00b7 Perfect Passive Indicative \u00b7 1st Person Singular',\n        gloss: 'BSB gloss: \u201cI have been crucified with\u201d',\n        title: 'Eliana word study \u2014 from Galatians 2:20',\n        essay: 'The Greek perfect tense denotes a completed past event whose transformative reality stands permanently in the present.',\n        occs: ['Matthew 27:44', 'Romans 6:6']\n      }\n    };\n\n    function loadWordInSheet(key, btn) {\n      const data = lexiconDB[key] || lexiconDB.bara;\n      document.getElementById('ws-word').textContent = data.word;\n      document.getElementById('ws-translit').textContent = data.translit;\n      document.getElementById('ws-strongs').textContent = data.strongs;\n      document.getElementById('ws-lemma').textContent = data.lemma;\n      document.getElementById('ws-parsing').textContent = data.parsing;\n      document.getElementById('ws-gloss').textContent = data.gloss;\n      document.getElementById('ws-essay-title').textContent = data.title;\n      document.getElementById('ws-essay-body').textContent = data.essay;\n      const occBox = document.getElementById('ws-occurrences');\n      occBox.innerHTML = data.occs.map(r => `<button class=\"occ-chip\" onclick=\"alert('Opens ${r} in Bible Reader')\">${r}<\/button>`).join('');\n      if (btn) {\n        btn.parentElement.querySelectorAll('.orig-word-pill').forEach(p => p.classList.remove('active'));\n        btn.classList.add('active');\n      }\n    }\n\n    // 8. Sanctuary Stillness, Prayer & Eliana Chat Streaming\n    let stillnessOn = false;\n    function toggleStillnessSession() {\n      stillnessOn = !stillnessOn;\n      document.getElementById('stillness-orb-label').textContent = stillnessOn ? 'Inhale 4s\u2026' : 'Breathe';\n      document.getElementById('stillness-phrase').textContent = stillnessOn\n        ? '\u201cBe still, and know that I am God.\u201d \u2014 Psalm 46:10'\n        : '\u201cPeace to you in the middle of your day.\u201d';\n    }\n\n    const prayers = [\n      '\u201cFather YHWH, where I have been carrying today as if everything depended on my own strength, quiet my heart in the truth that Christ lives in me. Let His self-giving love be my steadiness tonight. Amen.\u201d',\n      '\u201cHeavenly Father, Great YHWH, You are El Roi\u2014the God who sees me (Genesis 16:13). Hold our family in Your peace tonight and teach our hearts to rest in Your unhurried answer. Amen.\u201d'\n    ];\n    let pIdx = 0;\n    function generateNewPrayer() {\n      pIdx = (pIdx + 1) % prayers.length;\n      document.getElementById('prayer-text-box').textContent = prayers[pIdx];\n    }\n    function cycleCuratedPrayer() { generateNewPrayer(); }\n\n    function streamElianaFollowUp() {\n      const box = document.getElementById('eliana-chat-stream');\n      const full = '\u2726 Eliana: Notice also how Chain \u21163 links this to Hosea 11:1 and Matthew 2:15 (\u201cOut of Egypt I called My Son\u201d). What Israel walked through as a nation, the one-and-only Son walks through in person\u2014carrying us home.';\n      box.textContent = '';\n      let i = 0;\n      const timer = setInterval(() => {\n        box.textContent += full.charAt(i);\n        i++;\n        if (i >= full.length) clearInterval(timer);\n      }, 14);\n    }\n\n    function activateBottomTab(el) {\n      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));\n      el.classList.add('active');\n    }\n  <\/script>\n<\/body>\n<\/html>\n<!-- Vision: Now that we have seen the real app, what was missing was not more features\u2014it was tactile architectural unity: turning flat card stacks into an Illuminated Polyglot Sanctuary where one semantic language connects everything (Gold for \u2726 Eliana's voice, Azure for tappable Hebrew/Greek roots, Cinnabar for numbered Chains \u2116, and Verdigris for Stillness). Home becomes a serene Morning Office (Continue -> Sacred Word with an inline original-language root peek -> Active Study Path -> Sanctuary Rooms), the Bible Reader bridges effortless printed-book reading (with inline \u2726 Eliana Lens) and a 4-layer Hebrew/Greek polyglot score, and the four sharpened themes (Sacred, Shekinah, Ivory, Selah) elevate every surface for 2027. -->\n"}, {"letter": "B", "seat": "neon", "file": "mockup.html", "html": "<!-- Gemini 4 Neon -->\n<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"sanctuary\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n<title>Eliana's Rhythm \u2014 2027 Edition<\/title>\n<style>\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     ELIANA'S RHYTHM \u00b7 2027 ILLUMINATED EDITION\n     Five authored themes, zero alpha-muddied golds, editorial book craft.\n     \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n  :root {\n    --font-serif: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, 'Baskerville', Georgia, 'Times New Roman', serif;\n    --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;\n    --font-hebrew: 'SBL Hebrew', 'Ezra SIL', 'Times New Roman', 'Arial Hebrew', serif;\n    --font-greek: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Times New Roman', Georgia, serif;\n\n    --radius-sm: 8px;\n    --radius-md: 14px;\n    --radius-lg: 20px;\n    --radius-xl: 26px;\n    --transition: 240ms cubic-bezier(0.22, 1, 0.36, 1);\n\n    /* Reader live controls */\n    --reader-size: 18px;\n    --reader-leading: 1.72;\n  }\n\n  /* \u2500\u2500 THEME 1: SANCTUARY (Evolved Sacred \u2014 Midnight Indigo & Antique Gold) \u2500\u2500 */\n  [data-theme=\"sanctuary\"] {\n    --bg: #080C15;\n    --bg-outer: #04060B;\n    --surface: #101624;\n    --surface-raised: #161F31;\n    --surface-inset: #131B2B;\n    --text: #EDE8DC;\n    --text-secondary: #9EA5B6;\n    --text-tertiary: #6C7487;\n    --gold: #D8B458;\n    --gold-bright: #E8C973;\n    --gold-muted: #A6883B;\n    --on-gold: #0B0E17;\n    --gold-soft: rgba(216, 180, 88, 0.12);\n    --gold-glow: rgba(216, 180, 88, 0.22);\n    --hairline: rgba(237, 232, 220, 0.09);\n    --hairline-gold: rgba(216, 180, 88, 0.30);\n    --nav-bg: rgba(11, 16, 27, 0.92);\n    --sheet-scrim: rgba(3, 5, 10, 0.72);\n    --shadow-card: none;\n    --hl-amber: rgba(216, 180, 88, 0.20);\n    --hl-olive: rgba(126, 174, 128, 0.20);\n    --hl-blue: rgba(114, 164, 212, 0.20);\n    --hl-rose: rgba(210, 126, 134, 0.20);\n    --book-a-bg: linear-gradient(145deg, #1A2236, #0E1422);\n    --book-b-bg: linear-gradient(145deg, #241E18, #14110D);\n    --book-c-bg: linear-gradient(145deg, #16252B, #0D161A);\n  }\n\n  /* \u2500\u2500 THEME 2: SHEKINAH (Refined OLED \u2014 True Black & 22k Forged Gold) \u2500\u2500 */\n  [data-theme=\"shekinah\"] {\n    --bg: #000000;\n    --bg-outer: #000000;\n    --surface: #0B0B0C;\n    --surface-raised: #141416;\n    --surface-inset: #101012;\n    --text: #EAE6DF;\n    --text-secondary: #A4A098;\n    --text-tertiary: #6D6A63;\n    --gold: #E8B838;\n    --gold-bright: #F7D15E;\n    --gold-muted: #B68F26;\n    --on-gold: #120D00;\n    --gold-soft: rgba(232, 184, 56, 0.12);\n    --gold-glow: rgba(232, 184, 56, 0.24);\n    --hairline: rgba(255, 255, 255, 0.09);\n    --hairline-gold: rgba(232, 184, 56, 0.34);\n    --nav-bg: rgba(7, 7, 8, 0.94);\n    --sheet-scrim: rgba(0, 0, 0, 0.80);\n    --shadow-card: none;\n    --hl-amber: rgba(232, 184, 56, 0.22);\n    --hl-olive: rgba(120, 178, 124, 0.22);\n    --hl-blue: rgba(110, 166, 218, 0.22);\n    --hl-rose: rgba(214, 122, 130, 0.22);\n    --book-a-bg: linear-gradient(145deg, #161618, #09090A);\n    --book-b-bg: linear-gradient(145deg, #1A160E, #0B0906);\n    --book-c-bg: linear-gradient(145deg, #141618, #08090A);\n  }\n\n  /* \u2500\u2500 THEME 3: IVORY (Refined Alabaster \u2014 Limestone Paper, Ink & Gold Leaf) \u2500\u2500 */\n  [data-theme=\"ivory\"] {\n    --bg: #F6F4EE;\n    --bg-outer: #E9E5DC;\n    --surface: #FFFFFF;\n    --surface-raised: #FFFFFF;\n    --surface-inset: #F6EFE0;\n    --text: #1E1C18;\n    --text-secondary: #5D5A52;\n    --text-tertiary: #8B877D;\n    --gold: #8A6612;\n    --gold-bright: #A47B1B;\n    --gold-muted: #B79238;\n    --on-gold: #FFFFFF;\n    --gold-soft: rgba(138, 102, 18, 0.09);\n    --gold-glow: rgba(138, 102, 18, 0.16);\n    --hairline: rgba(30, 28, 24, 0.09);\n    --hairline-gold: rgba(138, 102, 18, 0.30);\n    --nav-bg: rgba(249, 247, 242, 0.94);\n    --sheet-scrim: rgba(25, 22, 16, 0.45);\n    --shadow-card: 0 8px 26px -10px rgba(45, 36, 18, 0.10), 0 1px 3px rgba(45, 36, 18, 0.05);\n    --hl-amber: rgba(224, 182, 76, 0.28);\n    --hl-olive: rgba(126, 178, 128, 0.24);\n    --hl-blue: rgba(114, 164, 214, 0.24);\n    --hl-rose: rgba(212, 124, 134, 0.24);\n    --book-a-bg: linear-gradient(145deg, #27221B, #1A1611);\n    --book-b-bg: linear-gradient(145deg, #3D3120, #282014);\n    --book-c-bg: linear-gradient(145deg, #263136, #192125);\n  }\n\n  /* \u2500\u2500 THEME 4: CRISP PRINT (Fresh Gallery Paper, Archival Ink & Gilt) \u2500\u2500 */\n  [data-theme=\"crisp\"] {\n    --bg: #F4F6F8;\n    --bg-outer: #E5E9EE;\n    --surface: #FFFFFF;\n    --surface-raised: #FFFFFF;\n    --surface-inset: #EFF2F5;\n    --text: #171A1F;\n    --text-secondary: #565E69;\n    --text-tertiary: #828B97;\n    --gold: #7E5E10;\n    --gold-bright: #987318;\n    --gold-muted: #AE8B34;\n    --on-gold: #FFFFFF;\n    --gold-soft: rgba(126, 94, 16, 0.08);\n    --gold-glow: rgba(126, 94, 16, 0.14);\n    --hairline: rgba(23, 26, 31, 0.09);\n    --hairline-gold: rgba(126, 94, 16, 0.28);\n    --nav-bg: rgba(248, 249, 251, 0.94);\n    --sheet-scrim: rgba(16, 20, 26, 0.45);\n    --shadow-card: 0 8px 24px -10px rgba(20, 28, 38, 0.09), 0 1px 2px rgba(20, 28, 38, 0.05);\n    --hl-amber: rgba(218, 178, 72, 0.26);\n    --hl-olive: rgba(118, 170, 122, 0.22);\n    --hl-blue: rgba(102, 156, 210, 0.22);\n    --hl-rose: rgba(208, 118, 128, 0.22);\n    --book-a-bg: linear-gradient(145deg, #20252E, #13171D);\n    --book-b-bg: linear-gradient(145deg, #322B20, #201B14);\n    --book-c-bg: linear-gradient(145deg, #212E36, #141D23);\n  }\n\n  /* \u2500\u2500 THEME 5: SELAH (New 2027 Signature \u2014 Still Waters Teal & Abyssal Slate) \u2500\u2500 */\n  [data-theme=\"selah\"] {\n    --bg: #0A141C;\n    --bg-outer: #050B10;\n    --surface: #111F2A;\n    --surface-raised: #172938;\n    --surface-inset: #132431;\n    --text: #E6ECEE;\n    --text-secondary: #92A7B4;\n    --text-tertiary: #637987;\n    --gold: #6BB8B3;\n    --gold-bright: #8BD2CD;\n    --gold-muted: #4C8F8B;\n    --on-gold: #06131A;\n    --gold-soft: rgba(107, 184, 179, 0.13);\n    --gold-glow: rgba(107, 184, 179, 0.24);\n    --hairline: rgba(230, 236, 238, 0.09);\n    --hairline-gold: rgba(107, 184, 179, 0.34);\n    --nav-bg: rgba(10, 20, 28, 0.93);\n    --sheet-scrim: rgba(4, 10, 15, 0.76);\n    --shadow-card: none;\n    --hl-amber: rgba(216, 188, 106, 0.20);\n    --hl-olive: rgba(107, 184, 179, 0.22);\n    --hl-blue: rgba(114, 174, 218, 0.22);\n    --hl-rose: rgba(208, 134, 146, 0.20);\n    --book-a-bg: linear-gradient(145deg, #172D3B, #0D1B24);\n    --book-b-bg: linear-gradient(145deg, #1A2A2D, #0E181A);\n    --book-c-bg: linear-gradient(145deg, #1C2636, #101722);\n  }\n\n  /* \u2500\u2500 RESET & SHELL \u2500\u2500 */\n  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n\n  html, body {\n    margin: 0;\n    padding: 0;\n    background: var(--bg-outer);\n    color: var(--text);\n    font-family: var(--font-sans);\n    font-size: 15px;\n    line-height: 1.5;\n    -webkit-font-smoothing: antialiased;\n    transition: background var(--transition), color var(--transition);\n  }\n\n  .app-shell {\n    width: 100%;\n    max-width: 390px;\n    min-height: 100vh;\n    margin: 0 auto;\n    background: var(--bg);\n    position: relative;\n    padding-bottom: 92px;\n    transition: background var(--transition), color var(--transition);\n    overflow-x: hidden;\n  }\n\n  @media (min-width: 440px) {\n    body { padding: 18px 0 24px; }\n    .app-shell {\n      border-radius: 36px;\n      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--hairline);\n      min-height: 844px;\n    }\n  }\n\n  button {\n    font-family: inherit;\n    color: inherit;\n    background: none;\n    border: none;\n    cursor: pointer;\n    padding: 0;\n  }\n\n  /* \u2500\u2500 LIVE THEME BAR (Always reachable, unobtrusive architectural ribbon) \u2500\u2500 */\n  .theme-ribbon {\n    position: sticky;\n    top: 0;\n    z-index: 40;\n    height: 44px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 4px;\n    padding: 0 12px;\n    background: var(--nav-bg);\n    backdrop-filter: blur(18px);\n    -webkit-backdrop-filter: blur(18px);\n    border-bottom: 1px solid var(--hairline);\n    transition: transform 240ms ease, opacity 240ms ease, background var(--transition);\n  }\n\n  .app-shell.immersive .theme-ribbon,\n  .app-shell.immersive .reader-topbar,\n  .app-shell.immersive .bottom-nav {\n    opacity: 0;\n    pointer-events: none;\n    transform: translateY(-100%);\n  }\n  .app-shell.immersive .bottom-nav { transform: translate(-50%, 120%); }\n\n  .theme-pill {\n    flex: 1;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 5px;\n    padding: 5px 4px;\n    border-radius: 99px;\n    font-size: 10.5px;\n    font-weight: 500;\n    letter-spacing: 0.01em;\n    color: var(--text-secondary);\n    border: 1px solid transparent;\n    transition: all 180ms ease;\n    white-space: nowrap;\n  }\n  .theme-pill:hover { color: var(--text); }\n  .theme-pill.active {\n    color: var(--gold);\n    background: var(--gold-soft);\n    border-color: var(--hairline-gold);\n    font-weight: 600;\n  }\n  .theme-dot {\n    width: 8px;\n    height: 8px;\n    border-radius: 50%;\n    flex-shrink: 0;\n    border: 1px solid rgba(128,128,128,0.35);\n  }\n\n  /* \u2500\u2500 SCREEN VIEWS \u2500\u2500 */\n  .screen { display: none; animation: fadeIn 220ms ease; }\n  .screen.active { display: block; }\n  @keyframes fadeIn {\n    from { opacity: 0; transform: translateY(4px); }\n    to { opacity: 1; transform: translateY(0); }\n  }\n\n  /* \u2500\u2500 TYPOGRAPHY HELPERS \u2500\u2500 */\n  .serif { font-family: var(--font-serif); }\n  .eyebrow {\n    font-size: 10.5px;\n    font-weight: 600;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--gold);\n  }\n  .muted { color: var(--text-secondary); }\n  .hairline-rule {\n    height: 1px;\n    background: var(--hairline);\n    border: none;\n    margin: 0;\n  }\n\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     TAB 1: HOME \u2014 THE MORNING OFFICE\n     \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n  .home-pad { padding: 14px 18px 24px; }\n\n  .masthead {\n    position: relative;\n    text-align: center;\n    padding: 8px 0 18px;\n  }\n  .masthead-actions {\n    position: absolute;\n    top: 4px;\n    right: 0;\n    display: flex;\n    align-items: center;\n    gap: 2px;\n  }\n  .icon-btn {\n    width: 36px;\n    height: 36px;\n    border-radius: 50%;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    color: var(--text-secondary);\n    transition: background 160ms ease, color 160ms ease;\n  }\n  .icon-btn:hover, .icon-btn.active {\n    background: var(--gold-soft);\n    color: var(--gold);\n  }\n  .wordmark {\n    font-family: var(--font-serif);\n    font-size: 27px;\n    font-weight: 400;\n    letter-spacing: 0.24em;\n    padding-left: 0.24em;\n    color: var(--gold);\n    line-height: 1.1;\n    margin: 0;\n  }\n  .wordmark-ornament {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 10px;\n    margin: 7px 0 6px;\n  }\n  .wordmark-ornament .line {\n    width: 32px;\n    height: 1px;\n    background: linear-gradient(90deg, transparent, var(--gold-muted), transparent);\n  }\n  .wordmark-ornament .diamond {\n    width: 4px;\n    height: 4px;\n    background: var(--gold);\n    transform: rotate(45deg);\n    opacity: 0.85;\n  }\n  .wordmark-sub {\n    font-family: var(--font-serif);\n    font-style: italic;\n    font-size: 12.5px;\n    letter-spacing: 0.08em;\n    color: var(--text-secondary);\n    margin: 0;\n  }\n  .day-ribbon {\n    margin-top: 10px;\n    font-size: 10.5px;\n    font-weight: 600;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--text-tertiary);\n  }\n  .day-ribbon span { color: var(--gold); }\n\n  /* Compact Continue Bookmark */\n  .bookmark-strip {\n    width: 100%;\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    padding: 11px 14px;\n    margin-bottom: 16px;\n    background: var(--surface);\n    border: 1px solid var(--hairline);\n    border-radius: var(--radius-md);\n    box-shadow: var(--shadow-card);\n    text-align: left;\n    transition: border-color 180ms ease, transform 140ms ease;\n  }\n  .bookmark-strip:active { transform: scale(0.99); }\n  .bookmark-strip:hover { border-color: var(--hairline-gold); }\n  .bookmark-icon {\n    width: 30px;\n    height: 30px;\n    border-radius: 9px;\n    background: var(--gold-soft);\n    color: var(--gold);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n  }\n  .bookmark-meta { flex: 1; min-width: 0; }\n  .bookmark-kicker {\n    font-size: 10px;\n    font-weight: 600;\n    letter-spacing: 0.11em;\n    text-transform: uppercase;\n    color: var(--text-tertiary);\n  }\n  .bookmark-ref {\n    font-family: var(--font-serif);\n    font-size: 16px;\n    color: var(--text);\n    line-height: 1.25;\n  }\n  .bookmark-time {\n    font-size: 11.5px;\n    color: var(--text-secondary);\n    white-space: nowrap;\n  }\n\n  /* Illuminated Sacred Word Folio */\n  .folio-card {\n    background: var(--surface);\n    border: 1px solid var(--hairline-gold);\n    border-radius: var(--radius-xl);\n    padding: 20px 20px 16px;\n    box-shadow: var(--shadow-card);\n    position: relative;\n    overflow: hidden;\n  }\n  .folio-card::before {\n    content: \"\";\n    position: absolute;\n    top: 0;\n    left: 24px;\n    right: 24px;\n    height: 1px;\n    background: linear-gradient(90deg, transparent, var(--gold), transparent);\n    opacity: 0.6;\n  }\n  .folio-top {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n    margin-bottom: 14px;\n  }\n  .day-stepper {\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    background: var(--surface-inset);\n    border: 1px solid var(--hairline);\n (--gold);\n    margin: 0 0 5px;\n  }\n  .folio-body {\n    font-size: 14px;\n    line-height: 1.62;\n    color: var(--text);\n    opacity: 0.9;\n    margin: 0;\n  }\n  .folio-expandable {\n    display: none;\n    margin-top: 14px;\n    padding-top: 14px;\n    border-top: 1px solid var(--hairline);\n    animation: fadeIn 200ms ease;\n  }\n  .folio-expandable.open { display: block; }\n  .folio-expandable .field-block + .field-block { margin-top: 14px; }\n\n  .expand-trigger {\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    margin-top: 10px;\n    padding: 4px 0;\n    font-size: 12px;\n    font-weight: 600;\n    color: var(--gold);\n  }\n\n  .folio-cta-row {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 10px;\n    margin-top: 16px;\n  }\n  .btn-primary {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    gap: 6px;\n    height: 42px;\n    padding: 0 14px;\n    border-radius: 12px;\n    background: var(--gold);\n    color: var(--on-gold);\n    font-size: 13px;\n    font-weight: 600;\n    letter-spacing: 0.01em;\n    transition: opacity 150ms ease, transform 120ms ease;\n  }\n  .btn-primary:active { transform: scale(0.98); }\n  .btn-ghost {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    gap: 6px;\n    height: 42px;\n    padding: 0 14px;\n    border-radius: 12px;\n    background: transparent;\n    border: 1px solid var(--hairline-gold);\n    color: var(--text);\n    font-size: 13px;\n    font-weight: 500;\n    transition: background 150ms ease, transform 120ms ease;\n  }\n  .btn-ghost:hover { background: var(--gold-soft); }\n  .btn-ghost:active { transform: scale(0.98); }\n\n  .folio-quiet-bar {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    margin-top: 14px;\n    padding-top: 11px;\n    border-top: 1px solid var(--hairline);\n  }\n  .quiet-action {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center; letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--gold);\n  }\n  .study-spine-title {\n    font-family: var(--font-serif);\n    font-size: 17px;\n    color: var(--text);\n    margin: 2px 0;\n  }\n  .study-spine-sub {\n    font-size: 12.5px;\n    color: var(--text-secondary);\n    line-height: 1.4;\n  }\n\n  /* Quiet Stillness Row */\n  .stillness-strip {\n    width: 100%;\n    margin-top: 12px;\n    display: flex;\n    align-items: center;\n    gap: 14px;\n    padding: 13px 16px;\n    background: var(--surface);\n    border: 1px solid var(--hairline);\n    border-radius: var(--radius-lg);\n    box-shadow: var(--shadow-card);\n    text-align: left;\n  }\n  .stillness-strip:hover { border-color: var(--hairline-gold); }\n  .pulse-orb {\n    width: 34px;\n    height: 34px;\n    border-radius: 50%;\n    background: radial-gradient(circle, var(--gold) 0%, var(--gold-soft) 58%, transparent 72%);\n    position: relative;\n    flex-shrink: 0;\n    animation: gentlePulse 5s ease-in-out infinite;\n  }\n  @keyframes gentlePulse {\n    0%, 100% { transform: scale(0.88); opacity: 0.78; }\n    50% { transform: scale(1.08); opacity: 1; }\n  }\n\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     TAB 2: BIBLE READER (BOTH READ & STUDY MODES)\n     \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u align-items: center;\n    justify-content: space-between;\n    gap: 10px;\n  }\n  .aa-row + .aa-row { margin-top: 10px; }\n  .aa-label {\n    font-size: 11px;\n    font-weight: 600;\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    color: var(--text-secondary);\n  }\n  .seg-group {\n    display: inline-flex;\n    background: var(--surface-inset);\n    border: 1px solid var(--hairline);\n    border-radius: 10px;\n    padding: 2px;\n    gap: 2px;\n  }\n  .seg-opt {\n    padding: 4px 10px;\n    border-radius: 8px;\n    font-size: 11.5px;\n    font-weight: 500;\n    color: var(--text-secondary);\n  }\n  .seg-opt.active {\n    background: var(--gold-soft);\n    color: var(--gold);\n    font-weight: 600;\n  }\n\n  /* Passage Container */\n  .reader-canvas {\n    padding: 22px 22px 120px;\n  }\n  .chapter-ornament {\n    text-align: center;\n    margin-bottom: 24px;\n  }\n  .chapter-book-label {\n    font-size: 11px;\n    font-weight: 600;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--gold);\n  }\n  .chapter-num-display {\n    font-family: var(--font-serif);\n    font-size: 42px;\n    font-weight: 400;\n    line-height: 1.05;\n    color: var(--text);\n    margin: 2px 0 4px;\n  }\n  .chapter-subtitle {\n    font-family: var(--font-serif);\n    font-style: italic;\n    font-size: 13.5px;\n    color: var(--text-secondary);\n  }\n\n  /* READ MODE \u2014 Heirloom Printed Bible */\n  .read-prose {\n    font-family: var(--font-serif);\n    font-size: var(--reader-size);\n    line-height: var(--reader-leading);\n    color: var(--text);\n  }\n  .read-prose.flowing .v-unit { display: inline; }\n  .read-prose.vbv .v-unit {\n    display: block;\n    margin-bottom: 12px;\n  }\n  .v-span {\n    border-radius: 5px;\n    padding: 1px 2px;\n    cursor: pointer;\n    transition: background 150ms ease;\n  }\n  .v-span:hover { background: var(--gold-soft); }\n  .v-span.selected {\n    background: var(--gold-soft);\n    box-shadow: 0 2px 0 0 var(--gold-muted);\n  }\n  .v-span.hl-amber { background: var(--hl-amber); }\n  .v-span.hl-olive { background: var(--hl-olive); }\n  .v-span.hl-blue  { background: var(--hl-blue); }\n  .v-span.hl-rose  { background: var(--hl-rose); }\n\n  .v-num {\n    font-family: var(--font-sans);\n    font-size: 0.64em;\n    font-weight: 700;\n    color: var(--gold);\n    vertical-align: super;\n    margin-right: 3px;\n    margin-left: 3px;\n    user-select: none;\n  }\n  .v-star {\n    font-size: 0.65em;\n    color: var(--gold-muted);\n    vertical-align: super;\n    margin-right: 2px;\n    opacity: 0.85;\n  }\n  .hide-marks .v-star { display: none; }\n  .chapter-dropcap {\n    float: left;\n    font-family: var(--font-serif);\n    font-size: 3.1em;\n    line-height: 0.84;\n    padding: 4px 8px 0 0;\n    color: var(--gold);\n  }\n\n  /* Inline Lens drawer inside Read Mode */\n  .inline-lens-card {\n    display: block;\n    margin: 14px 0 18px;\n    padding: 14px 16px;\n    background: var(--surface);\n    border: 1px solid var(--hairline-gold);\n    border-left: 2.5px solid var(--gold);\n    border-radius: var(--radius-md);\n    font-family: var(--font-sans);\n    animation: fadeIn 200ms ease;\n  }\n  .inline-lens-head {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    margin-bottom: 8px;\n  }\n\n  /* STUDY MODE \u2014 Architectural Interlinear Spreads */\n  .study-spread {\n    padding: 20px 0 22px;\n    border-top: 1px solid var(--hairline);\n  }\n  .study-spread:first-child { border-top: none; padding-top: 4px; }\n  .study-head {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n    margin-bottom: 10px;\n  }\n  .study-vnum {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n  }\n  .study-vnum-badge {\n    font-family: var(--font-serif);\n    font-size: 16px;\n    font-weight: 600;\n    color: var(--gold);\n  }\n  .study-open-link {\n    font-size: 11.5px;\n    font-weight: 600;\n    color: var(--gold);\n    display: inline-flex;\n    align-items: center;\n    gap: 3px;\n    padding: 3px 0;\n  }\n\n  .study-eliana-line {\n    display: flex;\n    align-items: flex-start;\n    gap: 8px;\n    margin-bottom: 6px;\n  }\n  .study-spark {\n    color: var(--gold);\n    font-size: 13px;\n    line-height: 1.8;\n    flex-shrink: 0;\n  }\n  .study-rendering {\n    font-family: var(--font-serif);\n    font-size: calc(var(--reader-size) + 0.5px);\n    line-height: 1.52;\n    color: var(--text);\n    margin: 0;\n  }\n  .study-compare-whisper {\n    font-size: 12px;\n    color: var(--text-tertiary);\n    margin: 0 0 14px 18px;\n    line-height: 1.45;\n  }\n\n  /* Original Text Container (Tappable Words) */\n  .orig-plate {\n    background: var(--surface);\n    border: 1px solid var(--hairline);\n    border-radius: var(--radius-md);\n    padding: 14px 14px 12px;\n    margin-bottom: 14px;\n    box-shadow: var(--shadow-card);\n  }\n  .orig-words-hebrew {\n    direction: rtl;\n    display: flex;\n    flex-wrap: wrap;\n    gap: 4px 7px;\n    font-family: var(--font-hebrew);\n    font-size: 25px;\n    line-height: 1.95;\n    color: var(--text);\n  }\n  .orig-words-greek {\n    direction: ltr;\n    display: flex;\n    flex-wrap: wrap;\n    gap: 3px 6px;\n    font-family: var(--font-greek);\n    font-size: 20px;\n    line-height: 1.62;\n    color: var(--text);\n  }\n  .orig-word {\n    padding: 0 3px;\n    border-radius: 5px;\n    border-bottom: 1px dotted var(--hairline-gold);\n    cursor: pointer;\n    transition: background 140ms ease, color 140ms ease, border-color 140ms ease;\n  }\n  .orig-word:hover, .orig-word:active {\n    background: var(--gold-soft);\n    color: var(--gold-bright);\n    border-bottom-color: var(--gold);\n  }\n  .translit-row {\n    margin-top: 8px;\n    padding-top: 8px;\n    border-top: 1px solid var(--hairline);\n    display: flex;\n    flex-wrap: wrap;\n    gap: 2px 5px;\n    font-family: var(--font-serif);\n    font-style: italic;\n    font-size: 13.5px;\n    line-height: 1.5;\n    color: var(--text-secondary);\n  }\n  .translit-token {\n    cursor: pointer;\n    border-radius: 4px;\n    padding: 0 2px;\n  }\n  .translit-token:hover { color: var(--gold); background: var(--gold-soft); }\n  .tap-hint {\n    margin-top: 8px;\n    font-size: 10.5px;\n    color: var(--text-tertiary);\n    display: flex;\n    align-items: center;\n    gap: 5px;\n  }\n\n  /* Key Word Spotlight */\n  .keyword-thread {\n    border-left: 1.5px solid var(--gold-muted);\n    padding-left: 13px;\n    margin-left: 2px;\n  }\n  .keyword-head {\n    display: flex;\n    align-items: baseline;\n    gap: 8px;\n    margin-bottom: 4px;\n  }\n  .keyword-orig {\n    font-size: 19px;\n    color: var(--gold);\n    font-weight: 600;\n  }\n  .keyword-orig.heb { font-family: var(--font-hebrew); font-size: 21px; }\n  .keyword-orig.grk { font-family: var(--font-greek); }\n  .keyword-translit {\n    font-family: var(--font-serif);\n    font-style: italic;\n    font-size: 13.5px;\n    color: var(--text-secondary);\n  }\n  .keyword-note {\n    font-size: 13.5px;\n    line-height: 1.58;\n    color: var(--text-secondary);\n    margin: 0;\n  }\n  .keyword-more-btn {\n    margin-top: 6px;\n    font-size: 12px;\n    font-weight: 600;\n    color: var(--gold);\n  }\n\n  /* Immersive floating exit pill */\n  .immersive-pill {\n    position: fixed;\n    top: 16px;\n    left: 50%;\n    transform: translateX(-50%) translateY(-80px);\n    z-index: 60;\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    padding: 8px 16px;\n    border-radius: 99px;\n    background: var(--surface-raised);\n    border: 1px solid var(--hairline-gold);\n    box-shadow: 0 8px 24px rgba(0,0,0,0.35);\n    font-size: 12px;\n    opacity: 0;\n    pointer-events: none;\n    transition: all 240ms ease;\n  }\n  .app-shell.immersive .immersive-pill {\n    opacity: 1;\n    pointer-events: auto;\n    transform: translateX(-50%) translateY(0);\n  }\n\n  /* Chapter id-template-columns: repeat(4, 1fr);\n    padding: 8px 10px 14px;\n    background: var(--nav-bg);\n    backdrop-filter: blur(22px);\n    -webkit-backdrop-filter: blur(22px);\n    border-top: 1px solid var(--hairline);\n    transition: transform 240ms ease, opacity 240ms ease, background var(--transition);\n  }\n  .nav-tab {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 3px;\n    padding: 4px 0;\n    color: var(--text-tertiary);\n    font-size: 10.5px;\n    font-weight: 500;\n    position: relative;\n    transition: color 180ms ease;\n  }\n  .nav-tab.active {\n    color: var(--gold);\n    font-weight: 600;\n  }\n  .nav-tab.active::after {\n    content: \"\";\n    position: absolute;\n    top: -8px;\n    width: 22px;\n    height: 2px;\n    border-radius: 2px;\n    background: var(--gold);\n  }\n\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     MODAL SHEETS & FULL-SCREEN OVERLAYS (Word Study, Verse Study, Aliyah, Stillness, Atelier)\n     \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n  .scrim {\n    position: fixed;\n    inset: 0;\n    background: var(--sheet-scrim);\n    z-index: 70;\n    opacity: 0;\n    pointer-events: none;\n    transition: opacity 220ms ease;\n  }\n %);\n    animation: deepBreath 12s ease-in-out infinite;\n    position: relative;\n  }\n  .breath-circle-inner {\n    width: 112px;\n    height: 112px;\n    border-radius: 50%;\n    border: 1px solid var(--hairline-gold);\n    background: radial-gradient(circle, var(--gold) 0%, var(--gold-muted) 100%);\n    opacity: 0.85;\n    box-shadow: 0 0 42px var(--gold-glow);\n  }\n  @keyframes deepBreath {\n    0%, 100% { transform: scale(0.76); opacity: 0.65; }\n    35%, 52% { transform: scale(1.12); opacity: 1; }\n  }\n\n  /* Theme Atelier Preview Grid */\n  .atelier-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 12px;\n    margin-top: 14px;\n  }\n  .theme-card-preview {\n    border-radius: var(--radius-md);\n    padding: 13px;\n    text-align: left;\n    border: 1.5px solid transparent;\n    transition: transform 150ms ease, border-color 180ms ease;\n    position: relative;\n  }\n  .theme-card-preview.selected { border-color: var(--gold); }\n  .theme-card-preview .tc-name {\n    font-family: var(--font-serif);\n    font-size: 15.5px;\n    font-weight: 600;\n    margin-bottom: 6px;\n  }\n  .theme-card-preview .tc-sample {\n    font-family: var(--font-serif);\n    font-size: 11.5px;\n    line-height: 1.45;\n    padding: 8px;\n    border-radius: 8px;\n    margin-bottom: 7px;\n  }\n  .theme-card-preview .tc-tag { font-size: 10.5px; opacity: 0.78; }\n\n  /* Toast */\n  .toast {\n    position: fixed;\n    left: 50%;\n    bottom: 84px;\n    transform: translate(-50%, 20px);\n    background: var(--surface-raised);\n    border: 1px solid var(--hairline-gold);\n    color: var(--text);\n    padding: 9px 16px;\n    border-radius: 99px;\n    font-size: 12.5px;\n    font-weight: 500;\n    z-index: 95;\n    opacity: 0;\n    pointer-events: none;\n    transition: all 220ms ease;\n    box-shadow: 0 10px 28px rgba(0,0,0,0.35);\n    white-space: nowrap;\n  }\n  .toast.show { opacity: 1; transform: translate(-50%, 0); }\n\n  /* Journal textarea */\n  .journal-input swered<\/p>\n        <div class=\"day-ribbon\"><span>Good afternoon<\/span> &nbsp;\u00b7&nbsp; Tuesday, November 17<\/div>\n      <\/header>\n\n      <!-- Continue Reading Bookmark -->\n      <button class=\"bookmark-strip\" onclick=\"openPassage('genesis1', 'study')\">\n        <span class=\"bookmark-icon\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <path d=\"M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z\"/>\n          <\/svg>\n        <\/span>\n        <span class=\"bookmark-meta\">\n          <div class=\"bookmark-kicker\">Continue reading<\/div>\n          <div class=\"bookmark-ref\">Genesis 1:1 &nbsp;<span style=\"font-family:var(--font-sans);font-size:11px;color:var(--gold)\">Study<\/span><\/div>\n        <\/span>\n        <span class=\"bookmark-time\">just now<\/span>\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"color:var(--text-tertiary)\"><polyline points=\"9 18 15 12 9 6\"/><\/svg>\n      <\/button>\n\n      <!-- Illuminated Sacred Word Folio -->\n      <article class=\"folio-card\" id=\"sacredWordCard\">\n        <div class=\"folio-top\">\n          <span class=\"eyebrow\">Sacred Word<\/span>\n          <div class=\"day-stepper\">\n            <button class=\"step-btn\" id=\"prevDayBtn\" onclick=\"stepDay(1)\" aria-label=\"Previous day\">\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"15 18 9 12 15 6\"/><\/svg>\n            <\/button>\n            <span class=\"day-label\" id=\"swDayLabel\">Today<\/span>\n            <button class=\"step-btn\" id=\"nextDayBtn\" onclick=\"stepDay(-1)\" disabled aria-label=\"Next day\">\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"9 18 15 12 9 6\"/><\/svg>\n            <\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"folio-ref-row\">\n          <span class=\"folio-ref\" id=\"swRef\">Galatians 2:20<\/span>\n          <button class=\"chain-badge\" id=\"swChainBadge\" style=\"display:none\" onclick=\"openChainSheet()\">\u21167<\/button>\n        <\/div>\n\n        <div class=\"folio-quote-wrap\">\n          <div class=\"folio-provenance\"><span>\u2726<\/span> Eliana Bible<\/div>\n          <p class=\"folio-verse\" id=\"swVerse\">\u201cI have been crucified with Christ, and I no longer live, but Christ lives in me. And the life I now live in the body, I live by faith in the Son of God, who loved me and gave himself up for me.\u201d<\/p>\n        <\/div>\n\n        <div class=\"field-block\">\n          <div class=\"folio-section-label\">Carry It With You<\/div>\n          <p class=\"folio-body\" id=\"swCarry\">Ask where you are still trying to run your life as though the old self were still in charge, rather than living out of the reality that Christ\u2019s self-giving love is what holds you today.<\/p>\n        <\/div>\n\n        <div class=\"folio-expandable\" id=\"swMore\">\n          <div class=\"field-block\">\n            <div class=\"folio-section-label\">Notice This<\/div>\n            <p class=\"folio-body\" id=\"swNotice\">Paul uses the perfect passive participle <em>synestaur\u014dmai<\/em> \u2014 \u201cI have been co-crucified\u201d \u2014 an event completed in the past whose standing result continues unbroken in the present.<\/p>\n          <\/div>\n          <div class=\"field-block\">\n            <div class=\"folio-section-label\">Why It Matters<\/div>\n            <p class=\"folio-body\" id=\"swWhy\">Faith here is not white-knuckled self-improvement; it is resting your weight on the faithfulness of the One who already gave himself for you.<\/p>\n          <\/div>\n        <\/div>\n\n        <button class=\"expand-trigger\" id=\"swExpandBtn\" onclick=\"toggleSwMore()\">\n          <span>More \u2014 Notice This \u00b7 Why It Matters<\/span>\n          <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"6 9 12 15 18 9\"/><\/svg>\n        <\/button>\n\n        <div class=\"folio-cta-row\">\n          <button class=\"btn-ghost\" onclick=\"openPassage('john3', 'read')\">Open in Bible<\/button>\n          <button class=\"btn-primary\" id=\"swDeeperBtn\" onclick=\"openVerseStudy('john3_16')\">\u2726 Deeper Study<\/button>\n        <\/div>\n\n        <div class=\"folio-quiet-bar\">\n          <button class=\"quiet-action\" onclick=\"openPrayerModal(true)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M12 21s-7-4.35-7-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.65-7 10-7 10z\"/><\/svg>\n            Pray this\n          <\/button>\n          <button class=\"quiet-action\" onclick=\"openJournalModal(true)\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z\"/><\/svg>\n            Journal\n          <\/button>\n          <button class=\"quiet-action\" id=\"swSaveBtn\" onclick=\"toggleSaveDaily()\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><polygon points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"/><\/svg>\n            <span id=\"swSaveLabel\">Save<\/span>\n          <\/button>\n        <\/div>\n      <\/article>\n\n      <!-- Active Study Spine -->\n      <div class=\"section-head\">\n        <h2>On Your Desk<\/h2>\n        <button onclick=\"switchTab('sanctuary')\">Open Library \u203a<\/button>\n      <\/div>\n\n      <button class=\"study-spine-card rentColor\" stroke-width=\"1.8\" style=\"color:var(--gold)\"><polyline points=\"9 18 15 12 9 6\"/><\/svg>\n      <\/button>\n    <\/div>\n  <\/section>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n       TAB 4: ELIANA (STUDY DESK COMPANION)\n       \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <section class=\"screen\" id=\"screen-eliana\">\n    <div class=\"eliana-wrap\">\n      <div class=\"eliana-header\">\n        <div class=\"eliana-id\">\n          <div class=\"eliana-avatar\">\u2726<\/div>\n          <div>\n            <div class=\"serif\" style=\"font-size:18px;color:var(--text);line-height:1.15\">Eliana<\/div>\n            <div style=\"font-size:11.5px;color:var(--text-secondary)\">Scripture, original languages &amp; prayer<\/div>\n          <\/div>\n        <\/div>\n        <button class=\"icon-btn\" onclick=\"resetElianaChat()\" title=\"Clear conversation\">\n          <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"/><path d=\"M3 3v5h5\"/><\/svg>\n        <\/button>\n      <\/div>\n\n      <div id=\"elianaThread\">\n        <div class=\"msg-user\">\n          Why does Eliana render <em>\u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6<\/em> in John 3:16 as \u201cone-and-only\u201d instead of \u201conly begotten\u201d?\n        <\/div>\n\n        <div class=\"msg-eliana\">\n          <div class=\"msg-eliana-label\"><span>\u2726<\/span> Eliana<\/div>\n          <p>\n            The Greek adjective <strong>\u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u03ae\u03c2<\/strong> (<em>monogen\u0113s<\/em>) combines <em>monos<\/em> (\u201csingle, sole\u201d) with <em>genos<\/em> (\u201ckind, class\u201d) \u2014 not <em>genna\u014d<\/em> (\u201cto beget\u201d). It means <em>one of a kind, unique, irreplaceable<\/em>.\n          <\/p>\n          <p>\n            You can see this clearly when Scripture uses the very same word for Isaac in <button class=\"ref-pill\" onclick=\"openPassage('john3','study')\">John 3:16<\/button> and <button class=\"ref-pill\" onclick=\"openPassage('genesis1','study')\">Genesis 1:1<\/button>\u2019s echo of covenant uniqueness (see also Hebrews 11:17, where Isaac is called Abraham\u2019s <em>monogen\u0113s<\/em> even though Abraham had other sons \u2014 Isaac was the unique son of promise).\n          <\/p>\n          <p>\n            When John writes that the Father gave His <em>one-and-only<\/em> Son, he is pointing to the incomparable weight of the gift: God did not spare what was irreplaceable.\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- Eliana Floating Composer (Visible only on Eliana tab) -->\n  <div class=\"eliana-composer-dock\" id=\"elianaComposer\">\n    <div class=\"prompt-chips\">\n      <button class=\"p-chip\" onclick=\"sendQuickPrompt('Walk me through b\u0101r\u0101 in Genesis 1:1')\">Explain b\u0101r\u0101 (Gen 1:1)<\/button>\n      <button class=\"p-chip\" onclick=\"sendQuickPrompt('Help me pray Galatians 2:20 today')\">Pray Galatians 2:20<\/button>\n      <button class=\"p-chip\" onclick=\"sendQuickPrompt('How does Chain \u21163 connect Hosea 11 and Matthew 2?')\">Chain \u21163 \u00b7 Out of Egypt<\/button>\n    <\/div>\n    <div class=\"composer-box\">\n      <input type=\"text\" id=\"elianaInput\" placeholder=\"Ask about a verse, word, or what\u2019s on your heart\u2026\" onkeydown=\"if(event.key==='Enter') sendElianaInput()\">\n      <button class=\"send-btn\" onclick=\"sendElianaInput()\" aria-label=\"Send\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"/><polygon points=\"22 2 15 22 11 13 2 9 22 2\"/><\/svg>\n      <\/button>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550 VERSE ACTION DOCK (Read Mode Selection) \u2550\u2550\u2550 -->\n  <div class=\"verse-dock\" id=\"verseDock\" aria-label=\"Verse actions\">\n    <div class=\"dock-header\">\n      <span class=\"dock-ref\" id=\"dockRefLabel\">Genesis 1:1<\/span>\n      <div class=\"dock-highlights\">\n        <button class=\"hl-swatch\" style=\"background:#D8B458\" onclick=\"applyHighlight('hl-amber')\" title=\"Gold ink\"><\/button>\n        <button class=\"hl-swatch\" style=\"background:#7EAE80\" onclick=\"applyHighlight('hl-olive')\" title=\"Olive ink\"><\/button>\n        <button class=\"hl-swatch\" style=\"background:#72A4D4\" onclick=\"applyHighlight('hl-blue')\" title=\"Still waters ink\"><\/button>\n        <button class=\"hl-swatch\" style=\"background:#D27E86\" onclick=\"applyHighlight('hl-rose')\" title=\"Rose ink\"><\/button>\n        <button class=\"hl-swatch\" style=\"background:transparent;font-size:10px;color:var(--text-secondary)\" onclick=\"applyHighlight('')\" title=\"Clear highlight\">\u2715<\/button>\n      <\/div>\n      <button class=\"icon-btn\" style=\"width:28px;height:28px\" onclick=\"clearVerseSelection()\" aria-label=\"Close\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18

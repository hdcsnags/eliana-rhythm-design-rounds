<script>
const ITEMS = [{"letter": "A", "seat": "argon", "file": "mockup.html", "html": "<!-- Model: Gemini 4 Argon (High) -->\n<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"sacred\" data-contrast=\"normal\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=5.0\" />\n  <title>Eliana's Rhythm \u2014 2027 Vision: The Illuminated Sanctuary<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Noto+Serif+Hebrew:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap\" rel=\"stylesheet\">\n  <style>\n    /* ==========================================================================\n       ELIANA'S RHYTHM (2027 VISION) \u2014 \"THE ILLUMINATED SANCTUARY & POLYGLOT MARGIN\"\n       Honoring Michael's real Compose architecture (FourThemeSystem, PremiumTokens,\n       Noto Serif + Noto Serif Hebrew, 4-Layer Study Cards, 5-Part Verse Study,\n       Numbered Chains \u2116, and Eliana \u2726) while solving what was missing in the UI/UX:\n       1. Replaces generic Material card stacks with an Illuminated Manuscript Spine\n          and etched jewel-box cards with four distinct semantic accents.\n       2. Sharpens the 4 Themes (Sacred, Shekinah, Ivory, Selah) + High Contrast.\n       3. Unifies Home around the Morning Office Meridian (Continue -> Sacred Word\n          with inline Original Root peek -> Active Study Path -> Sanctuary Rooms).\n       4. Elevates the Bible Reader with seamless Read (Flowing / Verse-by-verse +\n          inline \u2726 Eliana Lens) and Study (4-Layer Polyglot Score + interactive\n          Word Sheet & Chain \u21163 Sheet).\n       ========================================================================== */\n\n    /* THEME 1 (DEFAULT): SACRED \u2014 Deep Astronomical Lapis & Restrained Antique Gold */\n    :root,\n    [data-theme=\"sacred\"] {\n      --theme-name: \"Sacred\";\n      --theme-tagline: \"Antique gold on lapis midnight\";\n      --bg-outer: #04070D;\n      --bg-canvas: #080C14;\n      --bg-hero: #111622;\n      --bg-hero-inner: #171E2E;\n      --bg-elevated: #1B2336;\n      --bg-glass: rgba(8, 12, 20, 0.90);\n      --bg-subtle: rgba(232, 224, 208, 0.045);\n\n      --ink-primary: #EDE6D8;\n      --ink-secondary: #B4B8C5;\n      --ink-muted: #7E8496;\n      --ink-faint: #4C5264;\n\n      --gold: #D4AF37;\n      --gold-etched: #6E5A1C;\n      --gold-muted: #AA8C2C;\n      --gold-on: #060A12;\n      --gold-wash: rgba(212, 175, 55, 0.10);\n      --gold-border: rgba(212, 175, 55, 0.34);\n\n      --azure: #76AEE0;\n      --azure-wash: rgba(118, 174, 224, 0.10);\n      --azure-border: rgba(118, 174, 224, 0.30);\n\n      --cinnabar: #E07D60;\n      --cinnabar-wash: rgba(224, 125, 96, 0.11);\n      --cinnabar-border: rgba(224, 125, 96, 0.32);\n\n      --teal: #66B2AC;\n      --teal-wash: rgba(102, 178, 172, 0.10);\n      --teal-border: rgba(102, 178, 172, 0.30);\n\n      --border-hairline: #232A3B;\n      --hero-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);\n    }\n\n    /* THEME 2: SHEKINAH \u2014 Glory-Fire Gold on True OLED Jet Black (R=G=B neutral ladder) */\n    [data-theme=\"shekinah\"] {\n      --theme-name: \"Shekinah\";\n      --theme-tagline: \"Fire gold on true OLED black\";\n      --bg-outer: #000000;\n      --bg-canvas: #000000;\n      --bg-hero: #0D0D0D;\n      --bg-hero-inner: #141414;\n      --bg-elevated: #1A1A1A;\n      --bg-glass: rgba(0, 0, 0, 0.92);\n      --bg-subtle: rgba(255, 255, 255, 0.05);\n\n      --ink-primary: #ECE8E0;\n      --ink-secondary: #B8B4AC;\n      --ink-muted: #85817A;\n      --ink-faint: #524F4A;\n\n      --gold: #FFC233;\n      --gold-etched: #8C6D1F;\n      --gold-muted: #D1A62E;\n      --gold-on: #1A1200;\n      --gold-wash: rgba(255, 194, 51, 0.10);\n      --gold-border: rgba(255, 194, 51, 0.38);\n\n      --azure: #88BDF0;\n      --azure-wash: rgba(136, 189, 240, 0.10);\n      --azure-border: rgba(136, 189, 240, 0.30);\n\n      --cinnabar: #F08568;\n      --cinnabar-wash: rgba(240, 133, 104, 0.11);\n      --cinnabar-border: rgba(240, 133, 104, 0.34);\n\n      --teal: #6EC4BE;\n      --teal-wash: rgba(110, 196, 190, 0.10);\n      --teal-border: rgba(110, 196, 190, 0.30);\n\n      --border-hairline: #262626;\n      --hero-shadow: none;\n    }\n\n    /* THEME 3: IVORY \u2014 Paper, Ink, and Gold Leaf (Alabaster Flagship Light) */\n    [data-theme=\"ivory\"] {\n      --theme-name: \"Ivory\";\n      --theme-tagline: \"Paper, ink, and gold leaf\";\n      --bg-outer: #EAE8E1;\n      --bg-canvas: #F9F8F4;\n      --bg-hero: #FFFFFF;\n      --bg-hero-inner: #FBF6E8;\n      --bg-elevated: #F3F1EC;\n      --bg-glass: rgba(249, 248, 244, 0.92);\n      --bg-subtle: rgba(37, 37, 35, 0.04);\n\n      --ink-primary: #222220;\n      --ink-secondary: #52514D;\n      --ink-muted: #787670;\n      --ink-faint: #A3A098;\n\n      --gold: #8A6900;\n      --gold-etched: #F3E9C8;\n      --gold-muted: #735600;\n      --gold-on: #FFFFFF;\n      --gold-wash: rgba(138, 105, 0, 0.08);\n      --gold-border: rgba(138, 105, 0, 0.32);\n\n      --azure: #235789;\n      --azure-wash: rgba(35, 87, 137, 0.07);\n      --azure-border: rgba(35, 87, 137, 0.24);\n\n      --cinnabar: #A83C28;\n      --cinnabar-wash: rgba(168, 60, 40, 0.08);\n      --cinnabar-border: rgba(168, 60, 40, 0.25);\n\n      --teal: #246A65;\n      --teal-wash: rgba(36, 106, 101, 0.08);\n      --teal-border: rgba(36, 106, 101, 0.25);\n\n      --border-hairline: #E6E4DD;\n      --hero-shadow: 0 6px 20px rgba(80, 72, 52, 0.07);\n    }\n\n    /* THEME 4: SELAH \u2014 Dawn Verdigris & Burnished Electrum on Still-Waters Slate */\n    [data-theme=\"selah\"] {\n      --theme-name: \"Selah\";\n      --theme-tagline: \"Still-waters teal & electrum on deep slate\";\n      --bg-outer: #071118;\n      --bg-canvas: #0C1A24;\n      --bg-hero: #122430;\n      --bg-hero-inner: #172E3D;\n      --bg-elevated: #1D3849;\n      --bg-glass: rgba(12, 26, 36, 0.91);\n      --bg-subtle: rgba(232, 238, 240, 0.05);\n\n      --ink-primary: #E8F0F2;\n      --ink-secondary: #ADC2CC;\n      --ink-muted: #7893A1;\n      --ink-faint: #4A6473;\n\n      --gold: #64B8BB;\n      --gold-etched: #20494B;\n      --gold-muted: #E0BD72;\n      --gold-on: #07171E;\n      --gold-wash: rgba(100, 184, 187, 0.11);\n      --gold-border: rgba(100, 184, 187, 0.36);\n\n      --azure: #85C1F2;\n      --azure-wash: rgba(133, 193, 242, 0.10);\n      --azure-border: rgba(133, 193, 242, 0.30);\n\n      --cinnabar: #E59866;\n      --cinnabar-wash: rgba(229, 152, 102, 0.11);\n      --cinnabar-border: rgba(229, 152, 102, 0.32);\n\n      --teal: #E0BD72;\n      --teal-wash: rgba(224, 189, 114, 0.11);\n      --teal-border: rgba(224, 189, 114, 0.32);\n\n      --border-hairline: #233B4B;\n      --hero-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);\n    }\n\n    /* High Contrast Accessibility Override */\n    [data-contrast=\"high\"] {\n      --border-hairline: var(--gold);\n      --ink-secondary: var(--ink-primary);\n    }\n\n    :root {\n      --font-display: 'Cormorant Garamond', Georgia, serif;\n      --font-serif: 'Noto Serif', 'Iowan Old Style', Georgia, serif;\n      --font-hebrew: 'Noto Serif Hebrew', 'SBL Hebrew', 'Ezra SIL', serif;\n      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\n      --font-mono: 'JetBrains Mono', monospace;\n      --text-scale: 1;\n    }\n\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n      -webkit-tap-highlight-color: transparent;\n    }\n\n    html {\n      scroll-behavior: smooth;\n      background: var(--bg-outer);\n      color: var(--ink-primary);\n      font-family: var(--font-sans);\n      -webkit-font-smoothing: antialiased;\n    }\n\n    body {\n      width: 100%;\n      max-width: 390px;\n      min-height: 844px;\n      margin: 0 auto;\n      background: var(--bg-canvas);\n      color: var(--ink-primary);\n      position: relative;\n      overflow-x: hidden;\n      padding-bottom: 84px;\n      box-shadow: 0 0 60px rgba(0, 0, 0, 0.55);\n      transition: background-color 0.22s ease, color 0.22s ease;\n    }\n\n    /* ==========================================================================\n       STICKY STATUS BAR, LIVE 4-THEME SWITCHER & SCREEN JUMP RIBBON\n       ========================================================================== */\n    .sticky-shell {\n      position: sticky;\n      top: 0;\n      z-index: 120;\n      background: var(--bg-glass);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      border-bottom: 1px solid var(--border-hairline);\n    }\n\n    .ios-status-bar {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      padding: 7px 18px 3px;\n      font-size: 11px;\n      font-weight: 600;\n      color: var(--ink-primary);\n    }\n\n    .status-right {\n      display: flex;\n      align-items: center;\n      gap: 6px;\n      font-size: 10px;\n      color: var(--ink-secondary);\n    }\n\n    .theme-switcher-bar {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      padding: 5px 12px 6px;\n      gap: 4px;\n    }\n\n    .theme-pills {\n      display: flex;\n      align-items: center;\n      gap: 4px;\n      flex-wrap: nowrap;\n    }\n\n    .theme-btn {\n      appearance: none;\n      border: 1px solid var(--border-hairline);\n      background: var(--bg-subtle);\n      color: var(--ink-secondary);\n      font-family: var(--font-sans);\n      font-size: 10px;\n      font-weight: 600;\n      padding: 3.5px 8px;\n      border-radius: 999px;\n      cursor: pointer;\n      display: inline-flex;\n      align-items: center;\n      gap: 4px;\n      transition: all 0.16s ease;\n    }\n\n    .theme-btn .swatch {\n      width: 7px;\n      height: 7px;\n      border-radius: 50%;\n      display: inline-block;\n    }\n\n    .theme-btn.active {\n      border-color: var(--gold);\n      background: var(--gold-wash);\n      color: var(--gold);\n      font-weight: 700;\n    }\n\n    .a11y-tools {\n      display: flex;\n      align-items: center;\n      gap: 3px;\n    }\n\n    .tool-mini-btn {\n      appearance: none;\n      border: 1px solid var(--border-hairline);\n      background: var(--bg-subtle);\n      color: var(--ink-secondary);\n      font-size: 10px;\n      font-weight: 700;\n      padding: 3px 6px;\n      border-radius: 6px;\n      cursor: pointer;\n    }\n\n    .tool-mini-btn.active {\n      border-color: var(--gold);\n      color: var(--gold);\n      background: var(--gold-wash);\n    }\n\n    .screen-jump-strip {\n      display: flex;\n      align-items: center;\n      gap: 4px;\n      padding: 0 12px 7px;\n      overflow-x: auto;\n      scrollbar-width: none;\n    }\n    .screen-jump-strip::-webkit-scrollbar { display: none; }\n\n    .jump-pill {\n      appearance: none;\n      border: none;\n      background: transparent;\n      color: var(--ink-muted);\n      font-size: 10.5px;\n      font-weight: 600;\n      padding: 3px 8px;\n      border-radius: 6px;\n      white-space: nowrap;\n      text-decoration: none;\n      cursor: pointer;\n      transition: all 0.15s ease;\n    }\n\n    .jump-pill:hover,\n    .jump-pill.active {\n      background: var(--gold-wash);\n      color: var(--gold);\n    }\n\n    /* ==========================================================================\n       SHARED CHAPTER & CARD PRIMITIVES (PREMIUM TOKENS ARCHITECTURE)\n       ========================================================================== */\n    .screen-chapter {\n      padding: 16px 14px 26px;\n      border-bottom: 1px solid var(--border-hairline);\n      position: relative;\n    }\n\n    .chapter-eyebrow {\n      display: flex;\n      align-ite }\n\n    .home-brand-top {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 2px;\n    }\n\n    .liturgical-hour-pill {\n      display: inline-flex;\n      align-items: center;\n      gap: 5px;\n      font-size: 10px;\n      font-weight: 600;\n      color: var(--teal);\n      background: var(--teal-wash);\n      border: 1px solid var(--teal-border);\n      padding: 3px 8px;\n      border-radius: 999px;\n      cursor: pointer;\n    }\n\n    .eliana-wordmark {\n      font-family: var(--font-display);\n      font-size: 34px;\n      font-weight: 700;\n      letter-spacing: 0.01em;\n      color: var(--gold);\n      line-height: 1.05;\n      text-shadow: 0 1.5px 2px rgba(0, 0, 0, 0.35);\n    }\n\n    [data-theme=\"ivory\"] .eliana-wordmark {\n      text-shadow: 0 1px 0 var(--gold-etched);\n    }\n\n    .eliana-meaning {\n      font-size: 11.5px;\n      color: var(--ink-secondary);\n      letter-spacing: 0.04em;\n      margin-top: 2px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: 6px;\n    }\n\n    .eliana-meaning-heb {\n      font-family: var(--font-hebrew);\n      font-size: 12.5px;\n      color: var(--gold);\n    }\n\n    .home-hour-date {\n      font-size: 10.5px;\n      font-weight: 600;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n      color: var(--gold);\n      margin-top: 7px;\n    }\n\n    /* 1 \u00b7 Continue Reading + Daily Rhythm Strip */\n    .continue-card {\n      background: var(--bg-hero);\n      border: 1px solid var(--gold-border);\n      border-radius: 16px;\n      padding: 13px 15px;\n      margin-bottom: 14px;\n      box-shadow: var(--hero-shadow);\n    }\n\n    .continue-main-row {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 12px;\n      cursor: pointer;\n      text-decoration: none;\n      color: inherit;\n    }\n\n    .continue-icon-box {\n      width: 38px;\n : calc(18px * var(--text-scale));\n      line-height: 1.38;\n      color: var(--ink-primary);\n    }\n\n    .orig-mini-gloss {\n      font-family: var(--font-sans);\n      font-size: 9.5px;\n      color: var(--ink-muted);\n      direction: ltr;\n    }\n\n    /* Layer 2: Tappable Transliteration Flow (LTR) */\n    .translit-flow-row {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 5px;\n      padding: 4px 2px 10px;\n      border-bottom: 1px solid var(--border-hairline);\n      margin-bottom: 10px;\n    }\n\n    .translit-token {\n      font-family: var(--font-serif);\n      font-style: italic;\n      font-size: 13.5px;\n      color: var(--ink-secondary);\n      padding: 2px 5px;\n      border-radius: 5px;\n      cursor: pointer;\n      border: 1px solid transparent;\n    }\n\n    .translit-token:hover,\n    .translit-token.active {\n      color: var(--azure);\n      background: var(--azure-wash);\n      border-color: var(--azure-border);\n    }\n\n    /* Layer 4: Key Word Study Inline Section */\n    .keyword-study-inline {\n      margin-top: 8px;\n    }\n\n    .kw-lemma-header {\n      display: flex;\n      align-items: baseline;\n      gap: 7px;\n      margin-bottom: 4px;\n    }\n\n    .kw-lemma-orig {\n      font-family: var(--font-hebrew);\n      font-size: 17px;\n      font-weight: 700;\n      color: var(--gold);\n    }\n\n    .kw-lemma-translit {\n      font-family: var(--font-serif);\n      font-style: italic;\n      font-size: 13.5px;\n      color: var(--ink-secondary);\n    }\n\n    .kw-essay-snippet {\n      font-size: 13px;\n      line-height: 1.54;\n      color: var(--ink-secondary);\n      margin-bottom: 8px;\n    }\n\n    .study-card-footer {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      padding-top: 9px;\n      border-top: 1px solid var(--border-hairline);\n    }\n\n    .read-full-study-link {\n      font-size: 12.5px;\n      font-weight: 700;\n      color: var(--gold);\n      text-decoration: none;\n      display: inline-flex;\n      align-items: center;\n      gap: 5px;\n    }\n\n    /* ==========================================================================\n       SCREEN 4: WORD STUDY BOTTOM SHEET & CHAIN \u21163 BOTTOM SHEET\n       ========================================================================== */\n    .bottom-sheet-card {\n      background: var(--bg-hero);\n      border: 1px solid var(--azure-border);\n      border-radius: 20px;\n      padding: 14px 15px 16px;\n      margin-bottom: 14px;\n      box-shadow: var(--hero-shadow);\n    }\n\n    .sheet-drag-pill {\n      width: 36px;\n      height: 4px;\n      border-radius: 99px;\n      background: var(--border-hairline);\n      margin: 0 auto 10px;\n    }\n\n    .ws-header-row {\n      display: flex;\n      align-items: flex-start;\n      justify-content: space-between;\n      gap: 10px;\n      padding-bottom: 10px;\n      border-bottom: 1px solid var(--border-hairline);\n      margin-bottom: 10px;\n    }\n\n    .ws-headword {\n      font-size: 28px;\n      line-height: 1.2;\n      color: var(--ink-primary);\n    }\n\n    .ws-translit-sub {\n      font-family: var(--font-serif);\n      font-style: italic;\n      font-size: 14px;\n      color: var(--azure);\n    }\n\n    .strongs-label-pill {\n      font-family: var(--font-mono);\n      font-size: 11px;\n      font-weight: 700;\n      color: var(--azure);\n      background: var(--azure-wash);\n      border: 1px solid var(--azure-border);\n      padding: 4px 9px;\n      border-radius: 8px;\n      display: inline-block;\n    }\n\n    .morphology-strip {\n      background: var(--bg-hero-inner);\n      border-radius: 10px;\n      padding: 9px 11px;\n      margin-bottom: 10px;\n      border: 1px solid var(--border-hairline);\n    }\n\n    .morph-parse {\n      font-size: 12.5px;\n      font-weight: 700;\n      color: var(--ink-primary);\n      margin-bottom: 2px;\n    }\n\n    .morph-gloss {\n      font-size: 12px;\n      color: var(--ink-secondary);\n    }\n\n    .concordance-chips {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 6px;\n      margin-top: 7px;\n    }\n\n    .occ-chip {\n      appearance: none;\n      border: 1px solid var(--border-hairline);\n      background: var(--bg-subtle);\n      color: var(--azure);\n      font-size: 11px;\n      font-weight: 600;\n      padding: 4px 9px;\n      border-radius: 8px;\n      cursor: pointer;\n    }\n\n    /* ==========================================================================\n       SCREEN 5: 5-SECTION VERSE STUDY PAGE (VerseStudyScreen.kt)\n       ========================================================================== */\n    .study-5-article {\n      background: var(--bg-hero);\n      border: 1px solid var(--border-hairline);\n      border-radius: 18px;\n      padding: 16px;\n      box-shadow: var(--hero-shadow);\n    }\n\n    .section-kicker-gold {\n      font-size: 11px;\n      font-weight: 700;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n      color: var(--gold);\n      margin: 16px 0 7px;\n    }\n\n    .pull-quote-rendering {\n      display: flex;\n      align-items: flex-start;\n      gap: 9px;\n      margin: 14px 0;\n    }\n\n    .pull-quote-text {\n      font-family: var(--font-serif);\n      font-size: calc(18px * var(--text-scale));\n      line-height: 1.55;\n      color: var(--ink-primary);\n    }\n\n    .study-prose-p {\n      font-size: calc(14px * var(--text-scale));\n      line-height: 1.62;\n      color: var(--ink-primary);\n      margin-bottom: 10px;\n    }\n\n    .inline-scripture-door {\n      color: var(--gold);\n      font-weight: 600;\n      text-decoration: underline;\n      text-decoration-color: var(--gold-border);\n      cursor: pointer;\n    }\n\n    .practice-box {\n      background: var(--bg-hero-inner);\n      border: 1px solid var(--gold-border);\n      border-radius: 12px;\n      padding: 13px 14px;\n      margin-top: 14px;\n    }\n\n    /* ==========================================================================\n       SCREEN 6 & 7: LIBRARY, SANCTUARY ROOMS, ELIANA CHAT & SETTINGS\n       ========================================================================== */\n    .library-book-card {\n      background: var(--bg-hero);\n      border: 1px solid var(--border-hairline);\n      border-radius: 16px;\n      padding: 13px 14px;\n      display: flex;\n      align-items: flex-start;\n      gap: 12px;\n      margin-bottom: 10px;\n      box-shadow: var(--hero-shadow);\n    }\n\n    .book-emblem {\n      width: 44px;\n      height: 44px;\n      border-radius: 12px;\n      background: var(--bg-hero-inner);\n      border: 1px solid var(--gold-border);\n      color: var(--gold);\n      font-family: var(--font-display);\n      font-size: 20px;\n      font-weight: 700;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      flex-shrink: 0;\n    }\n\n    .stillness-orb-card {\n      background: radial-gradient(circle at 50% 42%, var(--gold-wash) 0%, var(--bg-hero) 72%);\n      border: 1px solid var(--gold-border);\n      border-radius: 18px;\n      padding: 18px 15px;\n      text-align: center;\n      margin-bottom: 12px;\n    }\n\n    .breathing-halo {\n      width: 88px;\n      height: 88px;\n      border-radius: 50%;\n      margin: 10px auto 12px;\n      background: radial-gradient(circle, var(--gold) 0%, rgba(212, 175, 55, 0.18) 65%, transparent 100%);\n      box-shadow: 0 0 28px var(--gold-wash);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      cursor: pointer;\n      animation: breathePulse 5s infinite ease-in-out;\n    }\n\n    @keyframes breathePulse {\n      0%, 100% { transform: scale(0.92); opacity: 0.78; }\n      50% { transform: scale(1.08); opacity: 1; }\n    }\n\n    .theme-studio-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 9px;\n      margin-top: 8px;\n    }\n\n    .theme-preview-card {\n      border-radius: 14px;\n      padding: 11px;\n      cursor: pointer;\n      border: 1.5px solid var(--border-hairline);\n      transition: transform 0.15s ease;\n    }\n\n    .theme-preview-card.current-theme {\n      border-color: var(--gold);\n      box-shadow: 0 0 0 1px var(--gold);\n    }\n\n    /* Sticky Bottom Navigation Bar */\n    .bottom-tab-bar {\n      position: fixed;\n      bottom: 0;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 100%;\n      max-width: 390px;\n      z-index: 130;\n      background: var(--bg-glass);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      border-top: 1px solid var(--border-hairline);\n      display: grid;\n      grid-template-columns: repeat(5, 1fr);\n      padding: 6px 6px 10px;\n    }\n\n    .tab-item {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      gap: 2px;\n      text-decoration: none;\n      color: var(--ink-muted);\n      font-size: 10px;\n      font-weight: 600;\n      padding: 4px 2px;\n      border-radius: 10px;\n    }\n\n    .tab-item.active {\n      color: var(--gold);\n    }\n\n    .tab-icon-pill {\n      padding: 2px 12px;\n      border-radius: 999px;\n      font-size: 14px;\n      line-height: 1.2;\n    }\n\n    .tab-item.active .tab-icon-pill {\n      background: var(--gold-wash);\n    }\n  <\/style>\n<\/head>\n<body>\n\n  <!-- ========================================================================\n       STICKY TOP BAR: iOS Status + Live 4-Theme Switcher + Screen Jump Strip\n       ======================================================================== -->\n  <header class=\"sticky-shell\">\n    <div class=\"ios-status-bar\">\n      <span>9:41<\/span>\n      <span style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); font-weight:700;\">\n        \u2726 Eliana\u2019s Rhythm \u00b7 2027\n      <\/span>\n      <div class=\"status-right\">\n        <span>5G<\/span>\n        <span>100% \ud83d\udd0b<\/span>\n      <\/div>\n    <\/div>\n\n    <!-- Live Theme Control: Switch all screens between Sacred, Shekinah, Ivory, Selah -->\n    <div class=\"theme-switcher-bar\" aria-label=\"Theme Switcher\">\n      <div class=\"theme-pills\">\n        <button class=\"theme-btn active\" data-t=\"sacred\" onclick=\"switchTheme('sacred', this)\">\n          <span class=\"swatch\" style=\"background:#D4AF37; border:1px solid #080C14;\"><\/span>Sacred\n        <\/button>\n        <button class=\"theme-btn\" data-t=\"shekinah\" onclick=\"switchTheme('shekinah', this)\">\n          <span class=\"swatch\" style=\"background:#FFC233; border:1px solid #000;\"><\/span>Shekinah\n        <\/button>\n        <button class=\"theme-btn\" data-t=\"ivory\" onclick=\"switchTheme('ivory', this)\">\n          <span class=\"swatch\" style=\"background:#FAF8F2; border:1px solid #8A6900;\"><\/span>Ivory\n        <\/button>\n        <button class=\"theme-btn\" data-t=\"selah\" onclick=\"switchTheme('selah', this)\">\n          <span class=\"swatch\" style=\"background:#64B8BB; border:1px solid #0C1A24;\"><\/span>Selah\n        <\/button>\n      <\/div>\n      <div class=\"a11y-tools\">\n        <button class=\"tool-mini-btn\" onclick=\"cycleTextScale()\" title=\"Scale Scripture Text\">Aa<\/button>\n        <button class=\"tool-mini-btn\" id=\"hc-btn\" onclick=\"toggleHighContrast()\" title=\"High Contrast Mode\">HC<\/button>\n      <\/div>\n    <\/div>\n\n    <!-- Quick Jump Strip across all 7 views in the 390x844 frame -->\n    <nav class=\"screen-jump-strip\" aria-label=\"Screen Jump Navigation\">\n      <a href=\"#sec-home\" class=\"jump-pill active\">1 \u00b7 Home<\/a>\n      <a href=\"#sec-reader-read\" class=\"jump-pill\">2 \u00b7 Bible: Read<\/a>\n      <a href=\"#sec-reader-study\" class=\"jump-pill\">3 \u00b7 Bible: Study (4L)<\/a>\n      <a href=\"#sec-sheets\" class=\"jump-pill\">4 \u00b7 Word &amp; Chain \u21163<\/a>\n      <a href=\"#sec-verse-study\" class=\"jump-pill\">5 \u00b7 Full Verse Study<\/a>\n      <a href=\"#sec-library-practice\" class=\"jump-pill\">6 \u00b7 Library &amp; Sanctuary<\/a>\n      <a href=\"#sec-eliana-themes\" class=\"jump-pill\">7 \u00b7 \u2726 Eliana &amp; Themes<\/a>\n    <\/nav>\n  <\/header>\n\n  <!-- ========================================================================\n       SCREEN 1: HOME \u2014 \"THE MORNING OFFICE & MERIDIAN THREAD\"\n       Order: Greeting/Hour -> 1. Continue Reading -> 2. Sacred Word (with inline\n       Original Root peek + Carry It With You + 4 Doors) -> 3. Study Path -> 4. Quick Access\n       ======================================================================== -->\n  <section id=\"sec-home\" class=\"screen-chapter\">\n    <div class=\"chapter-eyebrow\">\n      <span class=\"eyebrow-tag\">\u2726 Screen 1 \u00b7 Home (The Morning Office)<\/span>\n      <span class=\"eyebrow-sub\">4 Cards \u00b7 Zero Clutter<\/span>\n    <\/div>\n\n    <div class=\"home-brand-header\">\n      <div class=\"home-brand-top\">\n        <a href=\"#sec-library-practice\" class=\"liturgical-hour-pill\" style=\"text-decoration:none;\">\n          <span>\u25cf<\/span>\n          <span>60s Stillness<\/span>\n        <\/a>\n        <button class=\"day-step-btn\" onclick=\"cycleGreetingHour()\" title=\"Preview Morning / Afternoon / Night Greeting\" style=\"width:auto; padding:0 8px; font-size:10px;\">\n          \u2600 Hour \u21bb\n        <\/button>\n      <\/div>\n      <h1 class=\"eliana-wordmark\">Eliana<\/h1>\n      <div class=\"eliana-meaning\">\n        <span>God has answered<\/span>\n        <span>\u00b7<\/span>\n        <span class=\"eliana-meaning-heb\">\u05d0\u05b1\u05dc\u05b4\u05d9\u05e2\u05b2\u05e0\u05b8\u05d4<\/span>\n      <\/div>\n      <div class=\"home-hour-date\" id=\"home-greeting-line\">\n        GOOD MORNING \u00b7 THURSDAY, NOVEMBER 19\n      <\/div>\n    <\/div>\n\n    <!-- 1 \u00b7 CONTINUE READING (Specific to the verse, with daily loop cadence) -->\n    <div class=\"continue-card\">\n      <a href=\"#sec-reader-study\" class=\"continue-main-row\">\n        <div class=\"continue-icon-box\">\ud83d\udcd6<\/div>\n        <div class=\"continue-text-col\">\n          <div class=\"continue-kicker\">Continue reading \u00b7 Study mode<\/div>\n          <div class=\"continue-ref-title\">Genesis 1:14<\/div>\n          <div class=\"continue-meta\">last night \u00b7 \u201cLet there be lights in the expanse\u2026\u201d<\/div>\n        <\/div>\n        <span style=\"color:var(--gold); font-size:18px; font-weight:700;\">\u203a<\/span>\n      <\/a>\n      <div class=\"rhythm-cadence-bar\" aria-label=\"Today's Devotional Cadence\">\n        <a href=\"#sec-library-practice\" class=\"cadence-step done\">\u2713 Stillness<\/a>\n        <a href=\"#sec-home\" class=\"cadence-step active\">\u2726 Sacred Word<\/a>\n        <a href=\"#sec-reader-study\" class=\"cadence-step\">Study Path<\/a>\n        <a href=\"#sec-library-practice\" class=\"cadence-step\">Pray / Write<\/a>\n      <\/div>\n    <\/div>\n\n    <!-- 2 \u00b7 SACRED WORD (BreathingVerseCard + Inline Original Root Jewel + 4 Doors) -->\n    <article class=\"hero-card\">\n      <div class=\"sacred-word-header\">\n        <div>\n          <h2 class=\"sacred-word-title\">Sacred Word<\/h2>\n          <div class=\"day-stepper-row\">\n            <button class=\"day-step-btn\" onclick=\"stepVotdDay(-1)\" aria-label=\"Previous day\">\u2190<\/button>\n            <span class=\"day-label-text\" id=\"votd-day-label\">Today<\/span>\n            <button class=\"day-step-btn\" onclick=\"stepVotdDay(1)\" aria-label=\"Next day\">\u2192<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"sacred-badges\">\n          <a href=\"#sec-sheets\" class=\"chain-pill\" id=\"votd-chain-badge\">Chain \u211614<\/a>\n          <button class=\"star-btn\" id=\"votd-star\" onclick=\"toggleStar(this)\" aria-label=\"Save verse\">\u2605<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"votd-reference-bar\">\n        <span class=\"votd-ref\" id=\"votd-ref-text\">Galatians 2:20<\/span>\n        <span class=\"votd-voice-tag\">\u2726 Eliana Bible<\/span>\n      <\/div>\n\n      <!-- Inner Quote Surface (heroFillInner) -->\n      <div class=\"inset-quote-box\">\n        <p class=\"votd-quote-text\" id=\"votd-quote-body\">\n          \u201cI have been crucified with Christ, and I no longer live, but Christ lives in me. And the life I now live in the body, I live by faith in the Son of God, who loved me and gave himself up for me.\u201d\n        <\/p>\n      <\/div>\n\n      <!-- NEW Signature Identity Touch: Inline Original Root Jewel inside Sacred Word -->\n      <a href=\"#sec-sheets\" class=\"inline-root-jewel\" onclick=\"loadWordInSheet('systauroo')\">\n        <div class=\"root-jewel-left\">\n          <span class=\"root-jewel-script\" id=\"votd-root-script\">\u03c3\u03c5\u03bd\u03b5\u03c3\u03c4\u03b1\u03cd\u03c1\u03c9\u03bc\u03b1\u03b9<\/span>\n          <div class=\"root-jewel-meta\" id=\"votd-root-meta\">\n            <strong>synestaur\u014dmai \u00b7 G4957<\/strong> \u00b7 Perf. Pass. Ind.<br/>\n            \u201cCrucified together with \u2014 a completed past event with ongoing life today\u201d\n          <\/div>\n        <\/div>\n        <span style=\"color:var(--azure); font-size:11px; font-weight:700; white-space:nowrap;\">Root \u203a<\/span>\n      <\/a>\n\n      <!-- One Pastoral Field visible by default: Carry It With You -->\n      <div class=\"pastoral-field\">\n        <div class=\"pastoral-label\">Carry It With You<\/div>\n        <p class=\"pastoral-body\" id=\"votd-carry-text\">\n          Ask where you\u2019re still trying to run your life as though the old self were still in charge, rather than living out of the reality that Christ\u2019s love and self-giving for you is what defines you now.\n        <\/p>\n      <\/div>\n\n      <!-- Notice This & Why It Matters expand cleanly behind More -->\n      <div class=\"more-fields-box\" id=\"votd-more-box\">\n        <div class=\"pastoral-field\">\n          <div class=\"pastoral-label\">Notice This<\/div>\n          <p class=\"pastoral-body\">\n            Paul uses a single compound Greek verb, <em>synestaur\u014dmai<\/em> (perfect passive), meaning a decisive death in the past whose liberating consequence continues every morning you wake up.\n          <\/p>\n        <\/div>\n        <div class=\"pastoral-field\" style=\"margin-bottom:4px;\">\n          <div class=\"pastoral-label\">Why It Matters<\/div>\n          <p class=\"pastoral-body\">\n            Christian identity is not self-improvement; it is exchange of center\u2014Christ living inside your actual Tuesday and Thursday.\n          <\/p>\n        <\/div>\n      <\/div>\n\n      <button class=\"more-toggle-btn\" id=\"votd-more-btn\" onclick=\"toggleVotdMore()\">\n        More \u2014 Notice This \u00b7 Why It Matters \u25be\n      <\/button>\n\n      <!-- Row 1: The Word and Its Depth -->\n      <div class=\"doors-grid-top\">\n        <a href=\"#sec-reader-read\" class=\"btn-outline-door\">Read in the Bible<\/a>\n        <a href=\"#sec-verse-study\" class=\"btn-primary-gold\">\u2726 Deeper insight<\/a>\n      <\/div>\n\n      <!-- Row 2: The Daily Practices beside the Verse -->\n      <div class=\"doors-grid-bottom\">\n        <a href=\"#sec-library-practice\" class=\"btn-outline-door\">Pray this<\/a>\n        <a href=\"#sec-library-practice\" class=\"btn-outline-door\">Journal<\/a>\n        <a href=\"#sec-library-practice\" class=\"btn-outline-door\">Reflect \u00b7 Day 1<\/a>\n      <\/div>\n    <\/article>\n\n    <!-- 3 \u00b7 ONE STATEFUL STUDY PATH CARD (Aliyah / Eliana's Journal / Foundations) -->\n    <div class=\"surface-card\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;\">\n        <span style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold);\">\n          \ud83d\udcda Active Study Path\n        <\/span>\n        <span style=\"font-size:10px; color:var(--ink-muted);\">Picked up where you left off<\/span>\n      <\/div>\n\n      <div class=\"study-path-tabs\" role=\"tablist\">\n        <button class=\"path-pill active\" onclick=\"switchStudyPath('aliyah', this)\">Aliyah \u00b7 \u21163<\/button>\n        <button class=\"path-pill\" onclick=\"switchStudyPath('journal', this)\">Eliana\u2019s Journal<\/button>\n        <button class=\"path-pill\" onclick=\"switchStudyPath('foundations', this)\">The Foundations<\/button>\n      <\/div>\n\n      <div id=\"home-study-collection\" style=\"font-size:10.5px; font-weight:700; color:var(--cinnabar); margin-bottom:2px;\">\n        Aliyah \u2014 The Ascent \u00b7 Chain \u21163\n      <\/div>\n      <div id=\"home-study-title\" style=\"font-family:var(--font-serif); font-size:17px; font-weight:700; color:var(--ink-primary); margin-bottom:4px;\">\n        Out of Egypt: The Fulfillment That Looks Backward\n      <\/div>\n      <p id=\"home-study-desc\" style=\"font-size:12px; color:var(--ink-secondary); line-height:1.45; margin-bottom:10px;\">\n        Resumed at Section 2: \u201cThe Sentence That Shouldn\u2019t Be There\u201d (Matthew 2:15 \u00b7 Hosea 11:1 \u00b7 Exodus 4:22).\n      <\/p>\n\n      <div style=\"display:flex; gap:8px;\">\n        <a href=\"#sec-library-practice\" class=\"btn-primary-gold\" style=\"flex:1;\">Continue Study<\/a>\n        <a href=\"#sec-library-practice\" class=\"btn-outline-door\">Day 1 \u00b7 Love<\/a>\n      <\/div>\n    <\/div>\n\n    <!-- 4 \u00b7 QUICK ACCESS (2x2 Sanctuary Portals) -->\n    <div style=\"margin-top:4px;\">\n      <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:8px;\">\n        Quick Access \u00b7 Sanctuary Doors\n      <\/div>\n      <div class=\"quick-grid-2x2\">\n        <a href=\"#sec-reader-read\" class=\"quick-tile\">\n          <div class=\"quick-tile-icon\">\ud83d\udcd6<\/div>\n          <div>\n            <div class=\"quick-tile-title\">Bible<\/div>\n            <div class=\"quick-tile-sub\">Read &amp; 4-Layer Study<\/div>\n          <\/div>\n        <\/a>\n        <a href=\"#sec-library-practice\" class=\"quick-tile\">\n          <div class=\"quick-tile-icon\">\ud83c\udfdb<\/div>\n          <div>\n            <div class=\"quick-tile-title\">Library<\/div>\n            <div class=\"quick-tile-sub\">3 Books \u00b7 Chains<\/div>\n          <\/div>\n        <\/a>\n        <a href=\"#sec-library-practice\" class=\"quick-tile\">\n          <div class=\"quick-tile-icon\">\ud83d\udd6f<\/div>\n          <div>\n            <div class=\"quick-tile-title\">Throne Room<\/div>\n            <div class=\"quick-tile-sub\">Prayers &amp; Generator<\/div>\n          <\/div>\n        <\/a>\n        <a href=\"#sec-library-practice\" class=\"quick-tile\">\n          <div class=\"quick-tile-icon\">\u2712\ufe0f<\/div>\n          <div>\n            <div class=\"quick-tile-title\">Journal<\/div>\n            <div class=\"quick-tile-sub\">Guided &amp; Free Write<\/div>\n          <\/div>\n        <\/a>\n      <\/div>\n    <\/div>\n  <\/section>\n  <!-- ========================================================================\n       SCREEN 2: BIBLE READER \u2014 MODE 1: READ MODE\n       Flowing paragraphs (or Verse-by-Verse), BSB / KJV / ASV / \u2726 Eliana,\n       Aa typography & spacing controls, inline \u2726 Eliana Lens, and Verse Action Bar\n       ======================================================================== -->\n  <section id=\"sec-reader-read\" class=\"screen-chapter\">\n    <div class=\"chapter-eyebrow\">\n      <span class=\"eyebrow-tag\">\ud83d\udcd6 Screen 2 \u00b7 Bible Reader (Mode 1: Read)<\/span>\n      <span class=\"eyebrow-sub\">Flowing \u00b7 \u2726 Eliana Lens<\/span>\n    <\/div>\n\n    <!-- Reader Top Chrome -->\n    <div class=\"reader-bar\">\n      <div class=\"reader-top-row\">\n        <button class=\"passage-picker-btn\" onclick=\"alert('Opens Book \u00b7 Chapter \u00b7 Verse Picker Sheet (66 Books)')\">\n          <span>John 3<\/span>\n          <span class=\"version-badge\" id=\"read-version-badge\">BSB<\/span>\n          <span style=\"font-size:11px;\">\u25be<\/span>\n        <\/button>\n\n        <div class=\"reader-utilities\">\n          <button class=\"reader-icon-btn\" onclick=\"toggleAaDrawer('read-aa-drawer', this)\" title=\"Typography & Layout\">Aa<\/button>\n          <button class=\"reader-icon-btn active\" id=\"offline-pack-btn\" onclick=\"toggleOfflinePack(this)\" title=\"Kept Offline\">\u2b07 Offline \u2713<\/button>\n        <\/div>\n      <\/div>\n\n      <!-- Read | Study Mode Switch + Translation Pills (BSB, KJV, ASV, \u2726 Eliana) -->\n      <div class=\"mode-and-translation-row\">\n        <div class=\"mode-segmented\" role=\"tablist\" aria-label=\"Reader Mode\">\n          <a href=\"#sec-reader-read\" class=\"mode-chip active\">\u2713 Read<\/a>\n          <a href=\"#sec-reader-study\" class=\"mode-chip\">Study \u00b7 4L<\/a>\n        <\/div>\n\n        <div class=\"trans-pills-row\" role=\"tablist\" aria-label=\"Translations\">\n          <button class=\"trans-chip active\" onclick=\"setReadVersion('BSB', this)\">BSB<\/button>\n          <button class=\"trans-chip\" onclick=\"setReadVersion('KJV', this)\">KJV<\/button>\n          <button class=\"trans-chip\" onclick=\"setReadVersion('ASV', this)\">ASV<\/button>\n          <button class=\"trans-chip\" onclick=\"setReadVersion('ELIANA', this)\">\u2726 Eliana<\/button>\n        <\/div>\n      <\/div>\n\n      <!-- Collapsible Aa Controls Strip (Mirrors EnhancedBibleReaderScreen.kt) -->\n      <div class=\"aa-drawer\" id=\"read-aa-drawer\">\n        <div class=\"aa-row\">\n          <span style=\"color:var(--ink-muted); font-weight:600;\">Layout<\/span>\n          <div style=\"display:flex; gap:4px;\">\n            <button class=\"trans-chip active\" id=\"btn-flowing\" onclick=\"setReadLayout('flow -- Selected Verse 16 with inline \u2726 Eliana Lens open -->\n        <div class=\"read-verse-block selected\" id=\"rv-block-16\" onclick=\"selectReadVerse(16, this)\">\n          <p class=\"read-verse-line\" id=\"rv-16\">\n            <span class=\"v-sup\">16<\/span>For God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life.<span class=\"inline-mark-star\">\u2726<\/span><span class=\"inline-mark-chain\">\u21163<\/span>\n          <\/p>\n\n          <!-- Inline \u2726 Eliana Lens (Toggled from Verse Action Bar in Read Mode) -->\n          <div class=\"eliana-inline-lens\" id=\"read-inline-lens\">\n            <div class=\"lens-kicker\">\n              <span>\u2726 Eliana Lens \u00b7 John 3:16<\/span>\n              <span style=\"font-family:var(--font-serif); font-style:italic; text-transform:none;\">\u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6 (monogen\u0113 \u00b7 G3439)<\/span>\n            <\/div>\n            <p class=\"lens-rendering\">\n              \u201cFor God loved the world in this way: he gave his one-and-only Son, so that everyone who believes in him would not perish but have eternal life.\u201d\n            <\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"read-verse-block\" onclick=\"selectReadVerse(17, this)\">\n          <p class=\"read-verse-line\" id=\"rv-17\">\n            <span class=\"v-sup\">17<\/span>For God did not send His Son into the world to condemn the world, but to save the world through Him.<span class=\"inline-mark-star\">\u2726<\/span>\n          <\/p>\n        <\/div>\n      <\/div>\n\n      <!-- Unified Verse Action Bar (Rises when a verse is selected in Read or Study mode) -->\n      <div class=\"verse-action-bar\">\n        <div class=\"vab-header\">\n          <span class=\"vab-ref\" id=\"vab-selected-label\">John 3:16 Selected<\/span>\n          <span style=\"font-size:10px; color:var(--ink-muted);\">Tap any verse to switch<\/span>\n        <\/div>\n        <div class=\"vab-chips\">\n          <a href=\"#sec-verse-study\" class=\"vab-chip primary\">\ud83d\udcd6 Full Study<\/a>\n          <button class=\"vab-chip\" onclick=\"toggleElianaLensInline()\">\u2726 Eliana Lens<\/button>\n          <button class=\"vab-chip\" onclick=\"cycleVerseHighlight()\">\ud83d\udd8c Highlight<\/button>\n          <button class=\"vab-chip\" onclick=\"promptQuickNote()\">\u270e Note<\/button>\n          <button class=\"vab-chip\" onclick=\"toggleCompareBox()\">\u21c4 Compare (4)<\/button>\n          <a href=\"#sec-sheets\" class=\"vab-chip cinnabar\">Chain \u21163<\/a>\n          <a href=\"#sec-eliana-themes\" class=\"vab-chip\">\u2726 Ask Eliana<\/a>\n        <\/div>\n\n        <!-- Inline Compare Translations Drawer inside Action Bar -->\n        <div id=\"inline-compare-drawer\" style=\"display:none; margin-top:9px; padding-top:9px; border-top:1px solid var(--border-hairline); font-size:11.5px;\">\n          <div style=\"font-weight:700; color:var(--gold); margin-bottom:4px;\">John 3:16 \u00b7 Translation Comparison<\/div>\n          <div style=\"margin-bottom:4px;\"><strong>BSB:<\/strong> \u201cFor God so loved the world that He gave His one and only Son\u2026\u201d<\/div>\n          <div style=\"margin-bottom:4px;\"><strong>KJV:<\/strong> \u201cFor God so loved the world, that he gave his only begotten Son\u2026\u201d<\/div>\n          <div style=\"margin-bottom:4px;\"><strong>ASV:<\/strong> \u201cFor God so loved the world, that he gave his only begotten Son\u2026\u201d<\/div>\n          <div style=\"color:var(--gold);\"><strong>\u2726 Eliana:<\/strong> \u201cFor God loved the world in this way: he gave his one-and-only Son\u2026\u201d<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ========================================================================\n       SCREEN 3: BIBLE READER \u2014 MODE 2: STUDY MODE (\"THE 4-LAYER POLYGLOT SCORE\")\n       Shows BOTH Old Testament Hebrew (Genesis 1:1, RTL) AND New Testament\n       Greek (John 3:16, LTR) with all 4 layers:\n       1. Tappable Original Text (Hebrew RTL / Greek LTR)\n       2. Tappable Transliteration\n       3. \u2726 Eliana's own rendering + Top Voice comparison\n       4. Key Word Study + Read the full study \u203a\n       ======================================================================== -->\n  <section id=\"sec-reader-study\" class=\"screen-chapter\">\n    <div class=\"chapter-eyebrow\">\n      <span class=\"eyebrow-tag azure\">\u05d0/\u03a9 Screen 3 \u00b7 Bible Reader (Mode 2: Study)<\/span>\n      <span class=\"eyebrow-sub\">4 Layers \u00b7 Hebrew &amp; Greek<\/span>\n    <\/div>\n\n    <div class=\"reader-bar\">\n      <div class=\"reader-top-row\">\n        <div style=\"display:flex; align-items:center; gap:6px;\">\n          <span style=\"font-family:var(--font-serif); font-size:15px; font-weight:700; color:var(--gold);\">\n            Genesis 1:1 &amp; John 3:16\n          <\/span>\n          <span class=\"version-badge\">BSB \u00b7 \u2726<\/span>\n        <\/div>\n        <div class=\"mode-segmented\">\n          <a href=\"#sec-reader-read\" class=\"mode-chip\">Read<\/a>\n          <a href=\"#sec-reader-study\" class=\"mode-chip active\">\u2713 Study<\/a>\n        <\/div>\n      <\/div>\n\n      <!-- Layer Visibility Bar: Toggle any of the 4 layers -->\n      <div style=\"display:flex; gap:4px; overflow-x:auto; padding-top:6px; border-top:1px solid var(--border-hairline);\">\n        <span style=\"font-size:10px; color:var(--ink-muted); align-self:center; margin-right:2px;\">Layers:<\/span>\n        <button class=\"trans-chip active\" onclick=\"toggleLayerClass('layer-1-orig', this)\">1 \u00b7 Original \u05d0/\u03a9<\/button>\n        <button class=\"trans-chip active\" onclick=\"toggleLayerClass('layer-2-tl', this)\">2 \u00b7 Translit<\/button>\n        <button class=\"trans-chip active\" onclick=\"toggleLayerClass('layer-3-el', this)\">3 \u00b7 \u2726 Eliana<\/button>\n        <button class=\"trans-chip active\" onclick=\"toggleLayerClass('layer-4-kw', this)\">4 \u00b7 Key Word<\/button>\n      <\/div>\n    <\/div>\n\n    <!-- ====================================================================\n         STUDY VERSE CARD 1: OLD TESTAMENT HEBREW (GENESIS 1:1 \u2014 RTL)\n         Mirrors real app screen 11_tab_bible_reader.png + interactive tokens\n         ==================================================================== -->\n    <div class=\"study-card-outer\">\n      <div class=\"study-verse-header\">\n        <div class=\"study-v-num\">\n          <span>Genesis 1:1<\/span>\n          <span style=\"font-size:10.5px; font-weight:500; color:var(--ink-muted);\">OT Hebrew \u00b7 WLC (RTL)<\/span>\n        <\/div>\n        <a href=\"#sec-sheets\" class=\"chain-pill\">Chain \u21161 \u00b7 Creation<\/a>\n      <\/div>\n\n      <article class=\"study-polyglot-card\">\n        <!-- LAYER 3: \u2726 Eliana's Rendering + BSB Top-Voice Comparison -->\n        <div class=\"layer-3-el\">\n          <p class=\"study-top-rendering\">\n            <span class=\"star-lead\">\u2726<\/span>In the beginning God created the heavens and the earth.\n          <\/p>\n          <div class=\"study-bsb-compare\">The BSB reads the same \u00b7 Tap any Hebrew word below for Strong\u2019s sheet<\/div>\n        <\/div>\n\n        <!-- LAYER 1: Original Hebrew Text (RTL, Tall line-height for Niqqud + Cantillation) -->\n        <div class=\"original-flow-box layer-1-orig\">\n          <div class=\"original-flow-caption\">\n            <span>Layer 1 \u00b7 Original Hebrew (RTL \u00b7 Tap any word)<\/span>\n            <span style=\"font-family:var(--font-mono);\">H7225 \u2192 H776<\/span>\n          <\/div>\n          <div class=\"hebrew-words-flow\">\n            <button class=\"orig-word-pill\" onclick=\"loadWordInSheet('bereshit', this)\">\n              <span class=\"orig-heb-text\">\u05d1\u05b0\u05bc\u05e8\u05b5\u05d0\u05e9\u05b4\u05c1\u05d9\u05ea<\/span>\n              <span class=\"orig-mini-gloss\">In-beginning<\/span>\n            <\/button>\n            <button class=\"orig-word-pill active\" onclick=\"loadWordInSheet('bara', this)\">\n              <span class=\"orig-heb-text\">\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0<\/span>\n              <span class=\"orig-mini-gloss\">created<\/span>\n            <\/button>\n            <button class=\"orig-word-pill\" onclick=\"loadWordInSheet('elohim', this)\">\n              <span class=\"orig-heb-text\">\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd<\/span>\n              <span class=\"orig-mini-gloss\">God [pl.]<\/span>\n            <\/button>\n            <button class=\"orig-word-pill\" onclick=\"loadWordInSheet('et_hashamayim', this)\">\n              <span class=\"orig-heb-text\">\u05d0\u05b5\u05ea \u05d4\u05b7\u05e9\u05b8\u05bc\u05c1\u05de\u05b7\u05d9\u05b4\u05dd<\/span>\n              <span class=\"orig-mini-gloss\">the-heavens<\/span>\n            <\/button>\n            <button class=\"orig-word-pill\" onclick=\"loadWordInSheet('veet_haaretz', this)\">\n              <span class=\"orig-heb-text\">\u05d5\u05b0\u05d0\u05b5\u05ea \u05d4\u05b8\u05d0\u05b8\u05e8\u05b6\u05e5\u05c3<\/span>\n              <span class=\"orig-mini-gloss\">and-the-earth<\/span>\n            <\/button>\n          <\/div>\n        <\/div>\n\n        <!-- LAYER 2: Tappable Phonetic Transliteration (LTR) -->\n        <div class=\"translit-flow-row layer-2-tl\" aria-label=\"Tappable Transliteration\">\n          <span class=\"translit-token\" onclick=\"loadWordInSheet('bereshit')\">b\u0259\u00b7r\u00ea\u00b7\u0161\u00ee\u1e6f<\/span>\n          <span class=\"translit-token active\" onclick=\"loadWordInSheet('bara')\">b\u0101\u00b7r\u0101<\/span>\n          <span class=\"translit-token\" onclick=\"loadWordInSheet('elohim')\">\u2019\u0115\u00b7l\u014d\u00b7h\u00eem<\/span>\n          <span class=\"translit-token\" onclick=\"loadWordInSheet('et_hashamayim')\">\u2019\u00ea\u1e6f ha\u0161\u00b7\u0161\u0101\u00b7ma\u00b7yim<\/span>\n          <span class=\"translit-token\" onclick=\"loadWordInSheet('veet_haaretz')\">w\u0259\u00b7\u2019\u00ea\u1e6f h\u0101\u00b7\u2019\u0101\u00b7re\u1e63<\/span>\n        <\/div>\n\n        <!-- LAYER 4: Key Word Study (\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0 b\u0101r\u0101) -->\n        <div class=\"keyword-study-inline layer-4-kw\">\n          <div class=\"kw-lemma-header\">\n            <span class=\"kw-lemma-orig\">\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0<\/span>\n            <span class=\"kw-lemma-translit\">b\u0101r\u0101 \u00b7 Strong\u2019s H1254<\/span>\n          <\/div>\n          <p class=\"kw-essay-snippet\" id=\"kw-gen1-text\">\n            The verb is a <strong>Qal perfect, third person masculine singular<\/strong> \u2014 a simple, completed action, stated as plain fact. What sets <em>b\u0101r\u0101<\/em> apart in the Hebrew Bible is that its subject is exclusively God; humans make (<em>\u2018\u0101\u015b\u0101h<\/em>) and form (<em>y\u0101\u1e63ar<\/em>), but only God brings the new out of nothing.\n          <\/p>\n          <div class=\"study-card-footer\">\n            <a href=\"#sec-sheets\" class=\"btn-outline-door\" style=\"padding:4px 9px; font-size:11px;\" onclick=\"loadWordInSheet('bara')\">\n              Open Word Sheet (H1254)\n            <\/a>\n            <a href=\"#sec-verse-study\" class=\"read-full-study-link\">\n              Read the full study \u203a\n            <\/a>\n          <\/div>\n        <\/div>\n      <\/article>\n    <\/div>\n\n    <!-- ====================================================================\n         STUDY VERSE CARD 2: NEW TESTAMENT GREEK (JOHN 3:16 \u2014 LTR)\n         Mirrors real app screen 12_tab_bible_reader_study_john3.png\n         ==================================================================== -->\n    <div class=\"study-card-outer\" style=\"margin-bottom:4px;\">\n      <div class=\"study-verse-header\">\n        <div class=\"study-v-num\">\n          <span>John 3:16<\/span>\n          <span style=\"font-size:10.5px; font-weight:500; color:var(--ink-muted);\">NT Greek \u00b7 SBLGNT (LTR)<\/span>\n        <\/div>\n        <a href=\"#sec-sheets\" class=\"chain-pill\">Chain \u21163 \u00b7 The Beloved Son<\/a>\n      <\/div>\n\n      <article class=\"study-polyglot-card\">\n        <!-- LAYER 3: \u2726 Eliana's Rendering -->\n        <div class=\"layer-3-el\">\n          <p class=\"study-top-rendering\">\n            <span class=\"star-lead\">\u2726<\/span>\u201cFor God loved the world in this way: he gave his one-and-only Son, so that everyone who believes in him would not perish but have eternal life.\u201d\n          <\/p>\n          <div class=\"study-bsb-compare\">BSB: \u201cFor God so loved the world that He gave His one and only Son\u2026\u201d<\/div>\n        <\/div>\n\n        <!-- LAYER 1: Original Greek Text (LTR, Tappable Words) -->\n        <div class=\"original-flow-box layer-1-orig\">\n          <div class=\"original-flow-caption\">\n            <span>Layer 1 \u00b7 Original Greek (LTR \u00b7 Tap any word)<\/span>\n            <span style=\"font-family:var(--font-mono);\">G3779 \u2192 G166<\/span>\n          <\/div>\n          <div class=\"greek-words-flow\">\n            <button class=\"orig-word-pill\" onclick=\"loadWordInSheet('houtos', this)\">\n              <span class=\"orig-grk-text\">\u039f\u1f55\u03c4\u03c9\u03c2 \u03b3\u1f70\u03c1<\/span>\n              <span class=\"orig-mini-gloss\">In-this-way for<\/span>\n            <\/button>\n            <button class=\"orig-word-pill\" onclick=\"loadWordInSheet('egapesen', this)\">\n              <span class=\"orig-grk-text\">\u1f20\u03b3\u03ac\u03c0\u03b7\u03c3\u03b5\u03bd<\/span>\n              <span class=\"orig-mini-gloss\">loved<\/span>\n            <\/button>\n            <button class=\"orig-word-pill\" onclick=\"loadWordInSheet('ton_kosmon', this)\">\n              <span class=\"orig-grk-text\">\u1f41 \u0398\u03b5\u1f78\u03c2 \u03c4\u1f78\u03bd \u03ba\u03cc\u03c3\u03bc\u03bf\u03bd<\/span>\n              <span class=\"orig-mini-gloss\">God the world<\/span>\n            <\/button>\n            <button class=\"orig-word-pill active\" onclick=\"loadWordInSheet('monogene', this)\">\n              <span class=\"orig-grk-text\">\u03c4\u1f78\u03bd \u03a5\u1f31\u1f78\u03bd \u03c4\u1f78\u03bd \u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6<\/span>\n              <span class=\"orig-mini-gloss\">the Son the one-and-only<\/span>\n            <\/button>\n            <button class=\"orig-word-pill\" onclick=\"loadWordInSheet('edoken', this)\">\n              <span class=\"orig-grk-text\">\u1f14\u03b4\u03c9\u03ba\u03b5\u03bd<\/span>\n              <span class=\"orig-mini-gloss\">He-gave<\/span>\n            <\/button>\n            <button class=\"orig-word-pill\" onclick=\"loadWordInSheet('zoen_aionion', this)\">\n              <span class=\"orig-grk-text\">\u03b6\u03c9\u1f74\u03bd \u03b1\u1f30\u03ce\u03bd\u03b9\u03bf\u03bd<\/span>\n              <span class=\"orig-mini-gloss\">life eternal<\/span>\n            <\/button>\n          <\/div>\n        <\/div>\n\n        <!-- LAYER 2: Tappable Phonetic Transliteration -->\n        <div class=\"translit-flow-row layer-2-tl\">\n          <span class=\"translit-token\" onclick=\"loadWordInSheet('houtos')\">Hout\u014ds gar<\/span>\n          <span class=\"translit-token\" onclick=\"loadWordInSheet('egapesen')\">\u0113gap\u0113sen<\/span>\n          <span class=\"translit-token\" onclick=\"loadWordInSheet('ton_kosmon')\">ho Theos ton kosmon<\/span>\n          <span class=\"translit-token active\" onclick=\"loadWordInSheet('monogene')\">h\u014dste ton Huion ton monogen\u0113<\/span>\n          <span class=\"translit-token\" onclick=\"loadWordInSheet('edoken')\">ed\u014dken<\/span>\n          <span class=\"translit-token\" onclick=\"loadWordInSheet('zoen_aionion')\">hina pas ho pisteu\u014dn\u2026 ech\u0113 z\u014d\u0113n ai\u014dnion<\/span>\n        <\/div>\n\n        <!-- LAYER 4: Key Word Study (\u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6 monogen\u0113) -->\n        <div class=\"keyword-study-inline layer-4-kw\">\n          <div class=\"kw-lemma-header\">\n            <span class=\"kw-lemma-orig\" style=\"font-family:var(--font-serif);\">\u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6<\/span>\n            <span class=\"kw-lemma-translit\">monogen\u0113 \u00b7 Strong\u2019s G3439<\/span>\n          <\/div>\n          <p class=\"kw-essay-snippet\">\n            This adjective is often translated \u201conly begotten,\u201d a rendering going back through the Latin Vulgate\u2019s <em>unigenitus<\/em>. Morphologically, it joins <em>monos<\/em> (\u201conly\u201d) with <em>genos<\/em> (\u201ckind, class\u201d) \u2014 meaning \u201cunique, one of a kind, the beloved Son without peer.\u201d\n          <\/p>\n          <div class=\"study-card-footer\">\n            <a href=\"#sec-sheets\" class=\"btn-outline-door\" style=\"padding:4px 9px; font-size:11px;\" onclick=\"loadWordInSheet('monogene')\">\n              Inspect \u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6 \u2193\n            <\/a>\n            <a href=\"#sec-verse-study\" class=\"read-full-study-link\">\n              Read the full study \u203a\n            <\/a>\n          <\/div>\n        <\/div>\n      <\/article>\n    <\/div>\n  <\/section>\n\n  <!-- ========================================================================\n       SCREEN 4: INTERACTIVE WORD SHEET & NUMBERED CHAIN \u21163 SHEET\n       Tapping any Hebrew or Greek word above updates this sheet live.\n       ======================================================================== -->\n  <section id=\"sec-sheets\" class=\"screen-chapter\">\n    <div class=\"chapter-eyebrow\">\n      <span class=\"eyebrow-tag azure\">\ud83d\udd0d Screen 4 \u00b7 Word Sheet &amp; Chain \u21163<\/span>\n      <span class=\"eyebrow-sub\">Strong\u2019s \u00b7 Morphology \u00b7 Concordance<\/span>\n    <\/div>\n\n    <!-- WORD STUDY BOTTOM SHEET (WordStudySheet.kt) -->\n    <div class=\"bottom-sheet-card\" id=\"word-sheet-box\">\n      <div class=\"sheet-drag-pill\"><\/div>\n      <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n        <span style=\"font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--azure);\">\n          Word Study Sheet \u00b7 On-Device Originals DB\n        <\/span>\n        <span style=\"font-size:10px; color:var(--ink-muted);\">Tap any Hebrew/Greek token above<\/span>\n      <\/div>\n\n      <div class=\"ws-header-row\">\n        <div>\n          <div class=\"ws-headword\" id=\"ws-word\">\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0<\/div>\n          <div class=\"ws-translit-sub\" id=\"ws-translit\">b\u0101\u00b7r\u0101 \u00b7 Genesis 1:1<\/div>\n        <\/div>\n        <div style=\"text-align:right;\">\n          <span class=\"strongs-label-pill\" id=\"ws-strongs\">Strong\u2019s H1254<\/span>\n          <div style=\"font-size:10.5px; color:var(--ink-muted); margin-top:3px;\" id=\"ws-lemma\">Lemma: \u05d1\u05b8\u05bc\u05e8\u05b8\u05d0 (b\u0101r\u0101\u2019)<\/div>\n        <\/div>\n      <\/div>\n\n      <!-- Berean Morphology (No \u2726 \u2014 strictly factual grammar) -->\n      <div class=\"morphology-strip\">\n        <div class=\"morph-parse\" id=\"ws-parsing\">Verb \u00b7 Qal Perfect \u00b7 3rd Person Masculine Singular<\/div>\n        <div class=\"morph-gloss\" id=\"ws-gloss\">BSB gloss: \u201ccreated\u201d \u00b7 Subject in Qal/Niphal is exclusively God<\/div>\n      <\/div>\n\n      <!-- \u2726 Eliana Word Study Essay -->\n      <div style=\"margin-bottom:10px;\">\n        <div style=\"display:flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--gold); margin-bottom:4px;\">\n          <span>\u2726<\/span>\n          <span id=\"ws-essay-title\">Eliana word study \u2014 from Genesis 1:1<\/span>\n        <\/div>\n        <p style=\"font-size:12.5px; line-height:1.52; color:var(--ink-primary);\" id=\"ws-essay-body\">\n          In Hebrew, craftsmen shape existing clay or timber, but <em>b\u0101r\u0101<\/em> is reserved exclusively for divine creation\u2014initiation without preexisting resistance. Notice that the same verb returns when David asks God to create a clean heart (Psalm 51:10) and when Isaiah proclaims the new heavens (Isaiah 65:17).\n        <\/p>\n      <\/div>\n\n      <!-- Other Uses in Scripture (Bundled Concordance) -->\n      <div>\n        <div style=\"font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-muted);\">\n          Other uses in Scripture (Tap to jump in Bible)\n        <\/div>\n        <div class=\"concordance-chips\" id=\"ws-occurrences\">\n          <button class=\"occ-chip\" onclick=\"alert('Opens Genesis 1:27 in Bible Reader')\">Genesis 1:27<\/button>\n          <button class=\"occ-chip\" onclick=\"alert('Opens Psalm 51:10 in Bible Reader')\">Psalm 51:10<\/button>\n          <button class=\"occ-chip\" onclick=\"alert('Opens Isaiah 40:26 in Bible Reader')\">Isaiah 40:26<\/button>\n          <button class=\"occ-chip\" onclick=\"alert('Opens Isaiah 43:1 in Bible Reader')\">Isaiah 43:1<\/button>\n          <button class=\"occ-chip\" onclick=\"alert('Opens Isaiah 65:17 in Bible Reader')\">Isaiah 65:17<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- CHAIN \u21163 SHEET: Passages Linked Across Scripture -->\n    <div class=\"bottom-sheet-card\" style=\"border-color:var(--cinnabar-border); margin-bottom:4px;\">\n      <div class=\"sheet-drag-pill\"><\/div>\n      <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;\">\n        <span class=\"chain-pill\">Chain \u21163 \u00b7 4 Anchors Across Scripture<\/span>\n        <a href=\"#sec-library-practice\" style=\"font-size:11px; font-weight:700; color:var(--gold); text-decoration:none;\">Open Aliyah Study \u203a<\/a>\n      <\/div>\n      <h3 style=\"font-family:var(--font-serif); font-size:17px; font-weight:700; color:var(--ink-primary); margin-bottom:4px;\">\n        Out of Egypt \u2014 The Son Who Walks Israel\u2019s Road\n      <\/h3>\n      <p style=\"font-size:12px; color:var(--ink-secondary); line-height:1.45; margin-bottom:10px;\">\n        Follow the thread connecting God\u2019s firstborn son Israel in the Exodus to the one-and-only Son in the Gospels:\n      <\/p>\n\n      <div style=\"display:flex; flex-direction:column; gap:6px;\">\n        <div style=\"background:var(--bg-hero-inner); border:1px solid var(--border-hairline); border-radius:10px; padding:8px 10px;\">\n          <div style=\"font-size:11px; font-weight:700; color:var(--cinnabar);\">1 \u00b7 Exodus 4:22\u201323 \u2014 The Firstborn Title<\/div>\n          <div style=\"font-size:11.5px; color:var(--ink-secondary);\">\u201cIsrael is My firstborn son\u2026 Let My son go, that he may serve Me.\u201d<\/div>\n        <\/div>\n        <div style=\"background:var(--bg-hero-inner); border:1px solid var(--border-hairline); border-radius:10px; padding:8px 10px;\">\n          <div style=\"font-size:11px; font-weight:700; color:var(--cinnabar);\">2 \u00b7 Hosea 11:1 \u2014 The Retrospective Call<\/div>\n          <div style=\"font-size:11.5px; color:var(--ink-secondary);\">\u201cWhen Israel was a child, I loved him, and out of Egypt I called My son.\u201d<\/div>\n        <\/div>\n        <div style=\"background:var(--cinnabar-wash); border:1px solid var(--cinnabar-border); border-radius:10px; padding:8px 10px;\">\n          <div style=\"font-size:11px; font-weight:700; color:var(--cinnabar);\">3 \u00b7 Matthew 2:15 \u2014 The Fulfillment That Looks Backward<\/div>\n          <div style=\"font-size:11.5px; color:var(--ink-primary);\">\u201c\u2026to fulfill what the Lord had spoken through the prophet: \u2018Out of Egypt I called My Son.\u2019\u201d<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n  <!-- ========================================================================\n       SCREEN 5: VERSE STUDY PAGE (FIVE SECTIONS \u2014 VerseStudyScreen.kt)\n       1. Scripture (Original text + transliteration in gold-thread inset)\n       2. \u2726 Fresh Rendering pull-quote\n       3. Deeper Lens\n       4. Everyday Insight\n       5. Take-Home Practice (with door into the Journal)\n       ======================================================================== -->\n  <section id=\"sec-verse-study\" class=\"screen-chapter\">\n    <div class=\"chapter-eyebrow\">\n      <span class=\"eyebrow-tag\">\u2726 Screen 5 \u00b7 Verse Study Page (5 Sections)<\/span>\n      <span class=\"eyebrow-sub\">John 3:16 \u00b7 Instant Read<\/span>\n    <\/div>\n\n    <article class=\"study-5-article\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;\">\n        <div>\n          <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; color:var(--gold);\">\n            ELIANA \u00b7 FULL STUDY\n          <\/div>\n          <h3 style=\"font-family:var(--font-serif); font-size:20px; font-weight:700; color:var(--ink-primary);\">\n            John 3:16\n          <\/h3>\n        <\/div>\n        <div style=\"display:flex; gap:6px; align-items:center;\">\n          <a href=\"#sec-reader-study\" class=\"btn-outline-door\" style=\"padding:5px 9px; font-size:11px;\">\ud83d\udcd6 Open in Bible<\/a>\n          <button class=\"star-btn\" onclick=\"toggleStar(this)\">\u2605<\/button>\n        <\/div>\n      <\/div>\n\n      <!-- 1 \u00b7 SCRIPTURE (The Original Text + Transliteration inside Gold-Thread Inset) -->\n      <div class=\"inset-quote-box\" style=\"margin-top:4px;\">\n        <div style=\"font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.09em; color:var(--gold); margin-bottom:4px;\">\n          01 \u00b7 Scripture (Original Greek &amp; Transliteration)\n        <\/div>\n        <p style=\"font-family:var(--font-serif); font-size:17px; line-height:1.55; color:var(--ink-primary); margin-bottom:6px;\">\n          \u039f\u1f55\u03c4\u03c9\u03c2 \u03b3\u1f70\u03c1 \u1f20\u03b3\u03ac\u03c0\u03b7\u03c3\u03b5\u03bd \u1f41 \u0398\u03b5\u1f78\u03c2 \u03c4\u1f78\u03bd \u03ba\u03cc\u03c3\u03bc\u03bf\u03bd \u1f65\u03c3\u03c4\u03b5 \u03c4\u1f78\u03bd \u03a5\u1f31\u1f78\u03bd \u03c4\u1f78\u03bd \u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6 \u1f14\u03b4\u03c9\u03ba\u03b5\u03bd, \u1f35\u03bd\u03b1 \u03c0\u1fb6\u03c2 \u1f41 \u03c0\u03b9\u03c3\u03c4\u03b5\u03cd\u03c9\u03bd \u03b5\u1f30\u03c2 \u03b1\u1f50\u03c4\u1f78\u03bd \u03bc\u1f74 \u1f00\u03c0\u03cc\u03bb\u03b7\u03c4\u03b1\u03b9 \u1f00\u03bb\u03bb\u2019 \u1f14\u03c7\u1fc3 \u03b6\u03c9\u1f74\u03bd \u03b1\u1f30\u03ce\u03bd\u03b9\u03bf\u03bd.\n        <\/p>\n        <p style=\"font-family:var(--font-serif); font-style:italic; font-size:13px; line-height:1.45; color:var(--ink-secondary);\">\n          Hout\u014ds gar \u0113gap\u0113sen ho Theos ton kosmon h\u014dste ton Huion ton monogen\u0113 ed\u014dken, hina pas ho pisteu\u014dn eis auton m\u0113 apol\u0113tai all\u2019 ech\u0113 z\u014d\u0113n ai\u014dnion.\n        <\/p>\n      <\/div>\n\n      <!-- 2 \u00b7 FRESH RENDERING (\u2726 Pull-Quote) -->\n      <div class=\"pull-quote-rendering\">\n        <span style=\"color:var(--gold); font-size:15px; margin-top:3px;\">\u2726<\/span>\n        <div>\n          <div style=\"font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.09em; color:var(--gold); margin-bottom:2px;\">\n            02 \u00b7 Fresh Rendering\n          <\/div>\n          <p class=\"pull-quote-text\">\n            \u201cFor God loved the world in this way: he gave his one-and-only Son, so that everyone who believes in him would not perish but have eternal life.\u201d\n          <\/p>\n        <\/div>\n      <\/div>\n\n      <!-- 3 \u00b7 DEEPER LENS -->\n      <div class=\"section-kicker-gold\">03 \u00b7 Deeper Lens<\/div>\n      <div style=\"font-family:var(--font-serif); font-size:15px; font-weight:700; color:var(--gold); margin-bottom:6px;\">\n        \u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6 (monogen\u0113) \u2014 The Unrepeatable Son\n      <\/div>\n      <p class=\"study-prose-p\">\n        In Greek, <em>monogen\u0113s<\/em> combines <em>monos<\/em> (\u201conly, single\u201d) and <em>genos<\/em> (\u201ckind, stock\u201d), echoing the Septuagint\u2019s translation of Hebrew <em>y\u0101\u1e25\u00eed<\/em> in <a href=\"#sec-reader-study\" class=\"inline-scripture-door\">Genesis 22:2<\/a> (\u201cTake your son, your only one, whom you love\u201d). What Abraham was spared at Moriah, the Father completes here.\n      <\/p>\n\n      <!-- 4 \u00b7 EVERYDAY INSIGHT -->\n      <div class=\"section-kicker-gold\">04 \u00b7 Everyday Insight<\/div>\n      <p class=\"study-prose-p\">\n        The opening word <em>Hout\u014ds<\/em> means \u201cin this manner\u201d rather than merely \u201cso much.\u201d God\u2019s love is not an abstract mood measured by a thermometer; it has a concrete shape in history\u2014a gift given before we asked (<a href=\"#sec-reader-study\" class=\"inline-scripture-door\">Romans 5:8<\/a>).\n      <\/p>\n\n      <!-- 5 \u00b7 TAKE-HOME PRACTICE (Ends with a way into the Journal) -->\n      <div class=\"practice-box\">\n        <div class=\"section-kicker-gold\" style=\"margin-top:0;\">05 \u00b7 Take-Home Practice<\/div>\n        <p class=\"study-prose-p\" style=\"margin-bottom:10px;\">\n          Today, when you catch yourself trying to earn God\u2019s approval, pause and name one concrete place where you can rest in a love already given.\n        <\/p>\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n          <a href=\"#sec-library-practice\" class=\"btn-primary-gold\" style=\"flex:1;\">\u270e Reflect on this in your journal<\/a>\n          <a href=\"#sec-eliana-themes\" class=\"btn-outline-door\">\u2726 Ask Eliana<\/a>\n        <\/div>\n      <\/div>\n    <\/article>\n  <\/section>\n\n  <!-- ========================================================================\n       SCREEN 6: THE LIBRARY (3 BOOKS) & SANCTUARY PRACTICE\n       - Library Shelf: Eliana's Journal, Aliyah \u2014 The Ascent, The Foundations\n       - Rebuilt Stillness (Next-Sprint Vision: Sacred Pause + Scripture Breath)\n       - Throne Room (Prayer Generator + Curated Prayers) & Sacred Journal\n       - Journey Tapestry (Progress kept without streaks)\n       ======================================================================== -->\n  <section id=\"sec-library-practice\" class=\"screen-chapter\">\n    <div class=\"chapter-eyebrow\">\n      <span class=\"eyebrow-tag cinnabar\">\ud83c\udfdb Screen 6 \u00b7 Library &amp; Sanctuary Rooms<\/span>\n      <span class=\"eyebrow-sub\">Books \u00b7 Stillness \u00b7 Prayer \u00b7 Journal<\/span>\n    <\/div>\n\n    <!-- THE LIBRARY: A Shelf of Books, Each Opening Its Own Room -->\n    <div style=\"margin-bottom:14px;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;\">\n        <h3 style=\"font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--gold);\">\n          The Eliana Library\n        <\/h3>\n        <span style=\"font-size:10.5px; color:var(--ink-muted);\">3 Rooms \u00b7 Growing Shelf<\/span>\n      <\/div>\n\n      <!-- Book 1: Eliana's Journal -->\n      <div class=\"library-book-card\">\n        <div class=\"book-emblem\">E<\/div>\n        <div style=\"flex:1;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center;\">\n            <span style=\"font-family:var(--font-serif); font-size:15px; font-weight:700; color:var(--ink-primary);\">Eliana\u2019s Journal<\/span>\n            <span style=\"font-size:10px; font-weight:700; color:var(--gold);\">Ch 1 \u00b7 Day 2 \u203a<\/span>\n          <\/div>\n          <div style=\"font-size:11px; font-style:italic; color:var(--gold); margin-bottom:3px;\">by Michael W Thomas<\/div>\n          <p style=\"font-size:11.5px; color:var(--ink-secondary); line-height:1.4;\">\n            A compass to guide your journey through God\u2019s Word \u2014 daily teachings with Greek and Hebrew, reflection, and guided prayer.\n          <\/p>\n        <\/div>\n      <\/div>\n\n      <!-- Book 2: Aliyah \u2014 The Ascent -->\n      <div class=\"library-book-card\" style=\"border-color:var(--cinnabar-border);\">\n        <div class=\"book-emblem\" style=\"color:var(--cinnabar); border-color:var(--cinnabar-border);\">\u2116<\/div>\n        <div style=\"flex:1;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center;\">\n            <span style=\"font-family:var(--font-serif); font-size:15px; font-weight:700; color:var(--ink-primary);\">Aliyah \u2014 The Ascent<\/span>\n            <span class=\"chain-pill\">\u21163 Active \u203a<\/span>\n          <\/div>\n          <div style=\"font-size:11px; font-style:italic; color:var(--cinnabar); margin-bottom:3px;\">We ascend by digging<\/div>\n          <p style=\"font-size:11.5px; color:var(--ink-secondary); line-height:1.4;\">\n            Studies built from the numbered Scripture chains: \u21161 The Forsaken Cry \u00b7 \u21162 Who Raised Him? \u00b7 \u21163 Out of Egypt.\n          <\/p>\n        <\/div>\n      <\/div>\n\n      <!-- Book 3: The Foundations -->\n      <div class=\"library-book-card\">\n        <div class=\"book-emblem\" style=\"color:var(--azure); border-color:var(--azure-border);\">\u2726<\/div>\n        <div style=\"flex:1;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center;\">\n            <span style=\"font-family:var(--font-serif); font-size:15px; font-weight:700; color:var(--ink-primary);\">The Foundations<\/span>\n            <span style=\"font-size:10px; font-weight:700; color:var(--azure);\">3 Essays \u203a<\/span>\n          <\/div>\n          <div style=\"font-size:11px; font-style:italic; color:var(--azure); margin-bottom:3px;\">Trust that is earned, not demanded<\/div>\n          <p style=\"font-size:11.5px; color:var(--ink-secondary); line-height:1.4;\">\n            How the Words Reached You \u00b7 The Honest Brackets \u00b7 The Name Yeshua.\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- REBUILT STILLNESS (Next-Sprint Vision: Guided Breath + Scripture Cadence) -->\n    <div class=\"stillness-orb-card\">\n      <div style=\"font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold);\">\n        Sacred Stillness \u00b7 Rebuilt 2027 Guided Pause\n      <\/div>\n      <div class=\"breathing-halo\" onclick=\"toggleStillnessSession()\" title=\"Tap to start guided breath\">\n        <span style=\"font-family:var(--font-serif); font-size:12px; font-weight:700; color:var(--gold-on); background:var(--gold); padding:4px 10px; border-radius:99px;\" id=\"stillness-orb-label\">\n          Breathe\n        <\/span>\n      <\/div>\n      <div style=\"font-family:var(--font-serif); font-size:15px; color:var(--ink-primary); margin-bottom:3px;\" id=\"stillness-phrase\">\n        \u201cPeace to you in the middle of your day.\u201d\n      <\/div>\n      <div style=\"font-size:11.5px; color:var(--ink-secondary);\" id=\"stillness-sub\">\n        Inhale: <em>\u201cBe still, and know\u2026\u201d<\/em> (4s) \u00b7 Exhale: <em>\u201c\u2026that I am God.\u201d<\/em> (6s)\n      <\/div>\n    <\/div>\n\n    <!-- THRONE ROOM (Prayer Generator + Curated Prayers) & SACRED JOURNAL -->\n    <div class=\"surface-card\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;\">\n        <span style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold);\">\n          \ud83d\udd6f Throne Room &amp; Sacred Journal\n        <\/span>\n        <span style=\"font-size:10px; color:var(--ink-muted);\">Hebrews 4:16<\/span>\n      <\/div>\n\n      <!-- Prayer Generator Output -->\n      <div class=\"inset-quote-box\" style=\"margin-top:0;\">\n        <div style=\"display:flex; justify-content:space-between; font-size:10px; font-weight:700; color:var(--gold); margin-bottom:3px;\">\n          <span>\u2726 Woven Prayer \u00b7 Tied to Galatians 2:20<\/span>\n          <span>\u2605 Saved<\/span>\n        <\/div>\n        <p style=\"font-family:var(--font-serif); font-style:italic; font-size:13.5px; line-height:1.5; color:var(--ink-primary);\" id=\"prayer-text-box\">\n          \u201cFather YHWH, where I have been carrying today as if everything depended on my own strength, quiet my heart in the truth that Christ lives in me. Let His self-giving love be my steadiness tonight. Amen.\u201d\n        <\/p>\n      <\/div>\n\n      <div style=\"display:flex; gap:6px; margin-bottom:10px;\">\n        <button class=\"btn-primary-gold\" style=\"flex:1;\" onclick=\"generateNewPrayer()\">\u2726 Generate a Prayer<\/button>\n        <button class=\"btn-outline-door\" onclick=\"cycleCuratedPrayer()\">Curated: Mikaylah\u2019s \u21bb<\/button>\n      <\/div>\n\n      <!-- Sacred Journal Tied to Verse -->\n      <div style=\"border-top:1px solid var(--border-hairline); padding-top:10px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;\">\n          <span style=\"font-size:10.5px; font-weight:700; color:var(--gold);\">\u2712\ufe0f Your Sacred Space \u00b7 Tied to John 3:16<\/span>\n          <span style=\"font-size:10px; color:var(--ink-muted);\" id=\"journal-status\">Search &amp; History (18)<\/span>\n        <\/div>\n        <textarea id=\"journal-entry-box\" rows=\"2\" style=\"width:100%; background:var(--bg-hero-inner); border:1px solid var(--border-hairline); border-radius:10px; padding:8px 10px; color:var(--ink-primary); font-family:var(--font-serif); font-size:13px; resize:none;\">Resting tonight in how God loves\u2014\u201cin this way,\u201d by giving H

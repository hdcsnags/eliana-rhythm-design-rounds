      kjv: \"For God sent not his Son into the world to condemn the world; but that the world through him might be saved.\",\n          asv: \"For God sent not the Son into the world to judge the world; but that the world should be saved through him.\",\n          eliana: \"\u201cFor God did not send the Son into the world to pass judgment on the world, but so that the world might be rescued through him.\u201d\",\n          compareNote: \"BSB: \u201cto condemn the world, but to save the world through Him.\u201d\",\n          tokens: [\n            { t: \"\u03bf\u1f50 \u03b3\u1f70\u03c1\", tr: \"ou gar\", k: \"kosmon\" },\n            { t: \"\u1f00\u03c0\u03ad\u03c3\u03c4\u03b5\u03b9\u03bb\u03b5\u03bd\", tr: \"apesteilen\", k: \"egapesen\" },\n            { t: \"\u1f41 \u0398\u03b5\u1f78\u03c2\", tr: \"ho Theos\", k: \"egapesen\" },\n            { t: \"\u03c4\u1f78\u03bd \u03a5\u1f31\u1f78\u03bd\", tr: \"ton Huion\", k: \"monogene\" },\n            { t: \"\u03b5\u1f30\u03c2 \u03c4\u1f78\u03bd \u03ba\u03cc\u03c3\u03bc\u03bf\u03bd\", tr: \"eis ton kosmon\", k: \"kosmon\" },\n            { t: \"\u1f35\u03bd\u03b1 \u03ba\u03c1\u03af\u03bd\u1fc3\", tr: \"hina krin\u0113\", k: \"kosmon\" },\n            { t: \"\u1f00\u03bb\u03bb\u2019 \u1f35\u03bd\u03b1 \u03c3\u03c9\u03b8\u1fc7\", tr: \"all\u2019 hina s\u014dth\u0113\", k: \"aionion\" }\n          ],\n          kw: { orig: \"\u03ba\u03cc\u03c3\u03bc\u03bf\u03bd\", translit: \"kosmon\", short: \"Three times in one sentence John repeats \u201cthe world\u201d \u2014 underscoring that rescue, not condemnation, is the Father\u2019s mission.\", full: \"Three times in a single verse John repeats ton kosmon (\u201cthe world\u201d), letting the cadence itself undo the fear that God arrived with a gavel. The Son was sent on a rescue mission.\" }\n        }\n      ]\n    }\n  };\n\n  const VERSE_STUDIES = {\n    john3_16: {\n      ref: \"John 3:16\",\n      lang: \"grk\",\n      orig: \"\u039f\u1f55\u03c4\u03c9\u03c2 \u03b3\u1f70\u03c1 \u1f20\u03b3\u03ac\u03c0\u03b7\u03c3\u03b5\u03bd \u1f41 \u0398\u03b5\u1f78\u03c2 \u03c4\u1f78\u03bd \u03ba\u03cc\u03c3\u03bc\u03bf\u03bd \u1f65\u03c3\u03c4\u03b5 \u03c4\u1f78\u03bd \u03a5\u1f31\u1f78\u03bd \u03c4\u1f78\u03bd \u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6 \u1f14\u03b4\u03c9\u03ba\u03b5\u03bd \u1f35\u03bd\u03b1 \u03c0\u1fb6\u03c2 \u1f41 \u03c0\u03b9\u03c3\u03c4\u03b5\u03cd\u03c9\u03bd \u03b5\u1f30\u03c2 \u03b1\u1f50\u03c4\u1f78\u03bd \u03bc\u1f74 \u1f00\u03c0\u03cc\u03bb\u03b7\u03c4\u03b1\u03b9 \u1f00\u03bb\u03bb\u2019 \u1f14\u03c7\u1fc3 \u03b6\u03c9\u1f74\u03bd \u03b1\u1f30\u03ce\u03bd\u03b9\u03bf\u03bd\",\n      translit: \"Hout\u014ds gar \u0113gap\u0113sen ho Theos ton kosmon h\u014dste ton Huion ton monogen\u0113 ed\u014dken hina pas ho pisteu\u014dn eis auton m\u0113 apol\u0113tai all\u2019 ech\u0113 z\u014d\u0113n ai\u014dnion\",\n      rendering: \"\u201cFor God loved the world in this way: he gave his one-and-only Son, so that everyone who believes in him would not perish but have eternal life.\u201d\",\n      keyWord: \"\u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6 (monogen\u0113)\",\n      lens: \"The opening Greek adverb hout\u014ds does not primarily measure how intensely God loved (\u201cso much\u201d), though intensity is certainly there \u2014 it answers how: \u201cin this way.\u201d Love is not left as an invisible mood in heaven; it is defined by a concrete giving. And the gift is described with \u03bc\u03bf\u03bd\u03bf\u03b3\u03b5\u03bd\u1fc6, the word for what is irreplaceable and singular.\",\n      everyday: \"Familiar verses can grow smooth as river stones until our minds slide right past them. Reading John 3:16 through its original cadence restores its edge: God did not wait for the world to become lovable before acting. His posture toward you today is giving, not grudging.\",\n      practice: \"Before moving to the next task on your list, read the Fresh Rendering aloud once slowly. Replace \u201cthe world\u201d with your own name \u2014 not to shrink the verse, but to receive what is already true inside it.\"\n    },\n    gen1_1: {\n      ref: \"Genesis 1:1\",\n      lang: \"heb\",\n      orig: \"\u05d1\u05b0\u05bc\u05e8\u05b5\u05d0\u05e9\u05b4\u05c1\u05d9\u05ea \u05d1\u05b8\u05bc\u05e8\u05b8\u05d0 \u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd \u05d0\u05b5\u05ea \u05d4\u05b7\u05e9\u05b8\u05bc\u05c1\u05de\u05b7\u05d9\u05b4\u05dd \u05d5\u05b0\u05d0\u05b5\u05ea \u05d4\u05b8\u05d0\u05b8\u05e8\u05b6\u05e5\u05c3\",\n      translit: \"b\u0259\u00b7r\u00ea\u00b7\u0161\u00ee\u1e6f b\u0101\u00b7r\u0101 \u02be\u0115\u00b7l\u014d\u00b7h\u00eem \u02be\u00ea\u1e6f ha\u0161\u00b7\u0161\u0101\u00b7ma\u00b7yim w\u0259\u00b7\u02be\u00ea\u1e6f h\u0101\u00b7\u02be\u0101\u00b7re\u1e63\",\n      rendering: \"\u201cIn the beginning God created the heavens and the earth.\u201d\",\n      keyWord: \"\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0 (b\u0101r\u0101)\",\n      lens: \"Seven Hebrew words open the entire library of Scripture. The verb b\u0101r\u0101 (Qal perfect, 3rd masculine singular) is never once used in the Hebrew Bible with a human subject \u2014 only God creates in this way. Unlike ancient Near Eastern epics where the cosmos emerges from war between gods, Genesis opens in calm, uncontested sovereignty.\",\n      everyday: \"Everything you touch today \u2014 your work, your body, the quiet morning air \u2014 begins in intentional goodness, not accident. You are not trying to assemble meaning out of chaos on your own; you are living inside a world already spoken into being.\",\n      practice: \"Step outside or look through a window for thirty seconds. Name three ordinary created things you see, and thank the Creator who spoke them into existence.\"\n    }\n  };\n\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     STATE & INTERACTION CONTROLLERS\n     \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n  let state = {\n    theme: \"sanctuary\",\n    tab: \"home\",\n    dayIndex: 0,\n    savedDays: new Set(),\n    passageKey: \"genesis1\",\n    readerMode: \"study\", // 'read' | 'study'\n    version: \"BSB\",\n    fontSize: 18,\n    readFlow: \"flowing\", // 'flowing' | 'vbv'\n    showMarks: true,\n    selectedVerseNum: null,\n    inlineLensVerse: null,\n    highlights: {} // key: \"genesis1:1\" -> class\n  };\n\n  /* \u2500\u2500 Theme Switching \u2500\u2500 */\n  function setTheme(theme) {\n    state.theme = theme;\n    document.documentElement.setAttribute(\"data-theme\", theme);\n    document.querySelectorAll(\".theme-pill\").forEach(btn => {\n      btn.classList.toggle(\"active\", btn.dataset.setTheme === theme);\n    });\n    document.querySelectorAll(\".theme-card-preview\").forEach(card => {\n      card.classList.toggle(\"selected\", card.dataset.atelier === theme);\n    });\n  }\n  document.querySelectorAll(\".theme-pill\").forEach(btn => {\n    btn.addEventListener(\"click\", () => setTheme(btn.dataset.setTheme));\n  });\n\n  /* \u2500\u2500 Tab Switching \u2500\u2500 */\n  function switchTab(tab) {\n    state.tab = tab;\n    document.querySelectorAll(\".screen\").forEach(s => s.classList.remove(\"active\"));\n    document.getElementById(\"screen-\" + tab).classList.add(\"active\");\n    document.querySelectorAll(\".nav-tab\").forEach(b => b.classList.toggle(\"active\", b.dataset.tab === tab));\n    document.getElementById(\"elianaComposer\").classList.toggle(\"visible\", tab === \"eliana\");\n    if (tab !== \"bible\") {\n      clearVerseSelection();\n      toggleImmersive(false);\n    }\n    window.scrollTo({ top: 0, behavior: \"smooth\" });\n  }\n\n  /* \u2500\u2500 Home: Sacred Word Day Stepper \u2500\u2500 */\n  function renderDailyWord() {\n    const d = DAILY_WORDS[state.dayIndex];\n    document.getElementById(\"swDayLabel\").textContent = d.dayLabel;\n    document.getElementById(\"swRef\").textContent = d.ref;\n    document.getElementById(\"swVerse\").textContent = d.verse;\n    document.getElementById(\"swCarry\").textContent = d.carry;\n    document.getElementById(\"swNotice\").textContent = d.notice;\n    document.getElementById(\"swWhy\").textContent = d.why;\n\n    const badge = document.getElementById(\"swChainBadge\");\n    if (d.chain) {\n      badge.style.display = \"inline-flex\";\n      badge.textContent = \"\u2116\" + d.chain;\n      document.getElementById(\"swDeeperBtn\").textContent = \"\u2726 Ascend \u2116\" + d.chain;\n    } else {\n      badge.style.display = \"none\";\n      document.getElementById(\"swDeeperBtn\").textContent = \"\u2726 Deeper Study\";\n    }\n    document.getElementById(\"swDeeperBtn\").onclick = () => {\n      if (d.chain) openChainSheet();\n      else openVerseStudy(d.studyKey);\n    };\n\n    document.getElementById(\"prevDayBtn\").disabled = state.dayIndex >= DAILY_WORDS.length - 1;\n    document.getElementById(\"nextDayBtn\").disabled = state.dayIndex <= 0;\n\n    const isSaved = state.savedDays.has(d.ref);\n    document.getElementById(\"swSaveBtn\").classList.toggle(\"saved\", isSaved);\n    document.getElementById(\"swSaveLabel\").textContent = isSaved ? \"Saved\" : \"Save\";\n  }\n\n  function stepDay(delta) {\n    const next = state.dayIndex + delta;\n    if (next < 0 || next >= DAILY_WORDS.length) return;\n    state.dayIndex = next;\n    document.getElementById(\"swMore\").classList.remove(\"open\");\n    renderDailyWord();\n  }\n\n  function toggleSwMore() {\n    const el = document.getElementById(\"swMore\");\n    const open = el.classList.toggle(\"open\");\n    document.getElementById(\"swExpandBtn\").querySelector(\"span\").textContent =\n      open ? \"Less\" : \"More \u2014 Notice This \u00b7 Why It Matters\";\n  }\n\n  function toggleSaveDaily() {\n    const ref = DAILY_WORDS[state.dayIndex].ref;\n    if (state.savedDays.has(ref)) {\n      state.savedDays.delete(ref);\n      showToast(\"Removed from Saved Verses\");\n    } else {\n      state.savedDays.add(ref);\n      showToast(\"Saved \" + ref);\n    }\n    renderDailyWord();\n  }\n\n  /* \u2500\u2500 Bible Reader Rendering (Read & Study Modes) \u2500\u2500 */\n  function openPassage(key, mode) {\n    state.passageKey = key;\n    if (mode) state.readerMode = mode;\n    clearVerseSelection();\n    renderReader();\n    switchTab(\"bible\");\n  }\n\n  function setReaderMode(mode) {\n    state.readerMode = mode;\n    clearVerseSelection();\n    renderReader();\n  }\n\n  function selectDemoPassage(key) {\n    state.passageKey = key;\n    clearVerseSelection();\n    closeAllSheets();\n    renderReader();\n  }\n\n  function selectVersion(ver) {\n    state.version = ver;\n    document.querySelectorAll(\"#versionPickerGrid .dock-chip\").forEach(b => {\n      b.classList.toggle(\"primary\", b.dataset.ver === ver);\n    });\n    closeAllSheets();\n    renderReader();\n  }\n\n  function getVerseText(v) {\n    if (state.version === \"KJV\") return v.kjv;\n    if (state.version === \"ASV\") return v.asv;\n    if (state.version === \"ELIANA\") return v.eliana;\n    return v.bsb;\n  }\n\n  function renderReader() {\n    const p = PASSAGES[state.passageKey];\n    const verLabel = state.version === \"ELIANA\" ? \"\u2726 Eliana\" : state.version;\n    document.getElementById(\"readerPassageTitle\").textContent = `${p.book} ${p.chapter}`;\n    document.getElementById(\"readerVersionBadge\").textContent = verLabel;\n    document.getElementById(\"immersiveLabel\").textContent = `${p.book} ${p.chapter} \u00b7 ${verLabel}`;\n\n    document.getElementById(\"modeReadBtn\").classList.toggle(\"active\", state.readerMode === \"read\");\n    document.getElementById(\"modeStudyBtn\").classList.toggle(\"active\", state.readerMode === \"study\");\n    document.getElementById(\"readLayoutRow\").style.display = state.readerMode === \"read\" ? \"flex\" : \"none\";\n\n    const canvas = document.getElementById(\"readerCanvas\");\n    const otherKey = state.passageKey === \"genesis1\" ? \"john3\" : \"genesis1\";\n    const otherLabel = otherKey === \"john3\" ? \"John 3 (Greek)\" : \"Genesis 1 (Hebrew)\";\n\n    let html = `\n      <div class=\"chapter-ornament\">\n        <div class=\"chapter-book-label\">${p.book}<\/div>\n        <div class=\"chapter-num-display\">${p.chapter}<\/div>\n        <div class=\"chapter-subtitle\">${p.subtitle}<\/div>\n      <\/div>\n    `;\n\n    if (state.readerMode === \"read\") {\n      html += `<div class=\"read-prose ${state.readFlow} ${state.showMarks ? '' : 'hide-marks'}\">`;\n      p.verses.forEach((v, idx) => {\n        const key = `${state.passageKey}:${v.n}`;\n        const hl = state.highlights[key] || \"\";\n        const sel = state.selectedVerseNum === v.n ? \"selected\" : \"\";\n        const text = getVerseText(v);\n        html += `<span class=\"v-unit\">`;\n        if (idx === 0 && state.readFlow === \"flowing\") {\n          const clean = text.replace(/^\u201c/, \"\");\n          const firstChar = clean.charAt(0);\n          const restText = clean.slice(1);\n          html += `<span class=\"chapter-dropcap\">${firstChar}<\/span>`;\n          html += `<span class=\"v-span ${hl} ${sel}\" onclick=\"selectVerse(${v.n})\">`;\n          html += `<sup class=\"v-star\">\u2726<\/sup>${restText} `;\n          html += `<\/span>`;\n        } else {\n          html += `<span class=\"v-span ${hl} ${sel}\" onclick=\"selectVerse(${v.n})\">`;\n          html += `<sup class=\"v-num\">${v.n}<\/sup><sup class=\"v-star\">\u2726<\/sup>${text} `;\n          html += `<\/span>`;\n        }\n        if (state.inlineLensVerse === v.n) {\n          html += `\n            <span class=\"inline-lens-card\">\n              <span class=\"inline-lens-head\">\n                <span class=\"eyebrow\">\u2726 Eliana Lens \u00b7 ${p.book} ${p.chapter}:${v.n}<\/span>\n                <button style=\"font-size:11.5px;color:var(--gold);font-weight:600\" onclick=\"event.stopPropagation(); openVerseStudy('${v.studyKey}')\">Full Study \u203a<\/button>\n              <\/span>\n              <span style=\"display:block;font-family:var(--font-serif);font-size:15.5px;color:var(--text);margin-bottom:8px\">${v.eliana}<\/span>\n              <span style=\"display:block;font-size:13px;color:var(--text-secondary);line-height:1.55\">\n                <strong style=\"color:var(--gold)\">${v.kw.orig}<\/strong> <em>(${v.kw.translit})<\/em> \u2014 ${v.kw.short}\n              <\/span>\n            <\/span>\n          `;\n        }\n        html += `<\/span>`;\n      });\n      html += `<\/div>`;\n      html += `<p style=\"margin-top:20px;font-size:12px;color:var(--text-tertiary);text-align:center\">Tap any verse to highlight, compare, or open Eliana\u2019s Lens.<\/p>`;\n    } else {\n      // STUDY MODE \u2014 Architectural Interlinear Spreads\n      p.verses.forEach(v => {\n        const origCls = p.lang === \"heb\" ? \"orig-words-hebrew\" : \"orig-words-greek\";\n        const kwCls = p.lang === \"heb\" ? \"heb\" : \"grk\";\n        const tokensHtml = v.tokens.map(tok =>\n          `<span class=\"orig-word\" onclick=\"openWordSheet('${tok.k}')\">${tok.t}<\/span>`\n        ).join(\"\");\n        const translitHtml = v.tokens.map(tok =>\n          `<span class=\"translit-token\" onclick=\"openWordSheet('${tok.k}')\">${tok.tr}<\/span>`\n        ).join(\"\");\n\n        html += `\n          <article class=\"study-spread\">\n            <div class=\"study-head\">\n              <div class=\"study-vnum\">\n                <span class=\"study-vnum-badge\">${p.chapter}:${v.n}<\/span>\n                ${v.chain ? `<button class=\"chain-badge\" onclick=\"openChainSheet()\">\u2116${v.chain}<\/button>` : ``}\n              <\/div>\n              <button class=\"study-open-link\" onclick=\"openVerseStudy('${v.studyKey}')\">\n                Full study\n                <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"9 18 15 12 9 6\"/><\/svg>\n              <\/button>\n            <\/div>\n\n            <div class=\"study-eliana-line\">\n              <span class=\"study-spark\">\u2726<\/span>\n              <p class=\"study-rendering\">${v.eliana}<\/p>\n            <\/div>\n            <div class=\"study-compare-whisper\">${v.compareNote}<\/div>\n\n            <div class=\"orig-plate\">\n              <div class=\"${origCls}\">${tokensHtml}<\/div>\n              <div class=\"translit-row\">${translitHtml}<\/div>\n              <div class=\"tap-hint\">\n                <svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"/><\/svg>\n                Tap any ${p.lang === \"heb\" ? \"Hebrew\" : \"Greek\"} word for Strong\u2019s &amp; grammar\n              <\/div>\n            <\/div>\n\n            <div class=\"keyword-thread\">\n              <div class=\"keyword-head\">\n                <span class=\"keyword-orig ${kwCls}\">${v.kw.orig}<\/span>\n                <span class=\"keyword-translit\">${v.kw.translit}<\/span>\n              <\/div>\n              <p class=\"keyword-note\" id=\"kw-note-${state.passageKey}-${v.n}\">${v.kw.short}<\/p>\n              <button class=\"keyword-more-btn\" onclick=\"toggleKeywordNote(this, '${state.passageKey}', ${v.n})\">Read on<\/button>\n            <\/div>\n          <\/article>\n        `;\n      });\n    }\n\n    html += `\n      <div class=\"chapter-nav-footer\">\n        <button class=\"chap-nav-btn\" onclick=\"selectDemoPassage('${otherKey}')\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"15 18 9 12 15 6\"/><\/svg>\n          Switch to ${otherLabel}\n        <\/button>\n        <button class=\"chap-nav-btn\" onclick=\"setReaderMode('${state.readerMode === 'read' ? 'study' : 'read'}')\">\n          ${state.readerMode === 'read' ? 'Open Study Mode' : 'Open Read Mode'}\n        <\/button>\n      <\/div>\n    `;\n\n    canvas.innerHTML = html;\n  }\n\n  function toggleKeywordNote(btn, passageKey, verseNum) {\n    const v = PASSAGES[passageKey].verses.find(x => x.n === verseNum);\n    if (!v) return;\n    const el = document.getElementById(`kw-note-${passageKey}-${verseNum}`);\n    const expanded = btn.dataset.exp === \"1\";\n    el.textContent = expanded ? v.kw.short : v.kw.full;\n    btn.textContent = expanded ? \"Read on\" : \"Show less\";\n    btn.dataset.exp = expanded ? \"0\" : \"1\";\n  }\n\n  /* \u2500\u2500 Read Mode Verse Selection & Action Dock \u2500\u2500 */\n  function selectVerse(num) {\n    if (state.selectedVerseNum === num) {\n      clearVerseSelection();\n      return;\n    }\n    state.selectedVerseNum = num;\n    const p = PASSAGES[state.passageKey];\n    document.getElementById(\"dockRefLabel\").textContent = `${p.book} ${p.chapter}:${num}`;\n    document.getElementById(\"verseDock\").classList.add(\"open\");\n    renderReader();\n  }\n\n  function clearVerseSelection() {\n    state.selectedVerseNum = null;\n    document.getElementById(\"verseDock\").classList.remove(\"open\");\n    if (state.tab === \"bible\") renderReader();\n  }\n\n  function applyHighlight(cls) {\n    if (!state.selectedVerseNum) return;\n    const key = `${state.passageKey}:${state.selectedVerseNum}`;\n    if (cls) state.highlights[key] = cls;\n    else delete state.highlights[key];\n    renderReader();\n    showToast(cls ? \"Verse highlighted\" : \"Highlight cleared\");\n  }\n\n  function toggleInlineLens() {\n    if (!state.selectedVerseNum) return;\n    state.inlineLensVerse = state.inlineLensVerse === state.selectedVerseNum ? null : state.selectedVerseNum;\n    renderReader();\n  }\n\n  function openSelectedFullStudy() {\n    const p = PASSAGES[state.passageKey];\n    const v = p.verses.find(x => x.n === state.selectedVerseNum) || p.verses[0];\n    clearVerseSelection();\n    openVerseStudy(v.studyKey);\n  }\n\n  function openCompareSheet() {\n    const p = PASSAGES[state.passageKey];\n    const v = p.verses.find(x => x.n === state.selectedVerseNum) || p.verses[0];\n    document.getElementById(\"compareRefTitle\").textContent = `${p.book} ${p.chapter}:${v.n}`;\n    const rows = [\n      { code: \"\u2726 Eliana\", text: v.eliana },\n      { code: \"BSB\", text: v.bsb },\n      { code: \"KJV\", text: v.kjv },\n      { code: \"ASV\", text: v.asv }\n    ];\n    document.getElementById(\"compareList\").innerHTML = rows.map(r => `\n      <div style=\"padding:11px 13px;background:var(--surface);border:1px solid var(--hairline);border-radius:12px\">\n        <div style=\"font-size:10.5px;font-weight:700;letter-spacing:0.1em;color:var(--gold);margin-bottom:4px\">${r.code}<\/div>\n        <div class=\"serif\" style=\"font-size:14.5px;line-height:1.5;color:var(--text)\">${r.text}<\/div>\n      <\/div>\n    `).join(\"\");\n    openSheet(\"sheet-compare\");\n  }\n\n  function askElianaAboutSelected() {\n    const p = PASSAGES[state.passageKey];\n    const n = state.selectedVerseNum || p.verses[0].n;\n    clearVerseSelection();\n    switchTab(\"eliana\");\n    sendQuickPrompt(`Tell me more about ${p.book} ${p.chapter}:${n} in its original language.`);\n  }\n\n  function copySelectedVerse() {\n    const p = PASSAGES[state.passageKey];\n    const n = state.selectedVerseNum || p.verses[0].n;\n    showToast(`Copied ${p.book} ${p.chapter}:${n} (${state.version})`);\n    clearVerseSelection();\n  }\n\n  /* \u2500\u2500 Aa Typography Controls \u2500\u2500 */\n  function toggleAaDrawer() {\n    const open = document.getElementById(\"aaDrawer\").classList.toggle(\"open\");\n    document.getElementById(\"aaToggleBtn\").classList.toggle(\"active\", open);\n  }\n  function adjustFontSize(delta) {\n    state.fontSize = Math.min(23, Math.max(15, state.fontSize + delta));\n    document.documentElement.style.setProperty(\"--reader-size\", state.fontSize + \"px\");\n    document.getElementById(\"aaSample\").style.fontSize = state.fontSize + \"px\";\n  }\n  function setLineSpacing(val, btn) {\n    document.documentElement.style.setProperty(\"--reader-leading\", val);\n    btn.parentElement.querySelectorAll(\".seg-opt\").forEach(b => b.classList.remove(\"active\"));\n    btn.classList.add(\"active\");\n  }\n  function setReadFlow(mode, btn) {\n    state.readFlow = mode;\n    btn.parentElement.querySelectorAll(\".seg-opt\").forEach(b => b.classList.remove(\"active\"));\n    btn.classList.add(\"active\");\n    renderReader();\n  }\n  function toggleStudyMarks() {\n    state.showMarks = !state.showMarks;\n    document.getElementById(\"marksToggle\").classList.toggle(\"active\", state.showMarks);\n    renderReader();\n  }\n  function toggleImmersive(on) {\n    document.getElementById(\"appShell\").classList.toggle(\"immersive\", on);\n    if (on) {\n      document.getElementById(\"aaDrawer\").classList.remove(\"open\");\n      clearVerseSelection();\n    }\n  }\n\n  /* \u2500\u2500 Word Study Sheet \u2500\u2500 */\n  function openWordSheet(key) {\n    const w = WORD_LEXICON[key] || WORD_LEXICON.bara;\n    const wordEl = document.getElementById(\"wsWord\");\n    wordEl.textContent = w.word;\n    wordEl.className = \"ws-word \" + w.lang;\n    document.getElementById(\"wsTranslit\").textContent = w.translit;\n    document.getElementById(\"wsStrongs\").textContent = w.strongs;\n    document.getElementById(\"wsParsing\").textContent = w.parsing;\n    document.getElementById(\"wsGloss\").textContent = \"BSB gloss: \" + w.gloss;\n    document.getElementById(\"wsEssay\").textContent = w.essay;\n    document.getElementById(\"wsOccurrences\").innerHTML = w.occurrences.map(occ =>\n      `<button class=\"ws-occ-chip\" onclick=\"closeAllSheets(); showToast('Jumped to ${occ}')\">${occ}<\/button>`\n    ).join(\"\");\n    openSheet(\"sheet-word\");\n  }\n\n  /* \u2500\u2500 Full 5-Section Verse Study Overlay \u2500\u2500 */\n  function openVerseStudy(key) {\n    const s = VERSE_STUDIES[key] || VERSE_STUDIES.john3_16;\n    const targetPassage = key === \"gen1_1\" ? \"genesis1\" : \"john3\";\n    document.getElementById(\"vsHeaderRef\").textContent = s.ref;\n    document.getElementById(\"vsOpenBibleBtn\").onclick = () => {\n      closeOverlay(\"overlay-verse-study\");\n      openPassage(targetPassage, \"study\");\n    };\n    const origFont = s.lang === \"heb\"\n      ? \"font-family:var(--font-hebrew);font-size:26px;line-height:2;direction:rtl\"\n      : \"font-family:var(--font-greek);font-size:21px;line-height:1.65\";\n\n    document.getElementById(\"vsBody\").innerHTML = `\n      <div class=\"eyebrow\">Eliana \u00b7 Full Study<\/div>\n      <div class=\"vs-orig-box\">\n        <div style=\"${origFont};color:var(--text)\">${s.orig}<\/div>\n        <div class=\"serif\" style=\"font-style:italic;font-size:14px;color:var(--text-secondary);margin-top:8px\">${s.translit}<\/div>\n      <\/div>\n\n      <div class=\"vs-pullquote\">\n        <span style=\"color:var(--gold);font-size:15px;padding-top:4px\">\u2726<\/span>\n        <p>${s.rendering}<\/p>\n      <\/div>\n\n      <div class=\"vs-section\">\n        <div class=\"eyebrow\">Deeper Lens<\/div>\n        <div class=\"serif\" style=\"font-size:18px;font-weight:600;color:var(--gold);margin-top:6px\">${s.keyWord}<\/div>\n        <p>${s.lens}<\/p>\n      <\/div>\n\n      <div class=\"vs-section\">\n        <div class=\"eyebrow\">Everyday Insight<\/div>\n        <p>${s.everyday}<\/p>\n      <\/div>\n\n      <div class=\"vs-practice-box\">\n        <div class=\"eyebrow\" style=\"margin-bottom:6px\">Take-Home Practice<\/div>\n        <p style=\"font-size:14.5px;line-height:1.65;margin:0 0 12px;color:var(--text)\">${s.practice}<\/p>\n        <button style=\"font-size:12.5px;font-weight:600;color:var(--gold)\" onclick=\"closeOverlay('overlay-verse-study'); openJournalModal(true)\">Reflect on this in your journal \u2192<\/button>\n      <\/div>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:20px\">\n        <button class=\"btn-ghost\" style=\"width:100%\" onclick=\"closeOverlay('overlay-verse-study'); switchTab('eliana')\">\u2726 Ask Eliana a follow-up question<\/button>\n      <\/div>\n    `;\n    openOverlay(\"overlay-verse-study\");\n  }\n\n  /* \u2500\u2500 Eliana Chat Interaction \u2500\u2500 */\n  function sendElianaInput() {\n    const inp = document.getElementById(\"elianaInput\");\n    const txt = inp.value.trim();\n    if (!txt) return;\n    inp.value = \"\";\n    sendQuickPrompt(txt);\n  }\n\n  function sendQuickPrompt(text) {\n    const thread = document.getElementById(\"elianaThread\");\n    const u = document.createElement(\"div\");\n    u.className = \"msg-user\";\n    u.textContent = text;\n    thread.appendChild(u);\n\n    const r = document.createElement(\"div\");\n    r.className = \"msg-eliana\";\n    r.innerHTML = `<div class=\"msg-eliana-label\"><span>\u2726<\/span> Eliana<\/div><p class=\"muted\">Reflecting\u2026<\/p>`;\n    thread.appendChild(r);\n    window.scrollTo({ top: document.body.scrollHeight, behavior: \"smooth\" });\n\n    setTimeout(() => {\n      let reply = \"Scripture invites us to slow down and listen carefully to the exact words God chose. Notice how the original grammar shifts the weight from human striving back onto God\u2019s faithful action \u2014 would you like to open that passage in Study mode together?\";\n      if (text.toLowerCase().includes(\"b\u0101r\u0101\") || text.toLowerCase().includes(\"genesis\")) {\n        reply = \"In Genesis 1:1, <strong>\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0<\/strong> (<em>b\u0101r\u0101<\/em>) is used in the Qal stem exclusively with God as its subject. Nothing competes with Him at the threshold of creation \u2014 every breath you take today begins inside that same steady, spoken goodness.\";\n      } else if (text.toLowerCase().includes(\"pray\")) {\n        reply = \"<em>Father, thank You that my life is hidden with Christ. Quiet the parts of me still trying to carry what You have already borne, and let me walk today in the peace of Your Son\u2019s love. Amen.<\/em>\";\n      } else if (text.toLowerCase().includes(\"chain\")) {\n        reply = \"Chain \u21163 links Exodus 4:22 (\u201cIsrael is my firstborn son\u201d), Hosea 11:1 (\u201cOut of Egypt I called my son\u201d), and Matthew 2:15. Matthew shows that Yeshua relives Israel\u2019s entire story \u2014 and completes it faithfully where humanity stumbled.\";\n      }\n      r.innerHTML = `<div class=\"msg-eliana-label\"><span>\u2726<\/span> Eliana<\/div><p>${reply}<\/p>`;\n      window.scrollTo({ top: document.body.scrollHeight, behavior: \"smooth\" });\n    }, 450);\n  }\n\n  function resetElianaChat() {\n    document.getElementById(\"elianaThread\").innerHTML = `\n      <div style=\"text-align:center;padding:36px 12px\">\n        <div class=\"eliana-avatar\" style=\"margin:0 auto 12px;width:44px;height:44px;font-size:18px\">\u2726<\/div>\n        <div class=\"serif\" style=\"font-size:21px;margin-bottom:6px\">Peace to you.<\/div>\n        <p style=\"font-size:13.5px;color:var(--text-secondary);max-width:260px;margin:0 auto\">Bring a verse, an original word, or whatever is resting on your heart today.<\/p>\n      <\/div>\n    `;\n  }\n\n  /* \u2500\u2500 Sheets, Overlays, Stillness, Journal, Prayer \u2500\u2500 */\n  function openSheet(id) {\n    closeAllSheets();\n    document.getElementById(\"scrim\").classList.add(\"open\");\n    document.getElementById(id).classList.add(\"open\");\n  }\n  function openChainSheet() { openSheet(\"sheet-chain\"); }\n  function closeAllSheets() {\n    document.getElementById(\"scrim\").classList.remove(\"open\");\n    document.querySelectorAll(\".bottom-sheet\").forEach(s => s.classList.remove(\"open\"));\n  }\n  function openOverlay(id) {\n    document.getElementById(id).classList.add(\"open\");\n  }\n  function closeOverlay(id) {\n    document.getElementById(id).classList.remove(\"open\");\n  }\n\n  let breathTimer = null;\n  function openStillness() {\n    openOverlay(\"overlay-stillness\");\n    const cues = [\"Breathe in slowly\u2026\", \"Rest in the quiet\u2026\", \"Release gently\u2026\"];\n    let i = 0;\n    document.getElementById(\"breathCue\").textContent = cues[0];\n    clearInterval(breathTimer);\n    breathTimer = setInterval(() => {\n      i = (i + 1) % cues.length;\n      document.getElementById(\"breathCue\").textContent = cues[i];\n    }, 4000);\n  }\n  function closeStillness() {\n    clearInterval(breathTimer);\n    closeOverlay(\"overlay-stillness\");\n  }\n\n  function openJournalModal(fromDaily) {\n    const d = DAILY_WORDS[state.dayIndex];\n    document.getElementById(\"journalVerseRef\").textContent = \"\u2726 \" + d.ref;\n    document.getElementById(\"journalVerseText\").textContent = d.verse;\n    document.getElementById(\"journalQuoteBox\").style.display = fromDaily ? \"block\" : \"none\";\n    document.getElementById(\"journalTextarea\").value = \"\";\n    openOverlay(\"overlay-journal\");\n  }\n\n  function openPrayerModal(fromDaily) {\n    const d = DAILY_WORDS[state.dayIndex];\n    document.getElementById(\"prayerInput\").value = fromDaily ? `Help me pray through ${d.ref} today\u2026` : \"\";\n    document.getElementById(\"generatedPrayerOut\").style.display = \"none\";\n    openOverlay(\"overlay-prayer\");\n  }\n\n  function generateSamplePrayer() {\n    document.getElementById(\"generatedPrayerOut\").style.display = \"block\";\n  }\n\n  let toastTimer = null;\n  function showToast(msg) {\n    const t = document.getElementById(\"toast\");\n    t.textContent = msg;\n    t.classList.add(\"show\");\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(() => t.classList.remove(\"show\"), 2200);\n  }\n\n  // Initial render\n  renderDailyWord();\n  renderReader();\n<\/script>\n<\/body>\n<\/html>\n<!-- Vision: Reimagine Eliana's Rhythm as an illuminated heirloom book rather than a dashboard of Material cards \u2014 bringing the splash screen's engraved serif dignity, hairline gilt craft, and spatial calm into every room of the app. Unify Journey and Quick Access into a coherent Sanctuary with tactile collector book covers, turn Read and Study modes into effortless printed-page and tappable interlinear spreads, and sharpen five distinct physical-edition themes. -->\n"}, {"letter": "C", "seat": "fable", "file": "mockup.html", "html": "<!-- Model: Claude Fable 5.2 (claude-fable-5-2) -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Eliana's Rhythm: One Thread<\/title>\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%}\nbody{background:#000;font-family:-apple-system,BlinkMacSystemFont,\"Avenir Next\",\"Segoe UI\",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}\nbutton:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}\nsvg{display:block}\n.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}\n\n/* ---------- Four themes, one for each hour. Night is the shipped Shekinah, kept. ---------- */\n#app{--serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,\"Book Antiqua\",\"Noto Serif\",Georgia,serif;\n  --heb:\"SBL Hebrew\",\"Ezra SIL\",\"Noto Serif Hebrew\",\"Times New Roman\",\"Arial Hebrew\",serif;--s:1}\n#app[data-theme=dawn]{--bg:#F5EDE3;--page:#FCF7F0;--ink:#2A1E22;--mute:#6C5B5C;--line:rgba(42,30,34,.15);--acc:#AE3A1C;--on:#FFF8F0;--gold:#8C6210;--sun:#F29B4B;--wash:rgba(174,58,28,.08);\n  --sky:linear-gradient(180deg,#F1C2A0 0%,#F6DCC7 34%,#F5EDE3 68%)}\n#app[data-theme=day]{--bg:#F5F6F2;--page:#FFFFFF;--ink:#0E1A2C;--mute:#4F5D6E;--line:rgba(14,26,44,.14);--acc:#1C3DA8;--on:#FFFFFF;--gold:#86650F;--sun:#F2B01E;--wash:rgba(28,61,168,.07);\n  --sky:linear-gradient(180deg,#C5DAF4 0%,#E4EDF6 36%,#F5F6F2 68%)}\n#app[data-theme=dusk]{--bg:#15112A;--page:#201A3B;--ink:#F6EADC;--mute:#B9ADC0;--line:rgba(246,234,220,.16);--acc:#F2A679;--on:#1A1230;--gold:#EBC06C;--sun:#F58A52;--wash:rgba(242,166,121,.10);\n  --sky:linear-gradient(180deg,#5A2E63 0%,#2E1D52 34%,#15112A 68%)}\n#app[data-theme=night]{--bg:#000000;--page:#0D0D0D;--ink:#E8E4DC;--mute:#A6A29A;--line:rgba(232,228,220,.16);--acc:#FFC233;--on:#1A1200;--gold:#FFC233;--sun:#F3EAD0;--wash:rgba(255,194,51,.09);\n  --sky:radial-gradient(1.3px 1.3px at 12% 6%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 30% 15%,#fff 50%,transparent 52%),radial-gradient(1.4px 1.4px at 61% 4%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 79% 12%,#fff 50%,transparent 52%),radial-gradient(1.2px 1.2px at 91% 22%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 46% 24%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 7% 27%,#fff 50%,transparent 52%),linear-gradient(180deg,#0A1026 0%,#04060F 34%,#000 68%)}\n#app.hc{--mute:var(--ink);--line:var(--ink)}\n\n#app{position:relative;height:100vh;height:100dvh;max-width:430px;margin:0 auto;background:var(--bg);color:var(--ink);overflow:hidden;transition:background .6s,color .6s}\n\n/* Mockup control: not part of the app */\n#mock{position:absolute;top:0;left:0;right:0;height:38px;z-index:40;display:flex;align-items:center;gap:6px;padding:0 10px;background:#111;color:#bbb;font-size:11px;letter-spacing:.08em;text-transform:uppercase}\n#mock span{margin-right:auto}\n#mock button{height:28px;padding:0 10px;border-radius:14px;display:flex;align-items:center;gap:6px;color:#ddd;font-size:11px;letter-spacing:.04em;text-transform:none;font-weight:600}\n#mock button i{width:10px;height:10px;border-radius:50%;display:block}\n#mock button[aria-pressed=true]{background:#fff;color:#000}\n\n.screen{position:absolute;top:38px;left:0;right:0;bottom:70px;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}\n#app[data-tab=today] #today,#app[data-tab=bible] #bible,#app[data-tab=rooms] #rooms,#app[data-tab=journey] #journey{display:block}\n.pad{padding:18px 22px 48px}\n.eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}\n.eyebrow.q{color:var(--mute)}\n.mute{color:var(--mute)}\nh1{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}\nh2{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.2}\n.star{color:var(--gold)}\n.heb{font-family:var(--heb);direction:rtl;unicode-bidi:isolate}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:24px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px}\n.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}\n.btn.acc{background:var(--acc);color:var(--on)}\n.icbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}\n.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n.rule{height:1px;background:var(--line);margin:30px 0 22px}\n\n/* ---------- Today ---------- */\n#today{background:var(--sky)}\n.top{display:flex;justify-content:space-between;align-items:center;margin:-4px -8px 6px 0}\n.mark{font-family:var(--serif);font-size:21px;letter-spacing:.01em}\n.mark small{font-family:inherit;font-style:italic;font-size:13px;color:var(--mute);margin-left:8px}\n.hours{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin:14px 0 30px}\n.hours::before{content:\"\";position:absolute;left:12.5%;right:12.5%;top:9px;height:1px;background:var(--line)}\n.hours button{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:48px;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--mute);position:relative}\n.hours i{width:9px;height:9px;margin:5px 0;border-radius:50%;background:var(--bg);border:1.5px solid var(--mute);transition:all .5s}\n.hours button[aria-pressed=true]{color:var(--ink)}\n.hours button[aria-pressed=true] i{width:19px;height:19px;margin:0;background:var(--sun);border-color:var(--sun);box-shadow:0 0 22px 2px var(--sun)}\n.word{display:block;width:100%;text-align:center;font-size:92px;line-height:1.25;color:var(--ink);margin-top:2px}\n.wordsub{text-align:center;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--mute);margin-bottom:22px}\n.wordsub b{font-style:normal;font-weight:600;color:var(--acc);font-family:-apple-system,system-ui,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-left:8px}\n.verse{font-family:var(--serif);font-size:calc(29px*var(--s));line-height:1.2;letter-spacing:-.012em;text-wrap:balance}\n.ref{font-size:13px;font-weight:600;color:var(--mute);margin:10px 0 18px}\n.render{font-family:var(--serif);font-size:calc(17px*var(--s));line-height:1.5;padding-left:26px;position:relative;margin-bottom:22px}\n.render::before{content:\"\u2726\";position:absolute;left:0;top:0;color:var(--gold)}\n.carry{margin-top:24px;font-size:15px;line-height:1.55}\n.carry b{display:block;margin-bottom:5px}\n\n/* The thread: the one line that runs through the whole app */\n.thread{position:relative;padding-left:34px}\n.thread::before{content:\"\";position:absolute;left:8px;top:14px;bottom:14px;width:1.5px;background:linear-gradient(var(--gold),var(--gold)) no-repeat,var(--line);background-size:100% var(--done,0%)}\n.knot{position:relative;display:block;width:100%;padding:13px 0;min-height:64px}\n.knot::before{content:\"\";position:absolute;left:-31px;top:19px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1.5px solid var(--mute)}\n.knot.kept::before{background:var(--gold);border-color:var(--gold)}\n.knot.now::before{width:17px;height:17px;left:-34px;top:16px;background:var(--sun);border-color:var(--sun);box-shadow:0 0 18px 1px var(--sun)}\n.knot .k{font-size:11.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}\n.knot.now .k{color:var(--acc)}\n.knot .t{display:block;font-family:var(--serif);font-size:20px;line-height:1.25;margin:3px 0 2px}\n.knot .d{display:block;font-size:14px;color:var(--mute);line-height:1.4}\n.knot .go{display:none;margin-top:12px}\n.knot.now .go{display:inline-flex}\n.doors{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:12px}\n.doors button{display:flex;align-items:center;gap:12px;min-height:62px;padding:0 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px;font-weight:600}\n.doors .ic{color:var(--acc)}\n.foot{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--mute);line-height:1.5;margin-top:26px;text-align:center}\n\n/* ---------- Bible ---------- */\n.bhead{position:sticky;top:0;z-index:3;background:var(--bg);padding:8px 14px 10px 22px;border-bottom:1px solid var(--line);transition:background .6s}\n.bhead .r1{display:flex;align-items:center;gap:6px}\n.bookbtn{font-family:var(--serif);font-size:22px;display:flex;align-items:center;gap:6px;min-height:44px;margin-right:auto}\n.chip{min-height:34px;padding:0 13px;border-radiu Mockup theme switch\">\n    <span>Theme<\/span>\n    <button data-theme=\"dawn\"><i style=\"background:#AE3A1C\"><\/i>Dawn<\/button>\n    <button data-theme=\"day\"><i style=\"background:#1C3DA8\"><\/i>Day<\/button>\n    <button data-theme=\"dusk\"><i style=\"background:#F2A679\"><\/i>Dusk<\/button>\n    <button data-theme=\"night\"><i style=\"background:#FFC233\"><\/i>Night<\/button>\n  <\/div>\n\n  <!-- ================= TODAY ================= -->\n  <main class=\"screen\" id=\"today\">\n    <div class=\"pad\">\n      <div class=\"top\">\n        <div class=\"mark\">Eliana<small>God has answered<\/small><\/div>\n        <button class=\"icbtn\" data-sheet=\"s-set\" aria-label=\"Settings and themes\"><svg class=\"ic\"><use href=\"#i-gear\"/><\/svg><\/button>\n      <\/div>\n      <div class=\"eyebrow q\" id=\"greet\">Good morning \u00b7 Thursday, 19 November<\/div>\n\n      <div class=\"hours\" role=\"group\" aria-label=\"The hour\">\n        <button data-theme=\"dawn\"><i><\/i>Dawn<\/button>\n        <button data-theme=\"day\"><i><\/i>Day<\/button>\n        <button data-theme=\"dusk\"><i><\/i>Dusk<\/button>\n        <button data-theme=\"night\"><i><\/i>Night<\/button>\n      <\/div>\n\n      <div class=\"eyebrow\" style=\"text-align:center\">Today's word<\/div>\n      <button class=\"word heb\" data-word=\"harpu\" aria-label=\"Harpu, open the word\">\u05d4\u05b7\u05e8\u05b0\u05e4\u05bc\u05d5\u05bc<\/button>\n      <div class=\"wordsub\">har\u00b7p\u016b, \u201clet go\u201d<b>Tap the word<\/b><\/div>\n\n      <p class=\"verse\">Be still, and know that I am God.<\/p>\n      <div class=\"ref\">Psalm 46:10 \u00b7 BSB<\/div>\n      <p class=\"render\">Let your hands fall. Then you will know that I am God.<\/p>\n      <div class=\"row\">\n        <button class=\"btn\" data-open=\"vstudy\">Open the study<\/button>\n        <button class=\"btn ghost\" data-eliana=\"Psalm 46:10\"><span class=\"star\">\u2726<\/span> Ask Eliana<\/button>\n        <button class=\"icbtn\" aria-label=\"Save verse\" data-save><svg class=\"ic\"><use href=\"#i-star\"/><\/svg><\/button>\n      <\/div>\n      <p class=\"carry\"><b class=\"eyebrow\">Carry it with you<\/b>The command is plural, and it is given in the middle of a battle. Notice one thing today that you are gripping, and open your hand.<\/p>\n\n      <div class=\"rule\"><\/div>\n      <div class=\"eyebrow q\" style=\"margin-bottom:6px\">The day's rhythm<\/div>\n      <div class=\"thread\" id=\"beats\">\n        <div class=\"knot\" data-h=\"dawn\">\n          <span class=\"k\">Dawn \u00b7 Receive<\/span>\n          <span class=\"t\">Psalm 46:10<\/span>\n          <span class=\"d\">Read it once, slowly. That is the whole of the morning.<\/span>\n          <button class=\"btn acc go\" data-open=\"vstudy\">Sit with it<\/button>\n        <\/div>\n        <div class=\"knot\" data-h=\"day\">\n          <span class=\"k\">Day \u00b7 Read<\/span>\n          <span class=\"t\">Continue Genesis 1<\/span>\n          <span class=\"d\">You stopped at verse 3, in Read. A chain begins there.<\/span>\n          <button class=\"btn acc go\" data-go=\"bible\">Keep reading<\/button>\n        <\/div>\n        <div class=\"knot\" data-h=\"dusk\">\n          <span class=\"k\">Dusk \u00b7 Study<\/span>\n          <span class=\"t\">Aliyah \u21163 \u00b7 Out of Egypt<\/span>\n          <span class=\"d\">Matthew 2:13\u201318 \u00b7 Hosea 11 \u00b7 Exodus 4:22. About twelve minutes.<\/span>\n          <button class=\"btn acc go\" data-go=\"rooms\">Open the study<\/button>\n        <\/div>\n        <div class=\"knot\" data-h=\"night\">\n          <span class=\"k\">Night \u00b7 Rest<\/span>\n          <span class=\"t\">Stillness, then a prayer<\/span>\n          <span class=\"d\">Three quiet minutes, and the Throne Room after.<\/span>\n          <button class=\"btn acc go\" data-go=\"rooms\">Be still<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"rule\"><\/div>\n      <div class=\"eyebrow q\">Rooms<\/div>\n      <div class=\"doors\">\n        <button data-go=\"rooms\"><svg class=\"ic\"><use href=\"#i-book\"/><\/svg>Library<\/button>\n        <button data-go=\"rooms\"><svg class=\"ic\"><use href=\"#i-hands\"/><\/svg>Throne Room<\/button>\n        <button data-sheet=\"s-journal\"><svg class=\"ic\"><use href=\"#i-pen\"/><\/svg>Journal<\/button>\n        <button data-go=\"rooms\"><svg class=\"ic\"><use href=\"#i-still\"/><\/svg>Stillness<\/button>\n      <\/div>\n      <p class=\"foot\">Nothing here is counted against you.<br>The day begins whenever you open it.<\/p>\n    <\/div>\n  <\/main>\n\n  <!-- ================= BIBLE ================= -->\n  <main class=\"screen\" id=\"bible\" data-mode=\"read\">\n    <div class=\"bhead\">\n      <div class=\"r1\">\n        <button class=\"bookbtn\">Genesis 1 <svg class=\"ic\" style=\"width:18px;height:18px\"><use href=\"#i-down\"/><\/svg><\/button>\n        <button class=\"chip\" id=\"trans\" aria-label=\"Translation, tap to change\">BSB<\/button>\n        <button class=\"icbtn\" aria-label=\"Search\"><svg class=\"ic\"><use href=\"#i-search\"/><\/svg><\/button>\n        <button class=\"icbtn\" data-sheet=\"s-set\" aria-label=\"Text size\" style=\"font-family:var(--serif);font-size:19px\">Aa<\/button>\n      <\/div>\n      <div class=\"seg\" role=\"group\" aria-label=\"Reading mode\">\n        <button data-mode=\"read\" aria-pressed=\"true\">Read<\/button>\n        <button data-mode=\"study\" aria-pressed=\"false\">Study<\/button>\n      <\/div>\n      <div class=\"layers\" role=\"group\" aria-label=\"Layers shown\">\n        <button class=\"chip\" data-layer=\"rend\" aria-pressed=\"true\"><span>\u2726<\/span> Rendering<\/button>\n        <button class=\"chip\" data-layer=\"orig\" aria-pressed=\"true\">Hebrew<\/button>\n        <button class=\"chip\" data-layer=\"sound\" aria-pressed=\"true\">Sound<\/button>\n        <button class=\"chip\" data-layer=\"key\" aria-pressed=\"true\">Key word<\/button>\n      <\/div>\n    <\/div>\n\n    <div id=\"read\">\n      <div class=\"chno\"><small>Genesis<\/small><b>1<\/b><\/div>\n      <div id=\"readtext\"><\/div>\n      <button class=\"next\"><span><span class=\"eyebrow q\" style=\"display:block\">Next<\/span>Genesis 2<\/span><svg class=\"ic\"><use href=\"#i-chev\"/><\/svg><\/button>\n    <\/div>\n\n    <div id=\"study\">\n      <div class=\"sv\">\n        <div class=\"n\">1<\/div>\n        <p class=\"rend\">In the beginning God created the heavens and the earth.<\/p>\n        <p class=\"cmp\" data-cmp=\"0\"><\/p>\n        <div class=\"orig\">\n          <button data-word=\"reshit\">\u05d1\u05b0\u05bc\u05e8\u05b5\u05d0\u05e9\u05b4\u05c1\u05d9\u05ea<\/button><button data-word=\"bara\">\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0<\/button><button data-word=\"elohim\">\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd<\/button><button data-word=\"et\">\u05d0\u05b5\u05ea<\/button><button data-word=\"shamayim\">\u05d4\u05b7\u05e9\u05b8\u05bc\u05c1\u05de\u05b7\u05d9\u05b4\u05dd<\/button><button data-word=\"et\">\u05d5\u05b0\u05d0\u05b5\u05ea<\/button><button data-word=\"erets\">\u05d4\u05b8\u05d0\u05b8\u05e8\u05b6\u05e5<\/button>\n        <\/div>\n        <p class=\"tr\">b\u0259\u00b7r\u00ea\u00b7\u0161\u00ee\u1e6f b\u0101\u00b7r\u0101 \u2019\u0115\u00b7l\u014d\u00b7h\u00eem \u2019\u00ea\u1e6f ha\u0161\u00b7\u0161\u0101\u00b7ma\u00b7yim w\u0259\u00b7\u2019\u00ea\u1e6f h\u0101\u00b7\u2019\u0101\u00b7re\u1e63<\/p>\n        <div class=\"key\">\n          <div class=\"kw\"><span class=\"heb\">\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0<\/span><i>b\u0101\u00b7r\u0101<\/i><\/div>\n          A Qal perfect, third person masculine singular: a simple, completed act, stated as plain fact. In Scripture this verb has only ever one subject.\n          <div class=\"more\"><button data-word=\"bara\">The word<\/button><button data-open=\"vstudy\">Read the full study <svg class=\"ic\" style=\"width:16px;height:16px\"><use href=\"#i-chev\"/><\/svg><\/button><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"sv\">\n        <div class=\"n\">2<\/div>\n        <p class=\"rend\">Now the earth was formless and empty, darkness lay over the face of the deep, and the breath of God hovered over the face of the waters.<\/p>\n        <p class=\"cmp\" data-cmp=\"1\"><\/p>\n        <p class=\"orig plain heb\">\u05d5\u05b0\u05d4\u05b8\u05d0\u05b8\u05e8\u05b6\u05e5 \u05d4\u05b8\u05d9\u05b0\u05ea\u05b8\u05d4 \u05ea\u05b9\u05d4\u05d5\u05bc \u05d5\u05b8\u05d1\u05b9\u05d4\u05d5\u05bc \u05d5\u05b0\u05d7\u05b9\u05e9\u05b6\u05c1\u05da\u05b0 \u05e2\u05b7\u05dc\u05be\u05e4\u05b0\u05bc\u05e0\u05b5\u05d9 \u05ea\u05b0\u05d4\u05d5\u05b9\u05dd \u05d5\u05b0\u05e8\u05d5\u05bc\u05d7\u05b7 \u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd \u05de\u05b0\u05e8\u05b7\u05d7\u05b6\u05e4\u05b6\u05ea \u05e2\u05b7\u05dc\u05be\u05e4\u05b0\u05bc\u05e0\u05b5\u05d9 \u05d4\u05b7\u05de\u05b8\u05bc\u05d9\u05b4\u05dd<\/p>\n        <p class=\"tr\">w\u0259\u00b7h\u0101\u00b7\u2019\u0101\u00b7re\u1e63 h\u0101\u00b7y\u0259\u00b7\u1e6f\u0101h \u1e6f\u014d\u00b7h\u016b w\u0101\u00b7\u1e07\u014d\u00b7h\u016b \u2026<\/p>\n        <div class=\"key\">\n          <div class=\"kw\"><span class=\"heb\">\u05e8\u05d5\u05bc\u05d7\u05b7<\/span><i>r\u016b\u00b7a\u1e25<\/i><\/div>\n          Breath, wind, spirit: one Hebrew word carries all three, and the rendering keeps the first.\n          <div class=\"more\"><button data-open=\"vstudy\">Read the full study <svg class=\"ic\" style=\"width:16px;height:16px\"><use href=\"#i-chev\"/><\/svg><\/button><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"sv\">\n        <div class=\"n\">3<\/div>\n        <p class=\"rend\">And God said, \u201cLet light be,\u201d and light was.<\/p>\n        <p class=\"cmp\" data-cmp=\"2\"><\/p>\n        <div class=\"orig\">\n          <button data-word=\"amar\">\u05d5\u05b7\u05d9\u05b9\u05bc\u05d0\u05de\u05b6\u05e8<\/button><button data-word=\"elohim\">\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd<\/button><button data-word=\"yehi\">\u05d9\u05b0\u05d4\u05b4\u05d9<\/button><button data-word=\"or\">\u05d0\u05d5\u05b9\u05e8<\/button><button data-word=\"vayhi\">\u05d5\u05b7\u05d9\u05b0\u05d4\u05b4\u05d9<\/button><button data-word=\"or\">\u05d0\u05d5\u05b9\u05e8<\/button>\n        <\/div>\n        <p class=\"tr\">way\u00b7y\u014d\u00b7mer \u2019\u0115\u00b7l\u014d\u00b7h\u00eem y\u0259\u00b7h\u00ee \u2019\u014d\u00b7wr way\u00b7h\u00ee \u2019\u014d\u00b7wr<\/p>\n        <div class=\"key\">\n          <div class=\"kw\"><span class=\"heb\">\u05d9\u05b0\u05d4\u05b4\u05d9<\/span><i>y\u0259\u00b7h\u00ee<\/i><\/div>\n          Two words in Hebrew, and the answer echoes the command almost letter for letter. The rendering keeps it that short.\n          <div class=\"more\"><button data-sheet=\"s-chain\"><span class=\"chain\" style=\"margin:0 6px 0 0\"><i><\/i>12<\/span>Follow the chain<\/button><button data-open=\"vstudy\">Full study <svg class=\"ic\" style=\"width:16px;height:16px\"><use href=\"#i-chev\"/><\/svg><\/button><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/main>\n\n  <div id=\"actbar\" role=\"toolbar\" aria-label=\"Verse actions\">\n    <div class=\"lbl\" id=\"actlbl\">Genesis 1:3<\/div>\n    <div class=\"acts\">\n      <button data-act=\"study\"><svg class=\"ic\"><use href=\"#i-layers\"/><\/svg>Study<\/button>\n      <button data-act=\"chain\"><svg class=\"ic\"><use href=\"#i-link\"/><\/svg>Chain<\/button>\n      <button data-act=\"ask\"><span style=\"font-size:20px;line-height:22px\">\u2726<\/span>Ask<\/button>\n      <button data-act=\"journal\"><svg class=\"ic\"><use href=\"#i-pen\"/><\/svg>Journal<\/button>\n      <button data-act=\"save\"><svg class=\"ic\"><use href=\"#i-star\"/><\/svg>Save<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- ================= ROOMS ================= -->\n  <main class=\"screen\" id=\"rooms\">\n    <div class=\"pad\">\n      <div class=\"eyebrow\">The Library<\/div>\n      <h1 style=\"margin-top:6px\">A shelf, and three rooms beside it.<\/h1>\n      <div class=\"shelf\">\n        <button class=\"book\"><div class=\"cover c1\"><span class=\"g\">E<\/span><b>Eliana's Journal<\/b><small>Michael W Thomas<\/small><\/div><p><b>Day 12 next<\/b>A devotional, one day at a time<\/p><\/button>\n        <button class=\"book\"><div class=\"cover c2\"><span class=\"g\">\u2116<\/span><b>Aliyah<br>The Ascent<\/b><small>A book of discoveries<\/small><\/div><p><b>\u21163 \u00b7 Out of Egypt<\/b>Studies built from the chains<\/p><\/button>\n        <button class=\"book\"><div class=\"cover c3\"><span class=\"g\">\u2726<\/span><b>The Foundations<\/b><small>For every reader<\/small><\/div><p><b>Not yet opened<\/b>How the words reached you<\/p><\/button>\n        <div class=\"book\"><div class=\"cover c4\"><b style=\"font-size:16px;font-style:italic\">More books will join the shelf<\/b><\/div><\/div>\n      <\/div>\n\n      <section class=\"room\">\n        <div class=\"eyebrow\">Throne Room<\/div>\n        <h2>Come as you are, and pray.<\/h2>\n        <p>Tell Eliana what you are carrying and she will help you find words, or pray with ones already written.<\/p>\n        <button class=\"li\" data-eliana=\"A prayer\"><svg class=\"ic\"><use href=\"#i-hands\"/><\/svg>Help me find the words<svg class=\"ic\" style=\"margin-left:auto;color:var(--mute)\"><use href=\"#i-chev\"/><\/svg><\/button>\n        <button class=\"li\"><svg class=\"ic\"><use href=\"#i-sun\"/><\/svg>Prayers for the morning<span>Curated<\/span><\/button>\n        <button class=\"li\"><svg class=\"ic\"><use href=\"#i-star\"/><\/svg>My prayers<span>12 saved \u00b7 4 favourites<\/span><\/button>\n      <\/section>\n\n      <section class=\"room\">\n        <div class=\"eyebrow\">Journal<\/div>\n        <h2>Put what is on your heart into words.<\/h2>\n        <button class=\"li\" data-sheet=\"s-journal\"><svg class=\"ic\"><use href=\"#i-pen\"/><\/svg>Write freely<svg class=\"ic\" style=\"margin-left:auto;color:var(--mute)\"><use href=\"#i-chev\"/><\/svg><\/button>\n        <button class=\"li\" data-sheet=\"s-journal\"><svg class=\"ic\"><use href=\"#i-path\"/><\/svg>Help me start<span>A guided prompt<\/span><\/button>\n        <button class=\"li\"><svg class=\"ic\"><use href=\"#i-search\"/><\/svg>Past entries<span>31 entries<\/span><\/button>\n      <\/section>\n\n      <section class=\"room\">\n        <div class=\"eyebrow\">Stillness<\/div>\n        <h2>Make room to pause.<\/h2>\n        <div class=\"breath\"><span>breathe<\/span><\/div>\n        <div class=\"row\" style=\"justify-content:center\"><button class=\"btn\">Begin \u00b7 3 minutes<\/button><\/div>\n      <\/section>\n    <\/div>\n  <\/main>\n\n  <!-- ================= JOURNEY ================= -->\n  <main class=\"screen\" id=\"journey\">\n    <div class=\"pad\">\n      <div class=\"eyebrow\">Journey<\/div>\n      <h1 style=\"margin-top:6px\">The thread so far.<\/h1>\n      <p class=\"mute\" style=\"font-size:15px;line-height:1.5;margin-top:8px\">A filled knot is a day you came. Where you did not, the thread simply carries on. It never breaks, and nothing is counted.<\/p>\n      <svg id=\"weave\" viewBox=\"0 0 346 236\" role=\"img\" aria-label=\"The last four weeks drawn as one unbroken thread\"><\/svg>\n      <div class=\"tally\">\n        <div><b>14<\/b>chapters opened<\/div>\n        <div><b>6<\/b>pages written<\/div>\n        <div><b>9<\/b>prayers prayed<\/div>\n      <\/div>\n      <div class=\"eyebrow q\" style=\"margin:26px 0 4px\">Look back<\/div>\n      <button class=\"back\"><span class=\"k\">Tuesday \u00b7 Genesis 1:3<\/span><q>Light came before the sun did. I keep waiting for the circumstances first.<\/q><em>Journal \u00b7 tied to a verse<\/em><\/button>\n      <button class=\"back\"><span class=\"k\">Sunday \u00b7 Psalm 46<\/span><q>Read the whole psalm aloud. The refuge comes before the stillness.<\/q><em>Reading \u00b7 chain 7<\/em><\/button>\n      <button class=\"back\"><span class=\"k\">Last Friday \u00b7 Throne Room<\/span><q>A prayer for the house, and for patience with it.<\/q><em>Saved prayer<\/em><\/button>\n    <\/div>\n  <\/main>\n\n  <!-- ================= TABS ================= -->\n  <nav id=\"tabs\" aria-label=\"Main\">\n    <button data-go=\"today\"><svg class=\"ic\"><use href=\"#i-sun\"/><\/svg>Today<\/button>\n    <button data-go=\"bible\"><svg class=\"ic\"><use href=\"#i-book\"/><\/svg>Bible<\/button>\n    <button class=\"el\" data-eliana=\"\" aria-label=\"Ask Eliana\"><b>\u2726<\/b><span>Eliana<\/span><\/button>\n    <button data-go=\"rooms\"><svg class=\"ic\"><use href=\"#i-door\"/><\/svg>Rooms<\/button>\n    <button data-go=\"journey\"><svg class=\"ic\"><use href=\"#i-path\"/><\/svg>Journey<\/button>\n  <\/nav>\n\n  <!-- ================= VERSE STUDY PAGE ================= -->\n  <section class=\"page\" id=\"vstudy\" aria-label=\"Verse study\">\n    <div class=\"phead\">\n      <div class=\"r1\">\n        <button class=\"icbtn\" data-close-page aria-label=\"Back\"><svg class=\"ic\"><use href=\"#i-back\"/><\/svg><\/button>\n        <span style=\"margin-right:auto\">Psalm 46:10<\/span>\n        <button class=\"chip\" data-close-page data-go=\"bible\">Open in Bible<\/button>\n        <button class=\"icbtn\" aria-label=\"Save\" data-save><svg class=\"ic\"><use href=\"#i-star\"/><\/svg><\/button>\n      <\/div>\n      <div class=\"steps\">\n        <button data-sec=\"sec1\"><i><\/i>Scripture<\/button>\n        <button data-sec=\"sec2\"><i><\/i>Rendering<\/button>\n        <button data-sec=\"sec3\"><i><\/i>Lens<\/button>\n        <button data-sec=\"sec4\"><i><\/i>Insight<\/button>\n        <button data-sec=\"sec5\"><i><\/i>Practice<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"pad\">\n      <div class=\"sec\" id=\"sec1\" style=\"padding-top:8px\">\n        <div class=\"eyebrow\">Scripture<\/div>\n        <p class=\"grk heb\" style=\"font-family:var(--heb);text-align:right\">\u05d4\u05b7\u05e8\u05b0\u05e4\u05bc\u05d5\u05bc \u05d5\u05bc\u05d3\u05b0\u05e2\u05d5\u05bc \u05db\u05b4\u05bc\u05d9\u05be\u05d0\u05b8\u05e0\u05b9\u05db\u05b4\u05d9 \u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd<\/p>\n        <p class=\"mute\" style=\"font-family:var(--serif);font-style:italic\">har\u00b7p\u016b \u016b\u00b7\u1e0f\u0259\u00b7\u2018\u016b k\u00ee \u2019\u0101\u00b7n\u014d\u00b7\u1e35\u00ee \u2019\u0115\u00b7l\u014d\u00b7h\u00eem<\/p>\n      <\/div>\n      <div class=\"sec\" id=\"sec2\">\n        <div class=\"eyebrow\"><span class=\"star\">\u2726<\/span> Fresh rendering<\/div>\n        <p class=\"big\">Let your hands fall. Then you will know that I am God.<\/p>\n      <\/div>\n      <div class=\"sec\" id=\"sec3\">\n        <div class=\"eyebrow\">Deeper lens<\/div>\n        <p>The first word is a Hiphil imperative plural of <i>r\u0101p\u0304\u0101h<\/i>, to slacken or let drop. It is spoken to a crowd, and the psalm around it is full of war. It reads less like an invitation to calm and more like an order to put the weapons down.<\/p>\n      <\/div>\n      <div class=\"sec\" id=\"sec4\">\n        <div class=\"eyebrow\">Everyday insight<\/div>\n        <p>Stillness here is not the absence of noise. It is the moment you stop holding the thing up yourself and find that it does not fall.<\/p>\n      <\/div>\n      <div class=\"sec\" id=\"sec5\">\n        <div class=\"eyebrow\">Take-home practice<\/div>\n        <div class=\"practice\">\n          <p style=\"margin:0 0 16px;font-family:var(--serif);font-size:19px;line-height:1.45\">Name one thing you are gripping. Open your hand, literally, and say the verse once.<\/p>\n          <div class=\"row\"><button class=\"btn acc\" data-sheet=\"s-journal\">Write it in the journal<\/button><button class=\"btn ghost\" data-eliana=\"Psalm 46:10\"><span class=\"star\">\u2726<\/span> Ask<\/button><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= SHEETS ================= -->\n  <div id=\"scrim\"><\/div>\n\n  <section class=\"sheet\" id=\"s-word\" aria-label=\"Word\">\n    <div class=\"grab\"><\/div>\n    <div class=\"shead\"><span class=\"eyebrow\">The word<\/span><button class=\"icbtn\" data-close aria-label=\"Close\"><svg class=\"ic\"><use href=\"#i-x\"/><\/svg><\/button><\/div>\n    <span class=\"bigw heb\" id=\"w-w\"><\/span>\n    <div class=\"wtr\" id=\"w-t\"><\/div>\n    <div class=\"tags\" id=\"w-tags\"><\/div>\n    <h3>Meaning<\/h3><p id=\"w-m\"><\/p>\n    <h3>Other uses in Scripture<\/h3><div id=\"w-u\"><\/div>\n    <div class=\"row\" style=\"margin-top:18px\"><button class=\"btn ghost\" data-eliana=\"this word\"><span class=\"star\">\u2726<\/span> Ask Eliana about this word<\/button><\/div>\n  <\/section>\n\n  <section class=\"sheet\" id=\"s-chain\" aria-label=\"Chain\">\n    <div class=\"grab\"><\/div>\n    <div class=\"shead\"><span class=\"eyebrow\">Chain 12 \u00b7 four passages<\/span><button class=\"icbtn\" data-close aria-label=\"Close\"><svg class=\"ic\"><use href=\"#i-x\"/><\/svg><\/button><\/div>\n    <h2 style=\"margin:2px 0 18px\">Light, from the first word to the face of Christ<\/h2>\n    <div class=\"cknot\"><b>Genesis 1:3<\/b><span>And God said, \u201cLet there be light,\u201d and there was light.<\/span><\/div>\n    <div class=\"cknot\"><b>Psalm 119:105<\/b><span>Your word is a lamp to my feet and a light to my path.<\/span><\/div>\n    <div class=\"cknot\"><b>John 1:4\u20135<\/b><span>In Him was life, and that life was the light of men.<\/span><\/div>\n    <div class=\"cknot\"><b>2 Corinthians 4:6<\/b><span>For God, who said, \u201cLet light shine out of darkness,\u201d made His light shine in our hearts.<\/span><\/div>\n    <div class=\"row\"><button class=\"btn\">Read the chain<\/button><button class=\"btn ghost\">Its Aliyah study<\/button><\/div>\n  <\/section>\n\n  <section class=\"sheet tall\" id=\"s-eliana\" aria-label=\"Eliana\">\n    <div class=\"grab\"><\/div>\n    <div class=\"shead\"><span class=\"mark\"><span class=\"star\">\u2726<\/span> Eliana<\/span><button class=\"icbtn\" data-close aria-label=\"Close\"><svg class=\"ic\"><use href=\"#i-x\"/><\/svg><\/button><\/div>\n    <div id=\"chat\">\n      <span class=\"ctx\" id=\"ctx\">With you in Psalm 46:10<\/span>\n      <div class=\"me\">Why does your rendering say \u201clet your hands fall\u201d?<\/div>\n      <div class=\"her\" id=\"stream\" aria-live=\"polite\"><\/div>\n    <\/div>\n    <div class=\"sugg\"><button class=\"chip\">Pray this verse<\/button><button class=\"chip\">Where else is this word?<\/button><button class=\"chip\">Explain simply<\/button><\/div>\n    <div class=\"ask\"><input aria-label=\"Ask Eliana\" placeholder=\"Ask, or say what is on your mind\"><button aria-label=\"Send\"><svg class=\"ic\"><use href=\"#i-up\"/><\/svg><\/button><\/div>\n  <\/section>\n\n  <section class=\"sheet\" id=\"s-journal\" aria-label=\"Journal entry\">\n    <div class=\"grab\"><\/div>\n    <div class=\"shead\"><span class=\"eyebrow\">Journal \u00b7 Thursday evening<\/span><button class=\"icbtn\" data-close aria-label=\"Close\"><svg class=\"ic\"><use href=\"#i-x\"/><\/svg><\/button><\/div>\n    <span class=\"ctx\" id=\"jctx\">Tied to Psalm 46:10<\/span>\n    <h2>What are you holding that you could set down?<\/h2>\n    <textarea aria-label=\"Your entry\" placeholder=\"Begin anywhere.\"><\/textarea>\n    <div class=\"row\"><button class=\"btn\" data-close>Keep this page<\/button><button class=\"btn ghost\">Another prompt<\/button><\/div>\n  <\/section>\n\n  <section class=\"sheet\" id=\"s-set\" aria-label=\"Settings\">\n    <div class=\"grab\"><\/div>\n    <div class=\"shead\"><span class=\"eyebrow\">Appearance<\/span><button class=\"icbtn\" data-close aria-label=\"Close\"><svg class=\"ic\"><use href=\"#i-x\"/><\/svg><\/button><\/div>\n    <div class=\"swatches\">\n      <button class=\"sw\" data-theme=\"dawn\" style=\"background:#F5EDE3;color:#2A1E22\"><i style=\"background:#AE3A1C\"><\/i><span><b>Dawn<\/b><br><small>Vellum and rubric red<\/small><\/span><\/button>\n      <button class=\"sw\" data-theme=\"day\" style=\"background:#FFFFFF; 00b7 Thursday, 19 November';\n  var i=ORDER.indexOf(t);\n  $$('#beats .knot').forEach(function(k,n){k.classList.toggle('kept',n<i);k.classList.toggle('now',n===i)});\n  $('#beats').style.setProperty('--done',[0,30,58,84][i]+'%');\n}\nfunction go(tab){\n  app.dataset.tab=tab;hideBar();\n  $$('#tabs button[data-go]').forEach(function(b){if(b.dataset.go===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});\n}\n\n/* ----- Read mode: four translations of the same page ----- */\nvar T={\nBSB:[\"In the beginning God created the heavens and the earth.\",\"Now the earth was formless and void, and darkness was over the surface of the deep. And the Spirit of God was hovering over the surface of the waters.\",\"And God said, \u201cLet there be light,\u201d and there was light.\",\"And God saw that the light was good, and He separated the light from the darkness.\",\"God called the light \u201cday,\u201d and the darkness He called \u201cnight.\u201d And there was evening, and there was morning, the first day.\",\"And God said, \u201cLet there be an expanse between the waters, to separate the waters from the waters.\u201d\",\"So God made the expanse and separated the waters beneath it from the waters above. And it was so.\",\"God called the expanse \u201csky.\u201d And there was evening, and there was morning, the second day.\"],\nKJV:[\"In the beginning God created the heaven and the earth.\",\"And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters.\",\"And God said, Let there be light: and there was light.\",\"And God saw the light, that it was good: and God divided the light from the darkness.\",\"And God called the light Day, and the darkness he called Night. And the evening and the morning were the first day.\",\"And God said, Let there be a firmament in the midst of the waters, and let it divide the waters from the waters.\",\"And God made the firmament, and divided the waters which were under the firmament from the waters which were above the firmament: and it was so.\",\"And God called the firmament Heaven. And the evening and the morning were the second day.\"],\nASV:[\"In the beginning God created the heavens and the earth.\",\"And the earth was waste and void; and darkness was upon the face of the deep: and the Spirit of God moved upon the face of the waters.\",\"And God said, Let there be light: and there was light.\",\"And God saw the light, that it was good: and God divided the light from the darkness.\",\"And God called the light Day, and the darkness he called Night. And there was evening and there was morning, one day.\",\"And God said, Let there be a firmament in the midst of the waters, and let it divide the waters from the waters.\",\"And God made the firmament, and divided the waters which were under the firmament from the waters which were above the firmament: and it was so.\",\"And God called the firmament Heaven. And there was evening and there was morning, a second day.\"],\n\"\u2726 Eliana\":[\"In the beginning God created the heavens and the earth.\",\"Now the earth was formless and empty, darkness lay over the face of the deep, and the breath of God hovered over the face of the waters.\",\"And God said, \u201cLet light be,\u201d and light was.\",\"God saw the light, that it was good, and God parted the light from the darkness.\",\"God named the light Day, and the darkness he named Night. Evening came, and morning came: day one.\",\"And God said, \u201cLet there be a vault in the midst of the waters, and let it part water from water.\u201d\",\"So God made the vault, and parted the waters under it from the waters over it. And so it was.\",\"God named the vault Sky. Evening came, and morning came: a second day.\"]};\nvar TR=Object.keys(T),ti=0,PARAS=[[1,2],[3,4,5],[6,7,8]];\nfunction renderRead(){\n  var t=T[TR[ti]];\n  $('#readtext').innerHTML=PARAS.map(function(p){return '<p>'+p.map(function(n){\n    return '<span class=\"v\" tabindex=\"0\" role=\"button\" data-v=\"'+n+'\">'+(n>1?'<sup>'+n+'<\/sup>':'')+t[n-1]+'<\/span>'+(n===3?'<button class=\"chain\" data-sheet=\"s-chain\" aria-label=\"Chain 12\"><i><\/i>12<\/button>':'');\n  }).join(' ')+'<\/p>'}).join('');\n  $('#trans').innerHTML=TR[ti].replace('\u2726','<span class=\"star\">\u2726<\/span>');\n  var name=TR[ti]==='\u2726 Eliana'?'BSB':TR[ti],src=T[name],el=T['\u2726 Eliana'];\n  $$('[data-cmp]').forEach(function(c){var i=+c.dataset.cmp;c.textContent=src[i]===el[i]?'The '+name+' reads the same':name+': '+src[i]});\n}\nfunction setMode(m){\n  $('#bible').dataset.mode=m;hideBar();\n  $$('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.mode===m)});\n}\nfunction hideBar(){$('#actbar').classList.remove('show');$$('#read .v.sel').forEach(function(v){v.classList.remove('sel')})}\n\n/* ----- Words ----- */\nvar W={\nharpu:{w:'\u05d4\u05b7\u05e8\u05b0\u05e4\u05bc\u05d5\u05bc',t:'har\u00b7p\u016b',s:'H7503',g:'Hiphil imperative plural',gl:'be still',m:'From r\u0101p\u0304\u0101h: to sink, slacken, let drop. In the Hiphil it means to let go of something you are holding. The plural speaks to everyone at once.',u:[['Psalm 37:8','Refrain from anger and abandon wrath.'],['Deuteronomy 31:6','He will never leave you nor forsake you.'],['Proverbs 4:13','Hold on to instruction; do not let go.']]},\nreshit:{w:'\u05d1\u05b0\u05bc\u05e8\u05b5\u05d0\u05e9\u05b4\u05c1\u05d9\u05ea',t:'b\u0259\u00b7r\u00ea\u00b7\u0161\u00ee\u1e6f',s:'H7225',g:'Preposition, noun feminine singular',gl:'in the beginning',m:'The first, the chief, the best part of a thing. The Hebrew name of the whole book is this one word.',u:[['Proverbs 8:22','The LORD created me as His first course.'],['Psalm 111:10','The fear of the LORD is the beginning of wisdom.'],['Jeremiah 26:1','At the beginning of the reign of Jehoiakim.']]},\nbara:{w:'\u05d1\u05b8\u05bc\u05e8\u05b8\u05d0',t:'b\u0101\u00b7r\u0101',s:'H1254',g:'Qal perfect, 3rd masculine singular',gl:'created',m:'To create. A completed act, stated as plain fact. In Scripture the subject of this verb is only ever God.',u:[['Genesis 1:27','So God created man in His own image.'],['Psalm 51:10','Create in me a clean heart, O God.'],['Isaiah 40:26','Lift up your eyes on high: who created all these?'],['Isaiah 65:17','I will create new heavens and a new earth.']]},\nelohim:{w:'\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd',t:'\u2019\u0115\u00b7l\u014d\u00b7h\u00eem',s:'H430',g:'Noun, masculine plural',gl:'God',m:'Plural in form, and here it takes a singular verb. The grammar itself is worth a pause.',u:[['Deuteronomy 6:4','The LORD our God, the LORD is One.'],['Psalm 46:10','Be still, and know that I am God.']]},\net:{w:'\u05d0\u05b5\u05ea',t:'\u2019\u00ea\u1e6f',s:'H853',g:'Direct object marker',gl:'(untranslated)',m:'A small word that points at what the verb acts on. English has nothing like it, so no translation shows it.',u:[['Genesis 1:16','God made the two great lights.']]},\nshamayim:{w:'\u05d4\u05b7\u05e9\u05b8\u05bc\u05c1\u05de\u05b7\u05d9\u05b4\u05dd',t:'ha\u0161\u00b7\u0161\u0101\u00b7ma\u00b7yim',s:'H8064',g:'Article, noun masculine plural',gl:'the heavens',m:'Sky, heavens. Always plural in Hebrew, which is why some translations say heaven and others heavens.',u:[['Psalm 19:1','The heavens declare the glory of God.'],['Isaiah 55:9','As the heavens are higher than the earth.']]},\nerets:{w:'\u05d4\u05b8\u05d0\u05b8\u05e8\u05b6\u05e5',t:'h\u0101\u00b7\u2019\u0101\u00b7re\u1e63',s:'H776',g:'Article, noun feminine singular',gl:'the earth',m:'Earth, land, ground. The same word names the whole world and one promised country.',u:[['Psalm 24:1','The earth is the LORD\u2019s, and the fullness thereof.'],['Genesis 12:1','Go to the land I will show you.']]},\namar:{w:'\u05d5\u05b7\u05d9\u05b9\u05bc\u05d0\u05de\u05b6\u05e8',t:'way\u00b7y\u014d\u00b7mer',s:'H559',g:'Qal consecutive imperfect, 3rd masculine singular',gl:'and He said',m:'To say. Cre utton { cursor: pointer; }\n\n  /* Phone-sized 390x844 frame that scrolls smoothly */\n  .phone-shell {\n    width: 100%;\n    max-width: 390px;\n    min-height: 844px;\n    margin: 0 auto;\n    background: var(--bg-page);\n    color: var(--ink);\n    position: relative;\n    display: flex;\n    flex-direction: column;\n    transition: background 0.22s ease, color 0.22s ease;\n    box-shadow: 0 0 48px rgba(0, 0, 0, 0.24);\n  }\n\n  /* ==================== TOP BAR ==================== */\n  .topbar {\n    position: sticky;\n    top: 0;\n    z-index: 40;\n    background: var(--bg-nav);\n    backdrop-filter: blur(16px);\n    -webkit-backdrop-filter: blur(16px);\n    border-bottom: 1px solid var(--border);\n    padding: 10px 14px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n  }\n\n  .brand {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    min-width: 0;\n  }\n\n  .brand-mark {\n    width: 26px;\n    height: 26px;\n    border-radius: 8px;\n    background: var(--spark-soft);\n    border: 1px solid var(--border-strong);\n    display: grid;\n    place-items: center;\n    color: var(--spark-ink);\n    font-size: 13px;\n    flex-shrink: 0;\n  }\n\n  .brand-wordmark {\n    font-family: var(--font-serif);\n    font-size: 16px;\n    font-weight: 700;\n    color: var(--accent);\n    text-shadow: var(--title-etch);\n    letter-spacing: -0.01em;\n    white-space: nowrap;\n  }\n\n  .top-actions {\n    display: flex;\n    align-items: center;\n    gap: 6px;\n  }\n\n  /* One-tap Theme Switcher pill right in the header */\n  .theme-pill-btn {\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    padding: 5px 9px;\n    border-radius: 999px;\n    background: var(--bg-surface);\n    border: 1px solid var(--border-strong);\n    font-size: 11px;\n    font-weight: 600;\n    color: var(--ink-soft);\n  }\n\n  .theme-dot {\n    width: 10px;\n    height: 10px;\n    border-radius: 50%;\n    background: var(

home:()=>`${themeControls()}<div class="greeting"><div><div class="micro">Good morning, Michael</div><h1>A place to return.</h1></div><div class="date">Jan<strong>07</strong></div></div><section class="hero">${art}<div class="eyebrow">A word for your Thursday</div><blockquote>“Be still, and know<br>that I am God.”</blockquote><div class="verse-ref">PSALM 46:10 · KJV</div><div class="hero-line"></div><button class="hero-footer" style="width:100%" onclick="reader('study')"><span><small>There is room to let go.</small><strong>Sit with these words</strong></span><span class="round">${icon('arrow')}</span></button></section><div class="section-head"><h2>Your daily rhythm</h2><button class="link" onclick="go('journey')">Your journey ${icon('arrow')}</button></div><button class="row continue" onclick="reader()"><span class="progress">02</span><span class="copy"><span class="eyebrow">Pick up where you paused</span><strong>Psalm 46 · A steady refuge</strong><small>Read → Sit with it → Reflect</small></span>${icon('arrow')}</button><div class="section-head"><h2>A little further</h2><button class="link" onclick="go('library')">The library ↗</button></div><button class="row" style="padding-top:0" onclick="openBook(0)"><span class="book"><span>ELIANA’S</span>Journal<i>⌒</i></span><span class="copy"><span class="micro">Day 08 · 4 min</span><strong style="margin-top:8px">The space between</strong><small>Let the silence be a beginning.</small></span>${icon('arrow')}</button><button class="quiet" onclick="stillness()">${icon('sun')}<span><strong>Just a quiet minute.</strong><small>Nothing to finish. Simply be here.</small></span>${icon('arrow')}</button>${row('↗','The Throne Room','Prayers for the words you can’t find.',"go('prayer')")}<p class="footnote">Grace meets you here. Every day.</p>`,
bible:()=>`<div class="toolbar"><button class="book-picker" onclick="passages()">Psalms 46 ${icon('down')}</button><div class="tools"><button class="micro" onclick="translations()">${version} ⌄</button><button style="font:19px Georgia" onclick="readingSettings()" aria-label="Reading preferences">Aa</button></div></div><div class="segmented" aria-label="Reading mode"><button class="${mode==='read'?'active':''}" aria-pressed="${mode==='read'}" onclick="reader('read')">Read</button><button class="${mode==='study'?'active':''}" aria-pressed="${mode==='study'}" onclick="reader('study')">Study <span style="color:var(--accent)">✦</span></button></div>${mode==='read'?readView():studyView()}`,
article:()=>`<button class="link" onclick="reader('study')">← Psalm 46:10</button><div class="page-head"><div class="eyebrow">Verse study · 5 min</div><h1>The strength<br>of letting go.</h1><p class="sub">Psalm 46:10 · A closer encounter with the Word</p></div><article class="article"><div class="eyebrow">01 / Scripture</div><div class="hebrew" lang="he" dir="rtl">הַרְפּוּ וּדְעוּ כִּי־אָנֹכִי אֱלֹהִים</div><div class="translit">Harpū ūde‘ū kī ’ānōḵī ’ĕlōhīm.</div><div class="eyebrow">02 / Fresh rendering ✦</div><blockquote>“Let go, and recognize that I am God.”</blockquote><div class="eyebrow">03 / Deeper lens</div><h2>Stillness is not absence.</h2><p>Mountains shake. Nations rage. Into the noise comes a command: cease striving. The Hebrew <button class="link" onclick="word(0)">harpū ↗</button> asks for a loosening of the grip.</p><p>This is more than a private invitation to relax. The psalm places a world in turmoil before a God whose presence does not waver.</p><div class="eyebrow">04 / Everyday insight</div><h2>You can put something down.</h2><p>Trust does not mean that nothing matters. It means that everything does not depend on you. You can act with care without trying to hold the whole world together.</p><div class="practice"><div class="eyebrow" style="margin-top:0">05 / Take-home practice</div><p>What are you holding tightly that you could place in God’s hands today?</p><button class="primary" onclick="go('journal')">Take this to your journal ${icon('pen')}</button></div><button class="quiet" onclick="go('eliana')">${icon('spark')}<span><strong>Stay with the question.</strong><small>Talk about this verse with Eliana.</small></span>${icon('arrow')}</button></article>`,
library:()=>`<div class="page-head"><div class="eyebrow">The Eliana library</div><h1>Every book,<br>a room to enter.</h1><p class="sub">Follow a thread. Let it take its time.</p></div>${books.map((b,i)=>`<button class="shelf" onclick="openBook(${i})"><span class="book" style="background:${b.color};color:${b.ink}"><span>ELIANA’S RHYTHM</span>${b.cover}<i>${b.mark}</i><span>${b.short}</span></span><span class="copy"><span class="micro">${b.type}</span><h2>${b.title}</h2><p>${b.sub}</p><span class="link">${i===0?'Continue · Day 08':'Enter this book'} →</span></span></button>`).join('')}<p class="footnote">A growing library. A lifelong conversation.</p>`,
book:()=>`<button class="link" onclick="go('library')">← The library</button><div class="page-head"><div class="eyebrow">${books[bookIndex].type}</div><h1>${books[bookIndex].title}</h1><p class="sub">${books[bookIndex].sub}</p></div><section class="hero" style="border-radius:80px 80px 8px 8px">${art}<div class="eyebrow">${bookIndex===0?'Day 08 · A daily reading':'Begin here'}</div><blockquote>${bookIndex===0?'The space<br>between.':bookIndex===1?'The way<br>through.':'How the words<br>reached you.'}</blockquote><button class="primary" style="background:var(--heroink);color:var(--hero);margin-top:25px" onclick="lesson()">${bookIndex===0?'Continue reading':'Open the first chapter'} ${icon('arrow')}</button></section><div class="section-head"><h2>Inside this book</h2></div>${row('01',bookIndex===0?'Learning to be here':bookIndex===1?'Out of Egypt':'A library, not a single book','Scripture, reflection & a practice','lesson()')}${row('02',bookIndex===0?'The ordinary sacred':bookIndex===1?'Through the wilderness':'Scribes, scrolls & witnesses','A little further along the path','lesson(2)')}`,
journal:()=>`<div class="page-head"><div class="eyebrow">Your journal</div><h1>Let your heart<br>speak.</h1><p class="sub">No perfect words needed.</p></div><div class="segmented"><button class="active" onclick="go('journal')">Write</button><button onclick="go('history')">Past entries · ${entries.length}</button></div><div style="margin-top:24px"><span class="pill">${icon('book')} Psalm 46:10</span><button class="link" style="float:right" onclick="promptJournal()">A little guidance ↗</button></div><label for="entry" class="sub" style="display:block;margin-top:20px">What could you place in God’s hands today?</label><textarea id="entry" class="journal-area" placeholder="God, today I’m carrying…" oninput="draft=this.value">${esc(draft)}</textarea><button class="primary" onclick="saveEntry()">Keep this reflection ${icon('pen')}</button><p class="sub" style="font-size:10px;margin-top:13px;text-align:center">Your entries stay in this browser.</p><button class="quiet" onclick="go('prayer')">${icon('spark')}<span><strong>Let this become a prayer.</strong><small>Find words for what you’re carrying.</small></span>${icon('arrow')}</button>`,
history:()=>`<button class="link" onclick="go('journal')">← Your journal</button><div class="page-head"><div class="eyebrow">Little moments, kept</div><h1>Words to return to.</h1></div><input class="search" type="search" placeholder="Search your reflections" aria-label="Search entries" oninput="filterEntries(this.value)"><div id="entries">${entryList('')}</div>`,
eliana:()=>`<div class="chat-mark">${icon('spark')}</div><div class="page-head"><div class="eyebrow">In conversation with Eliana</div><h1>Bring the<br>unfinished things.</h1><p class="sub">Questions, doubts, a verse that stayed with you.<br>We can begin right there.</p></div><span class="pill">From Psalm 46:10</span><button class="chat-prompt" onclick="ask('What does it mean to be still?')">What does it mean to be still? ${icon('arrow')}</button><button class="chat-prompt" onclick="ask('How can I let go without giving up?')">How can I let go without giving up? ${icon('arrow')}</button><div id="answer" aria-live="polite"></div><form class="chat-input" onsubmit="event.preventDefault();ask($('#question').value)"><input id="question" aria-label="Your question" placeholder="What’s on your heart?"><button aria-label="Send question">${icon('arrow')}</button></form><p class="sub" style="font-size:10px;margin-top:15px">Interactive preview · Illustrative responses</p>`,
journey:()=>`<div class="page-head"><div class="eyebrow">Your journey · Sample week</div><h1>Small returns.<br>Deepening roots.</h1><p class="sub">There is no catching up. Only coming back.</p></div><div class="week">${['M','T','W','T','F','S','S'].map((d,i)=>`<div class="day">${d}<i class="${i<4?'filled':''}">${i<4?'✧':'·'}</i></div>`).join('')}</div><section class="hero" style="border-radius:80px 80px 8px 8px">${art}<div class="eyebrow">This week’s thread</div><blockquote>Making room<br>for trust.</blockquote><p style="font-size:11px;color:var(--gold)">3 readings · ${entries.length} reflections · 1 quiet pause</p></section><div class="section-head"><h2>Words you’ve kept</h2></div>${saved?row('✧','Psalm 46:10','Be still, and know that I am God.',"reader('study')"):'<p class="sub">Save a verse in Study to find it here.</p>'}${row('↗','Your reflections',`${entries.length} moments, kept`,"go('history')")}${row('↗','The Throne Room','Return to prayer',"go('prayer')")}`,
prayer:()=>`<div class="page-head"><div class="eyebrow">The Throne Room</div><h1>You are<br>welcome here.</h1><p class="sub">Bring your gratitude. Bring your need.<br>There is room for all of it.</p></div><label for="prayer-input" class="micro">What would you like to pray about?</label><textarea id="prayer-input" class="journal-area" style="min-height:145px" placeholder="Help me find words for…">${esc(draft)}</textarea><button class="primary" onclick="makePrayer()">Shape a prayer ${icon('spark')}</button><div class="section-head"><h2>Prayers to borrow</h2></div>${row('01','At the beginning of the day','An open heart. A small beginning.',"curatedPrayer('morning')")}${row('02','When the way feels unclear','A prayer for trust.',"curatedPrayer('trust')")}<button class="quiet" onclick="stillness()">${icon('sun')}<span><strong>Begin without words.</strong><small>Enter a minute of stillness.</small></span>${icon('arrow')}</button>`
};
const books=[{title:'Eliana’s Journal',cover:'Eliana’s<br>Journal',short:'DAILY DEVOTIONS',type:'A daily companion',sub:'Scripture for the ordinary, sacred work of being alive.',color:'#d8c7a7',ink:'#4b4739',mark:'⌒'},{title:'Aliyah',cover:'Aliyah<br><small>The Ascent</small>',short:'A BOOK OF DISCOVERIES',type:'The ascent',sub:'Follow the threads that run through the whole of Scripture.',color:'#3c5149',ink:'#e1cfaa',mark:'≋'},{title:'The Foundations',cover:'The<br>Foundations',short:'HOW THE WORDS REACHED YOU',type:'For the curious reader',sub:'Scribes, scrolls, and a story you can examine for yourself.',color:'#bac8d1',ink:'#34434e',mark:'✳'}];
const psalm=['God is our refuge and strength, a very present help in trouble.','Therefore will not we fear, though the earth be removed, and though the mountains be carried into the midst of the sea;','Though the waters thereof roar and be troubled, though the mountains shake with the swelling thereof. Selah.','There is a river, the streams whereof shall make glad the city of God, the holy place of the tabernacles of the most High.','God is in the midst of her; she shall not be moved: God shall help her, and that right early.','The heathen raged, the kingdoms were moved: he uttered his voice, the earth melted.','The LORD of hosts is with us; the God of Jacob is our refuge. Selah.','Come, behold the works of the LORD, what desolations he hath made in the earth.','He maketh wars to cease unto the end of the earth; he breaketh the bow, and cutteth the spear in sunder; he burneth the chariot in the fire.','Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.','The LORD of hosts is with us; the God of Jacob is our refuge. Selah.'];
function readView(){return `<div class="chapter-head"><div class="micro">Book II · A song of refuge</div><h1>God is in the midst.</h1><p>To the chief Musician. A Psalm for the sons of Korah.</p></div><div class="scripture"><p><span class="dropcap">46</span><sup>1</sup>${psalm[0]} <sup>2</sup>${psalm[1]} <sup>3</sup>${psalm[2]}</p><p>${psalm.slice(3,7).map((v,i)=>`<sup>${i+4}</sup>${v}`).join(' ')}</p><p>${psalm.slice(7).map((v,i)=>i===2?`<button class="verse-select" onclick="reader('study')" aria-label="Study Psalm 46 verse 10"><sup>10</sup>${v} ✦</button>`:`<sup>${i+8}</sup>${v}`).join(' ')}</p></div><button class="quiet" onclick="reader('study')">${icon('spark')}<span><strong>A word worth staying with.</strong><small>Explore Psalm 46:10 in Study.</small></span>${icon('arrow')}</button><p class="footnote">Psalm 46 · King James Version</p>`}
function studyView(){return `<div class="study-meta"><strong>Psalm 46:10</strong><button class="link" onclick="toggleSaved()" aria-pressed="${saved}">${icon('save')} ${saved?'Saved':'Save verse'}</button></div><div class="study-card"><div class="study-layer original"><div class="micro">01 / Original · Hebrew</div><div class="hebrew" lang="he" dir="rtl">${['הַרְפּוּ','וּדְעוּ','כִּי־אָנֹכִי','אֱלֹהִים'].map((w,i)=>`<button onclick="word(${i})">${w}</button>`).join('')}</div><div class="translit">Harpū ūde‘ū kī ’ānōḵī ’ĕlōhīm.</div><div class="hint">Tap a word to uncover its meaning · verse excerpt</div></div><div class="study-layer"><div class="micro">02 / Fresh rendering <span style="color:var(--accent)">✦ Eliana</span></div><blockquote class="rendering">“Let go, and recognize<br>that I am God.”</blockquote></div><div class="study-layer"><button class="word" onclick="word(0)"><span><span class="micro" style="display:block;margin-bottom:12px">03 / A word to carry</span><strong>הַרְפּוּ <em style="font-size:15px;color:var(--muted)">harpū</em></strong><p>Release your grip. Cease striving.</p></span>${icon('arrow')}</button></div></div><button class="chain" onclick="chain()"><span class="micro">Connected across Scripture · № 07</span><strong>When surrender becomes strength</strong><small>Psalm 46:10 → Exodus 14:14 → Matthew 11:28 ↗</small></button><button class="primary study-next" onclick="go('article')">Read the full verse study ${icon('arrow')}</button><button class="quiet" onclick="go('eliana')">${icon('spark')}<span><strong>What is this stirring in you?</strong><small>Explore this verse with Eliana.</small></span>${icon('arrow')}</button>`}
function toggleSaved(){saved=!saved;persist('er-saved',saved);render();toast(saved?'Verse kept in Your journey':'Verse removed from saved')}
function openModal(title,html){clearInterval(timer);$('#modal-body').innerHTML=`<div class="handle"></div><div class="dialog-top"><span class="micro">${title}</span><button aria-label="Close dialog" onclick="closeModal()">×</button></div>${html}`;if(!$('#modal').open)$('#modal').showModal()}
function closeModal(){clearInterval(timer);$('#modal').close()}$('#modal').addEventListener('cancel',()=>clearInterval(timer));$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientY<r.top||e.clientX<r.left||e.clientX>r.right)closeModal()}});
function settings(){openModal('Make yourself at home',`<h2>A different light.<br>The same quiet place.</h2><div class="options">${themes.map(([id,name,color,desc])=>`<button class="theme-option" aria-pressed="${theme===id}" style="--swatch:${color}" onclick="setTheme('${id}')"><span></span><strong>${name}</strong><small>${desc}</small></button>`).join('')}</div><div class="setting-row"><span>Larger Scripture</span><button onclick="toggleSize();settings()" aria-pressed="${large}">${large?'On':'Off'}</button></div><div class="setting-row"><span>High contrast</span><button onclick="document.body.classList.toggle('contrast');settings()" aria-pressed="${document.body.classList.contains('contrast')}">${document.body.classList.contains('contrast')?'On':'Off'}</button></div><button class="row" onclick="closeModal();go('journey')"><span class="copy"><strong>Your journey</strong><small>Reflections, saved verses & small returns</small></span>${icon('arrow')}</button>`)}
function toggleSize(){large=!large;document.documentElement.style.setProperty('--reading',large?'24px':'20px')}
function readingSettings(){openModal('Reading preferences',`<h2>Room for the words.</h2><div class="setting-row"><span>Scripture text size</span><button onclick="toggleSize();readingSettings()">${large?'Large · 24':'Standard · 20'}</button></div><p>Read follows the chapter. Study opens the original language, rendering, and connected passages.</p><button class="primary" onclick="settings()">Choose your atmosphere ${icon('arrow')}</button>`)}
function passages(){openModal('Scripture',`<h2>Return to the Word.</h2><p>This concept follows Psalm 46, from the flowing chapter into its original words.</p><button class="row" onclick="closeModal();reader('read')"><span class="copy"><strong>Psalms · Chapter 46</strong><small>Read the complete chapter</small></span>${icon('arrow')}</button><button class="row" onclick="closeModal();reader('study')"><span class="copy"><strong>Psalm 46:10</strong><small>Original language & verse study</small></span>${icon('arrow')}</button>`)}
function translations(){openModal('Translations',`<h2>Many voices.<br>One place to listen.</h2><p>This prototype includes the KJV chapter and an excerpt of Eliana’s fresh rendering. BSB and ASV are available in the full app.</p><button class="row" onclick="closeModal();reader('read')"><span class="copy"><strong>King James Version</strong><small>KJV · Complete chapter</small></span>✓</button><button class="row" onclick="closeModal();reader('study')"><span class="copy"><strong>✦ Eliana’s rendering</strong><small>Psalm 46:10 · Explore in Study</small></span>${icon('arrow')}</button><div class="row"><span class="copy"><strong>BSB · ASV</strong><small>Additional translations in the full app</small></span></div>`)}
const words=[['הַרְפּוּ','harpū','H7503 · רָפָה','Hiphil imperative · masculine plural','Release. Let go. Cease striving.','The root can describe slackening or letting drop. In this psalm, the command interrupts the tumult of nations and turns attention toward God.'],['וּדְעוּ','ūde‘ū','H3045 · יָדַע','Qal imperative · masculine plural','And know. Recognize.','Knowing here is recognition: acknowledging who God is in the middle of the upheaval.'],['כִּי־אָנֹכִי','kī ’ānōḵī','H3588 / H595','Conjunction / first-person pronoun','That I am.','These words lead into the declaration of God’s identity.'],['אֱלֹהִים','’ĕlōhīm','H430','Noun · masculine plural in form','God.','Though plural in form, this name here refers to the one God speaking in the psalm.']];
function word(i){const w=words[i];openModal('Within the word',`<div class="big-word" lang="he" dir="rtl">${w[0]}</div><div class="translit" style="text-align:center;font-size:19px">${w[1]}</div><p style="text-align:center">${w[2]}</p><span class="pill">${w[3]}</span><h3>${w[4]}</h3><p>${w[5]}</p><div class="micro" style="margin-top:24px">${i===0?'Elsewhere in Scripture':'Return to the passage'}</div>${i===0?`<button class="row" onclick="occurrence()"><span class="copy"><strong>Joshua 10:6</strong><small>The same root, in a different setting</small></span>${icon('arrow')}</button>`:''}<button class="row" onclick="closeModal();reader('study')"><span class="copy"><strong>Psalm 46:10</strong><small>See the word in its context</small></span>${icon('arrow')}</button>`)}
function occurrence(){openModal('Word occurrence · H7503',`<h2>Joshua 10:6</h2><p style="font:22px/1.6 Georgia;color:var(--ink)">“Slack not thy hand from thy servants; come up to us quickly, and save us, and help us…”</p><p>KJV · Verse excerpt. The same Hebrew root appears in an urgent appeal not to withdraw help.</p><button class="primary" onclick="word(0)">Return to harpū ${icon('arrow')}</button>`)}
function chain(){openModal('Scripture chain · № 07',`<h2>When surrender<br>becomes strength.</h2><p>Follow an invitation from standing still to finding rest.</p><h3>01 · Psalm 46:10</h3><p>“Be still, and know that I am God.”</p><h3>02 · Exodus 14:14</h3><p>“The LORD shall fight for you, and ye shall hold your peace.”</p><h3>03 · Matthew 11:28</h3><p>“Come unto me, all ye that labour and are heavy laden, and I will give you rest.”</p><p class="micro">KJV · Connected excerpts</p><button class="primary" onclick="closeModal();go('journal')">Reflect on this thread ${icon('pen')}</button>`)}
function openBook(i){bookIndex=i;go('book')}
function lesson(n=1){const title=bookIndex===0?(n===2?'The ordinary sacred':'The space between'):bookIndex===1?(n===2?'Through the wilderness':'Out of Egypt'):(n===2?'Scribes, scrolls & witnesses':'How the words reached you');openModal(books[bookIndex].title,`<h2>${title}</h2><span class="pill">${n===2?'Chapter 2':'Chapter 1'} · Reading preview</span><p style="font:20px/1.7 Georgia;color:var(--ink)">${bookIndex===0?'Not every silence needs to be filled. Sometimes the space between our words is where we begin to listen.':bookIndex===1?'A path opens where there seemed to be no way. The story of deliverance begins with a people who cannot free themselves.':'The Bible came to us through human hands: copied, carried, translated, and treasured. Knowing that story can deepen the way we read.'}</p><h3>Carry this with you</h3><p>${bookIndex===2?'What questions do you bring to the story of Scripture?':'Where might you make a little room for trust today?'}</p><button class="primary" onclick="closeModal();go('journal')">Reflect on this reading ${icon('pen')}</button>`)}
function promptJournal(){openModal('A little guidance',`<h2>Start with one<br>honest sentence.</h2>${['Today, I am grateful for…','Something I cannot control is…','God, help me make room for…'].map((s,i)=>`<button class="row" onclick="choosePrompt(${i})"><span class="copy"><strong>${s}</strong></span>${icon('arrow')}</button>`).join('')}`)}
function choosePrompt(i){draft+=(draft?'\n\n':'')+['Today, I am grateful for…','Something I cannot control is…','God, help me make room for…'][i]+' ';closeModal();render();$('#entry').focus()}
function saveEntry(){const t=$('#entry').value.trim();if(!t)return toast('Begin with a word or a thought.');entries.unshift({text:t,date:new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'})});const kept=persist('er-entries',entries);draft='';render();toast(kept?'Your reflection is kept.':'Kept for this session. Browser storage is unavailable.')}
function entryList(q){const list=entries.filter(e=>e&&typeof e.text==='string'&&e.text.toLowerCase().includes(q.toLowerCase()));return list.length?list.map(e=>`<article class="entry"><div class="micro">${esc(e.date)} · Psalm 46:10</div><p>${esc(e.text)}</p></article>`).join(''):`<p class="sub">${q?'No reflections match your search.':'Your first reflection can be a single sentence.'}</p>`}function filterEntries(q){$('#entries').innerHTML=entryList(q)}
function ask(q){if(!q.trim())return;clearInterval(stream);$('#question').value='';$('#answer').innerHTML=`<p class="sub" style="margin-top:24px">${esc(q)}</p><div class="chat-answer"><span id="stream"></span><div id="chat-links"></div></div>`;const response='There is a difference between caring deeply and carrying everything. In Psalm 46, stillness comes in the middle of upheaval. It is an invitation to recognize God’s presence before we decide what to do next. What is one thing you feel you have to hold together today?';const ws=response.split(' ');let i=0;const el=$('#stream');stream=setInterval(()=>{if(!el.isConnected){clearInterval(stream);return}el.textContent+=ws[i++]+' ';if(i===ws.length){clearInterval(stream);$('#chat-links').innerHTML=`<button class="link" onclick="reader('study')">Psalm 46:10 · Explore the verse ↗</button><br><span class="micro">Illustrative response for this preview</span>`}},38)}
function makePrayer(){const t=$('#prayer-input').value.trim();if(!t)return toast('Share a few words to begin.');openModal('A prayer to make your own',`<h2>God, meet me here.</h2><p class="micro">Your words</p><p>${esc(t)}</p><p style="font:20px/1.7 Georgia;color:var(--ink)">God, I bring you what I am carrying. Meet me with patience in the places I cannot untangle. Give me wisdom for the next small step, and peace for what is beyond my hands. Help me trust that I am held. Amen.</p><p>Sample prayer · A starting point for your own words.</p><button class="primary" onclick="keepPrayer()">Keep in my journal ${icon('pen')}</button>`)}
function keepPrayer(){draft+=(draft?'\n\n':'')+'God, I bring you what I am carrying. Give me wisdom for the next small step, and peace for what is beyond my hands. Amen.';closeModal();go('journal')}
function curatedPrayer(type){openModal('The Throne Room',`<h2>${type==='morning'?'At the beginning<br>of the day.':'When the way<br>feels unclear.'}</h2><p style="font:22px/1.7 Georgia;color:var(--ink)">${type==='morning'?'God, receive this day before I know what it holds. Give me eyes to notice goodness, hands ready to help, and a heart willing to begin again. Amen.':'God, be near in the uncertainty. Help me take the step I can see, and trust you with the road I cannot. Amen.'}</p><button class="primary" onclick="closeModal();go('journal')">Write your own prayer ${icon('pen')}</button>`)}
function stillness(){openModal('Stillness · One quiet minute',`<h2>For now,<br>simply be here.</h2><div class="breath" id="breath">Be still.</div><p style="text-align:center">Let your shoulders soften.<br>There is nothing to earn in this moment.</p><button class="primary" id="begin" onclick="startStillness()">Begin · 60 seconds ${icon('arrow')}</button>`)}
function startStillness(){let left=60;$('#breath').classList.add('running');$('#begin').disabled=true;$('#begin').textContent='60 seconds remaining';timer=setInterval(()=>{left--;$('#begin').textContent=left+' seconds remaining';$('#breath').textContent=left%8<4?'Let go.':'Be here.';if(left<=0){clearInterval(timer);$('#breath').classList.remove('running');$('#breath').textContent='Amen.';$('#begin').disabled=false;$('#begin').textContent='Carry this peace with you →';$('#begin').onclick=closeModal}},1000)}
function toast(s){clearTimeout(toastTimer);$('#toast').textContent=s;toastTimer=setTimeout(()=>$('#toast').textContent='',3000)}
render();
</script>
</body>
</html>

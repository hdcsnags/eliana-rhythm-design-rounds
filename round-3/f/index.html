:root[data-theme=sacred] {
  color-scheme:dark;
  --page:#151929; --panel:#1e2438; --inset:#252d45; --ink:#f2ecdf; --muted:#b8bfd0;
  --line:#3b435e; --accent:#becbff; --wash:#2b3454; --on:#18213b; --gold:#e6c18f; --outside:#0f121e;
}
:root[data-theme=shekinah] {
  color-scheme:dark;
  --page:#000; --panel:#111; --inset:#191919; --ink:#f5efe6; --muted:#bcb4aa;
  --line:#39332c; --accent:#ffca72; --wash:#322511; --on:#201401; --gold:#ffd393; --outside:#151515;
}
:root[data-theme=crisp] {
  --page:#f9faf8; --panel:#fff; --inset:#e9efee; --ink:#142c2c; --muted:#485e60;
  --line:#cddad9; --accent:#185b60; --wash:#e1eeee; --on:#f8ffff; --gold:#5c663a; --outside:#dce5e3;
}
:root[data-contrast=true] { --muted:var(--ink); --line:var(--muted); }
* { box-sizing:border-box; }
[hidden] { display:none!important; }
body { margin:0; color:var(--ink); background:var(--outside); font:15px/1.45 var(--ui); }
button,input,textarea,select { font:inherit; color:inherit; }
button { border:0; background:none; padding:0; cursor:pointer; }
button:disabled { opacity:.45; cursor:default; }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
:focus:not(:focus-visible) { outline:none; }
h1,h2,h3,p,blockquote { margin:0; }
h1,h2,h3 { font-family:var(--serif); font-weight:400; }
h1 { font-size:43px; line-height:1.05; letter-spacing:-.058em; }
h2 { font-size:27px; line-height:1.13; letter-spacing:-.04em; }
h3 { font-size:23px; line-height:1.2; letter-spacing:-.025em; }
small { font-size:13px; }
.app { width:min(100%,460px); min-height:100dvh; margin:auto; background:var(--page); }
.icon { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; vertical-align:middle; }
.defs { position:absolute; width:0; height:0; overflow:hidden; }
.top { padding:12px 23px; min-height:67px; display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:9px; font:21px/1 var(--serif); letter-spacing:-.045em; }
.brand .icon { width:29px; height:29px; color:var(--accent); }
.icon-button { flex:none; display:grid; place-items:center; width:44px; height:44px; border-radius:50%; color:var(--accent); }
.icon-button.framed { border:1px solid var(--line); }
.icon-button:hover,.tool:hover { background:var(--wash); }
.pane { padding:0 24px 100px; }
.eyebrow { font-size:11px; line-height:1.4; font-weight:750; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); }
.muted { color:var(--muted); }
.home-intro { display:flex; align-items:flex-end; justify-content:space-between; gap:8px; padding:24px 0 20px; }
.home-intro h1 { margin-top:6px; font-size:clamp(34px,11vw,45px); white-space:nowrap; }
.cover { position:relative; isolation:isolate; min-height:313px; display:flex; flex-direction:column; padding:16px 18px 0; overflow:hidden; color:#fff5e7; background:#182139; border-radius:7px 48px 7px 7px; }
.cover::before { position:absolute; content:""; z-index:-1; inset:0; background:linear-gradient(90deg,#10172bd9 0%,#111a2a70 63%,#111a2a1c),linear-gradient(0deg,#0d1429f0 0%,transparent 51%),var(--photo) center 51%/cover; }
[data-theme=shekinah] .cover::before { filter:sepia(.36) saturate(.9); }
[data-theme=crisp] .cover::before { filter:hue-rotate(-21deg) saturate(.73); }
.cover-top,.cover-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.cover .eyebrow,.cover .reference { color:#f0cf9d; }
.cover .icon-button { color:#fff5e7; width:44px; height:44px; }
.cover .icon-button:hover { background:#fff3; }
.cover blockquote { font:clamp(31px,9.5vw,39px)/1.03 var(--serif); letter-spacing:-.039em; max-width:267px; margin:15px 0 11px; text-shadow:0 2px 10px #0006; }
.cover .reference { font-size:13px; font-weight:600; letter-spacing:.03em; }
.cover-foot { border-top:1px solid #ffebcb65; margin-top:auto; min-height:55px; }
.cover-foot button { align-self:stretch; display:flex; align-items:center; gap:7px; font-size:13px; font-weight:650; }
.cover-foot .icon { width:16px; height:16px; }
[aria-pressed=true] .saved-icon { fill:currentColor; }
.home-section { margin-top:24px; }
.home-section h2 { margin-bottom:8px; }
.row { width:100%; min-height:68px; display:flex; align-items:center; text-align:left; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); }
.row:hover .row-title,.text-button:hover { color:var(--accent); }
.row > span:nth-child(2) { flex:1; min-width:0; }
.row-title { display:block; font:21px/1.16 var(--serif); letter-spacing:-.025em; }
.row small { display:block; margin-top:4px; color:var(--muted); }
.row .chev { width:17px; height:17px; color:var(--accent); }
.tile { width:43px; height:45px; display:grid; place-items:center; background:var(--wash); color:var(--accent); border-radius:5px; flex:none; }
.resume { padding:12px; border:1px solid var(--line); border-radius:7px; background:var(--panel); }
.resume .eyebrow { display:block; margin-bottom:4px; }
.book-spine { width:38px; height:49px; display:grid; place-items:center; border-radius:3px 6px 6px 3px; box-shadow:inset 4px 0 #0002; background:#664b68; color:#faf1dc; flex:none; }
.book-spine.ascent { background:#304e53; }
.book-spine.foundations { background:#785137; }
.spaces { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.space { min-height:76px; border:1px solid var(--line); background:var(--panel); padding:10px; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:6px; font-size:14px; }
.space .icon { color:var(--accent); }
.tabs { position:fixed; z-index:5; bottom:0; left:50%; transform:translateX(-50%); width:min(100%,460px); display:grid; grid-template-columns:repeat(4,1fr); padding:4px 12px max(6px,env(safe-area-inset-bottom)); background:var(--page); border-top:1px solid var(--line); }
.tabs button { display:grid; gap:4px; justify-items:center; align-content:center; min-height:55px; font-size:11px; font-weight:620; color:var(--muted); }
.tabs button[aria-current=page] { color:var(--accent); }
.tabs .nav-mark { display:grid; place-items:center; width:45px; height:27px; border-radius:20px; }
.tabs button[aria-current=page] .nav-mark { background:var(--wash); }
.tabs .icon { width:18px; height:18px; }
.reader-top { position:sticky; top:0; z-index:3; background:var(--page); border-bottom:1px solid var(--line); padding:5px 24px 0; }
.reader-tools { display:flex; align-items:center; gap:5px; min-height:52px; }
.locator { display:flex; align-items:center; gap:5px; margin-right:auto; font:24px/1 var(--serif); letter-spacing:-.045em; min-height:44px; }
.locator .icon,.tool .icon { width:16px; height:16px; }
.tool { min-height:44px; padding:0 8px; border-radius:5px; font-size:13px; font-weight:700; color:var(--accent); }
.mode { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.mode button { display:flex; align-items:center; justify-content:center; gap:7px; min-height:43px; border-bottom:2px solid transparent; font-size:13px; color:var(--muted); }
.mode button .icon { width:16px; height:16px; }
.mode button[aria-pressed=true] { border-color:var(--accent); font-weight:750; color:var(--accent); }
.reader-head { padding:24px 0 17px; }
.reader-head h1 { margin-top:4px; }
.reader-head .eyebrow { display:flex; gap:8px; align-items:center; }
.reader-head .eyebrow::before { content:""; width:17px; height:1px; background:var(--accent); }
.reader-head .muted { margin-top:7px; }
.chapter { font:var(--read-size)/1.51 var(--serif); letter-spacing:-.017em; }
.chapter p+p { margin-top:15px; }
.verse-marker { font:700 10px/1 var(--ui); color:var(--accent); vertical-align:super; display:inline-grid; place-items:center; padding:0 3px; min-width:22px; min-height:28px; margin-left:-2px; }
.verse-marker:hover { background:var(--wash); }
.verse.selected { background:var(--wash); box-decoration-break:clone; -webkit-box-decoration-break:clone; border-radius:3px; }
.selah { color:var(--muted); font-style:italic; }
.verse-actions,.actions { display:flex; gap:8px; flex-wrap:wrap; }
.verse-actions { margin:19px 0; }
.pill,.primary { min-height:44px; padding:7px 13px; border:1px solid var(--line); border-radius:6px; display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:650; font-size:13px; }
.pill:hover { background:var(--wash); }
.primary { color:var(--on); background:var(--accent); border-color:var(--accent); }
.primary:hover { filter:brightness(1.12); }
.pill .icon,.primary .icon { width:16px; height:16px; }
.study-heading { display:flex; align-items:end; justify-content:space-between; gap:8px; }
.verse-step { display:flex; gap:3px; }
.verse-step .icon-button { border:1px solid var(--line); }
.study-leaf { border:1px solid var(--line); border-radius:7px; background:var(--panel); overflow:hidden; }
.study-layer { padding:14px 15px; border-left:2px solid var(--line); }
.study-layer+.study-layer { border-top:1px solid var(--line); }
.study-layer p { margin-top:6px; }
.study-layer.rendering { border-left-color:var(--accent); }
.study-layer blockquote { font:var(--read-size)/1.3 var(--serif); letter-spacing:-.018em; margin-top:6px; }
.original { display:flex; flex-wrap:wrap; gap:1px 4px; margin-top:5px; }
.original button { min-width:44px; min-height:44px; padding:0 4px; font:23px/1.2 var(--serif); text-decoration:underline dotted; text-underline-offset:4px; border-radius:4px; }
.original .key { color:var(--accent); background:var(--wash); }
.original button:hover { background:var(--inset); }
.translit { font:italic 17px/1.38 var(--serif); color:var(--muted); }
.word-link { display:flex; align-items:center; justify-content:space-between; text-align:left; gap:5px; width:100%; min-height:45px; margin-top:3px; color:var(--accent); }
.word-link strong { font:23px/1.14 var(--serif); }
.word-link small { display:block; color:var(--muted); margin-top:3px; }
.study-preview { margin-top:12px; }
.study-cta { width:100%; justify-content:space-between; margin-top:14px; }
.section-head { padding:25px 0 19px; }
.section-head h1 { margin-top:5px; }
.section-head p:not(.eyebrow) { margin-top:8px; color:var(--muted); }
.article > section { padding:16px 0; border-top:1px solid var(--line); }
.article > section h2 { margin-bottom:8px; }
.article .scripture-display { font:24px/1.5 var(--serif); }
.article p+p { margin-top:6px; }
.article .practice { padding:15px; background:var(--wash); border:0; border-radius:7px; }
.practice .primary { margin-top:12px; }
.text-button { min-height:44px; color:var(--accent); font-weight:650; text-decoration:underline; text-underline-offset:4px; }
.field { width:100%; display:block; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:6px; }
textarea.field { resize:vertical; min-height:115px; }
form label { display:block; margin-bottom:6px; font-weight:650; }
form .actions { margin-top:11px; }
.stack { display:grid; gap:11px; margin-top:15px; }
.note { background:var(--panel); border:1px solid var(--line); padding:13px; border-radius:6px; overflow-wrap:anywhere; }
.note p { white-space:pre-wrap; margin-top:4px; }
.chat-log { margin:0 0 13px; display:grid; gap:10px; }
.chat-log .mine { background:var(--wash); margin-left:22px; }
.chat-log .answer { margin-right:22px; }
.timeline { margin-bottom:22px; border-left:1px solid var(--line); padding-left:15px; }
.timeline .row { position:relative; }
.timeline .row::before { content:""; width:7px; height:7px; position:absolute; top:26px; left:-19px; background:var(--accent); transform:rotate(45deg); }
.breath { display:grid; place-items:center; width:150px; height:150px; margin:32px auto; border:1px solid var(--accent); outline:1px solid var(--line); outline-offset:10px; border-radius:50%; background:var(--wash); color:var(--accent); font:25px var(--serif); }
.breath.running { animation:breathe 8s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform:scale(.92); } 50% { transform:scale(1.08); } }
dialog { color:var(--ink); background:var(--page); border:1px solid var(--line); border-radius:18px 18px 0 0; position:fixed; inset:auto 0 0; margin:0 auto; width:min(100%,460px); max-width:none; max-height:84dvh; padding:9px 23px max(22px,env(safe-area-inset-bottom)); }
dialog::backdrop { background:#0a1027a3; }
.dialog-head { display:flex; justify-content:space-between; align-items:center; gap:9px; margin-bottom:11px; }
.dialog-head h2 { margin-top:4px; }
.sheet p+p,.sheet .note+.note { margin-top:9px; }
.sheet .actions { margin-top:12px; }
.theme-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.theme-choice { background:var(--swatch); color:var(--sample); border:1px solid var(--rim); border-radius:6px; padding:10px; text-align:left; min-height:75px; }
.theme-choice[aria-pressed=true] { outline:2px solid var(--accent); outline-offset:2px; }
.theme-choice strong { display:block; font:20px/1.2 var(--serif); }
.theme-choice small { font-size:11px; }
.theme-choice small::before { content:""; display:inline-block; width:7px; height:7px; margin-right:6px; border-radius:50%; background:var(--swatch-accent); }
.pref { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:48px; border-bottom:1px solid var(--line); }
.pref select { min-height:36px; background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:2px 6px; }
.result { display:block; width:100%; text-align:left; min-height:44px; border-bottom:1px solid var(--line); padding:8px 0; }
.result strong { color:var(--accent); }
.result small { display:block; color:var(--muted); margin-top:3px; }
.result[aria-pressed=true] { font-weight:750; }
.lexeme { font:38px/1.2 var(--serif); margin-bottom:7px; }
@media(max-width:350px) { .pane,.reader-top { padding-left:17px; padding-right:17px; } .home-intro h1 { font-size:35px; } .study-heading h1 { font-size:36px; } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; } }

function updateChatLog() {
  const log = $('#chat-log');
  if (!log) return;
  log.innerHTML = messages.map(item => `<div class="note ${item.kind}"><small class="eyebrow">${item.kind === 'mine' ? 'You' : 'Eliana'}</small>

function sendReply(question) {
  if (ongoingReply) return;
  ongoingReply = true;
  const link = chatRef || 'ps:10';
  const text = link === 'jn:16'
    ? 'Notice how the verse moves from love to giving. Read it slowly and ask what the gift tells you about the giver.'
    : link === 'ex:14'
      ? 'Moses speaks at the sea, when the way forward is still hidden. Read the promise once more and notice who is doing the fighting.'
      : 'Read the stillness here alongside the verse before it, where God breaks the bow. What changes when you hear those words amid the sound of conflict?';
  const response = {kind:'answer', text:'', link, done:false};
  messages.push({kind:'mine', text:question}, response);
  renderChat();
  const words = text.split(' ');
  let cursor = 0;
  const timer = setInterval(() => {
    cursor += 2;
    response.text = words.slice(0, cursor).join(' ');
    if (cursor >= words.length) {
      clearInterval(timer);
      response.done = true;
      ongoingReply = false;
      const submit = $('#chat-form button[type=submit]');
      if (submit) submit.disabled = false;
    }
    updateChatLog();
  }, 62);
}

  let further = occurrences.map(id =>
    `<button class="result" data-passage="${id}"><strong>${reference(id)}</strong><small>${escapeText(passageText(id, 'KJV'))}</small></button>`).join('');
  if (key === 'raphah') further = '<p><strong>Deuteronomy 31:6</strong> · “he will not fail thee”</p><p><strong>Psalm 37:8</strong> · “Cease from anger”</p>';
  if (key === 'monogenes') further = '<p><strong>John 1:14</strong> · “the only begotten of the Father”</p><p><strong>Luke 7:12</strong> · “the only son of his mother”</p>';
  showSheet('Word study', lemma || number, `<div class="lexeme" lang="${number.startsWith('H') ? 'he' : 'grc'}">${word}</div>
    <p class="eyebrow">Strong’s ${number}</p><p><strong>${grammar}</strong></p><p>${meaning}</p>
    ${further ? `<div class="stack"><h3>Also appears in</h3>${further}</div>` : ''}`);
}
function verseSheet(id) {
  const hasStudy = Boolean(studySamples[id]);
  showSheet('Verse tools', reference(id), `<p>${escapeText(passageText(id))}</p>
    <div class="actions">
      ${hasStudy ? `<button class="primary" data-study-mode="${id}">${icon('spark')} Open Study mode</button>
        <button class="pill" data-study="${id}">Full verse study</button>` : ''}
      ${saveButton(id)}
      <button class="pill" data-compare="${id}">Compare</button>
      <button class="pill" data-ask="${id}">Ask Eliana</button>
      <button class="pill" data-room="journal" data-ref="${id}">Journal</button>
      <button class="pill" data-room="prayer" data-ref="${id}">Pray</button>
      ${['ps:10','ex:14'].includes(id) ? `<button class="pill" data-room="chain">${icon('chain')} Chain 12</button>` : ''}
    </div>`);
}
function compareSheet(id) {
  showSheet('Compare translations', reference(id),
    ['KJV','BSB','ASV','Eliana'].map(key => `<article class="note"><small class="eyebrow">${key === 'Eliana' ? '✦ Eliana · Sample' : key}</small><p>${escapeText(passageText(id, key))}</p></article>`).join('') +
    `<button class="text-button" data-verse="${id}">Back to verse tools</button>`);
}
function savePrayer(prayer) {
  if (!prayers.some(item => item.text === prayer)) {
    prayers.unshift({key:Date.now(), text:prayer, favorite:false});
    store('prayers', prayers);
  }
  $('#prayer-status').textContent = 'Saved to your prayers.';
}
function breathe(button) {
  const circle = $('#breath');
  clearInterval(stillTimer);
  if (circle.classList.contains('running')) {
    circle.classList.remove('running');
    circle.textContent = 'Ready';
    button.textContent = 'Begin 24-second pause';
    return;
  }
  circle.textContent = 'Breathe in';
  circle.classList.add('running');
  button.textContent = 'End pause';
  let elapsed = 0;
  stillTimer = setInterval(() => {
    elapsed += 4;
    if (elapsed >= 24) {
      clearInterval(stillTimer);
      circle.classList.remove('running');
      circle.textContent = 'Amen';
      button.textContent = 'Begin again';
    } else circle.textContent = elapsed % 8 ? 'Breathe out' : 'Breathe in';
  }, 4000);
}

document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) {
    if (event.target === dialog) {
      const rect = dialog.getBoundingClientRect();
      if (event.clientY < rect.top || event.clientX < rect.left || event.clientX > rect.right) dialog.close();
    }
    return;
  }
  const d = button.dataset;
  if (d.tab) {
    roomTrail = [];
    setScreen(d.tab);
  } else if (d.sheet) showNamedSheet(d.sheet);
  else if (d.passage) openPassage(d.passage);
  else if (d.mode) setMode(d.mode);
  else if (d.verse) verseSheet(d.verse);
  else if (d.word) wordSheet(d.word);
  else if (d.study) openRoom('study', d.study);
  else if (d.studyMode) {
    mode = 'study';
    store('mode', mode);
    openPassage(d.studyMode, false);
  } else if (d.step) {
    openPassage('ps:' + d.step, false);
    const same = $(`[data-step="${Number(d.step) + (button.getAttribute('aria-label') === 'Next verse' ? 1 : -1)}"]`);
    if (same && !same.disabled) same.focus({preventScroll:true});
  } else if (d.room) openRoom(d.room, d.ref);
  else if (d.compare) compareSheet(d.compare);
  else if (d.ask) {
    chatRef = d.ask;
    roomTrail = [];
    setScreen('eliana');
    $('#chat-input').focus({preventScroll:true});
  } else if (d.save) {
    saved = saved.includes(d.save) ? saved.filter(id => id !== d.save) : [d.save, ...saved];
    store('saved', saved);
    syncSaved();
  } else if (d.themeChoice) {
    theme = d.themeChoice;
    root.dataset.theme = theme;
    store('theme', theme);
    $$('[data-theme-choice]').forEach(choice => choice.setAttribute('aria-pressed', choice === button));
  } else if (d.version) {
    version = d.version;
    store('version', version);
    dialog.close();
    renderReader();
  } else if (d.prompt) {
    dialog.close();
    const entry = $('#entry');
    entry.value = d.prompt + '\n\n' + entry.value;
    entry.focus();
    entry.setSelectionRange(entry.value.length, entry.value.length);
  } else if (d.favorite) {
    const item = prayers.find(item => String(item.key) === d.favorite);
    item.favorite = !item.favorite;
    store('prayers', prayers);
    button.setAttribute('aria-pressed', item.favorite);
    button.textContent = item.favorite ? '★ Favourited' : '☆ Favourite';
  } else if (button.id === 'back') back();
  else if (button.id === 'breathe') breathe(button);
  else if (button.id === 'save-curated') savePrayer(curated[room.id][1]);
  else if (button.id === 'save-prayer') savePrayer(pendingPrayer);
});

document.addEventListener('input', event => {
  const {id, value} = event.target;
  if (id === 'verse-search') $('#search-results').innerHTML = results(value);
  if (id === 'journal-search') $('#journal-results').innerHTML = entries(value);
  if (id === 'prayer-search') $('#prayer-results').innerHTML = prayerCards(value);
});
document.addEventListener('change', event => {
  const {id, value, checked} = event.target;
  if (id === 'text-size') {
    root.style.setProperty('--read-size', value + 'px');
    store('text-size', value);
  }
  if (id === 'high-contrast') {
    root.dataset.contrast = checked;
    store('contrast', checked);
  }
});
document.addEventListener('submit', event => {
  const form = event.target;
  if (!['journal-form','chat-form','prayer-form'].includes(form.id)) return;
  event.preventDefault();
  const input = $('textarea', form);
  const text = input.value.trim();
  if (!text) {
    input.focus();
    return;
  }
  if (form.id === 'journal-form') {
    notes.unshift({text, id:room.id, date:new Date().toLocaleDateString('en-CA',{month:'long',day:'numeric',year:'numeric'})});
    store('notes', notes);
    input.value = '';
    $('#journal-status').textContent = 'Entry saved.';
    $('#journal-results').innerHTML = entries($('#journal-search').value);
  } else if (form.id === 'chat-form') sendReply(text);
  else {
    const closing = room.id === 'jn:16' ? 'Help me live in the love You have already given.' : 'Give me peace for what I cannot carry and courage for what is mine to do.';
    pendingPrayer = 'Father, I bring this to You today: ' + text + '\n\n' + closing + ' Amen.';
    $('#prayer-preview').innerHTML = `<article class="note"><h2>Sample prayer</h2><p>${escapeText(pendingPrayer)}</p></article>
      <div class="actions"><button class="primary" id="save-prayer">${icon('save')} Save prayer</button></div>
      <p class="muted" id="prayer-status" role="status"></p>`;
    $('#save-prayer').focus();
  }
});

const now = new Date();
$('#today-date').textContent = new Intl.DateTimeFormat('en-CA', {weekday:'long', month:'long', day:'numeric'}).format(now);
const hour = now.getHours();
$('#greeting').textContent = hour < 12 ? 'Good morning.' : hour < 18 ? 'Good afternoon.' : 'Good evening.';
fillIcons();
updateHome();
</script>

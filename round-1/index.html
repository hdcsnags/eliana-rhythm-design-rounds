suggestion\" onclick=\"answer()\">How do I forgive someone<br>who isn\u2019t sorry? \u2197<\/button><div id=\"answer\"><\/div><label class=\"eyebrow\" for=\"question\" style=\"display:block;margin-top:25px\">What\u2019s on your heart?<\/label><textarea id=\"question\" placeholder=\"Ask a question\u2026\"><\/textarea><button class=\"primary\" onclick=\"answer()\">Explore together ${icon('arrow')}<\/button><p class=\"sub\" style=\"margin-top:15px;font-size:11px\">A preview of a Scripture-guided conversation. Responses here are illustrative.<\/p>`,\njournal:()=>`<div class=\"intro\"><div class=\"eyebrow\">A place to be honest<\/div><h1>The heart,<br>unhurried.<\/h1><p class=\"sub\">What are you carrying into today?<\/p><\/div><span class=\"tag\">Reflecting on Psalm 46:10<\/span><label for=\"entry\" class=\"hidden\">Your reflection<\/label><textarea id=\"entry\" placeholder=\"God, today I\u2019m feeling\u2026\"><\/textarea><button class=\"primary\" onclick=\"saveEntry()\">Keep this reflection ${icon('pen')}<\/button><button class=\"text-link\" style=\"margin:14px auto\" onclick=\"prayer()\">Help me turn this into a prayer ${icon('arrow')}<\/button><p class=\"sub\" style=\"font-size:10px;text-align:center\">Demo reflections stay in this browser. Shared devices can access them.<\/p><div class=\"section-title\"><h2>Little moments, kept.<\/h2><\/div>${entries.map(e=>`<article class=\"journal-card\"><div class=\"eyebrow\">Today \u00b7 Psalm 46:10<\/div><p>${escapeHtml(e)}<\/p><\/article>`).join('')}<article class=\"journal-card\"><div class=\"eyebrow\">Wednesday, November 18 \u00b7 Sample<\/div><p>Felt anxious about work today, read Philippians 4:6 and sat with it.<\/p><span class=\"tag\">Philippians 4:6<\/span><\/article>`,\njourney:()=>`<div class=\"intro\"><div class=\"eyebrow\">Your journey \u00b7 Preview<\/div><h1>Quiet roots.<br>Steady growth.<\/h1><p class=\"sub\">A life of faith is made of small returns.<\/p><\/div><div class=\"week\">${['M','T','W','T','F','S','S'].map((d,i)=>`<div class=\"day\">${d}<i class=\"${i<4?'filled':''}\">${i<4?'\u2727':'\u00b7'}<\/i><\/div>`).join('')}<\/div><section class=\"blessing\"><div class=\"eyebrow\">This week\u2019s thread<\/div><p>Learning to rest<br>in what you cannot control.<\/p><small>4 MOMENTS IN THE WORD<\/small><\/section><div class=\"section-title\"><h2>Words to return to<\/h2><\/div>${step('bookmark','Psalm 46:10','Be still, and know that I am God.',\"go('reader')\")}<p class=\"bottom-note\">You don\u2019t have to catch up.<br><br>You can simply begin again.<\/p>`};\nfunction lens(){let content={context:'<h3>Stillness in the storm.<\/h3><p>This psalm moves through shaking mountains and warring nations to a God who ends conflict. \u201cBe still\u201d comes amid that upheaval: an invitation to recognize who is truly in control.<\/p>',meaning:'<h3>Make room for trust.<\/h3><p>Stillness here is more than a quiet room. It is a loosening of our grasp on control, grounded in God\u2019s power and presence.<\/p><p><em>Where might you release your grip today?<\/em><\/p>',deeper:'<div class=\"hebrew-word\"><span lang=\"he\" dir=\"rtl\">\u05d4\u05b7\u05e8\u05b0\u05e4\u05bc\u05d5\u05bc<\/span> <span style=\"font:italic 17px Georgia\">harp\u016b<\/span><\/div><h3>Let go. Cease striving.<\/h3><p>The Hebrew verb <em>r\u0101ph\u0101h<\/em> can carry the sense of slackening or letting drop. Here, the plural command addresses a world in turmoil\u2014not only an individual seeking calm.<\/p><p class=\"fine\">Hebrew root: \u05e8\u05e4\u05d4 \u00b7 Interpretive study note<\/p>'};return `<aside class=\"lens\"><div class=\"lens-heading\"><span class=\"eyebrow\">In the margins \u00b7 46:10<\/span>${icon('leaf')}<\/div><div class=\"tabs\" role=\"tablist\">${[['context','Context'],['meaning','Meaning'],['deeper','Deeper lens']].map(([k,v])=>`<button role=\"tab\" aria-selected=\"${tab===k}\" class=\"${tab===k?'active':''}\" onclick=\"tab='${k}';const y=scrollY;render();scrollTo(0,y)\">${v}<\/button>`).join('')}<\/div><div role=\"tabpanel\">${content[tab]}<\/div><\/aside>`}\nfunction escapeHtml(s){return s.replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nfunction toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2600)}\nfunction openModal(s){$('#modal').innerHTML=`<button class=\"close\" aria-label=\"Close dialog\" onclick=\"closeModal()\">\u00d7<\/button>${s}`;$('#modal').showModal()}\nfunction closeModal(){clearInterval(timer);$('#modal').close()}\n$('#modal').addEventListener('cancel',()=>clearInterval(timer));\nfunction stillness(){openModal('<div class=\"eyebrow\">A quiet minute<\/div><h2>Nothing to prove.<br>Just be here.<\/h2><div class=\"breath\" id=\"breath\">Be still.<\/div><p style=\"text-align:center\">Let your shoulders soften.<br>God is present in this moment.<\/p><button class=\"primary\" id=\"start\" style=\"margin-top:24px\" onclick=\"startStillness()\">Begin \u00b7 60 seconds<\/button>')}\nfunction startStillness(){let left=60;$('#breath').classList.add('breathing');$('#start').disabled=true;$('#start').textContent='60 seconds remaining';timer=setInterval(()=>{left--;$('#start').textContent=left+' seconds remaining';if(left<=0){clearInterval(timer);$('#breath').classList.remove('breathing');$('#breath').textContent='Amen.';$('#start').textContent='Carry this peace with you';}},1000)}\nfunction saveEntry(){let t=$('#entry').value.trim();if(!t)return toast('Write a thought to keep first.');entries.unshift(t);try{localStorage.setItem('eliana-reflections',JSON.stringify(entries));render();toast('Your reflection is kept.')}catch(e){render();toast('Kept for this session only.')}}\nfunction prayer(){openModal('<div class=\"eyebrow\">A prayer to make your own<\/div><h2>God, meet me here.<\/h2><p>Help me bring you what I am carrying, even when the words are hard to find. Teach me to release what I cannot control, and to take the next small step with you. Let your peace make room in my heart today. Amen.<\/p><p style=\"font-size:10px;margin-top:18px\">Sample prayer \u00b7 A starting point for your own words.<\/p>')}\nfunction answer(){const q=$('#question').value.trim();if(q&&!q.toLowerCase().includes('forgiv')){$('#answer').innerHTML='<p class=\"chat-answer\">This preview explores forgiveness. Choose the suggested question to try the conversation.<\/p>';return}$('#question').value='How do I forgive someone who isn\u2019t sorry?';$('#answer').innerHTML='<div class=\"chat-answer\" role=\"status\"><\/div>';const words='Forgiveness can begin before an apology arrives. Romans 12:18 acknowledges that peace is not always within your control. You can release the desire for revenge while still keeping wise boundaries. Forgiveness does not require pretending the harm was small, or restoring trust before it is safe. What feels hardest to let go of right now?'.split(' ');let i=0;const el=$('#answer .chat-answer');const stream=setInterval(()=>{if(!el.isConnected||i>=words.length){clearInterval(stream);return}el.textContent+=words[i++]+' '},45)}\nfunction chapterPicker(){openModal('<div class=\"eyebrow\">Scripture library \u00b7 Preview<\/div><h2>Return to the Word.<\/h2><p>This concept includes Psalm 46 with its complete text and verse study.<\/p><button class=\"suggestion\" onclick=\"closeModal();go(\\'reader\\')\">Psalms \u00b7 Chapter 46 \u2192<\/button>')}\nfunction settings(){openModal('<div class=\"eyebrow\">Make yourself at home<\/div><h2>Reading preferences<\/h2><div class=\"settings-row\"><span>Larger Scripture text<\/span><button onclick=\"document.body.classList.toggle(\\'large\\');this.textContent=document.body.classList.contains(\\'large\\')?\\'On\\':\\'Off\\'\">'+(document.body.classList.contains('large')?'On':'Off')+'<\/button><\/div><div class=\"settings-row\"><span>High contrast<\/span><button onclick=\"document.body.classList.toggle(\\'contrast\\');this.textContent=document.body.classList.contains(\\'contrast\\')?\\'On\\':\\'Off\\'\">'+(document.body.classList.contains('contrast')?'On':'Off')+'<\/button><\/div><p style=\"font-size:11px\">Eliana\u2019s Rhythm \u00b7 An interactive design concept<\/p>')}\nrender();\n<\/script>\n<\/body>\n<\/html>\n<!--\nA quiet daily rhythm: receive, pause, and reflect, without streaks or pressure.\nScripture stays at the center; study unfolds in its margins, from context to Hebrew.\n-->\n"}, {"letter": "G", "seat": "hydrogen", "file": "mockup.html", "html": "<!-- Gemini 4 Hydrogen -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\" />\n<title>Eliana's Rhythm \u2014 Concept Mockup<\/title>\n<style>\n  :root {\n    --bg: #F6F2EA;\n    --bg-elevated: #FFFDF8;\n    --bg-muted: #ECE5D8;\n    --bg-tint: #E5ECE4;\n    --ink: #1F2421;\n    --ink-soft: #545C55;\n    --ink-faint: #848B82;\n    --accent: #3F6148;\n    --accent-soft: #D9E5DB;\n    --accent-ink: #FFFFFF;\n    --warm: #B86B43;\n    --warm-soft: #F3E2D8;\n    --border: rgba(31, 36, 33, 0.10);\n    --shadow: 0 8px 24px rgba(31, 36, 33, 0.06);\n    --font-serif: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;\n    --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;\n    --font-hebrew: 'SBL Hebrew', 'Ezra SIL', 'Times New Roman', serif;\n    --scale: 1;\n    --radius: 20px;\n  }\n\n  [data-theme=\"dusk\"] {\n    --bg: #171A18;\n    --bg-elevated: #212623;\n    --bg-muted: #2A302C;\n    --bg-tint: #233128;\n    --ink: #EDEAE2;\n    --ink-soft: #B2B6AE;\n    --ink-faint: #7E857D;\n    --accent: #82AD8D;\n    --accent-soft: #2A3D30;\n    --accent-ink: #121714;\n    --warm: #D9936D;\n    --warm-soft: #362821;\n    --border: rgba(237, 234, 226, 0.11);\n    --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);\n  }\n\n  [data-theme=\"contrast\"] {\n    --bg: #FFFFFF;\n    --bg-elevated: #FFFFFF;\n    --bg-muted: #F0F0F0;\n    --bg-tint: #E6F0EA;\n    --ink: #000000;\n    --ink-soft: #1C1C1C;\n    --ink-faint: #404040;\n    --accent: #0B4F28;\n    --accent-soft: #D4E8DA;\n    --accent-ink: #FFFFFF;\n    --warm: #8F3300;\n    --warm-soft: #FDE5D8;\n    --border: rgba(0, 0, 0, 0.45);\n    --shadow: none;\n  }\n\n  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n\n  html, body {\n    margin: 0;\n    padding: 0;\n    background: #1B1D1B;\n    font-family: var(--font-sans);\n    color: var(--ink);\n    display: flex;\n    justify-content: center;\n    min-height: 100vh;\n  }\n\n  /* Phone viewport frame: 390x844 friendly, fills cleanly at 390px */\n  .phone-shell {\n    width: 100%;\n    max-width: 390px;\n    min-height: 844px;\n    background: var(--bg);\n    color: var(--ink);\n    position: relative;\n    display: flex;\n    flex-direction: column;\n    overflow-x: hidden;\n    transition: background 0.25s ease, color 0.25s ease;\n    box-shadow: 0 0 60px rgba(0,0,0,0.45);\n  }\n\n  /* Subtle top bar */\n  .topbar {\n    position: sticky;\n    top: 0;\n    z-index: 20;\n    background: color-mix(in srgb, var(--bg) 90%, transparent);\n    backdrop-filter: blur(12px);\n    -webkit-backdrop-filter: blur(12px);\n    padding: 14px 18px 10px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    border-bottom: 1px solid var(--border);\n  }\n\n  .brand {\n    display: flex;\n    align-items: center;\n    gap: 9px;\n  }\n\n  .brand-mark {\n    width: 28px;\n    height: 28px;\n    border-radius: 9px;\n    background: var(--accent-soft);\n    color: var(--accent);\n    display: grid;\n    place-items: center;\n  }\n\n  .brand-title {\n    font-family: var(--font-serif);\n    font-size: 16px;\n    font-weight: 600;\n    letter-spacing: -0.01em;\n    line-height: 1.1;\n  }\n\n  .brand-sub {\n    font-size: 11px;\n    color: var(--ink-faint);\n    letter-spacing: 0.03em;\n  }\n\n  .top-actions {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n  }\n\n  .icon-btn {\n    width: 36px;\n    height: 36px;\n    border-radius: 12px;\n    border: 1px solid var(--border);\n    background: var(--bg-elevated);\n    color: var(--ink);\n    display: grid;\n    place-items: center;\n    cursor: pointer;\n    transition: transform 0.15s ease, background 0.2s ease;\n  }\n  .icon-btn:active { transform: scale(0.94); }\n\n  /* Main scrollable canvas */\n  .content {\n    flex: 1;\n    padding: 16px 18px 98px;\n    display: flex;\n    flex-direction: column;\n    gap: 16px;\n  }\n\n  .screen { display: none; flex-direction: column; gap: 16px; animation: fadeIn 0.22s ease; }\n  .screen.active { display: flex; }\n\n  @keyframes fadeIn {\n    from { opacity: 0; transform: translateY(4px); }\n    to { opacity: 1; transform: translateY(0); }\n  }\n\n  /* Typography helpers respecting user text scale */\n  .t-body { font-size: calc(15px * var(--scale)); line-height: 1.55; }\n  .t-verse { font-family: var(--font-serif); font-size: calc(19px * var(--scale)); line-height: 1.5; }\n  .t-scripture { font-family: var(--font-serif); font-size: calc(17px * var(--scale)); line-height: 1.72; }\n  .eyebrow {\n    font-size: 11px;\n    font-weight: 600;\n    letter-spacing: 0.09em;\n    text-transform: uppercase;\n    color: var(--ink-faint);\n  }\n\n  /* Cards */\n  .card {\n    background: var(--bg-elevated);\n    border: 1px solid var(--border);\n    border-radius: var(--radius);\n    padding: 18px;\n    box-shadow: var(--shadow);\n  }\n\n  .card-tint {\n    background: var(--bg-tint);\n    border: 1px solid var(--border);\n    border-radius: var(--radius);\n    padding: 18px;\n  }\n\n  /* Home: Rhythm arc header */\n  .day-arc {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n  }\n\n  .cadence-pills {\n    display: flex;\n    gap: 6px;\n    background: var(--bg-muted);\n    padding: 4px;\n    border-radius: 999px;\n  }\n\n  .cadence-pill {\n    border: none;\n    background: transparent;\n    color: var(--ink-soft);\n    font-size: 11.5px;\n    font-weight: 600;\n    padding: 5px 10px;\n    border-radius: 999px;\n    cursor: pointer;\n    transition: all 0.2s ease;\n  }\n  .cadence-pill.active {\n    background: var(--bg-elevated);\n    color: var(--ink);\n    box-shadow: 0 2px 6px rgba(0,0,0,0.08);\n  }\n\n  /* Hero Daily Verse */\n  .verse-hero {\n    position: relative;\n    overflow: hidden;\n    background: linear-gradient(155deg, var(--bg-elevated) 0%, var(--bg-tint) 100%);\n  }\n\n  .verse-quote-mark {\n    font-family: var(--font-serif);\n    font-size: 46px;\n    line-height: 0.6;\n    color: var(--accent);\n    opacity: 0.35;\n    margin-bottom: 6px;\n  }\n\n  .verse-ref-row {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    margin-top: 14px;\n    gap: 8px;\n  }\n\n  .pill-btn {\n    border: 1px solid var(--border);\n    background: var(--bg-elevated);\n    color: var(--ink);\n    font-size: 12.5px;\n    font-weight: 600;\n    padding: 8px 13px;\n    border-radius: 999px;\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    cursor: pointer;\n    transition: transform 0.12s ease, background 0.2s ease;\n  }\n  .pill-btn:active { transform: scale(0.96); }\n  .pill-btn.primary {\n    background: var(--accent);\n    color: var(--accent-ink);\n    border-color: transparent;\n  }\n  .pill-btn.warm {\n    background: var(--warm-soft);\n    color: var(--warm);\n    border-color: transparent;\n  }\n\n  /* Blessing Card with Hebrew toggle */\n  .hebrew-block {\n    font-family: var(--font-hebrew);\n    direction: rtl;\n    text-align: right;\n    font-size: calc(20px * var(--scale));\n    line-height: 1.75;\n    color: var(--accent);\n    padding: 10px 12px;\n    background: var(--bg);\n    border-radius: 12px;\n    border: 1px dashed var(--border);\n    margin-top: 10px;\n  }\n\n  /* Next Gentle Step */\n  .step-card {\n    display: flex;\n    align-items: center;\n    gap: 14px;\n    cursor: pointer;\n    transition: transform 0.15s ease;\n  }\n  .step-card:active { transform: scale(0.985); }\n\n  .step-badge {\n    width: 44px;\n    height: 44px;\n    border-radius: 14px;\n    background: var(--warm-soft);\n    color: var(--warm);\n    display: grid;\n    place-items: center;\n    flex-shrink: 0;\n  }\n\n  /* Quick Sanctuary row */\n  .quick-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 10px;\n  }\n\n  .quick-tile {\n    background: var(--bg-elevated);\n    border: 1px solid var(--border);\n    border-radius: 16px;\n    padding: 14px;\n    text-align: left;\n    cursor: pointer;\n    display: flex;\n    flex-direction: column;\n    gap: 6px;\n    color: var(--ink);\n    transition: transform 0.15s ease;\n  }\n  .quick-tile:active { transform: scale(0.97); }\n  .quick-tile strong { font-size: 14px; }\n  .quick-tile span { font-size: 12px; color: var(--ink-soft); }\n\n  /* 7-day Rhythm Stones (no guilt streak) */\n  .stones-row {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-top: 10px;\n  }\n  .stone-col {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 5px;\n    font-size: 11px;\n    color: var(--ink-faint);\n  }\n  .stone {\n    width: 28px;\n    height: 24px;\n    border-radius: 52% 48% 45% 55% / 58% 46% 54% 42%;\n    background: var(--bg-muted);\n    border: 1px solid var(--border);\n    display: grid;\n    place-items: center;\n  }\n  .stone.filled {\n    background: var(--accent);\n    color: var(--accent-ink);\n    border-color: transparent;\n  }\n  .stone.today {\n    box-shadow: 0 0 0 3px var(--accent-soft);\n  }\n\n  /* Bible Reader + Study Mode */\n  .reader-toolbar {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n    background: var(--bg-elevated);\n    border: 1px solid var(--border);\n    border-radius: 16px;\n    padding: 8px 10px;\n  }\n\n  .chapter-select {\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    font-family: var(--font-serif);\n    font-weight: 600;\n    font-size: 16px;\n    background: transparent;\n    border: none;\n    color: var(--ink);\n    cursor: pointer;\n    padding: 4px 6px;\n  }\n\n  /* Tactile Study Mode switch */\n  .study-toggle {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    border: 1px solid var(--border);\n    background: var(--bg-muted);\n    color: var(--ink-soft);\n    padding: 6px 11px;\n    border-radius: 999px;\n    font-size: 12.5px;\n    font-weight: 600;\n    cursor: pointer;\n    transition: all 0.22s ease;\n  }\n  .study-toggle.on {\n    background: var(--accent);\n    color: var(--accent-ink);\n    border-color: transparent;\n  }\n  .switch-dot {\n    width: 14px;\n    height: 14px;\n    border-radius: 50%;\n    background: var(--bg-elevated);\n    transition: transform 0.2s ease;\n  }\n\n  .reader-page {\n    background: var(--bg-elevated);\n    border: 1px solid var(--border);\n    border-radius: var(--radius);\n    padding: 20px 18px;\n    box-shadow: var(--shadow);\n  }\n\n  .chapter-heading {\n    display: flex;\n    align-items: baseline;\n    justify-content: space-between;\n    margin-bottom: 14px;\n    padding-bottom: 10px;\n    border-bottom: 1px solid var(--border);\n  }\n\n  .verse-line {\n    position: relative;\n    padding: 6px 8px;\n    margin: 2px -8px;\n    border-radius: 10px;\n    transition: background 0.18s ease, border-left 0.18s ease;\n    cursor: pointer;\n  }\n  .verse-line:hover {\n    background: color-mix(in srgb, var(--accent-soft) 45%, transparent);\n  }\n  .verse-line.selected {\n    background: var(--accent-soft);\n  }\n  .v-num {\n    font-family: var(--font-sans);\n    font-size: 11px;\n    font-weight: 700;\n    color: var(--ink-faint);\n    vertical-align: super;\n    margin-right: 4px;\n  }\n\n  /* Study Mode annotations inside reader */\n  .study-on .verse-line.has-note {\n    border-left: 2.5px solid var(--accent);\n    padding-left: 10px;\n  }\n  .study-hint-chip {\n    display: none;\n    margin-top: 5px;\n    font-family: var(--font-sans);\n    font-size: 11.5px;\n    color: var(--accent);\n    font-weight: 600;\n    align-items: center;\n    gap: 5px;\n  }\n  .study-on .verse-line.has-note .study-hint-chip {\n    display: inline-flex;\n  }\n\n  /* Layered Verse Study Panel */\n  .verse-study-panel {\n    display: none;\n    flex-direction: column;\n    gap: 12px;\n    background: var(--bg-elevated);\n    border: 1.5px solid var(--accent);\n    border-radius: var(--radius);\n    padding: 16px;\n    box-shadow: var(--shadow);\n    animation: fadeIn 0.2s ease;\n  }\n  .study-on .verse-study-panel.open { display: flex; }\n\n  .layer-tabs {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 6px;\n    background: var(--bg-muted);\n    padding: 4px;\n    border-radius: 12px;\n  }\n  .layer-tab {\n    border: none;\n    background: transparent;\n    color: var(--ink-soft);\n    font-size: 12px;\n    font-weight: 600;\n    padding: 7px 4px;\n    border-radius: 9px;\n    cursor: pointer;\n  }\n  .layer-tab.active {\n    background: var(--bg-elevated);\n    color: var(--ink);\n    box-shadow: 0 2px 5px rgba(0,0,0,0.08);\n  }\n\n  .hebrew-card {\n    background: var(--bg);\n    border: 1px solid var(--border);\n    border-radius: 14px;\n    padding: 12px 14px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 12px;\n  }\n  .hebrew-word {\n    font-family: var(--font-hebrew);\n    font-size: 26px;\n    color: var(--accent);\n    direction: rtl;\n  }\n\n  /* Reflect screen (Journal / Prayer / Stillness) */\n  .seg-control {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 6px;\n    background: var(--bg-muted);\n    padding: 5px;\n    border-radius: 14px;\n  }\n  .seg-btn {\n    border: none;\n    background: transparent;\n    color: var(--ink-soft);\n    font-size: 13px;\n    font-weight: 600;\n    padding: 8px 6px;\n    border-radius: 10px;\n    cursor: pointer;\n  }\n  .seg-btn.active {\n    background: var(--bg-elevated);\n    color: var(--ink);\n    box-shadow: 0 2px 6px rgba(0,0,0,0.08);\n  }\n\n  .subview { display: none; flex-direction: column; gap: 14px; }\n  .subview.active { display: flex; }\n\n  textarea, input[type=\"text\"] {\n    width: 100%;\n    border: 1px solid var(--border);\n    background: var(--bg);\n    color: var(--ink);\n    border-radius: 14px;\n    padding: 12px 14px;\n    font-family: var(--font-sans);\n    font-size: 14.5px;\n    line-height: 1.5;\n    resize: vertical;\n  }\n  textarea:focus, input[type=\"text\"]:focus {\n    outline: 2px solid var(--accent);\n    outline-offset: 1px;\n  }\n\n  .journal-entry {\n    background: var(--bg-elevated);\n    border: 1px solid var(--border);\n    border-radius: 16px;\n    padding: 15px;\n    display: flex;\n    flex-direction: column;\n    gap: 8px;\n  }\n  .verse-tag {\n    display: inline-flex;\n    align-items: center;\n    gap: 5px;\n    font-size: 11.5px;\n    font-weight: 600;\n    color: var(--accent);\n    background: var(--accent-soft);\n    padding: 4px 9px;\n    border-radius: 999px;\n    width: fit-content;\n    cursor: pointer;\n  }\n\n  /* Stillness breathing circle */\n  .stillness-stage {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    text-align: center;\n    padding: 26px 18px;\n    gap: 18px;\n  }\n  .breath-ring-wrap {\n    width: 176px;\n    height: 176px;\n    display: grid;\n    place-items: center;\n    position: relative;\n  }\n  .breath-halo {\n    position: absolute;\n    width: 150px;\n    height: 150px;\n    border-radius: 50%;\n    background: var(--accent-soft);\n    transition: transform 3.8s ease-in-out, opacity 3.8s ease-in-out;\n  }\n  .breath-core {\n    position: relative;\n    width: 108px;\n    height: 108px;\n    border-radius: 50%;\n    background: var(--accent);\n    color: var(--accent-ink);\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    box-shadow: 0 10px 26px rgba(63, 97, 72, 0.25);\n    transition: transform 3.8s ease-in-out;\n  }\n  .breathing-in .breath-halo { transform: scale(1.24); opacity: 0.9; }\n  .breathing-in .breath-core { transform: scale(1.12); }\n  .breathing-out .breath-halo { transform: scale(0.92); opacity: 0.55; }\n  .breathing-out .breath-core { transform: scale(0.96); }\n\n  /* Ask / Chat */\n  .chat-feed {\n    display: flex;\n    flex-direction: column;\n    gap: 12px;\n  }\n  .msg-user {\n    align-self: flex-end;\n    max-width: 85%;\n    background: var(--accent);\n    color: var(--accent-ink);\n    padding: 12px 15px;\n    border-radius: 18px 18px 4px 18px;\n    font-size: 14.5px;\n    line-height: 1.45;\n  }\n  .msg-guide {\n    align-self: flex-start;\n    width: 100%;\n    background: var(--bg-elevated);\n    border: 1px solid var(--border);\n    padding: 15px;\n    border-radius: 18px 18px 18px 4px;\n    display: flex;\n    flex-direction: column;\n    gap: 10px;\n  }\n  .ref-row {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 6px;\n  }\n  .chat-composer {\n    display: flex;\n    gap: 8px;\n    align-items: center;\n    background: var(--bg-elevated);\n    border: 1px solid var(--border);\n    padding: 6px 8px 6px 12px;\n    border-radius: 999px;\n  }\n  .chat-composer input {\n    border: none;\n    background: transparent;\n    padding: 6px 0;\n  }\n  .chat-composer input:focus { outline: none; }\n\n  /* Journey bars */\n  .bar-track {\n    height: 8px;\n    background: var(--bg-muted);\n    border-radius: 999px;\n    overflow: hidden;\n    margin-top: 6px;\n  }\n  .bar-fill {\n    height: 100%;\n    background: var(--accent);\n    border-radius: 999px;\n  }\n\n  /* Bottom Navigation */\n  .bottom-nav {\n    position: fixed;\n    bottom: 0;\n    width: 100%;\n    max-width: 390px;\n    z-index: 30;\n    background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);\n    backdrop-filter: blur(14px);\n    -webkit-backdrop-filter: blur(14px);\n    border-top: 1px solid var(--border);\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    padding: 8px 6px 14px;\n  }\n\n  .nav-btn {\n    border: none;\n    background: transparent;\n    color: var(--ink-faint);\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 4px;\n    font-size: 11px;\n    font-weight: 600;\n    padding: 4px 0;\n    cursor: pointer;\n    transition: color 0.18s ease;\n  }\n  .nav-btn.active { color: var(--accent); }\n\n  /* Settings & Saved Sheet Modal */\n  .sheet-backdrop {\n    position: fixed;\n    inset: 0;\n    max-width: 390px;\n    margin: 0 auto;\n    background: rgba(0,0,0,0.42);\n    z-index: 50;\n    display: none;\n    align-items: flex-end;\n  }\n  .sheet-backdrop.open { display: flex; }\n  .sheet {\n    width: 100%;\n    background: var(--bg-elevated);\n    border-radius: 24px 24px 0 0;\n    padding: 18px 20px 28px;\n    max-height: 82vh;\n    overflow-y: auto;\n    display: flex;\n    flex-direction: column;\n    gap: 16px;\n    border-top: 1px solid var(--border);\n  }\n  .theme-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 8px;\n  }\n  .theme-chip {\n    border: 1.5px solid var(--border);\n    border-radius: 14px;\n    padding: 10px 8px;\n    background: var(--bg);\n    color: var(--ink);\n    font-size: 12px;\n    font-weight: 600;\n    cursor: pointer;\n    text-align: center;\n  }\n  .theme-chip.active { border-color: var(--accent); background: var(--accent-soft); }\n\n  .toast {\n    position: fixed;\n    bottom: 84px;\n    left: 50%;\n    transform: translateX(-50%) translateY(10px);\n    background: var(--ink);\n    color: var(--bg);\n    font-size: 12.5px;\n    font-weight: 600;\n    padding: 9px 15px;\n    border-radius: 999px;\n    opacity: 0;\n    pointer-events: none;\n    transition: all 0.22s ease;\n    z-index: 60;\n    white-space: nowrap;\n  }\n  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }\n\n  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n  .muted { color: var(--ink-soft); }\n  .faint { color: var(--ink-faint); }\n<\/style>\n<\/head>\n<body>\n<div class=\"phone-shell\" id=\"app\" data-theme=\"linen\">\n\n  <!-- Top Bar -->\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <div class=\"brand-mark\" aria-hidden=\"true\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\n          <path d=\"M12 3c-2.5 3.5-4 6.5-4 9.5a4 4 0 0 0 8 0c0-3-1.5-6-4-9.5z\"/>\n          <path d=\"M5 19c2.5-1.2 4.8-1.2 7 0 2.2 1.2 4.5 1.2 7 0\"/>\n        <\/svg>\n      <\/div>\n      <div>\n        <div class=\"brand-title\">Eliana's Rhythm<\/div>\n        <div class=\"brand-sub\" id=\"header-sub\">Morning Watch \u00b7 Thu<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"top-actions\">\n      <button class=\"icon-btn\" onclick=\"openSheet('journey')\" title=\"Journey & Saved Verses\" aria-label=\"Journey and Saved\">\n        <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path d=\"M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z\"/>\n        <\/svg>\n      <\/button>\n      <button class=\"icon-btn\" onclick=\"openSheet('settings')\" title=\"Appearance & Reminders\" aria-label=\"Settings\">\n        <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\n          <circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"/>\n        <\/svg>\n      <\/button>\n    <\/div>\n  <\/header>\n\n  <!-- Main Content -->\n  <main class=\"content\">\n\n    <!-- ==================== 1. HOME SCREEN ==================== -->\n    <section class=\"screen active\" id=\"screen-home\">\n      <div class=\"day-arc\">\n        <span class=\"eyebrow\">Today's Cadence<\/span>\n        <div class=\"cadence-pills\" role=\"tablist\" aria-label=\"Time of day rhythm\">\n          <button class=\"cadence-pill active\" onclick=\"setCadence('morning', this)\">Morning<\/button>\n          <button class=\"cadence-pill\" onclick=\"setCadence('midday', this)\">Midday<\/button>\n          <button class=\"cadence-pill\" onclick=\"setCadence('evening', this)\">Evening<\/button>\n        <\/div>\n      <\/div>\n\n      <!-- Daily Verse Card -->\n      <article class=\"card verse-hero\">\n        <div class=\"row-between\" style=\"margin-bottom: 8px;\">\n          <span class=\"eyebrow\" id=\"cadence-label\">Morning Anchor<\/span>\n          <span class=\"faint\" style=\"font-size:12px;\">Psalm 46:10<\/span>\n        <\/div>\n        <div class=\"verse-quote-mark\">\u201c<\/div>\n        <p class=\"t-verse\" id=\"hero-verse-text\" style=\"margin: 0;\">\n          Be still, and know that I am God.\n        <\/p>\n        <p class=\"t-body muted\" id=\"hero-verse-note\" style=\"margin: 10px 0 0; font-size: 13.5px;\">\n          In Hebrew, <em>harp\u016b<\/em> means to let your shoulders drop and loosen your grip on what you cannot carry.\n        <\/p>\n        <div class=\"verse-ref-row\">\n          <button class=\"pill-btn primary\" onclick=\"goReflect('stillness')\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg>\n            Enter 60s Stillness\n          <\/button>\n          <button class=\"pill-btn\" onclick=\"openPsalmInStudy()\">\n            Study v.10\n          <\/button>\n        <\/div>\n      <\/article>\n\n      <!-- Gentle Next Prompt -->\n      <article class=\"card step-card\" onclick=\"goScreen('read')\" role=\"button\" tabindex=\"0\">\n        <div class=\"step-badge\" aria-hidden=\"true\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\n            <path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"/><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/>\n          <\/svg>\n        <\/div>\n        <div style=\"flex:1;\">\n          <div class=\"eyebrow\">Next Gentle Step<\/div>\n          <div style=\"font-weight: 600; font-size: 15px; margin-top: 2px;\" id=\"next-step-title\">Read Psalm 46 with Study Mode<\/div>\n          <div class=\"muted\" style=\"font-size: 12.5px; margin-top: 2px;\" id=\"next-step-sub\">3 minutes \u00b7 Hebrew notes ready on verse 10<\/div>\n        <\/div>\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" class=\"faint\"><path d=\"M9 18l6-6-6-6\"/><\/svg>\n      <\/article>\n\n      <!-- The Blessing (Numbers 6:24-26 + Hebrew) -->\n      <article class=\"card\">\n        <div class=\"row-between\">\n          <div>\n            <span class=\"eyebrow\">Spoken Blessing \u00b7 Numbers 6:24\u201326<\/span>\n          <\/div>\n          <button class=\"pill-btn\" style=\"padding: 5px 10px; font-size: 11.5px;\" onclick=\"toggleHomeHebrew()\" id=\"heb-toggle-btn\">\n            Hide Hebrew\n          <\/button>\n        <\/div>\n        <p class=\"t-scripture\" style=\"margin: 10px 0 0; font-size: calc(15.5px * var(--scale));\">\n          The LORD bless thee, and keep thee: the LORD make his face shine upon thee, and be gracious unto thee: the LORD lift up his countenance upon thee, and give thee peace.\n        <\/p>\n        <div class=\"hebrew-block\" id=\"home-hebrew\">\n          \u05d9\u05b0\u05d1\u05b8\u05e8\u05b6\u05db\u05b0\u05da\u05b8 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05d5\u05b0\u05d9\u05b4\u05e9\u05b0\u05c1\u05de\u05b0\u05e8\u05b6\u05da\u05b8\u05c3 \u05d9\u05b8\u05d0\u05b5\u05e8 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05e4\u05b8\u05bc\u05e0\u05b8\u05d9\u05d5 \u05d0\u05b5\u05dc\u05b6\u05d9\u05da\u05b8 \u05d5\u05b4\u05d9\u05d7\u05bb\u05e0\u05b6\u05bc\u05da\u05b8\u05bc\u05c3 \u05d9\u05b4\u05e9\u05b8\u05bc\u05c2\u05d0 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05e4\u05b8\u05bc\u05e0\u05b8\u05d9\u05d5 \u05d0\u05b5\u05dc\u05b6\u05d9\u05da\u05b8 \u05d5\u05b0\u05d9\u05b8\u05e9\u05b5\u05c2\u05dd \u05dc\u05b0\u05da\u05b8 \u05e9\u05b8\u05c1\u05dc\u05d5\u05b9\u05dd\u05c3\n        <\/div>\n      <\/article>\n\n      <!-- Quick Sanctuary Actions -->\n      <div class=\"quick-grid\">\n        <button class=\"quick-tile\" onclick=\"goReflect('prayer')\">\n          <span class=\"eyebrow\" style=\"color: var(--warm);\">Personal Prayer<\/span>\n          <strong>Turn worry into prayer<\/strong>\n          <span>Share a line; receive a prayer<\/span>\n        <\/button>\n        <button class=\"quick-tile\" onclick=\"goReflect('journal')\">\n          <span class=\"eyebrow\" style=\"color: var(--accent);\">Quiet Journal<\/span>\n          <strong>Write a reflection<\/strong>\n          <span>Last: Philippians 4:6<\/span>\n        <\/button>\n      <\/div>\n\n      <!-- Rhythm Stones (Progress without streak pressure) -->\n      <article class=\"card-tint\">\n        <div class=\"row-between\">\n          <div>\n            <span class=\"eyebrow\">This Week's Rhythm<\/span>\n            <div style=\"font-size: 13.5px; font-weight: 600; margin-top: 2px;\">5 quiet moments gathered<\/div>\n          <\/div>\n          <button class=\"pill-btn\" style=\"padding: 5px 11px; font-size: 12px;\" onclick=\"openSheet('journey')\">Journey<\/button>\n        <\/div>\n        <div class=\"stones-row\" aria-label=\"Weekly rhythm stones\">\n          <div class=\"stone-col\"><div class=\"stone filled\">\u2713<\/div><span>S<\/span><\/div>\n          <div class=\"stone-col\"><div class=\"stone filled\">\u2713<\/div><span>M<\/span><\/div>\n          <div class=\"stone-col\"><div class=\"stone\"><\/div><span>T<\/span><\/div>\n          <div class=\"stone-col\"><div class=\"stone filled\">\u2713<\/div><span>W<\/span><\/div>\n          <div class=\"stone-col\"><div class=\"stone filled today\">\u2713<\/div><span>T<\/span><\/div>\n          <div class=\"stone-col\"><div class=\"stone\"><\/div><span>F<\/span><\/div>\n          <div class=\"stone-col\"><div class=\"stone\"><\/div><span>S<\/span><\/div>\n        <\/div>\n      <\/article>\n    <\/section>\n\n    <!-- ==================== 2. BIBLE READER + STUDY MODE ==================== -->\n    <section class=\"screen\" id=\"screen-read\">\n      <!-- Reader Toolbar -->\n      <div class=\"reader-toolbar\">\n        <button class=\"chapter-select\" onclick=\"cyclePassage()\" title=\"Switch chapter\">\n          <span id=\"passage-label\">Psalm 46<\/span>\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M6 9l6 6 6-6\"/><\/svg>\n        <\/button>\n\n        <button class=\"study-toggle on\" id=\"study-toggle-btn\" onclick=\"toggleStudyMode()\" aria-pressed=\"true\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><\/svg>\n          <span id=\"study-toggle-label\">Study Mode: On<\/span>\n        <\/button>\n      <\/div>\n\n      <!-- Scripture Canvas -->\n      <div id=\"reader-container\" class=\"study-on\">\n        <article class=\"reader-page\" id=\"reader-page\">\n          <div class=\"chapter-heading\">\n            <div>\n              <div class=\"eyebrow\" id=\"book-subtitle\">Songs of Trust \u00b7 KJV<\/div>\n              <h2 style=\"font-family: var(--font-serif); margin: 2px 0 0; font-size: 22px;\" id=\"chapter-title\">Psalm 46<\/h2>\n            <\/div>\n            <span class=\"faint\" style=\"font-size: 12px;\" id=\"study-status-hint\">Tap underlined verses<\/span>\n          <\/div>\n\n          <div class=\"t-scripture\" id=\"verses-list\">\n            <!-- Populated by JS so chapters & study notes stay crisp -->\n          <\/div>\n        <\/article>\n\n        <!-- Layered Verse Study Drawer (Context -> Meaning -> Deeper Lens) -->\n        <article class=\"verse-study-panel open\" id=\"verse-study-panel\" style=\"margin-top: 14px;\">\n          <div class=\"row-between\">\n            <div>\n              <span class=\"eyebrow\" style=\"color: var(--accent);\" id=\"study-verse-ref\">Psalm 46:10 \u00b7 Verse Study<\/span>\n              <div style=\"font-family: var(--font-serif); font-weight: 600; font-size: 16px; margin-top: 2px;\" id=\"study-verse-title\">Laying Down the Armor<\/div>\n            <\/div>\n            <div style=\"display:flex; gap:6px;\">\n              <button class=\"pill-btn\" style=\"padding: 5px 10px; font-size: 11.5px;\" onclick=\"saveCurrentStudyVerse()\">Save<\/button>\n              <button class=\"pill-btn\" style=\"padding: 5px 10px; font-size: 11.5px;\" onclick=\"journalFromVerse()\">Journal<\/button>\n            <\/div>\n          <\/div>\n\n          <!-- 3-Layer Tabs -->\n          <div class=\"layer-tabs\" role=\"tablist\">\n            <button class=\"layer-tab active\" onclick=\"setStudyLayer('context', this)\">1. Context<\/button>\n            <button class=\"layer-tab\" onclick=\"setStudyLayer('meaning', this)\">2. Meaning<\/button>\n            <button class=\"layer-tab\" onclick=\"setStudyLayer('deeper', this)\">3. Deeper Lens<\/button>\n          <\/div>\n\n          <div id=\"study-layer-body\" class=\"t-body\" style=\"font-size: calc(14px * var(--scale));\">\n            <!-- Rendered by JS -->\n          <\/div>\n        <\/article>\n      <\/div>\n    <\/section>\n\n    <!-- ==================== 3. REFLECT (JOURNAL / PRAYER / STILLNESS) ==================== -->\n    <section class=\"screen\" id=\"screen-reflect\">\n      <div class=\"seg-control\" role=\"tablist\">\n        <button class=\"seg-btn active\" id=\"seg-journal\" onclick=\"setReflectTab('journal')\">Journal<\/button>\n        <button class=\"seg-btn\" id=\"seg-prayer\" onclick=\"setReflectTab('prayer')\">Prayer<\/button>\n        <button class=\"seg-btn\" id=\"seg-stillness\" onclick=\"setReflectTab('stillness')\">Stillness<\/button>\n      <\/div>\n\n      <!-- Journal Subview -->\n      <div class=\"subview active\" id=\"sub-journal\">\n        <div class=\"card\" style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div class=\"row-between\">\n            <span class=\"eyebrow\">New Private Reflection<\/span>\n            <span class=\"verse-tag\" id=\"journal-attached-verse\" onclick=\"clearJournalVerse()\">Philippians 4:6 \u00d7<\/span>\n          <\/div>\n          <textarea id=\"journal-input\" rows=\"3\" placeholder=\"What is sitting with you today?\"><\/textarea>\n          <div class=\"row-between\">\n            <span class=\"faint\" style=\"font-size:12px;\">Stored privately on your phone<\/span>\n            <button class=\"pill-btn primary\" onclick=\"addJournalEntry()\">Save Entry<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"eyebrow\" style=\"margin-top:4px;\">Recent Entries<\/div>\n        <div id=\"journal-list\" style=\"display:flex; flex-direction:column; gap:10px;\">\n          <article class=\"journal-entry\">\n            <div class=\"row-between\">\n              <span class=\"verse-tag\" onclick=\"goScreen('read')\">Philippians 4:6<\/span>\n              <span class=\"faint\" style=\"font-size:11.5px;\">Yesterday \u00b7 Evening<\/span>\n            <\/div>\n            <p class=\"t-body\" style=\"margin:0;\">\n              Felt anxious about work today, read Philippians 4:6 and sat with it. Realized I had been rehearsing tomorrow's meetings instead of handing them over.\n            <\/p>\n          <\/article>\n          <article class=\"journal-entry\">\n            <div class=\"row-between\">\n              <span class=\"verse-tag\" onclick=\"openPsalmInStudy()\">Psalm 46:1<\/span>\n              <span class=\"faint\" style=\"font-size:11.5px;\">Tuesday \u00b7 Morning<\/span>\n            <\/div>\n            <p class=\"t-body\" style=\"margin:0;\">\n              Read the opening before checking email. \"A very present help\" felt grounding while Eliana was still asleep.\n            <\/p>\n          <\/article>\n        <\/div>\n      <\/div>\n\n      <!-- Prayer Subview -->\n      <div class=\"subview\" id=\"sub-prayer\">\n        <div class=\"card\" style=\"display:flex; flex-direction:column; gap:10px;\">\n          <span class=\"eyebrow\" style=\"color: var(--warm);\">Personal Prayer Builder<\/span>\n          <p class=\"muted\" style=\"margin:0; font-size:13.5px;\">\n            Share a few honest words about what you're carrying. Eliana's Rhythm shapes a quiet prayer rooted in Scripture.\n          <\/p>\n          <textarea id=\"prayer-prompt\" rows=\"3\" placeholder=\"e.g., Tired from a long week, worried about patience with my family...\"><\/textarea>\n          <div class=\"row-between\">\n            <button class=\"pill-btn\" onclick=\"fillSamplePrayer()\">Try sample<\/button>\n            <button class=\"pill-btn primary\" onclick=\"generatePrayer()\">Write Prayer<\/button>\n          <\/div>\n        <\/div>\n\n        <article class=\"card-tint\" id=\"prayer-output-card\">\n          <div class=\"row-between\" style=\"margin-bottom:8px;\">\n            <span class=\"eyebrow\" style=\"color: var(--accent);\">Your Written Prayer<\/span>\n            <span class=\"faint\" style=\"font-size:11.5px;\">Anchored in Psalm 46:10<\/span>\n          <\/div>\n          <p class=\"t-scripture\" id=\"prayer-output\" style=\"margin:0; font-size: calc(16px * var(--scale));\">\n            Father, You see the noise waiting at the edge of my day and the weight I keep trying to hold in my own hands. Quiet my rushing heart. Help me release what I cannot fix tonight, and walk gently with those I love. Amen.\n          <\/p>\n        <\/article>\n      <\/div>\n\n      <!-- Stillness Subview -->\n      <div class=\"subview\" id=\"sub-stillness\">\n        <div class=\"card stillness-stage\" id=\"stillness-stage\">\n          <span class=\"eyebrow\">Guided Quiet Moment<\/span>\n          <div class=\"breath-ring-wrap\">\n            <div class=\"breath-halo\"><\/div>\n            <div class=\"breath-core\">\n              <span id=\"breath-cue\" style=\"font-weight:700; font-size:15px;\">Ready<\/span>\n              <span id=\"breath-timer\" style=\"font-size:12px; opacity:0.85;\">0:60<\/span>\n            <\/div>\n          <\/div>\n          <p class=\"t-verse\" style=\"margin:0; font-size: calc(18px * var(--scale));\">\n            \u201cBe still, and know that I am God.\u201d\n          <\/p>\n          <p class=\"muted\" id=\"stillness-sub\" style=\"margin:0; font-size:13px;\">\n            Inhale peace (4s) \u00b7 Hold (2s) \u00b7 Release control (4s)\n          <\/p>\n          <div style=\"display:flex; gap:10px;\">\n            <button class=\"pill-btn primary\" id=\"stillness-btn\" onclick=\"toggleStillness()\">Begin 60s Pause<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- ==================== 4. ASK / CONVERSATIONAL GUIDE ==================== -->\n    <section class=\"screen\" id=\"screen-ask\">\n      <div class=\"row-between\">\n        <div>\n          <span class=\"eyebrow\">Conversational Guide<\/span>\n          <div class=\"muted\" style=\"font-size:12.5px;\">Scripture-rooted answers, streamed gently<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"chat-feed\" id=\"chat-feed\">\n        <div class=\"msg-user\">How do I forgive someone who isn't sorry?<\/div>\n\n        <div class=\"msg-guide\">\n          <div class=\"eyebrow\" style=\"color: var(--accent);\">Guide \u00b7 Scriptural Perspective<\/div>\n          <p class=\"t-body\" style=\"margin:0;\">\n            Forgiving someone who shows no remorse is one of the hardest things Scripture asks of us\u2014and it helps to separate <strong>forgiveness<\/strong> from <strong>instant reconciliation<\/strong>.\n          <\/p>\n          <p class=\"t-body\" style=\"margin:0;\">\n            In Matthew 18 and Luke 23:34, Jesus releases the debt of retaliation even when the other person does not understand what they've done. Forgiveness is handing the ledger of justice over to God (Romans 12:19) so bitterness does not quietly rule your own heart. At the same time, wise boundaries are biblical (Proverbs 4:23): you can release vengeance before God while still keeping healthy distance until real repentance appears.\n          <\/p>\n          <div class=\"ref-row\">\n            <span class=\"verse-tag\" onclick=\"openPsalmInStudy()\">Romans 12:19<\/span>\n            <span class=\"verse-tag\" onclick=\"openPsalmInStudy()\">Luke 23:34<\/span>\n            <span class=\"verse-tag\" onclick=\"openPsalmInStudy()\">Colossians 3:13<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- Quick Suggested Prompts -->\n      <div style=\"display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;\">\n        <button class=\"pill-btn\" style=\"white-space:nowrap; font-size:12px;\" onclick=\"askQuestion('What does it mean to pray without ceasing?')\">Pray without ceasing?<\/button>\n        <button class=\"pill-btn\" style=\"white-space:nowrap; font-size:12px;\" onclick=\"askQuestion('Why did God seem silent in the Psalms?')\">When God feels silent<\/button>\n      <\/div>\n\n      <form class=\"chat-composer\" onsubmit=\"event.preventDefault(); sendChat();\">\n        <input type=\"text\" id=\"chat-input\" placeholder=\"Ask a faith question...\" aria-label=\"Ask a faith question\" />\n        <button type=\"submit\" class=\"pill-btn primary\" style=\"padding: 8px 14px;\">Ask<\/button>\n      <\/form>\n    <\/section>\n\n  <\/main>\n\n  <!-- Bottom Navigation -->\n  <nav class=\"bottom-nav\" aria-label=\"Main navigation\">\n    <button class=\"nav-btn active\" id=\"nav-home\" onclick=\"goScreen('home')\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"/><\/svg>\n      <span>Today<\/span>\n    <\/button>\n    <button class=\"nav-btn\" id=\"nav-read\" onclick=\"goScreen('read')\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"/><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/><\/svg>\n      <span>Read<\/span>\n    <\/button>\n    <button class=\"nav-btn\" id=\"nav-reflect\" onclick=\"goScreen('reflect')\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"/><\/svg>\n      <span>Reflect<\/span>\n    <\/button>\n    <button class=\"nav-btn\" id=\"nav-ask\" onclick=\"goScreen('ask')\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/><\/svg>\n      <span>Ask<\/span>\n    <\/button>\n  <\/nav>\n\n  <!-- Bottom Sheet: Journey / Saved Verses / Settings -->\n  <div class=\"sheet-backdrop\" id=\"sheet-backdrop\" onclick=\"if(event.target===this) closeSheet()\">\n    <div class=\"sheet\" role=\"dialog\" aria-modal=\"true\">\n      <div class=\"row-between\">\n        <strong style=\"font-family:var(--font-serif); font-size:18px;\" id=\"sheet-title\">Settings<\/strong>\n        <button class=\"pill-btn\" style=\"padding:5px 12px;\" onclick=\"closeSheet()\">Done<\/button>\n      <\/div>\n\n      <!-- Settings Body -->\n      <div id=\"sheet-settings\" style=\"display:none; flex-direction:column; gap:16px;\">\n        <div>\n          <span class=\"eyebrow\">Reading Theme<\/span>\n          <div class=\"theme-grid\" style=\"margin-top:8px;\">\n            <button class=\"theme-chip active\" data-theme-opt=\"linen\" onclick=\"setTheme('linen', this)\">Morning Linen<\/button>\n            <button class=\"theme-chip\" data-theme-opt=\"dusk\" onclick=\"setTheme('dusk', this)\">Evening Dusk<\/button>\n            <button class=\"theme-chip\" data-theme-opt=\"contrast\" onclick=\"setTheme('contrast', this)\">High Contrast<\/button>\n          <\/div>\n        <\/div>\n\n        <div>\n          <div class=\"row-between\">\n            <span class=\"eyebrow\">Text Size<\/span>\n            <span id=\"scale-label\" style=\"font-size:12.5px; font-weight:600;\">100%<\/span>\n          <\/div>\n          <input type=\"range\" min=\"0.9\" max=\"1.25\" step=\"0.05\" value=\"1\" style=\"width:100%; margin-top:8px; accent-color: var(--accent);\" oninput=\"setScale(this.value)\" />\n        <\/div>\n\n        <div class=\"card\" style=\"padding:13px 14px; display:flex; flex-direction:column; gap:10px;\">\n          <div class=\"row-between\">\n            <div>\n              <div style=\"font-weight:600; font-size:14px;\">Morning Verse Reminder<\/div>\n              <div class=\"faint\" style=\"font-size:12px;\">7:30 AM \u00b7 Gentle chime<\/div>\n            <\/div>\n            <input type=\"checkbox\" checked style=\"width:18px; height:18px; accent-color:var(--accent);\" onchange=\"showToast('Morning reminder updated')\" />\n          <\/div>\n          <div class=\"row-between\">\n            <div>\n              <div style=\"font-weight:600; font-size:14px;\">Evening Stillness Cue<\/div>\n              <div class=\"faint\" style=\"font-size:12px;\">9:15 PM \u00b7 60-second wind-down<\/div>\n            <\/div>\n            <input type=\"checkbox\" checked style=\"width:18px; height:18px; accent-color:var(--accent);\" onchange=\"showToast('Evening stillness reminder updated')\" />\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- Journey & Saved Body -->\n      <div id=\"sheet-journey\" style=\"display:none; flex-direction:column; gap:14px;\">\n        <div class=\"card\" style=\"padding:14px;\">\n          <span class=\"eyebrow\">Your Journey Over Time<\/span>\n          <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; text-align:center;\">\n            <div><strong style=\"font-size:20px; font-family:var(--font-serif);\">18<\/strong><div class=\"faint\" style=\"font-size:11px;\">Chapters<\/div><\/div>\n            <div><strong style=\"font-size:20px; font-family:var(--font-serif);\">11<\/strong><div class=\"faint\" style=\"font-size:11px;\">Reflections<\/div><\/div>\n            <div><strong style=\"font-size:20px; font-family:var(--font-serif);\">24<\/strong><div class=\"faint\" style=\"font-size:11px;\">Still Moments<\/div><\/div>\n          <\/div>\n          <div style=\"margin-top:14px;\">\n            <div class=\"row-between\" style=\"font-size:12.5px;\"><span>Psalms of Trust<\/span><strong>4 / 10<\/strong><\/div>\n            <div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:40%;\"><\/div><\/div>\n          <\/div>\n          <div style=\"margin-top:10px;\">\n            <div class=\"row-between\" style=\"font-size:12.5px;\"><span>Philippians<\/span><strong>3 / 4<\/strong><\/div>\n            <div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:75%;\"><\/div><\/div>\n          <\/div>\n        <\/div>\n\n        <div>\n          <span class=\"eyebrow\">Saved Verses<\/span>\n          <div id=\"saved-verses-list\" style=\"display:flex; flex-direction:column; gap:8px; margin-top:8px;\">\n            <div class=\"journal-entry\" style=\"padding:12px;\" onclick=\"closeSheet(); openPsalmInStudy();\">\n              <strong style=\"font-size:13px; color:var(--accent);\">Psalm 46:10<\/strong>\n              <div style=\"font-family:var(--font-serif); font-size:14.5px;\">\u201cBe still, and know that I am God.\u201d<\/div>\n            <\/div>\n            <div class=\"journal-entry\" style=\"padding:12px;\" onclick=\"closeSheet(); goReflect('journal');\">\n              <strong style=\"font-size:13px; color:var(--accent);\">Numbers 6:24\u201326<\/strong>\n              <div style=\"font-family:var(--font-serif); font-size:14.5px;\">\u201cThe LORD bless thee, and keep thee\u2026\u201d<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"toast\" id=\"toast\">Saved<\/div>\n<\/div>\n\n<script>\n  const PASSAGES = {\n    psalm46: {\n      title: \"Psalm 46\",\n      subtitle: \"Songs of Trust \u00b7 KJV\",\n      verses: [\n        { n: 1, text: \"God is our refuge and strength, a very present help in trouble.\", study: {\n          title: \"A Very Present Help\",\n          context: \"Attributed to the sons of Korah, Psalm 46 was likely sung during a moment of siege or national upheaval when Jerusalem's walls felt fragile.\",\n          meaning: \"Refuge is not an escape from life's storm, but a shelter inside it\u2014'very present' literally reads 'abundantly found.'\",\n          hebrew: \"\u05de\u05b7\u05d7\u05b0\u05e1\u05b6\u05d4\", translit: \"Machseh\", hebrewNote: \"A shelter from rain or danger; a place you run into rather than a fortress you defend yourself.\"\n        }},\n        { n: 2, text: \"Therefore will not we fear, though the earth be removed, and though the mountains be carried into the midst of the sea;\", study: null },\n        { n: 4, text: \"There is a river, the streams whereof shall make glad the city of God, the holy place of the tabernacles of the most High.\", study: null },\n        { n: 5, text: \"God is in the midst of her; she shall not be moved: God shall help her, and that right early.\", study: null },\n        { n: 10, text: \"Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.\", study: {\n          title: \"Laying Down the Armor\",\n          context: \"Verses 8\u20139 describe broken bows and burned chariots\u2014the end of frantic human striving. Verse 10 interrupts the noise of battle directly in God's voice.\",\n          meaning: \"This is not merely a cue for quietness; it is an invitation to stop fighting for control and let God be God.\",\n          hebrew: \"\u05d4\u05b7\u05e8\u05b0\u05e4\u05bc\u05d5\u05bc\", translit: \"Harp\u016b (from raphah)\", hebrewNote: \"Literally 'drop your hands,' 'slacken,' or 'let go.' The posture of an exhausted soldier lowering a heavy shield.\"\n        }},\n        { n: 11, text: \"The LORD of hosts is with us; the God of Jacob is our refuge.\", study: null }\n      ]\n    },\n    numbers6: {\n      title: \"Numbers 6:22\u201327\",\n      subtitle: \"The Priestly Blessing \u00b7 KJV\",\n      verses: [\n        { n: 24, text: \"The LORD bless thee, and keep thee:\", study: {\n          title: \"Kept Like a Garden\",\n          context: \"Given to Aaron and his sons to speak over the people of Israel before setting out across the wilderness.\",\n          meaning: \"To 'keep' (shamar) is the watchful care of a shepherd or gardener\u2014guarding life from harm and helping it flourish.\",\n          hebrew: \"\u05d9\u05b0\u05d1\u05b8\u05e8\u05b6\u05db\u05b0\u05da\u05b8\", translit: \"Yevarekhekha\", hebrewNote: \"To kneel in affection and bestow good\u2014pictured as God leaning down toward His child.\"\n        }},\n        { n: 25, text: \"The LORD make his face shine upon thee, and be gracious unto thee:\", study: null },\n        { n: 26, text: \"The LORD lift up his countenance upon thee, and give thee peace.\", study: {\n          title: \"Turned Face & Shalom\",\n          context: \"The blessing expands in three lines (3 words, 5 words, 7 words in Hebrew), rising toward its final word: Shalom.\",\n          meaning: \"'Lift up his countenance' means God turns His full, unhurried smile toward you\u2014nothing hidden, nothing withheld.\",\n          hebrew: \"\u05e9\u05b8\u05c1\u05dc\u05d5\u05b9\u05dd\", translit: \"Sh\u0101l\u014dm\", hebrewNote: \"Not merely the absence of conflict, but wholeness, soundness, and resting safely in belonging.\"\n        }}\n      ]\n    }\n  };\n\n  let currentPassageKey = \"psalm46\";\n  let selectedVerseNum = 10;\n  let studyMode = true;\n  let studyLayer = \"context\";\n  let hebrewVisible = true;\n  let stillnessInterval = null;\n  let stillnessRunning = false;\n  let stillnessSeconds = 60;\n\n  function goScreen(name) {\n    document.querySelectorAll(\".screen\").forEach(s => s.classList.remove(\"active\"));\n    document.getElementById(\"screen-\" + name).classList.add(\"active\");\n    document.querySelectorAll(\".nav-btn\").forEach(b => b.classList.remove(\"active\"));\n    document.getElementById(\"nav-\" + name).classList.add(\"active\");\n    window.scrollTo({ top: 0, behavior: \"smooth\" });\n  }\n\n  function setCadence(part, btn) {\n    document.querySelectorAll(\".cadence-pill\").forEach(p => p.classList.remove(\"active\"));\n    btn.classList.add(\"active\");\n    const map = {\n      morning: { sub: \"Morning Watch \u00b7 Thu\", label: \"Morning Anchor\", verse: \"Be still, and know that I am God.\", note: \"In Hebrew, harp\u016b means to let your shoulders drop and loosen your grip on what you cannot carry.\", step: \"Read Psalm 46 with Study Mode\", stepSub: \"3 minutes \u00b7 Hebrew notes ready on verse 10\" },\n      midday: { sub: \"Midday Pause \u00b7 Thu\", label: \"Midday Breath\", verse: \"Cast all your care upon him; for he careth for you.\", note: \"Pause between tasks for sixty quiet seconds before rushing into the afternoon.\", step: \"Take a 60s Stillness Breath\", stepSub: \"1 minute \u00b7 Slow 4-2-4 cadence\" },\n      evening: { sub: \"Evening Close \u00b7 Thu\", label: \"Evening Release\", verse: \"The LORD lift up his countenance upon thee, and give thee peace.\", note: \"End the day by writing one honest line in your journal or turning a worry into prayer.\", step: \"Open Evening Prayer & Journal\", stepSub: \"2 minutes \u00b7 Hand tomorrow back to God\" }\n    };\n    const d = map[part];\n    document.getElementById(\"header-sub\").textContent = d.sub;\n    document.getElementById(\"cadence-label\").textContent = d.label;\n    document.getElementById(\"hero-verse-text\").textContent = d.verse;\n    document.getElementById(\"hero-verse-note\").textContent = d.note;\n    document.getElementById(\"next-step-title\").textContent = d.step;\n    document.getElementById(\"next-step-sub\").textContent = d.stepSub;\n  }\n\n  function toggleHomeHebrew() {\n    hebrewVisible = !hebrewVisible;\n    document.getElementById(\"home-hebrew\").style.display = hebrewVisible ? \"block\" : \"none\";\n    document.getElementById(\"heb-toggle-btn\").textContent = hebrewVisible ? \"Hide Hebrew\" : \"Show Hebrew\";\n  }\n\n  function openPsalmInStudy() {\n    currentPassageKey = \"psalm46\";\n    selectedVerseNum = 10;\n    if (!studyMode) toggleStudyMode();\n    renderReader();\n    goScreen(\"read\");\n  }\n\n  function cyclePassage() {\n    currentPassageKey = currentPassageKey === \"psalm46\" ? \"numbers6\" : \"psalm46\";\n    selectedVerseNum = currentPassageKey === \"psalm46\" ? 10 : 24;\n    renderReader();\n  }\n\n  function toggleStudyMode() {\n    studyMode = !studyMode;\n    const container = document.getElementById(\"reader-container\");\n    const btn = document.getElementById(\"study-toggle-btn\");\n    const label = document.getElementById(\"study-toggle-label\");\n    const hint = document.getElementById(\"study-status-hint\");\n    container.classList.toggle(\"study-on\", studyMode);\n    btn.classList.toggle(\"on\", studyMode);\n    btn.setAttribute(\"aria-pressed\", String(studyMode));\n    label.textContent = studyMode ? \"Study Mode: On\" : \"Study Mode: Off\";\n    hint.textContent = studyMode ? \"Tap underlined verses\" : \"Pure reading mode\";\n    showToast(studyMode ? \"Study Mode enabled\" : \"Pure reading mode\");\n  }\n\n  function renderReader() {\n    const p = PASSAGES[currentPassageKey];\n    document.getElementById(\"passage-label\").textContent = p.title;\n    document.getElementById(\"chapter-title\").textContent = p.title;\n    document.getElementById(\"book-subtitle\").textContent = p.subtitle;\n\n    const list = document.getElementById(\"verses-list\");\n    list.innerHTML = \"\";\n    p.verses.forEach(v => {\n      const div = document.createElement(\"div\");\n      div.className = \"verse-line\" + (v.study ? \" has-note\" : \"\") + (v.n === selectedVerseNum ? \" selected\" : \"\");\n      div.innerHTML = `<span class=\"v-num\">${v.n}<\/span>${v.text}` +\n        (v.study ? `<div class=\"study-hint-chip\">\u25cf Deeper Lens \u00b7 ${v.study.translit}<\/div>` : \"\");\n      div.onclick = () => selectVerse(v.n);\n      list.appendChild(div);\n    });\n    renderStudyPanel();\n  }\n\n  function selectVerse(num) {\n    selectedVerseNum = num;\n    if (!studyMode) toggleStudyMode();\n    renderReader();\n  }\n\n  function setStudyLayer(layer, btn) {\n    studyLayer = layer;\n    document.querySelectorAll(\".layer-tab\").forEach(t => t.classList.remove(\"active\"));\n    btn.classList.add(\"active\");\n    renderStudyPanel();\n  }\n\n  function renderStudyPanel() {\n    const p = PASSAGES[currentPassageKey];\n    const v = p.verses.find(x => x.n === selectedVerseNum) || p.verses.find(x => x.study);\n    const panel = document.getElementById(\"verse-study-panel\");\n    if (!v || !v.study) {\n      document.getElementById(\"study-verse-ref\").textContent = `${p.title}:${selectedVerseNum} \u00b7 Quick Note`;\n      document.getElementById(\"study-verse-title\").textContent = \"Pause with this line\";\n      document.getElementById(\"study-layer-body\").innerHTML = `<p style=\"margin:0;\">Read this verse slowly twice. Tap verse ${p.verses.find(x=>x.study).n} above for the full 3-layer Hebrew study.<\/p>`;\n      panel.classList.add(\"open\");\n      return;\n    }\n    document.getElementById(\"study-verse-ref\").textContent = `${p.title}:${v.n} \u00b7 Verse Study`;\n    document.getElementById(\"study-verse-title\").textContent = v.study.title;\n    const body = document.getElementById(\"study-layer-body\");\n    if (studyLayer === \"context\") {\n      body.innerHTML = `<p style=\"margin:0;\">${v.study.context}<\/p>`;\n    } else if (studyLayer === \"meaning\") {\n      body.innerHTML = `<p style=\"margin:0;\">${v.study.meaning}<\/p>`;\n    } else {\n      body.innerHTML = `\n        <div class=\"hebrew-card\">\n          <div>\n            <div class=\"eyebrow\">Original Hebrew<\/div>\n            <div style=\"font-weight:700; font-size:15px; margin-top:2px;\">${v.study.translit}<\/div>\n          <\/div>\n          <div class=\"hebrew-word\">${v.study.hebrew}<\/div>\n        <\/div>\n        <p style=\"margin:8px 0 0;\">${v.study.hebrewNote}<\/p>\n      `;\n    }\n    panel.classList.add(\"open\");\n  }\n\n  function saveCurrentStudyVerse() {\n    const p = PASSAGES[currentPassageKey];\n    const v = p.verses.find(x => x.n === selectedVerseNum);\n    if (!v) return;\n    const container = document.getElementById(\"saved-verses-list\");\n    const card = document.createElement(\"div\");\n    card.className = \"journal-entry\";\n    card.style.padding = \"12px\";\n    card.innerHTML = `<strong style=\"font-size:13px; color:var(--accent);\">${p.title}:${v.n}<\/strong><div style=\"font-family:var(--font-serif); font-size:14.5px;\">\u201c${v.text}\u201d<\/div>`;\n    container.prepend(card);\n    showToast(`Saved ${p.title}:${v.n}`);\n  }\n\n  function journalFromVerse() {\n    const p = PASSAGES[currentPassageKey];\n    document.getElementById(\"journal-attached-verse\").textContent = `${p.title}:${selectedVerseNum} \u00d7`;\n    document.getElementById(\"journal-attached-verse\").style.display = \"inline-flex\";\n    goReflect(\"journal\");\n    document.getElementById(\"journal-input\").focus();\n  }\n\n  function clearJournalVerse() {\n    document.getElementById(\"journal-attached-verse\").style.display = \"none\";\n  }\n\n  function goReflect(tab) {\n    goScreen(\"reflect\");\n    setReflectTab(tab);\n  }\n\n  function setReflectTab(tab) {\n    [\"journal\", \"prayer\", \"stillness\"].forEach(t => {\n      document.getElementById(\"seg-\" + t).classList.toggle(\"active\", t === tab);\n      document.getElementById(\"sub-\" + t).classList.toggle(\"active\", t === tab);\n    });\n  }\n\n  function addJournalEntry() {\n    const input = document.getElementById(\"journal-input\");\n    const text = input.value.trim();\n    if (!text) return showToast(\"Write a short line first\");\n    const tagEl = document.getElementById(\"journal-attached-verse\");\n    const tagVisible = tagEl.style.display !== \"none\";\n    const tagText = tagEl.textContent.replace(\" \u00d7\", \"\");\n    const el = document.createElement(\"article\");\n    el.className = \"journal-entry\";\n    el.innerHTML = `\n      <div class=\"row-between\">\n        ${tagVisible ? `<span class=\"verse-tag\">${tagText}<\/span>` : `<span class=\"eyebrow\">Private Note<\/span>`}\n        <span class=\"faint\" style=\"font-size:11.5px;\">Just now<\/span>\n      <\/div>\n      <p class=\"t-body\" style=\"margin:0;\"><\/p>\n    `;\n    el.querySelector(\"p\").textContent = text;\n    document.getElementById(\"journal-list\").prepend(el);\n    input.value = \"\";\n    showToast(\"Reflection saved\");\n  }\n\n  function fillSamplePrayer() {\n    document.getElementById(\"prayer-prompt\").value = \"Feeling stretched thin at work and wanting patience when I come home to my family.\";\n  }\n\n  function generatePrayer() {\n    const val = document.getElementById(\"prayer-prompt\").value.trim();\n    const out = document.getElementById(\"prayer-output\");\n    if (!val) {\n      fillSamplePrayer();\n    }\n    const topic = document.getElementById(\"prayer-prompt\").value.trim();\n    out.textContent = `Lord, You already know what I am carrying right now\u2014\"${topic.slice(0, 90)}${topic.length > 90 ? \"\u2026\" : \"\"}\". Meet me right in the middle of it. Steadiness does not have to come from my own strength. Give me a calm mind, gentle words for the people around me, and quiet trust in Your presence. Amen.`;\n    showToast(\"Personal prayer written\");\n  }\n\n  function toggleStillness() {\n    const stage = document.getElementById(\"stillness-stage\");\n    const btn = document.getElementById(\"stillness-btn\");\n    const cue = document.getElementById(\"breath-cue\");\n    const timer = document.getElementById(\"breath-timer\");\n\n    if (stillnessRunning) {\n      clearInterval(stillnessInterval);\n      stillnessRunning = false;\n      stillnessSeconds = 60;\n      stage.classList.remove(\"breathing-in\", \"breathing-out\");\n      cue.textContent = \"Ready\";\n      timer.textContent = \"0:60\";\n      btn.textContent = \"Begin 60s Pause\";\n      return;\n    }\n\n    stillnessRunning = true;\n    btn.textContent = \"End Pause\";\n    let phaseTick = 0;\n    stage.classList.add(\"breathing-in\");\n    cue.textContent = \"Inhale\";\n\n    stillnessInterval = setInterval(() => {\n      stillnessSeconds--;\n      phaseTick = (phaseTick + 1) % 10;\n      if (phaseTick < 4) {\n        stage.classList.add(\"breathing-in\");\n        stage.classList.remove(\"breathing-out\");\n        cue.textContent = \"Inhale\";\n      } else if (phaseTick < 6) {\n        cue.textContent = \"Rest\";\n      } else {\n        stage.classList.remove(\"breathing-in\");\n        stage.classList.add(\"breathing-out\");\n        cue.textContent = \"Release\";\n      }\n      const s = Math.max(0, stillnessSeconds);\n      timer.textContent = \"0:\" + (s < 10 ? \"0\" + s : s);\n      if (stillnessSeconds <= 0) {\n        toggleStillness();\n        showToast(\"Still moment complete\");\n      }\n    }, 1000);\n  }\n\n  function askQuestion(q) {\n    document.getElementById(\"chat-input\").value = q;\n    sendChat();\n  }\n\n  function sendChat() {\n    const input = document.getElementById(\"chat-input\");\n    const q = input.value.trim();\n    if (!q) return;\n    input.value = \"\";\n\n    const feed = document.getElementById(\"chat-feed\");\n    const userMsg = document.createElement(\"div\");\n    userMsg.className = \"msg-user\";\n    userMsg.textContent = q;\n    feed.appendChild(userMsg);\n\n    const guideMsg = document.createElement(\"div\");\n    guideMsg.className = \"msg-guide\";\n    guideMsg.innerHTML = `<div class=\"eyebrow\" style=\"color: var(--accent);\">Guide \u00b7 Streaming Response<\/div><p class=\"t-body\" style=\"margin:0;\"><\/p><div class=\"ref-row\" style=\"display:none;\"><span class=\"verse-tag\" onclick=\"openPsalmInStudy()\">Psalm 46:1<\/span><span class=\"verse-tag\" onclick=\"openPsalmInStudy()\">1 Thessalonians 5:17<\/span><\/div>`;\n    feed.appendChild(guideMsg);\n\n    const p = guideMsg.querySelector(\"p\");\n    const refs = guideMsg.querySelector(\".ref-row\");\n    const full = `Scripture often meets honest questions with presence before explanation. In the Psalms, even deep uncertainty is brought straight to God rather than hidden outside prayer. Start with a single honest sentence today\u2014God welcomes unpolished trust.`;\n    let i = 0;\n    const stream = setInterval(() => {\n      i += 4;\n      p.textContent = full.slice(0, i);\n      if (i >= full.length) {\n        clearInterval(stream);\n        refs.style.display = \"flex\";\n      }\n    }, 22);\n  }\n\n  function openSheet(which) {\n    document.getElementById(\"sheet-settings\").style.display = which === \"settings\" ? \"flex\" : \"none\";\n    document.getElementById(\"sheet-journey\").style.display = which === \"journey\" ? \"flex\" : \"none\";\n    document.getElementById(\"sheet-title\").textContent = which === \"settings\" ? \"Appearance & Reminders\" : \"Journey & Saved Verses\";\n    document.getElementById(\"sheet-backdrop\").classList.add(\"open\");\n  }\n\n  function closeSheet() {\n    document.getElementById(\"sheet-backdrop\").classList.remove(\"open\");\n  }\n\n  function setTheme(theme, btn) {\n    document.getElementById(\"app\").setAttribute(\"data-theme\", theme);\n    document.querySelectorAll(\".theme-chip\").forEach(c => c.classList.remove(\"active\"));\n    btn.classList.add(\"active\");\n    showToast(btn.textContent + \" theme\");\n  }\n\n  function setScale(val) {\n    document.documentElement.style.setProperty(\"--scale\", val);\n    document.getElementById(\"scale-label\").textContent = Math.round(val * 100) + \"%\";\n  }\n\n  function showToast(msg) {\n    const t = document.getElementById(\"toast\");\n    t.textContent = msg;\n    t.classList.add(\"show\");\n    clearTimeout(window.__toastTimer);\n    window.__toastTimer = setTimeout(() => t.classList.remove(\"show\"), 1800);\n  }\n\n  renderReader();\n<\/script>\n<\/body>\n<\/html>\n<!--\n  Design idea: Instead of a crowded tile dashboard or streak-guilt tracker, this concept organizes\n  Eliana's Rhythm as a calm \"Three-Beat Day\" (Morning, Midday, Evening) paired with tactile Rhythm Stones\n  and a switchable Bible Study Mode that opens a 3-layer Deeper Lens (Context, Meaning, Hebrew) inline.\n-->\n"}];
const W = 390, H = 844, KEY = "design-pass:" + "/Users/thamosmythos/Eliana/ElianaKMP/design/passes/whole-app/round-1";
let state = {}; try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const row = document.getElementById("row");
let revealed = false;
function draw() {
  const z = parseFloat(document.getElementById("zoom").value);
  row.innerHTML = "";
  ITEMS.forEach((it) => {
    const s = state[it.letter] || (state[it.letter] = { pick: "", notes: "" });
    const card = document.createElement("div"); card.className = "card" + (s.pick === "drop" ? " dropped" : "");
    const head = document.createElement("div"); head.className = "head";
    head.innerHTML = '<span class="letter">' + it.letter + '</span><span class="seat">' + (revealed ? it.seat + " · " + it.file : "") + "</span>";
    [["base", "Base"], ["take", "Take parts"], ["drop", "Drop"]].forEach(([v, label]) => {
      const b = document.createElement("button"); b.textContent = label; if (s.pick === v) b.className = "on";
      b.onclick = () => { if (v === "base") ITEMS.forEach(o => { if (state[o.letter] && state[o.letter].pick === "base") state[o.letter].pick = ""; });
                          s.pick = s.pick === v ? "" : v; save(); draw(); };
      head.appendChild(b);
    });
    const frame = document.createElement("div"); frame.className = "frame"; frame.style.width = W * z + "px"; frame.style.height = H * z + "px";
    const f = document.createElement("iframe"); f.setAttribute("sandbox", "allow-scripts"); f.width = W; f.height = H;
    f.style.transform = "scale(" + z + ")"; f.srcdoc = it.html; frame.appendChild(f);
    const t = document.createElement("textarea"); t.placeholder = "What works here, what to take, what to change"; t.value = s.notes;
    t.oninput = () => { s.notes = t.value; save(); };
    card.style.width = W * z + 26 + "px"; card.append(head, frame, t); row.appendChild(card);
  });
}
document.getElementById("zoom").onchange = draw;
document.getElementById("reveal").onclick = (e) => { revealed = !revealed; e.target.textContent = revealed ? "Hide who made each" : "Show who made each"; draw(); };
document.getElementById("copy").onclick = () => {
  const lines = ["# Picks: " + document.title, ""];
  ITEMS.forEach((it) => { const s = state[it.letter] || {}; 
    lines.push("## " + it.letter + " (" + it.seat + ", " + it.file + "): " + ({ base: "BASE", take: "take parts", drop: "dropped" }[s.pick] || "no mark"));
    if (s.notes) lines.push(s.notes.trim()); lines.push(""); });
  const text = lines.join("\n"); const out = document.getElementById("out"); out.textContent = text; out.style.display = "block";
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
};
draw();
</script></body></html>

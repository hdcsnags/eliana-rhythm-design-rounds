 <main>\n    <!-- DAY RHYTHM SWITCHER -->\n    <div class=\"cadence-strip\">\n      <div class=\"cadence-pills\">\n        <button class=\"cadence-pill active\" onclick=\"setDayHour('morning', this)\">\n          <span class=\"dot\"><\/span>Morning\n        <\/button>\n        <button class=\"cadence-pill\" onclick=\"setDayHour('midday', this)\">Midday<\/button>\n        <button class=\"cadence-pill\" onclick=\"setDayHour('evening', this)\">Evening<\/button>\n      <\/div>\n      <a href=\"#screen-journey\" class=\"rhythm-lamp-badge\" title=\"View your rhythm over time\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2C9.5 6 7 9.5 7 13a5 5 0 0 0 10 0c0-3.5-2.5-7-5-11z\"/><\/svg>\n        <span>12 days gathered<\/span>\n      <\/a>\n    <\/div>\n\n    <!-- ======================================================================\n         SCREEN 1: HOME \u2014 THE THREE BREATHS (Word \u00b7 Priestly Blessing \u00b7 Next Step)\n         ====================================================================== -->\n    <section class=\"screen-section\" id=\"screen-home\">\n\n      <!-- I. DAILY VERSE LEAF (Psalm 46:10) -->\n      <article class=\"codex-leaf\">\n        <div class=\"leaf-header\">\n          <span class=\"movement-tag\">I \u00b7 Today\u2019s Word<\/span>\n          <span class=\"verse-ref-pill\">Psalm 46:10<\/span>\n        <\/div>\n\n        <blockquote class=\"daily-verse-quote\" id=\"homeVerseQuote\">\n          \u201c<span class=\"highlight-word\" onclick=\"jumpToStudyLayer('deeper')\">Be still<\/span>, and <span class=\"highlight-word\" onclick=\"jumpToStudyLayer('deeper')\">know<\/span> that I am God; I will be exalted among the nations, I will be exalted in the earth.\u201d\n        <\/blockquote>\n\n        <!-- Interactive Hebrew Root Preview right on Home -->\n        <div class=\"hebrew-root-peek\" onclick=\"jumpToStudyLayer('deeper')\" title=\"Tap to open full Deeper Lens study\">\n          <div class=\"peek-left\">\n            <span class=\"peek-label\">Deeper Lens \u00b7 Hebrew Imperative<\/span>\n            <span class=\"peek-meaning\"><strong>Harp\u016b<\/strong> literally means <em>\u201clet your hands drop \u2014 unclench your grip and stop striving.\u201d<\/em><\/span>\n          <\/div>\n          <div class=\"peek-hebrew-badge\">\n            <span class=\"peek-hebrew-script\">\u05d4\u05b7\u05e8\u05b0\u05e4\u05bc\u05d5\u05bc<\/span>\n            <span class=\"peek-translit\">harp\u016b \u00b7 H7503<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"leaf-actions\">\n          <a href=\"#screen-reader\" class=\"btn-primary-brass\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"/><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/><\/svg>\n            <span>Open Psalm 46 in Study Mode<\/span>\n          <\/a>\n          <a href=\"#screen-stillness\" class=\"btn-secondary-outline\">\n            <span>60s Stillness<\/span>\n          <\/a>\n        <\/div>\n      <\/article>\n\n      <!-- II. THE PRIESTLY BLESSING (Numbers 6:24\u201326 in English + Pointed Hebrew) -->\n      <article class=\"blessing-card\" id=\"blessingCard\">\n        <div class=\"blessing-top\">\n          <span class=\"blessing-kicker\">II \u00b7 Daily Blessing \u00b7 Numbers 6:24\u201326<\/span>\n          <button class=\"blessing-toggle-btn\" onclick=\"toggleBlessingTranslit()\" id=\"btnTranslit\">\n            Show Phonetics\n          <\/button>\n        <\/div>\n\n        <div class=\"blessing-stanzas\">\n          <div class=\"blessing-line\">\n            <div class=\"blessing-hebrew-row\">\n              <span class=\"blessing-vnum\">v. 24<\/span>\n              <span class=\"blessing-hebrew\" lang=\"he\">\u05d9\u05b0\u05d1\u05b8\u05e8\u05b6\u05db\u05b0\u05da\u05b8 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05d5\u05b0\u05d9\u05b4\u05e9\u05b0\u05c1\u05de\u05b0\u05e8\u05b6\u05da\u05b8<\/span>\n            <\/div>\n            <p class=\"blessing-english\">The Lord bless you and keep you;<\/p>\n            <p class=\"blessing-translit\">Yev\u0101rekhekh\u0101 Adonai veyishmerekha<\/p>\n          <\/div>\n\n          <div class=\"blessing-line\">\n            <div class=\"blessing-hebrew-row\">\n              <span class=\"blessing-vnum\">v. 25<\/span>\n              <span class=\"blessing-hebrew\" lang=\"he\">\u05d9\u05b8\u05d0\u05b5\u05e8 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05e4\u05b8\u05bc\u05e0\u05b8\u05d9\u05d5 \u05d0\u05b5\u05dc\u05b6\u05d9\u05da\u05b8 \u05d5\u05b4\u05d9\u05d7\u05bb\u05e0\u05b6\u05bc\u05da\u05b8\u05bc<\/span>\n            <\/div>\n            <p class=\"blessing-english\">The Lord make his face shine upon you and be gracious to you;<\/p>\n            <p class=\"blessing-translit\">Y\u0101\u2019\u0113r Adonai p\u0101n\u0101v \u0113lekha v\u012b\u1e25unnekk\u0101<\/p>\n          <\/div>\n\n          <div class=\"blessing-line\">\n            <div class=\"blessing-hebrew-row\">\n              <span class=\"blessing-vnum\">v. 26<\/span>\n              <span class=\"blessing-hebrew\" lang=\"he\">\u05d9\u05b4\u05e9\u05b8\u05bc\u05c2\u05d0 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05e4\u05b8\u05bc\u05e0\u05b8\u05d9\u05d5 \u05d0\u05b5\u05dc\u05b6\u05d9\u05da\u05b8 \u05d5\u05b0\u05d9\u05b8\u05e9\u05b5\u05c2\u05dd \u05dc\u05b0\u05da\u05b8 \u05e9\u05b8\u05c1\u05dc\u05d5\u05b9\u05dd<\/span>\n            <\/div>\n            <p class=\"blessing-english\">The Lord lift up his countenance upon you and give you peace (<em>shalom<\/em>).<\/p>\n            <p class=\"blessing-translit\">Yiss\u0101 Adonai p\u0101n\u0101v \u0113lekha vey\u0101\u015b\u0113m lekh\u0101 sh\u0101l\u014dm<\/p>\n          <\/div>\n        <\/div>\n      <\/article>\n\n      <!-- III. GENTLE PROMPT FOR WHAT TO DO NEXT (Connected to Yesterday's Thread) -->\n      <article class=\"gentle-prompt-card\">\n        <div class=\"prompt-header\">\n          <span class=\"prompt-compass-icon\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polygon points=\"16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76\"/><\/svg>\n          <\/span>\n          <span class=\"prompt-title\">III \u00b7 Gentle Prompt \u00b7 Your Next Step<\/span>\n        <\/div>\n        <p class=\"prompt-body\" id=\"gentlePromptText\">\n          Yesterday you journaled about <em>work anxiety<\/em> and sat with <em>Philippians 4:6<\/em>. Today\u2019s word in <em>Psalm 46:10<\/em> carries that thread forward\u2014how would you like to respond?\n        <\/p>\n        <div class=\"prompt-pathways\">\n          <a href=\"#screen-reader\" class=\"pathway-btn\">\n            <div class=\"pathway-left\">\n              <span>1. Unfold Psalm 46:10 in 3 Study Layers<\/span>\n            <\/div>\n            <span class=\"pathway-tag\">Word + Hebrew<\/span>\n          <\/a>\n          <a href=\"#screen-stillness\" class=\"pathway-btn\">\n            <div class=\"pathway-left\">\n              <span>2. Turn today\u2019s work weight into a Prayer<\/span>\n            <\/div>\n            <span class=\"pathway-tag\">Prayer &amp; Journal<\/span>\n          <\/a>\n          <a href=\"#screen-ask\" class=\"pathway-btn\">\n            <div class=\"pathway-left\">\n              <span>3. Ask: \u201cHow do I forgive someone who isn\u2019t sorry?\u201d<\/span>\n            <\/div>\n            <span class=\"pathway-tag\">Scripture Guide<\/span>\n          <\/a>\n        <\/div>\n      <\/article>\n    <\/section>\n\n    <!-- ======================================================================\n         SCREEN 2: BIBLE READER WITH \"LIVING MARGIN\" STUDY MODE & 3-LAYER STUDY\n         ====================================================================== -->\n    <div class=\"screen-divider\">\n      <span class=\"screen-kicker\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/><\/svg>\n        Bible Reader &amp; Living Margin Study\n      <\/span>\n      <span class=\"screen-number\">Codex View<\/span>\n    <\/div>\n\n    <section class=\"screen-section\" id=\"screen-reader\">\n      <div class=\"reader-shell\" id=\"readerShell\" data-studymode=\"on\">\n\n        <!-- Sticky Reader Toolbar: Book/Chapter Switcher + Study Mode Toggle -->\n        <div class=\"reader-toolbar\">\n          <div class=\"chapter-selector-group\">\n            <button class=\"chapter-pill active\" onclick=\"loadChapter('psalm46', this)\">Psalm 46<\/button>\n            <button class=\"chapter-pill\" onclick=\"loadChapter('numbers6', this)\">Num 6<\/button>\n            <button class=\"chapter-pill\" onclick=\"loadChapter('phil4', this)\">Phil 4<\/button>\n          <\/div>\n\n          <button class=\"study-mode-toggle\" id=\"studyModeBtn\" onclick=\"toggleStudyMode()\" aria-pressed=\"true\">\n            <span class=\"switch-dot\"><\/span>\n            <span id=\"studyModeLabel\">Study Mode: ON<\/span>\n          <\/button>\n        <\/div>\n\n        <!-- Study Mode Active Explanation Bar -->\n        <div class=\"study-status-ribbon study-only\">\n          <span><strong>Living Margin Active:<\/strong> Stanza outlines &amp; Hebrew roots illuminated in place.<\/span>\n          <span style=\"color: var(--accent-brass); font-weight: 700;\">Tap any verse<\/span>\n        <\/div>\n\n        <!-- SCRIPTURE PAGE CONTENT -->\n        <div class=\"scripture-page\" id=\"scriptureContainer\">\n          <div class=\"chapter-heading-block\">\n            <div class=\"book-overline\">The Book of Psalms \u00b7 Book II<\/div>\n            <h2 class=\"chapter-main-title\">Psalm 46<\/h2>\n            <p class=\"psalm-superscription\">To the choirmaster. Of the Sons of Korah. According to Alamoth. A Song.<\/p>\n          <\/div>\n\n          <!-- Stanza I Header (Study Mode Only) -->\n          <div class=\"stanza-study-header study-only\">\n            <span>Stanza I (vv. 1\u20133) \u00b7 Refuge When the Earth Gives Way<\/span>\n            <span>Refrain: Present Help<\/span>\n          <\/div>\n\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(1)\">\n            <span class=\"v-num\">1<\/span>\n            God is our <span class=\"ruby-word\">refuge<span class=\"ruby-gloss study-only\">\u05de\u05b7\u05d7\u05b2\u05e1\u05b6\u05d4 \u00b7 ma\u1e25\u0103seh<\/span><\/span> and strength, a very present help in trouble.\n          <\/div>\n\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(2)\">\n            <span class=\"v-num\">2<\/span>\n            Therefore we will not fear though the earth gives way, though the mountains be moved into the heart of the sea,\n          <\/div>\n\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(3)\">\n            <span class=\"v-num\">3<\/span>\n            though its waters roar and foam, though the mountains tremble at its swelling. <span class=\"selah-mark\">Selah<\/span>\n          <\/div>\n\n          <!-- Stanza II Header (Study Mode Only) -->\n          <div class=\"stanza-study-header study-only\">\n            <span>Stanza II (vv. 4\u20137) \u00b7 The Quiet River in the Besieged City<\/span>\n            <span>Zion\u2019s Stream<\/span>\n          <\/div>\n\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(4)\">\n            <span class=\"v-num\">4<\/span>\n            There is a river whose streams make glad the city of God, the holy habitation of the Most High.\n          <\/div>\n\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(5)\">\n            <span class=\"v-num\">5<\/span>\n            God is in the midst of her; she shall not be moved; God will help her when <span class=\"ruby-word\">morning dawns<span class=\"ruby-gloss study-only\">\u05dc\u05b4\u05e4\u05b0\u05e0\u05d5\u05b9\u05ea \u05d1\u05b9\u05bc\u05e7\u05b6\u05e8 \u00b7 liphn\u014dt b\u014dqer<\/span><\/span>.\n          <\/div>\n\n          <!-- Stanza III Header (Study Mode Only) -->\n          <div class=\"stanza-study-header study-only\">\n            <span>Stanza III (vv. 8\u201311) \u00b7 The Voice That Disarms the Nations<\/span>\n            <span>First-Person Shift<\/span>\n          <\/div>\n\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(8)\">\n            <span class=\"v-num\">8<\/span>\n            Come, behold the works of the Lord, how he has brought desolations on the earth.\n          <\/div>\n\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(9)\">\n            <span class=\"v-num\">9<\/span>\n            He makes wars cease to the end of the earth; he breaks the bow and shatters the spear; he burns the chariots with fire.\n          <\/div>\n\n          <!-- SELECTED VERSE: PSALM 46:10 -->\n          <div class=\"verse-block selected-verse\" id=\"verse10Block\" onclick=\"selectVerseForStudy(10)\">\n            <span class=\"v-num\">10<\/span>\n            \u201c<span class=\"ruby-word\">Be still<span class=\"ruby-gloss study-only\">\u05d4\u05b7\u05e8\u05b0\u05e4\u05bc\u05d5\u05bc \u00b7 harp\u016b<\/span><\/span>, and <span class=\"ruby-word\">know<span class=\"ruby-gloss study-only\">\u05d5\u05bc\u05d3\u05b0\u05e2\u05d5\u05bc \u00b7 ude\u2018\u016b<\/span><\/span> that <span class=\"ruby-word\">I am<span class=\"ruby-gloss study-only\">\u05d0\u05b8\u05e0\u05b9\u05db\u05b4\u05d9 \u00b7 \u0101n\u014dkh\u012b<\/span><\/span> God. I will be <span class=\"ruby-word\">exalted<span class=\"ruby-gloss study-only\">\u05d0\u05b8\u05e8\u05d5\u05bc\u05dd \u00b7 \u0101r\u016bm<\/span><\/span> among the nations, I will be exalted in the earth!\u201d\n          <\/div>\n\n          <div class=\"margin-whisper study-only\">\n            <strong>Marginal Note on v. 10:<\/strong> For 9 verses the psalmist speaks <em>about<\/em> God. Suddenly in verse 10, God Himself interrupts in the first person\u2014commanding both raging armies and anxious defenders to drop their hands.\n          <\/div>\n\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(11)\">\n            <span class=\"v-num\">11<\/span>\n            The Lord of hosts is with us; the God of Jacob is our <span class=\"ruby-word\">fortress<span class=\"ruby-gloss study-only\">\u05de\u05b4\u05e9\u05b0\u05c2\u05d2\u05b8\u05bc\u05d1 \u00b7 mi\u015bg\u0101b<\/span><\/span>. <span class=\"selah-mark\">Selah<\/span>\n          <\/div>\n        <\/div>\n\n        <!-- ==================================================================\n             VERSE STUDY IN 3 UNFOLDING LAYERS (Context \u00b7 Meaning \u00b7 Deeper Lens)\n             ================================================================== -->\n        <div class=\"verse-study-codex\" id=\"verseStudyCodex\">\n          <div class=\"study-codex-header\">\n            <div>\n              <h3 class=\"study-codex-title\" id=\"studyTargetTitle\">Verse Study \u00b7 Psalm 46:10<\/h3>\n              <p class=\"study-codex-sub\">Explored in three layers: Context, Meaning &amp; Deeper Lens<\/p>\n            <\/div>\n            <span class=\"verse-ref-pill\">3 Layers<\/span>\n          <\/div>\n\n          <!-- Layer Switcher (All Layers visible by default, or isolate one) -->\n          <div class=\"layer-tabs\">\n            <button class=\"layer-tab active\" onclick=\"filterStudyLayer('all', this)\">All 3 Layers<\/button>\n            <button class=\"layer-tab\" onclick=\"filterStudyLayer('context', this)\">1 \u00b7 Context<\/button>\n            <button class=\"layer-tab\" onclick=\"filterStudyLayer('meaning', this)\">2 \u00b7 Meaning<\/button>\n            <button class=\"layer-tab\" onclick=\"filterStudyLayer('deeper', this)\">3 \u00b7 Deeper Lens<\/button>\n          <\/div>\n\n          <!-- LAYER 1: CONTEXT -->\n          <div class=\"study-layer-card\" data-layer=\"context\" id=\"layerContextCard\">\n            <div class=\"layer-badge-row\">\n              <span class=\"layer-pill context\">Layer 1 \u00b7 Context<\/span>\n              <span style=\"font-size: 0.69rem; color: var(--ink-muted);\">Sons of Korah \u00b7 Siege Song<\/span>\n            <\/div>\n            <h4 class=\"layer-heading\" id=\"layer1Heading\">The Battlefield Behind the Stillness<\/h4>\n            <p class=\"layer-text\" id=\"layer1Text\">\n              Sung after Jerusalem survived an impossible siege (often linked to Sennacherib\u2019s Assyrian army in 2 Kings 19). Verses 1\u20139 are loud with collapsing mountains, roaring seas, and burning chariots. Verse 10 is not spoken in a quiet meadow\u2014it is God\u2019s commanding voice cutting across a war zone.\n            <\/p>\n          <\/div>\n\n          <!-- LAYER 2: MEANING -->\n          <div class=\"study-layer-card\" data-layer=\"meaning\" id=\"layerMeaningCard\">\n            <div class=\"layer-badge-row\">\n              <span class=\"layer-pill meaning\">Layer 2 \u00b7 Meaning<\/span>\n              <span style=\"font-size: 0.69rem; color: var(--ink-muted);\">Pastoral Heart<\/span>\n            <\/div>\n            <h4 class=\"layer-heading\" id=\"layer2Heading\">Surrendering White-Knuckled Control<\/h4>\n            <p class=\"layer-text\" id=\"layer2Text\">\n              When we are anxious, we try to play God by rehearsing every threat. \u201cBe still\u201d is not a call to numbness; it is a command to lay down our weapons of self-salvation. To <em>be still<\/em> and to <em>know<\/em> are two sides of one movement: only when our hands let go do we recognize whose hands hold the world.\n            <\/p>\n          <\/div>\n\n          <!-- LAYER 3: DEEPER LENS (ORIGINAL HEBREW NOTES) -->\n          <div class=\"study-layer-card\" data-layer=\"deeper\" id=\"layerDeeperCard\">\n            <div class=\"layer-badge-row\">\n              <span class=\"layer-pill deeper\">Layer 3 \u00b7 Deeper Lens<\/span>\n              <span style=\"font-size: 0.69rem; color: var(--ink-muted);\">Original Hebrew \u00b7 Masoretic Text<\/span>\n            <\/div>\n            <h4 class=\"layer-heading\">Original-Language Roots &amp; Morphology<\/h4>\n\n            <div class=\"hebrew-interlinear-banner\">\n              <div class=\"hebrew-verse-full\" lang=\"he\" id=\"deeperHebrewFull\">\n                \u05d4\u05b7\u05e8\u05b0\u05e4\u05bc\u05d5\u05bc \u05d5\u05bc\u05d3\u05b0\u05e2\u05d5\u05bc \u05db\u05b4\u05bc\u05d9\u05be\u05d0\u05b8\u05e0\u05b9\u05db\u05b4\u05d9 \u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd \u05d0\u05b8\u05e8\u05d5\u05bc\u05dd \u05d1\u05b7\u05bc\u05d2\u05bc\u05d5\u05b9\u05d9\u05b4\u05dd \u05d0\u05b8\u05e8\u05d5\u05bc\u05dd \u05d1\u05b8\u05bc\u05d0\u05b8\u05e8\u05b6\u05e5\n              <\/div>\n              <div class=\"hebrew-phonetic-full\" id=\"deeperPhoneticFull\">\n                Harp\u016b ude\u2018\u016b k\u012b-\u0101n\u014dkh\u012b El\u014dh\u012bm, \u0101r\u016bm bagg\u014dyim \u0101r\u016bm b\u0101\u2019\u0101rets\n              <\/div>\n            <\/div>\n\n            <div class=\"lexicon-grid\" id=\"lexiconGrid\">\n              <div class=\"lexicon-item\">\n                <div class=\"lexicon-item-top\">\n                  <span class=\"lex-hebrew-word\" lang=\"he\">\u05d4\u05b7\u05e8\u05b0\u05e4\u05bc\u05d5\u05bc<\/span>\n                  <span class=\"lex-meta\">harp\u016b \u00b7 root \u05e8\u05b8\u05e4\u05b8\u05d4 (raphah)<\/span>\n                  <span class=\"lex-strongs\">Strong\u2019s H7503<\/span>\n                <\/div>\n                <p class=\"lex-gloss\">\n                  <strong>Hiphil Imperative Plural:<\/strong> Literally <em>\u201cCause your hands to drop / slacken your grip / cease striving.\u201d<\/em> Elsewhere used of letting one\u2019s hands fall from exhaustion or dropping a weapon. Stillness begins in the hands.\n                <\/p>\n              <\/div>\n\n              <div class=\"lexicon-item\">\n                <div class=\"lexicon-item-top\">\n                  <span class=\"lex-hebrew-word\" lang=\"he\">\u05d5\u05bc\u05d3\u05b0\u05e2\u05d5\u05bc<\/span>\n                  <span class=\"lex-meta\">ude\u2018\u016b \u00b7 root \u05d9\u05b8\u05d3\u05b7\u05e2 (yada\u2018)<\/span>\n                  <span class=\"lex-strongs\">Strong\u2019s H3045<\/span>\n                <\/div>\n                <p class=\"lex-gloss\">\n                  <strong>Qal Imperative:<\/strong> <em>\u201cAnd know by experience.\u201d<\/em> In Hebrew thought, <em>yada\u2018<\/em> is relational and covenantal recognition, not mere intellectual trivia.\n                <\/p>\n              <\/div>\n\n              <div class=\"lexicon-item\">\n                <div class=\"lexicon-item-top\">\n                  <span class=\"lex-hebrew-word\" lang=\"he\">\u05d0\u05b8\u05e0\u05b9\u05db\u05b4\u05d9<\/span>\n                  <span class=\"lex-meta\">\u0101n\u014dkh\u012b \u00b7 Emphatic \u201cI\u201d<\/span>\n                  <span class=\"lex-strongs\">Strong\u2019s H595<\/span>\n                <\/div>\n                <p class=\"lex-gloss\">\n                  The solemn covenantal pronoun <em>\u201cI Myself\u201d<\/em>\u2014echoing Sinai\u2019s opening declaration (<em>\u201cI am [\u0100n\u014dkh\u012b] the Lord your God\u201d<\/em>, Exod 20:2).\n                <\/p>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <!-- Response Actions directly inside Verse Study -->\n          <div class=\"study-response-bar\">\n            <a href=\"#screen-stillness\" class=\"study-action-chip\">\n              <span>Tie to Journal<\/span>\n            <\/a>\n            <a href=\"#screen-stillness\" class=\"study-action-chip\">\n              <span>Pray this Verse<\/span>\n            <\/a>\n            <a href=\"#screen-ask\" class=\"study-action-chip\">\n              <span>Ask Guide<\/span>\n            <\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- ======================================================================\n         SCREEN 3: STILLNESS, JOURNAL & PERSONAL PRAYER (\"THE INNER ROOM\")\n         ====================================================================== -->\n    <div class=\"screen-divider\">\n      <span class=\"screen-kicker\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M12 2a9 9 0 0 0-9 9c0 4.97 4.03 9 9 9s9-4.03 9-9A9 9 0 0 0 12 2z\"/><\/svg>\n        Stillness, Journal &amp; Personal Prayer\n      <\/span>\n      <span class=\"screen-number\">The Inner Room<\/span>\n    <\/div>\n\n    <section class=\"screen-section\" id=\"screen-stillness\">\n\n      <!-- STILLNESS: Guided Quiet Moment -->\n      <article class=\"stillness-card\" id=\"stillnessCard\">\n        <div class=\"blessing-top\">\n          <span class=\"blessing-kicker\">Stillness \u00b7 60-Second Guided Quiet<\/span>\n          <span style=\"font-size: 0.7rem; color: #C7B99E;\">Psalm 46:10 Cadence<\/span>\n        <\/div>\n\n        <div class=\"stillness-ring-wrap\">\n          <div class=\"breath-circle\"><\/div>\n          <div class=\"breath-inner-text\">\n            <span class=\"breath-phase\" id=\"breathPhaseText\">Harp\u016b \u00b7 Release<\/span>\n            <span class=\"breath-timer\" id=\"breathTimerText\">0:60 remaining<\/span>\n          <\/div>\n        <\/div>\n\n        <p class=\"stillness-liturgy-phrase\" id=\"breathPromptLine\">\n          \u201cUnclench your hands\u2026 inhale: <em>Be still<\/em> \u00b7 exhale: <em>and know that I am God.<\/em>\u201d\n        <\/p>\n\n        <button class=\"blessing-toggle-btn\" style=\"padding: 7px 16px; font-size: 0.76rem;\" onclick=\"toggleStillnessSession()\" id=\"stillnessBtn\">\n          Begin 60s Quiet Moment\n        <\/button>\n      <\/article>\n\n      <!-- JOURNAL: Private Reflections Tied to a Verse (Philippians 4:6) -->\n      <article class=\"journal-card\">\n        <div class=\"leaf-header\">\n          <span class=\"movement-tag\">Private Journal \u00b7 Verse-Tied Reflections<\/span>\n          <span style=\"font-size: 0.7rem; color: var(--ink-muted);\">Locked on device<\/span>\n        <\/div>\n\n        <!-- Example content from brief: Philippians 4:6 -->\n        <div class=\"journal-entry-box\">\n          <div class=\"journal-entry-meta\">\n            <span>Yesterday \u00b7 8:42 PM<\/span>\n            <span class=\"tied-verse-badge\" onclick=\"loadChapterAndScroll('phil4')\" title=\"Read Philippians 4 in Reader\">\n              <svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/><\/svg>\n              Philippians 4:6\n            <\/span>\n          <\/div>\n          <p class=\"journal-quote-body\">\n            \u201cFelt anxious about work today, read Philippians 4:6 and sat with it.\u201d\n          <\/p>\n          <p class=\"philippians-snippet\">\n            \u201cDo not be anxious about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God.\u201d\n          <\/p>\n        <\/div>\n\n        <div id=\"customJournalEntries\"><\/div>\n\n        <!-- Quick New Journal Entry tied to Psalm 46:10 -->\n        <div class=\"composer-input-row\">\n          <input type=\"text\" class=\"composer-input\" id=\"journalInput\" placeholder=\"Write a reflection tied to Psalm 46:10\u2026\" />\n          <button class=\"btn-secondary-outline\" onclick=\"addJournalEntry()\" style=\"padding: 8px 11px;\">Save<\/button>\n        <\/div>\n      <\/article>\n\n      <!-- PRAYER: Writes a Personal Prayer from What the User Shares -->\n      <article class=\"prayer-card\">\n        <div class=\"leaf-header\">\n          <span class=\"movement-tag\">Prayer Weaver \u00b7 From Your Words<\/span>\n          <span class=\"verse-ref-pill\">Psalm 46 &amp; Phil 4<\/span>\n        <\/div>\n        <p style=\"font-size: 0.78rem; color: var(--ink-secondary); margin-bottom: 4px;\">\n          Share what you are carrying, or tap a thread below to compose a personal prayer:\n        <\/p>\n\n        <div class=\"prayer-share-chips\">\n          <button class=\"share-chip active\" onclick=\"weavePrayer('anxious', this)\">Anxious about work tomorrow<\/button>\n          <button class=\"share-chip\" onclick=\"weavePrayer('forgive', this)\">Struggling to forgive someone<\/button>\n          <button class=\"share-chip\" onclick=\"weavePrayer('daughter', this)\">Blessing over family<\/button>\n        <\/div>\n\n        <div class=\"woven-prayer-paper\" id=\"wovenPrayerBox\">\n          \u201cFather, my hands have been clenched tightly around my work and tomorrow\u2019s outcomes. Teach my heart the Hebrew of <em>harp\u016b<\/em>\u2014to let my hands drop in trust before You. When my thoughts race, remind me that You are already in the morning before I arrive. Guard my mind with the peace of Christ that passes understanding. Amen.\u201d\n          <div class=\"prayer-amen-row\">\n            <span>Woven with Psalm 46:5, 10 &amp; Philippians 4:6\u20137<\/span>\n            <button class=\"icon-pill-btn\" onclick=\"this.textContent='Saved to Journal \u2713'\">Amen \u00b7 Save<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"composer-input-row\">\n          <input type=\"text\" class=\"composer-input\" id=\"customPrayerInput\" placeholder=\"Share what\u2019s on your heart to weave a prayer\u2026\" />\n          <button class=\"btn-secondary-outline\" onclick=\"weaveCustomPrayer()\" style=\"padding: 8px 11px;\">Weave<\/button>\n        <\/div>\n      <\/article>\n    <\/section>\n\n    <!-- ======================================================================\n         SCREEN 4: ASK / CHAT \u2014 STREAMED CONVERSATIONAL SCRIPTURE GUIDE\n         ====================================================================== -->\n    <div class=\"screen-divider\">\n      <span class=\"screen-kicker\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/><\/svg>\n        Ask \u00b7 Conversational Scripture Guide\n      <\/span>\n      <span class=\"screen-number\">Streamed Counsel<\/span>\n    <\/div>\n\n    <section class=\"screen-section\" id=\"screen-ask\">\n      <div class=\"ask-card\">\n        <div class=\"leaf-header\">\n          <span class=\"movement-tag\">Faith &amp; Scripture Dialogue<\/span>\n          <button class=\"icon-pill-btn\" onclick=\"replayStreamAnswer()\">Replay Stream<\/button>\n        <\/div>\n\n        <!-- Example question from brief -->\n        <div class=\"user-question-bubble\" id=\"askQuestionBubble\">\n          \u201cHow do I forgive someone who isn\u2019t sorry?\u201d\n        <\/div>\n\n        <div class=\"guide-response-box\">\n          <div class=\"stream-status-bar\">\n            <span class=\"stream-indicator\">\n              <span class=\"pulse-dot\"><\/span>\n              <span id=\"streamStatusText\">Anchored in 4 Scriptures<\/span>\n            <\/span>\n            <span style=\"font-size: 0.68rem; color: var(--ink-muted);\">Pastoral Lens<\/span>\n          <\/div>\n\n          <div class=\"guide-prose\" id=\"streamedProse\">\n            <p>\n              Scripture gently separates <strong>forgiveness<\/strong> from <strong>reconciliation<\/strong>\u2014and that distinction can lift an enormous weight when the other person isn\u2019t repentant.\n            <\/p>\n            <p>\n              <strong>1. Forgiveness happens between you and God.<\/strong> In <span class=\"scripture-ref-inline\">Mark 11:25<\/span>, Jesus speaks of forgiving <em>\u201cwhenever you stand praying\u201d<\/em>\u2014the other person isn\u2019t even in the room. On the cross, Jesus prayed <span class=\"scripture-ref-inline\">Luke 23:34<\/span> over people who were actively mocking Him. It means releasing your right to collect the debt yourself and handing the ledger to a just Judge (<span class=\"scripture-ref-inline\">Romans 12:19<\/span>).\n            <\/p>\n            <p>\n              <strong>2. Reconciliation requires two people and rebuilt trust.<\/strong> Notice <span class=\"scripture-ref-inline\">Romans 12:18<\/span>: <em>\u201cIf possible, so far as it depends on you, live peaceably with all.\u201d<\/em> Paul acknowledges that sometimes the other side refuses peace. You can unclench your fist (<em>harp\u016b<\/em>, <span class=\"scripture-ref-inline\">Psalm 46:10<\/span>) so bitterness doesn\u2019t poison your soul, while still keeping wise boundaries (<span class=\"scripture-ref-inline\">Proverbs 4:23<\/span>).\n            <\/p>\n          <\/div>\n\n          <div class=\"followup-chips\">\n            <button class=\"followup-btn\" onclick=\"askFollowup('trust')\">\n              <span>Does forgiving mean trusting them again right away?<\/span>\n              <span>\u2192<\/span>\n            <\/button>\n            <button class=\"followup-btn\" onclick=\"askFollowup('replay')\">\n              <span>What when the hurt keeps replaying in my mind?<\/span>\n              <span>\u2192<\/span>\n            <\/button>\n          <\/div>\n\n          <div class=\"composer-input-row\" style=\"margin-top: 10px;\">\n            <input type=\"text\" class=\"composer-input\" id=\"askCustomInput\" placeholder=\"Ask a question of faith or Scripture\u2026\" />\n            <button class=\"btn-secondary-outline\" onclick=\"askCustomQuestion()\" style=\"padding: 8px 11px;\">Ask<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- ======================================================================\n         SCREEN 5: JOURNEY & AROUND IT (GATHERED LIGHT, TREASURY, REMINDERS)\n         ====================================================================== -->\n    <div class=\"screen-divider\">\n      <span class=\"screen-kicker\">\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\"/><\/svg>\n        Journey &amp; Sanctuary Settings\n      <\/span>\n      <span class=\"screen-number\">Gathered Light<\/span>\n    <\/div>\n\n    <section class=\"screen-section\" id=\"screen-journey\">\n      <div class=\"journey-card\">\n        <div class=\"leaf-header\">\n          <span class=\"movement-tag\">Your Journey \u00b7 No Broken-Streak Guilt<\/span>\n          <span class=\"verse-ref-pill\">November<\/span>\n        <\/div>\n        <p style=\"font-size: 0.79rem; color: var(--ink-secondary);\">\n          Every day you dwell in the Word or sit in Stillness lights an oil lamp on your table. Missed days never erase gathered light.\n        <\/p>\n\n        <div class=\"journey-stats-row\">\n          <div class=\"stat-tile\">\n            <div class=\"stat-num\">19<\/div>\n            <div class=\"stat-label\">Chapters Read<\/div>\n          <\/div>\n          <div class=\"stat-tile\">\n            <div class=\"stat-num\">12<\/div>\n            <div class=\"stat-label\">Lamps Lit<\/div>\n          <\/div>\n          <div class=\"stat-tile\">\n            <div class=\"stat-num\">8<\/div>\n            <div class=\"stat-label\">Reflections<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"lamp-mosaic\" aria-label=\"14-day rhythm lamps\">\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>Th<\/div>\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>Fr<\/div>\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>Sa<\/div>\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>Su<\/div>\n          <div class=\"lamp-cell\"><span class=\"lamp-flame\"><\/span>Mo<\/div>\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>Tu<\/div>\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>We<\/div>\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>Th<\/div>\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>Fr<\/div>\n          <div class=\"lamp-cell\"><span class=\"lamp-flame\"><\/span>Sa<\/div>\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>Su<\/div>\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>Mo<\/div>\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>Tu<\/div>\n          <div class=\"lamp-cell lit\"><span class=\"lamp-flame\"><\/span>Today<\/div>\n        <\/div>\n\n        <!-- Saved Verses Treasury & Rhythm Reminders -->\n        <div class=\"around-grid\" style=\"margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-hairline);\">\n          <div>\n            <span class=\"tray-label\">Saved Treasury (3 Verses)<\/span>\n            <div class=\"treasury-pill-list\">\n              <span class=\"tied-verse-badge\" onclick=\"loadChapterAndScroll('psalm46')\">Psalm 46:10 \u00b7 Harp\u016b<\/span>\n              <span class=\"tied-verse-badge\" onclick=\"loadChapterAndScroll('numbers6')\">Numbers 6:24\u201326 \u00b7 Shalom<\/span>\n              <span class=\"tied-verse-badge\" onclick=\"loadChapterAndScroll('phil4')\">Philippians 4:6\u20137<\/span>\n            <\/div>\n          <\/div>\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-top: 6px;\">\n            <span class=\"tray-label\">Gentle Bells \u00b7 7:30 AM &amp; 9:15 PM<\/span>\n            <button class=\"icon-pill-btn\" onclick=\"toggleSettingsTray()\">Adjust Theme / Font \u2191<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <!-- STICKY BOTTOM 5-TAB NAVIGATION -->\n  <nav class=\"bottom-nav\" aria-label=\"Primary Navigation\">\n    <a href=\"#screen-home\" class=\"nav-tab active\" data-target=\"screen-home\" onclick=\"setActiveTab(this)\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><path d=\"M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z\"/><\/svg>\n      <span>Home<\/span>\n    <\/a>\n    <a href=\"#screen-reader\" class=\"nav-tab\" data-target=\"screen-reader\" onclick=\"setActiveTab(this)\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"/><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/><\/svg>\n      <span>Word \u00b7 Study<\/span>\n    <\/a>\n    <a href=\"#screen-stillness\" class=\"nav-tab\" data-target=\"screen-stillness\" onclick=\"setActiveTab(this)\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z\"/><\/svg>\n      <span>Selah<\/span>\n    <\/a>\n    <a href=\"#screen-ask\" class=\"nav-tab\" data-target=\"screen-ask\" onclick=\"setActiveTab(this)\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/><\/svg>\n      <span>Ask<\/span>\n    <\/a>\n    <a href=\"#screen-journey\" class=\"nav-tab\" data-target=\"screen-journey\" onclick=\"setActiveTab(this)\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 3\"/><\/svg>\n      <span>Journey<\/span>\n    <\/a>\n  <\/nav>\n\n  <script>\n    /* ========================================================================\n       INTERACTIVE BEHAVIORS FOR ELIANA'S RHYTHM\n       ======================================================================== */\n\n    // 1. Settings Tray, Theme & Font Size Switching\n    function toggleSettingsTray() {\n      const tray = document.getElementById('settingsTray');\n      tray.classList.toggle('open');\n    }\n\n    function setTheme(themeName, btn) {\n      document.documentElement.setAttribute('data-theme', themeName);\n      const labels = { vellum: 'Vellum', dusk: 'Dusk', contrast: 'Contrast' };\n      document.getElementById('currentThemeLabel').textContent = labels[themeName] || 'Vellum';\n      const parent = btn.parentElement;\n      parent.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));\n      btn.classList.add('active');\n    }\n\n    function setFontSize(sizeKey, btn) {\n      document.documentElement.setAttribute('data-fontsize', sizeKey);\n      const parent = btn.parentElement;\n      parent.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));\n      btn.classList.add('active');\n    }\n\n    // 2. Time-of-Day Liturgical Cadence Switcher\n    function setDayHour(hour, btn) {\n      document.querySelectorAll('.cadence-pill').forEach(p => p.classList.remove('active'));\n      btn.classList.add('active');\n      const label = document.getElementById('cadenceTimeLabel');\n      const prompt = document.getElementById('gentlePromptText');\n      if (hour === 'morning') {\n        label.textContent = 'Morning Cadence \u00b7 Receive & Dwell';\n        prompt.innerHTML = 'Yesterday you journaled about <em>work anxiety<\/em> and sat with <em>Philippians 4:6<\/em>. Today\u2019s word in <em>Psalm 46:10<\/em> carries that thread forward\u2014how would you like to respond?';\n      } else if (hour === 'midday') {\n        label.textContent = 'Midday Pause \u00b7 60-Second Selah';\n        prompt.innerHTML = 'In the middle of today\u2019s tasks, pause to unclench your hands (<em>harp\u016b<\/em>). Step into a 60-second quiet breath or read <em>Psalm 46<\/em> with Study Mode.';\n      } else {\n        label.textContent = 'Evening Examen \u00b7 Release the Day';\n        prompt.innerHTML = 'Before sleep, rest beneath the Priestly Blessing of <em>Numbers 6:24\u201326<\/em> and leave tomorrow\u2019s work in God\u2019s hands through a brief prayer.';\n      }\n    }\n\n    // 3. Priestly Blessing Phonetics Toggle\n    function toggleBlessingTranslit() {\n      const card = document.getElementById('blessingCard');\n      const btn = document.getElementById('btnTranslit');\n      card.classList.toggle('show-translit');\n      btn.textContent = card.classList.contains('show-translit') ? 'Hide Phonetics' : 'Show Phonetics';\n    }\n\n    // 4. Bible Reader Study Mode Switch\n    function toggleStudyMode() {\n      const shell = document.getElementById('readerShell');\n      const btn = document.getElementById('studyModeBtn');\n      const label = document.getElementById('studyModeLabel');\n      const isCurrentlyOn = shell.getAttribute('data-studymode') === 'on';\n      if (isCurrentlyOn) {\n        shell.setAttribute('data-studymode', 'off');\n        btn.classList.add('off');\n        btn.setAttribute('aria-pressed', 'false');\n        label.textContent = 'Study Mode: OFF';\n      } else {\n        shell.setAttribute('data-studymode', 'on');\n        btn.classList.remove('off');\n        btn.setAttribute('aria-pressed', 'true');\n        label.textContent = 'Study Mode: ON';\n      }\n    }\n\n    // 5. Chapter Switcher (Psalm 46, Numbers 6, Philippians 4)\n    const PSALM46_HTML = document.getElementById('scriptureContainer').innerHTML;\n    const PSALM46_LEXICON = document.getElementById('lexiconGrid').innerHTML;\n\n    const CHAPTER_DATA = {\n      psalm46: {\n        scriptureHTML: null,\n        lexiconHTML: null,\n        studyTitle: 'Verse Study \u00b7 Psalm 46:10',\n        l1Head: 'The Battlefield Behind the Stillness',\n        l1Text: 'Sung after Jerusalem survived an impossible siege (often linked to Sennacherib\u2019s Assyrian army in 2 Kings 19). Verses 1\u20139 are loud with collapsing mountains, roaring seas, and burning chariots. Verse 10 is not spoken in a quiet meadow\u2014it is God\u2019s commanding voice cutting across a war zone.',\n        l2Head: 'Surrendering White-Knuckled Control',\n        l2Text: 'When we are anxious, we try to play God by rehearsing every threat. \u201cBe still\u201d is not a call to numbness; it is a command to lay down our weapons of self-salvation. To <em>be still<\/em> and to <em>know<\/em> are two sides of one movement: only when our hands let go do we recognize whose hands hold the world.',\n        hebFull: '\u05d4\u05b7\u05e8\u05b0\u05e4\u05bc\u05d5\u05bc \u05d5\u05bc\u05d3\u05b0\u05e2\u05d5\u05bc \u05db\u05b4\u05bc\u05d9\u05be\u05d0\u05b8\u05e0\u05b9\u05db\u05b4\u05d9 \u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd \u05d0\u05b8\u05e8\u05d5\u05bc\u05dd \u05d1\u05b7\u05bc\u05d2\u05bc\u05d5\u05b9\u05d9\u05b4\u05dd \u05d0\u05b8\u05e8\u05d5\u05bc\u05dd \u05d1\u05b8\u05bc\u05d0\u05b8\u05e8\u05b6\u05e5',\n        phonFull: 'Harp\u016b ude\u2018\u016b k\u012b-\u0101n\u014dkh\u012b El\u014dh\u012bm, \u0101r\u016bm bagg\u014dyim \u0101r\u016bm b\u0101\u2019\u0101rets'\n      },\n      numbers6: {\n        scriptureHTML: `\n          <div class=\"chapter-heading-block\">\n            <div class=\"book-overline\">The Fourth Book of Moses \u00b7 Torah<\/div>\n            <h2 class=\"chapter-main-title\">Numbers 6:22\u201327<\/h2>\n            <p class=\"psalm-superscription\">The Aaronic Priestly Blessing (Birkat Kohanim)<\/p>\n          <\/div>\n          <div class=\"stanza-study-header study-only\">\n            <span>Three Ascending Lines (3 \u2192 5 \u2192 7 Hebrew Words)<\/span>\n            <span>Covenant Name<\/span>\n          <\/div>\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(22)\">\n            <span class=\"v-num\">22<\/span>\n            The Lord spoke to Moses, saying, \u201cSpeak to Aaron and his sons, saying, Thus you shall bless the people of Israel:\u201d\n          <\/div>\n          <div class=\"verse-block selected-verse\" onclick=\"selectVerseForStudy(24)\">\n            <span class=\"v-num\">24<\/span>\n            \u201cThe Lord <span class=\"ruby-word\">bless you<span class=\"ruby-gloss study-only\">\u05d9\u05b0\u05d1\u05b8\u05e8\u05b6\u05db\u05b0\u05da\u05b8 \u00b7 yev\u0101rekhekh\u0101<\/span><\/span> and <span class=\"ruby-word\">keep you<span class=\"ruby-gloss study-only\">\u05d5\u05b0\u05d9\u05b4\u05e9\u05b0\u05c1\u05de\u05b0\u05e8\u05b6\u05da\u05b8 \u00b7 veyishmerekha<\/span><\/span>;\n          <\/div>\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(25)\">\n            <span class=\"v-num\">25<\/span>\n            the Lord make his <span class=\"ruby-word\">face shine<span class=\"ruby-gloss study-only\">\u05d9\u05b8\u05d0\u05b5\u05e8 \u05e4\u05b8\u05bc\u05e0\u05b8\u05d9\u05d5 \u00b7 y\u0101\u2019\u0113r p\u0101n\u0101v<\/span><\/span> upon you and be <span class=\"ruby-word\">gracious<span class=\"ruby-gloss study-only\">\u05d5\u05b4\u05d9\u05d7\u05bb\u05e0\u05b6\u05bc\u05da\u05b8\u05bc \u00b7 v\u012b\u1e25unnekk\u0101<\/span><\/span> to you;\n          <\/div>\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(26)\">\n            <span class=\"v-num\">26<\/span>\n            the Lord lift up his countenance upon you and give you <span class=\"ruby-word\">peace<span class=\"ruby-gloss study-only\">\u05e9\u05b8\u05c1\u05dc\u05d5\u05b9\u05dd \u00b7 sh\u0101l\u014dm<\/span><\/span>.\u201d\n          <\/div>\n          <div class=\"margin-whisper study-only\">\n            <strong>Marginal Note on vv. 24\u201326:<\/strong> Each line begins with the Lord\u2019s action and ends with singular \u201cyou\u201d (<em>-kha<\/em>)\u2014spoke over the whole assembly, yet addressed intimately to each single listener.\n          <\/div>\n        `,\n        lexiconHTML: `\n          <div class=\"lexicon-item\">\n            <div class=\"lexicon-item-top\">\n              <span class=\"lex-hebrew-word\" lang=\"he\">\u05d9\u05b0\u05d1\u05b8\u05e8\u05b6\u05db\u05b0\u05da\u05b8<\/span>\n              <span class=\"lex-meta\">yev\u0101rekhekh\u0101 \u00b7 root \u05d1\u05b8\u05bc\u05e8\u05b7\u05da\u05b0 (barakh)<\/span>\n              <span class=\"lex-strongs\">Strong\u2019s H1288<\/span>\n            <\/div>\n            <p class=\"lex-gloss\"><strong>Piel Imperfect:<\/strong> Related to <em>berekh<\/em> (\u201cknee\u201d)\u2014to kneel before someone with open-handed gifts, endowing them with flourishing and life.<\/p>\n          <\/div>\n          <div class=\"lexicon-item\">\n            <div class=\"lexicon-item-top\">\n              <span class=\"lex-hebrew-word\" lang=\"he\">\u05d5\u05b0\u05d9\u05b4\u05e9\u05b0\u05c1\u05de\u05b0\u05e8\u05b6\u05da\u05b8<\/span>\n              <span class=\"lex-meta\">veyishmerekha \u00b7 root \u05e9\u05b8\u05c1\u05de\u05b7\u05e8 (shamar)<\/span>\n              <span class=\"lex-strongs\">Strong\u2019s H8104<\/span>\n            <\/div>\n            <p class=\"lex-gloss\">Literally <em>\u201chedge you about with thorns\u201d<\/em>\u2014as a shepherd builds a protective thorn-fold around the flock in the wilderness night.<\/p>\n          <\/div>\n          <div class=\"lexicon-item\">\n            <div class=\"lexicon-item-top\">\n              <span class=\"lex-hebrew-word\" lang=\"he\">\u05e9\u05b8\u05c1\u05dc\u05d5\u05b9\u05dd<\/span>\n              <span class=\"lex-meta\">sh\u0101l\u014dm \u00b7 root \u05e9\u05b8\u05c1\u05dc\u05b5\u05dd (shalem)<\/span>\n              <span class=\"lex-strongs\">Strong\u2019s H7965<\/span>\n            <\/div>\n            <p class=\"lex-gloss\">More than the absence of conflict: completeness, structural soundness, and unfractured harmony under God\u2019s gaze.<\/p>\n          <\/div>\n        `,\n        studyTitle: 'Verse Study \u00b7 Numbers 6:24\u201326',\n        l1Head: 'Spoken Over a Wilderness People',\n        l1Text: 'Given at Sinai through Aaron\u2019s sons so that God\u2019s own Name would be placed upon Israel as they journeyed through the wilderness (Num 6:27). The oldest surviving biblical text ever found\u2014etched on silver scrolls at Ketef Hinnom (7th c. BC).',\n        l2Head: 'A Crescendo of Grace Toward Shalom',\n        l2Text: 'In Hebrew, the three lines grow from 3 words to 5 words to 7 words\u2014a poetic wave of blessing culminating in Shalom: wholeness, safety, and resting beneath God\u2019s shining face.',\n        hebFull: '\u05d9\u05b0\u05d1\u05b8\u05e8\u05b6\u05db\u05b0\u05da\u05b8 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05d5\u05b0\u05d9\u05b4\u05e9\u05b0\u05c1\u05de\u05b0\u05e8\u05b6\u05da\u05b8 \u00b7 \u05d9\u05b8\u05d0\u05b5\u05e8 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05e4\u05b8\u05bc\u05e0\u05b8\u05d9\u05d5 \u05d0\u05b5\u05dc\u05b6\u05d9\u05da\u05b8 \u05d5\u05b4\u05d9\u05d7\u05bb\u05e0\u05b6\u05bc\u05da\u05b8\u05bc',\n        phonFull: 'Yev\u0101rekhekh\u0101 Adonai veyishmerekha \u00b7 Y\u0101\u2019\u0113r Adonai p\u0101n\u0101v \u0113lekha v\u012b\u1e25unnekk\u0101'\n      },\n      phil4: {\n        scriptureHTML: `\n          <div class=\"chapter-heading-block\">\n            <div class=\"book-overline\">Epistle to the Philippians \u00b7 Prison Letters<\/div>\n            <h2 class=\"chapter-main-title\">Philippians 4:4\u20137<\/h2>\n            <p class=\"psalm-superscription\">Rejoicing, Gentleness &amp; the Peace of God<\/p>\n          <\/div>\n          <div class=\"stanza-study-header study-only\">\n            <span>Exhortation (vv. 4\u20137) \u00b7 From Divided Mind to Guarded Heart<\/span>\n            <span>Garrison of Peace<\/span>\n          <\/div>\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(4)\">\n            <span class=\"v-num\">4<\/span>\n            Rejoice in the Lord always; again I will say, rejoice. Let your reasonableness be known to everyone. The Lord is at hand;\n          <\/div>\n          <div class=\"verse-block selected-verse\" onclick=\"selectVerseForStudy(6)\">\n            <span class=\"v-num\">6<\/span>\n            do not be <span class=\"ruby-word\">anxious<span class=\"ruby-gloss study-only\">\u03bc\u03b5\u03c1\u03b9\u03bc\u03bd\u1fb6\u03c4\u03b5 \u00b7 merimnate<\/span><\/span> about anything, but in everything by prayer and supplication with <span class=\"ruby-word\">thanksgiving<span class=\"ruby-gloss study-only\">\u03b5\u1f50\u03c7\u03b1\u03c1\u03b9\u03c3\u03c4\u03af\u03b1\u03c2 \u00b7 eucharistias<\/span><\/span> let your requests be made known to God.\n          <\/div>\n          <div class=\"verse-block\" onclick=\"selectVerseForStudy(7)\">\n            <span class=\"v-num\">7<\/span>\n            And the peace of God, which surpasses all understanding, will <span class=\"ruby-word\">guard<span class=\"ruby-gloss study-only\">\u03c6\u03c1\u03bf\u03c5\u03c1\u03ae\u03c3\u03b5\u03b9 \u00b7 phrour\u0113sei<\/span><\/span> your hearts and your minds in Christ Jesus.\n          <\/div>\n          <div class=\"margin-whisper study-only\">\n            <strong>Your Journal Thread (Yesterday):<\/strong> \u201cFelt anxious about work today, read Philippians 4:6 and sat with it.\u201d\n          <\/div>\n        `,\n        lexiconHTML: `\n          <div class=\"lexicon-item\">\n            <div class=\"lexicon-item-top\">\n              <span class=\"lex-hebrew-word\">\u03bc\u03b5\u03c1\u03b9\u03bc\u03bd\u1fb6\u03c4\u03b5<\/span>\n              <span class=\"lex-meta\">merimnate \u00b7 root \u03bc\u03b5\u03c1\u03af\u03b6\u03c9 (meriz\u014d)<\/span>\n              <span class=\"lex-strongs\">Strong\u2019s G3309<\/span>\n            <\/div>\n            <p class=\"lex-gloss\">Literally <em>\u201cto be drawn in opposite directions / divided in mind.\u201d<\/em> Anxiety fractures attention; prayer gathers it back into one place.<\/p>\n          <\/div>\n          <div class=\"lexicon-item\">\n            <div class=\"lexicon-item-top\">\n              <span class=\"lex-hebrew-word\">\u03c6\u03c1\u03bf\u03c5\u03c1\u03ae\u03c3\u03b5\u03b9<\/span>\n              <span class=\"lex-meta\">phrour\u0113sei \u00b7 Military Garrison<\/span>\n              <span class=\"lex-strongs\">Strong\u2019s G5432<\/span>\n            <\/div>\n            <p class=\"lex-gloss\">Philippi was a Roman military colony. Paul uses the term for a <em>sentinel detachment standing watch<\/em> at the city gates\u2014God\u2019s peace patrols the entrance to your heart.<\/p>\n          <\/div>\n        `,\n        studyTitle: 'Verse Study \u00b7 Philippians 4:6\u20137',\n        l1Head: 'Written in Chains, Anchored in Joy',\n        l1Text: 'Paul writes from Roman custody, awaiting trial, to a beleaguered church in Philippi. His counsel against anxiety comes not from comfort, but from a prison cell where he has discovered the nearness of the Lord (v. 5).',\n        l2Head: 'The Exchange of Worry for Guarded Peace',\n        l2Text: 'Anxiety pulls our mind in two directions (Greek: merimna\u014d, \u201cto be divided\u201d). Prayer with thanksgiving transfers the burden to God, whose peace stands like a Roman garrison (phroure\u014d) outside the door of your heart.',\n        hebFull: '\u03bc\u03b7\u03b4\u1f72\u03bd \u03bc\u03b5\u03c1\u03b9\u03bc\u03bd\u1fb6\u03c4\u03b5 \u00b7 \u1f21 \u03b5\u1f30\u03c1\u03ae\u03bd\u03b7 \u03c4\u03bf\u1fe6 \u03b8\u03b5\u03bf\u1fe6 \u03c6\u03c1\u03bf\u03c5\u03c1\u03ae\u03c3\u03b5\u03b9 \u03c4\u1f70\u03c2 \u03ba\u03b1\u03c1\u03b4\u03af\u03b1\u03c2 \u1f51\u03bc\u1ff6\u03bd',\n        phonFull: 'M\u0113den merimnate (\"be pulled apart by nothing\") \u00b7 phrour\u0113sei (\"shall stand garrison\")'\n      }\n    };\n\n    function loadChapter(key, btn) {\n      if (btn) {\n        document.querySelectorAll('.chapter-pill').forEach(p => p.classList.remove('active'));\n        btn.classList.add('active');\n      }\n      const d = CHAPTER_DATA[key];\n      if (!d) return;\n      document.getElementById('scriptureContainer').innerHTML = d.scriptureHTML || PSALM46_HTML;\n      document.getElementById('lexiconGrid').innerHTML = d.lexiconHTML || PSALM46_LEXICON;\n      document.getElementById('studyTargetTitle').textContent = d.studyTitle;\n      document.getElementById('layer1Heading').textContent = d.l1Head;\n      document.getElementById('layer1Text').textContent = d.l1Text;\n      document.getElementById('layer2Heading').textContent = d.l2Head;\n      document.getElementById('layer2Text').textContent = d.l2Text;\n      document.getElementById('deeperHebrewFull').textContent = d.hebFull;\n      document.getElementById('deeperPhoneticFull').textContent = d.phonFull;\n    }\n\n    function loadChapterAndScroll(key) {\n      const pills = document.querySelectorAll('.chapter-pill');\n      const indexMap = { psalm46: 0, numbers6: 1, phil4: 2 };\n      loadChapter(key, pills[indexMap[key]]);\n      document.getElementById('screen-reader').scrollIntoView({ behavior: 'smooth' });\n    }\n\n    function selectVerseForStudy(vNum) {\n      document.querySelectorAll('.verse-block').forEach(v => v.classList.remove('selected-verse'));\n      if (event && event.currentTarget) {\n        event.currentTarget.classList.add('selected-verse');\n      }\n      const activePill = document.querySelector('.chapter-pill.active');\n      const bookName = activePill ? activePill.textContent : 'Psalm 46';\n      document.getElementById('studyTargetTitle').textContent = 'Verse Study \u00b7 ' + bookName + ':' + vNum;\n    }\n\n    // 6. Filter 3-Layer Verse Study (All Stacked or Single Layer)\n    function filterStudyLayer(layerKey, btn) {\n      if (btn) {\n        document.querySelectorAll('.layer-tab').forEach(t => t.classList.remove('active'));\n        btn.classList.add('active');\n      }\n      document.querySelectorAll('.study-layer-card').forEach(card => {\n        if (layerKey === 'all' || card.getAttribute('data-layer') === layerKey) {\n          card.style.display = 'block';\n        } else {\n          card.style.display = 'none';\n        }\n      });\n    }\n\n    function jumpToStudyLayer(layerKey) {\n      const tabs = document.querySelectorAll('.layer-tab');\n      filterStudyLayer('all', tabs[0]);\n      document.getElementById('layerDeeperCard').scrollIntoView({ behavior: 'smooth' });\n    }\n\n    // 7. Stillness 60s Breathing Guide\n    let stillnessInterval = null;\n    let secondsLeft = 60;\n    function toggleStillnessSession() {\n      const card = document.getElementById('stillnessCard');\n      const btn = document.getElementById('stillnessBtn');\n      const phase = document.getElementById('breathPhaseText');\n      const timer = document.getElementById('breathTimerText');\n\n      if (stillnessInterval) {\n        clearInterval(stillnessInterval);\n        stillnessInterval = null;\n        card.classList.remove('breathing');\n        phase.textContent = 'Harp\u016b \u00b7 Release';\n        btn.textContent = 'Resume Quiet Moment';\n        return;\n      }\n\n      card.classList.add('breathing');\n      btn.textContent = 'Pause Quiet Moment';\n      stillnessInterval = setInterval(() => {\n        secondsLeft = secondsLeft > 1 ? secondsLeft - 1 : 60;\n        const cycle = (60 - secondsLeft) % 8;\n        if (cycle < 4) {\n          phase.textContent = 'Inhale \u00b7 \u201cBe still\u2026\u201d';\n        } else {\n          phase.textContent = 'Exhale \u00b7 \u201c\u2026and know\u201d';\n        }\n        timer.textContent = '0:' + (secondsLeft < 10 ? '0' + secondsLeft : secondsLeft) + ' remaining';\n      }, 1000);\n    }\n\n    // 8. Journal Entry Addition\n    function addJournalEntry() {\n      const input = document.getElementById('journalInput');\n      const val = input.value.trim();\n      if (!val) return;\n      const container = document.getElementById('customJournalEntries');\n      const box = document.createElement('div');\n      box.className = 'journal-entry-box';\n      box.innerHTML = `\n        <div class=\"journal-entry-meta\">\n          <span>Just now<\/span>\n          <span class=\"tied-verse-badge\">Psalm 46:10<\/span>\n        <\/div>\n        <p class=\"journal-quote-body\"><\/p>\n      `;\n      box.querySelector('.journal-quote-body').textContent = '\u201c' + val + '\u201d';\n      container.prepend(box);\n      input.value = '';\n    }\n\n    // 9. Personal Prayer Weaver\n    const PRAYERS = {\n      anxious: '\u201cFather, my hands have been clenched tightly around my work and tomorrow\u2019s outcomes. Teach my heart the Hebrew of <em>harp\u016b<\/em>\u2014to let my hands drop in trust before You. When my thoughts race, remind me that You are already in the morning before I arrive. Guard my mind with the peace of Christ that passes understanding. Amen.\u201d',\n      forgive: '\u201cLord, You see the wound that has not been acknowledged or apologized for. I cannot carry the ledger of this debt any longer. Like Jesus on the cross, I place this person and my hurt into Your nail-scarred hands. Free my heart from rehearsing the wrong, and keep me wise and whole in Your peace. Amen.\u201d',\n      daughter: '\u201cGod who answers\u2014Eliana\u2019s God\u2014make Your face shine upon our home today. Bless and keep those I love; lift up Your countenance over every anxious corner and set Your deep shalom upon us. Amen.\u201d'\n    };\n\n    function weavePrayer(key, btn) {\n      document.querySelectorAll('.share-chip').forEach(c => c.classList.remove('active'));\n      if (btn) btn.classList.add('active');\n      const box = document.getElementById('wovenPrayerBox');\n      box.innerHTML = PRAYERS[key] + `\n        <div class=\"prayer-amen-row\">\n          <span>Woven with Psalm 46:10, Numbers 6:24\u201326 &amp; Phil 4:6<\/span>\n          <button class=\"icon-pill-btn\" onclick=\"this.textContent='Saved to Journal \u2713'\">Amen \u00b7 Save<\/button>\n        <\/div>\n      `;\n    }\n\n    function weaveCustomPrayer() {\n      const input = document.getElementById('customPrayerInput');\n      const shared = input.value.trim();\n      if (!shared) return;\n      document.querySelectorAll('.share-chip').forEach(c => c.classList.remove('active'));\n      const box = document.getElementById('wovenPrayerBox');\n      const safeText = shared.replace(/<\/g, '&lt;').replace(/>/g, '&gt;');\n      box.innerHTML = `\u201cFather, I bring before You what I am carrying right now: <em>${safeText}<\/em>. Where my grip is tight, grant me the stillness of <em>harp\u016b<\/em> (Psalm 46:10); where my mind is divided, station Your garrison of peace around my heart (Philippians 4:6\u20137) and rest Your shining countenance upon me. Amen.\u201d\n        <div class=\"prayer-amen-row\">\n          <span>Personal Prayer \u00b7 Woven with Psalm 46:10 &amp; Phil 4:6\u20137<\/span>\n          <button class=\"icon-pill-btn\" onclick=\"this.textContent='Saved to Journal \u2713'\">Amen \u00b7 Save<\/button>\n        <\/div>\n      `;\n      input.value = '';\n    }\n\n    // 10. Ask / Streamed Scripture Guide\n    const FOLLOWUP_ANSWERS = {\n      trust: {\n        q: '\u201cDoes forgiving mean trusting them again right away?\u201d',\n        chunks: [\n          '<p><strong>No\u2014forgiveness is given freely, while trust is rebuilt over time through fruit.<\/strong><\/p>',\n          '<p>In <span class=\"scripture-ref-inline\">Luke 3:8<\/span>, John calls for <em>\u201cfruits in keeping with repentance.\u201d<\/em> You can forgive someone completely from the heart (<span class=\"scripture-ref-inline\">Colossians 3:13<\/span>) while still recognizing that wise stewardship of your heart requires truthfulness and safety (<span class=\"scripture-ref-inline\">Proverbs 22:3<\/span>).<\/p>'\n        ]\n      },\n      replay: {\n        q: '\u201cWhat when the hurt keeps replaying in my mind?\u201d',\n        chunks: [\n          '<p><strong>Forgiveness is often a daily unclenching, not a one-time switch.<\/strong><\/p>',\n          '<p>When Peter asked if he should forgive seven times, Jesus answered <em>\u201cseventy-seven times\u201d<\/em> (<span class=\"scripture-ref-inline\">Matthew 18:22<\/span>)\u2014often for the <em>same<\/em> wound returning to memory. Each time the replay starts, practice <em>harp\u016b<\/em> (<span class=\"scripture-ref-inline\">Psalm 46:10<\/span>): gently hand the memory back to God rather than judging yourself for still feeling the bruise.<\/p>'\n        ]\n      }\n    };\n\n    const DEFAULT_FORGIVE_CHUNKS = [\n      '<p>Scripture gently separates <strong>forgiveness<\/strong> from <strong>reconciliation<\/strong>\u2014and that distinction can lift an enormous weight when the other person isn\u2019t repentant.<\/p>',\n      '<p><strong>1. Forgiveness happens between you and God.<\/strong> In <span class=\"scripture-ref-inline\">Mark 11:25<\/span>, Jesus speaks of forgiving <em>\u201cwhenever you stand praying\u201d<\/em>\u2014the other person isn\u2019t even in the room. On the cross, Jesus prayed <span class=\"scripture-ref-inline\">Luke 23:34<\/span> over people who were actively mocking Him. It means releasing your right to collect the debt yourself and handing the ledger to a just Judge (<span class=\"scripture-ref-inline\">Romans 12:19<\/span>).<\/p>',\n      '<p><strong>2. Reconciliation requires two people and rebuilt trust.<\/strong> Notice <span class=\"scripture-ref-inline\">Romans 12:18<\/span>: <em>\u201cIf possible, so far as it depends on you, live peaceably with all.\u201d<\/em> Paul acknowledges that sometimes the other side refuses peace. You can unclench your fist (<em>harp\u016b<\/em>, <span class=\"scripture-ref-inline\">Psalm 46:10<\/span>) so bitterness doesn\u2019t poison your soul, while still keeping wise boundaries (<span class=\"scripture-ref-inline\">Proverbs 4:23<\/span>).<\/p>'\n    ];\n\n    let activeStreamTimer = null;\n\n    function askFollowup(key) {\n      const item = FOLLOWUP_ANSWERS[key];\n      if (!item) return;\n      document.getElementById('askQuestionBubble').textContent = item.q;\n      streamChunksIntoGuide(item.chunks);\n    }\n\n    function replayStreamAnswer() {\n      document.getElementById('askQuestionBubble').textContent = '\u201cHow do I forgive someone who isn\u2019t sorry?\u201d';\n      streamChunksIntoGuide(DEFAULT_FORGIVE_CHUNKS);\n    }\n\n    function askCustomQuestion() {\n      const input = document.getElementById('askCustomInput');\n      const q = input.value.trim();\n      if (!q) return;\n      document.getElementById('askQuestionBubble').textContent = '\u201c' + q + '\u201d';\n      const safeQ = q.replace(/<\/g, '&lt;').replace(/>/g, '&gt;');\n      streamChunksIntoGuide([\n        `<p>Bringing <em>\u201c${safeQ}\u201d<\/em> before Scripture invites both honesty and stillness.<\/p>`,\n        `<p>Throughout the Psalms and Epistles, God never asks us to hide our questions; He meets us in them (<span class=\"scripture-ref-inline\">Psalm 62:8<\/span>). Begin by releasing what you cannot control (<span class=\"scripture-ref-inline\">Psalm 46:10<\/span>), bringing the weight with thanksgiving (<span class=\"scripture-ref-inline\">Philippians 4:6\u20137<\/span>), and trusting the Father whose face shines toward you (<span class=\"scripture-ref-inline\">Numbers 6:24\u201326<\/span>).<\/p>`\n      ]);\n      input.value = '';\n    }\n\n    function streamChunksIntoGuide(chunks) {\n      if (activeStreamTimer) clearInterval(activeStreamTimer);\n      const prose = document.getElementById('streamedProse');\n      const status = document.getElementById('streamStatusText');\n      status.textContent = 'Streaming answer with Scripture\u2026';\n      prose.innerHTML = '';\n      let idx = 0;\n      activeStreamTimer = setInterval(() => {\n        if (idx < chunks.length) {\n          prose.innerHTML += chunks[idx];\n          idx++;\n        } else {\n          clearInterval(activeStreamTimer);\n          activeStreamTimer = null;\n          status.textContent = 'Anchored in Scripture';\n        }\n      }, 220);\n    }\n\n    // 11. Bottom Navigation Active State & Scroll Spy\n    function setActiveTab(tabEl) {\n      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));\n      tabEl.classList.add('active');\n    }\n\n    window.addEventListener('scroll', () => {\n      const sections = ['screen-home', 'screen-reader', 'screen-stillness', 'screen-ask', 'screen-journey'];\n      let current = 'screen-home';\n      for (const id of sections) {\n        const el = document.getElementById(id);\n        if (el && el.getBoundingClientRect().top <= 220) {\n          current = id;\n        }\n      }\n      document.querySelectorAll('.nav-tab').forEach(t => {\n        t.classList.toggle('active', t.getAttribute('data-target') === current);\n      });\n    }, { passive: true });\n  <\/script>\n<\/body>\n<\/html>\n<!--\n  Idea: \"The Living Codex & The Three Breaths\" \u2014 instead of splitting 9 devotional tools across a utility grid, Home flows as a three-breath liturgical cadence (Today's Word with a Hebrew peek, the Priestly Blessing in Hebrew and English, and a Gentle Prompt tied to yesterday's reflection).\n  In the Bible Reader, flipping on Study Mode transforms the chapter into a \"Living Margin\" codex\u2014illuminating stanza outlines, inline Hebrew roots (harp\u016b, yada\u2018, shalom), and a three-layer Verse Study (Context, Meaning, Deeper Lens) right inside the text alongside verse-tied journaling, prayer weaving, stillness, and streamed Scripture counsel.\n-->"}, {"letter": "F", "seat": "astra", "file": "mockup.html", "html": "<!-- Model: GPT-6.2 Astra -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>Eliana\u2019s Rhythm<\/title>\n<style>\n:root{--paper:#f8f5ed;--ink:#303d32;--muted:#777c70;--line:#dddfd2;--rust:#aa553c;--sage:#e9eddf;--serif:Georgia,'Times dding:3px}.switch:after{content:'';display:block;width:13px;height:13px;background:var(--paper);border-radius:50%;transition:transform .2s}.toggle[aria-pressed=true] .switch{background:var(--ink)}.toggle[aria-pressed=true] .switch:after{transform:translateX(13px)}.chapter-head{text-align:center;padding:30px 0 23px}.chapter-head h1{font-size:37px;margin:10px 0}.chapter-head p{font:italic 14px var(--serif);color:var(--muted)}.scripture{font:20px/1.75 var(--serif)}.scripture p{margin-bottom:19px}.scripture sup{font:9px Arial;color:var(--rust);margin-right:9px;vertical-align:super}.verse-select{text-align:left;display:block;padding:13px 16px;margin:5px -16px 17px;width:calc(100% + 32px);font:inherit;border-radius:2px}.verse-select.selected{background:var(--sage);border-left:2px solid #87916f}.verse-select span{font:9px Arial;color:#69715c;display:block;letter-spacing:1.3px;margin:8px 0 0 19px}.lens{padding:19px;background:#eeeee3;border:1px solid #dce0cf;border-radius:3px;margin:0 -5px 25px}.lens-heading>svg{width:18px;height:18px}.lens-heading{display:flex;align-items:center;justify-content:space-between}.lens-heading .eyebrow{color:#536347}.tabs{display:flex;border-bottom:1px solid #d5dac9;margin-top:13px;gap:21px}.tabs button{font-size:11px;padding:12px 0;color:var(--muted)}.tabs button.active{color:var(--ink);border-bottom:2px solid var(--ink)}.lens h3{margin-top:18px;font-size:22px}.lens p{font-size:12px;line-height:1.85;margin:9px 0;color:#606b57}.hebrew-word{font:29px var(--serif);margin-top:17px}.lens .fine{font-size:10px;color:#79816f}.reader-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:20px 0}.reader-foot button{font-size:12px}.primary{background:var(--ink);color:var(--paper);padding:15px 20px;border-radius:3px;display:flex;justify-content:center;align-items:center;gap:10px;width:100%;font-size:12px}.primary svg{width:16px;height:16px}.intro{margin:20px 0 25px}.intro h1{margin:12px 0}.journal-card{padding:22px;border:1px solid var(--line);margin:20px 0}.journal-card p{font:20px/1.5 var(--serif);margin:14px 0}.tag{font-size:10px;background:var(--sage);padding:7px 10px;display:inline-block}textarea,input{width:100%;border:1px solid var(--line);background:transparent;color:var(--ink);padding:15px;border-radius:3px;outline-color:var(--rust)}textarea{resize:vertical;min-height:150px;line-height:1.6;margin:18px 0}.chat-answer{font:19px/1.6 var(--serif);margin:25px 0}.suggestion{padding:17px;text-align:left;border:1px solid var(--line);width:100%;margin:10px 0;font:18px/1.4 var(--serif)}.week{display:flex;justify-content:space-between;margin:25px 0}.day{text-align:center;font-size:10px;color:var(--muted)}.day i{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:var(--sage);margin-top:10px;font-style:normal}.day i.filled{background:#677354;color:var(--paper)}dialog{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:28px;max-width:350px;width:calc(100% - 36px)}dialog::backdrop{background:#27352866;backdrop-filter:blur(5px)}dialog h2{margin:15px 0}dialog p{line-height:1.7;color:var(--muted)}.close{float:right;padding:0;font-size:23px}.breath{width:135px;height:135px;background:var(--sage);border:1px solid #bec7ad;border-radius:50%;margin:30px auto;display:grid;place-items:center;font:20px var(--serif)}.breathing{animation:breathe 8s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.2);background:#dce4ce}}.settings-row{display:flex;justify-content:space-between;align-items:center;margin:25px 0}.settings-row button{border:1px solid var(--line);padding:9px 15px}.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 20px;border-radius:4px;font-size:12px;z-index:30;white-space:nowrap}.large .scripture{font-size:24px}.contrast{--paper:#fffef9;--ink:#142619;--muted:#4b5046;--line:#89917e}.hidden{display:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}\n<\/style>\n<\/head>\n<body>\n<svg style=\"display:none\" xmlns=\"http://www.w3.org/2000/svg\"><defs>\n<symbol id=\"sun\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5\"/><\/symbol>\n<symbol id=\"book\" viewBox=\"0 0 24 24\"><path d=\"M12 5v16M3 4c4-1 6 0 9 1 3-1 5-2 9-1v15c-4-1-6 0-9 2-3-2-5-3-9-2Z\"/><\/symbol>\n<symbol id=\"pen\" viewBox=\"0 0 24 24\"><path d=\"m5 16-1 4 4-1L20 7l-3-3Zm9-9 3 3M12 21h9\"/><\/symbol>\n<symbol id=\"path\" viewBox=\"0 0 24 24\"><path d=\"M5 20h10a4 4 0 0 0 0-8H9a4 4 0 0 1 0-8h7\"/><circle cx=\"18\" cy=\"4\" r=\"2\"/><circle cx=\"4\" cy=\"20\" r=\"1\"/><\/symbol>\n<symbol id=\"chat\" viewBox=\"0 0 24 24\"><path d=\"M20 15a3 3 0 0 1-3 3H8l-5 3V6a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3Z\"/><path d=\"M7 8h9M7 12h6\"/><\/symbol>\n<symbol id=\"arrow\" viewBox=\"0 0 24 24\"><path d=\"M4 12h15m-5-5 5 5-5 5\"/><\/symbol>\n<symbol id=\"leaf\" viewBox=\"0 0 24 24\"><path d=\"M5 20c0-7 6-12 13-16 3 10-2 15-10 13M5 20l8-9\"/><\/symbol>\n<symbol id=\"heart\" viewBox=\"0 0 24 24\"><path d=\"M12 20S2 14 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 6-10 12-10 12Z\"/><\/symbol>\n<symbol id=\"bookmark\" viewBox=\"0 0 24 24\"><path d=\"M6 3h12v18l-6-4-6 4Z\"/><\/symbol>\n<\/defs><\/svg>\n<div id=\"app\"><header><div class=\"brand\"><svg viewBox=\"0 0 26 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"><path d=\"M13 29V6m0 13C3 19 3 12 3 12s10-1 10 7Zm0-7C22 12 23 4 23 4S13 4 13 12Zm0 13c8 0 10-7 10-7s-10 0-10 7Z\"/><\/svg>eliana\u2019s rhythm<\/div><button class=\"avatar\" onclick=\"settings()\" aria-label=\"Open settings\">M<\/button><\/header><main id=\"content\"><\/main><nav aria-label=\"Main navigation\" id=\"nav\"><\/nav><\/div>\n<dialog id=\"modal\"><\/dialog><div id=\"toast\" class=\"toast hidden\" role=\"status\"><\/div>\n<script>\nconst $=s=>document.querySelector(s);const icon=(name,cls='')=>`<svg class=\"${cls}\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><use href=\"#${name}\"/><\/svg>`;\nlet page='home',study=true,tab='context',saved=false,timer=null;let entries=[];try{entries=JSON.parse(localStorage.getItem('eliana-reflections')||'[]')}catch(e){}\nconst navs=[['home','sun','Today'],['reader','book','Scripture'],['ask','chat','Ask'],['journal','pen','Journal'],['journey','path','Journey']];\nfunction go(p){page=p;render();window.scrollTo(0,0)}\nfunction render(){ $('#nav').innerHTML=navs.map(([p,i,t])=>`<button class=\"${page===p?'active':''}\" ${page===p?'aria-current=\"page\"':''} onclick=\"go('${p}')\">${icon(i)}${t}<\/button>`).join('');$('#content').innerHTML=`<div class=\"page\">${views[page]()}<\/div>`}\nfunction step(i,title,sub,action){return `<button class=\"step\" onclick=\"${action}\"><span class=\"step-icon\">${icon(i)}<\/span><span class=\"step-copy\"><h3>${title}<\/h3><p>${sub}<\/p><\/span>${icon('arrow','arrow')}<\/button>`}\nconst views={home:()=>`<div class=\"greeting\"><div class=\"eyebrow\">Thursday, November 19<\/div><h1>A little room<br>for God.<\/h1><p class=\"sub\">Come as you are, Michael. Begin here.<\/p><\/div>\n<section class=\"verse-card\"><div class=\"eyebrow\">A word for today<\/div><svg class=\"landscape\" viewBox=\"0 0 300 116\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"151\" cy=\"53\" r=\"29\" fill=\"#bd704c\"/><path d=\"M151 11V3m-43 20-7-7m100 7 7-7M94 54H83m125 0h11\" stroke=\"#b77753\" stroke-width=\"1\"/><path d=\"M-12 90c49-32 76-27 116-6s78 27 124-3 62-23 85-12\" fill=\"#d5dcc7\"/><path d=\"M-10 103c58-31 93-25 145-9s107-11 178-6\" stroke=\"#8b977b\"/><path d=\"M-10 112c61-23 101-14 140-7s115-16 185-5\" stroke=\"#b0b99f\"/><path d=\"M-10 79c44-11 80-13 116 5s71 22 107 5\" stroke=\"#879477\"/><\/svg><blockquote>\u201cBe still, and know<br>that I am God.\u201d<\/blockquote><div class=\"verse-bottom\"><span class=\"reference\">Psalm 46:10<\/span><button class=\"text-link\" onclick=\"go('reader')\">Sit with this ${icon('arrow')}<\/button><\/div><\/section>\n<div class=\"section-title\"><h2>Your daily rhythm<\/h2><span class=\"eyebrow\">No hurry. Just presence.<\/span><\/div><div class=\"rhythm\">${step('book','Receive the Word','Psalm 46 \u00b7 a refuge in the noise',\"go('reader')\")}${step('leaf','Find a little stillness','One quiet minute with God','stillness()')}${step('pen','Let your heart speak','A prayer, a thought, a beginning',\"go('journal')\")}<\/div><section class=\"blessing\"><div class=\"eyebrow\">A blessing to carry<\/div><p>\u201cThe LORD bless thee,<br>and keep thee.\u201d<\/p><div class=\"hebrew\" lang=\"he\" dir=\"rtl\">\u05d9\u05b0\u05d1\u05b8\u05e8\u05b6\u05db\u05b0\u05da\u05b8 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05d5\u05b0\u05d9\u05b4\u05e9\u05b0\u05c1\u05de\u05b0\u05e8\u05b6\u05da\u05b8<\/div><br><small>NUMBERS 6:24 \u00b7 KJV<\/small><\/section><p class=\"bottom-note\">Grace meets you here, every day.<\/p>`,\nreader:()=>`<div class=\"reader-top\"><button onclick=\"chapterPicker()\">Psalms <span style=\"font:13px Arial\">\u2304<\/span><\/button><button class=\"version\" onclick=\"toast('King James Version \u00b7 public domain')\">KJV<\/button><\/div><div class=\"study-bar\"><span>READ SLOWLY. NOTICE WHAT STAYS.<\/span><button class=\"toggle\" aria-pressed=\"${study}\" onclick=\"study=!study;render()\">Study <span class=\"switch\"><\/span><\/button><\/div><div class=\"chapter-head\"><div class=\"eyebrow\">The book of Psalms<\/div><h1>Psalm 46<\/h1><p>God is our refuge and strength.<\/p><\/div><div class=\"scripture\"><p><sup>1<\/sup>God is our refuge and strength, a very present help in trouble.<\/p><p><sup>2<\/sup>Therefore will not we fear, though the earth be removed, and though the mountains be carried into the midst of the sea;<\/p><p><sup>3<\/sup>Though the waters thereof roar and be troubled, though the mountains shake with the swelling thereof. Selah.<\/p><button class=\"text-link\" style=\"margin:0 auto 20px;color:var(--muted)\" onclick=\"document.getElementById('middle').classList.toggle('hidden');this.textContent=this.textContent.includes('Show')?'Hide verses 4\u20139':'Show verses 4\u20139'\">Show verses 4\u20139<\/button><div id=\"middle\" class=\"hidden\"><p><sup>4<\/sup>There is a river, the streams whereof shall make glad the city of God, the holy place of the tabernacles of the most High.<\/p><p><sup>5<\/sup>God is in the midst of her; she shall not be moved: God shall help her, and that right early.<\/p><p><sup>6<\/sup>The heathen raged, the kingdoms were moved: he uttered his voice, the earth melted.<\/p><p><sup>7<\/sup>The LORD of hosts is with us; the God of Jacob is our refuge. Selah.<\/p><p><sup>8<\/sup>Come, behold the works of the LORD, what desolations he hath made in the earth.<\/p><p><sup>9<\/sup>He maketh wars to cease unto the end of the earth; he breaketh the bow, and cutteth the spear in sunder; he burneth the chariot in the fire.<\/p><\/div><button class=\"verse-select ${study?'selected':''}\" onclick=\"study=!study;render()\" aria-label=\"${study?'Close':'Study'} verse 10\"><sup>10<\/sup>Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.${study?'<span>VERSE 10 \u00b7 A MOMENT TO GO DEEPER<\/span>':''}<\/button><\/div>${study?lens():''}<div class=\"scripture\"><p><sup>11<\/sup>The LORD of hosts is with us; the God of Jacob is our refuge. Selah.<\/p><\/div><div class=\"reader-foot\"><button onclick=\"saved=!saved;render();toast(saved?'Psalm 46:10 saved':'Verse removed from saved')\">${saved?'\u2713 Saved verse':'\uff0b Save verse'}<\/button><button onclick=\"go('journal')\">Reflect on this \u2197<\/button><\/div>`,\nask:()=>`<div class=\"intro\"><div class=\"eyebrow\">Scripture & conversation<\/div><h1>Bring your<br>questions.<\/h1><p class=\"sub\">There\u2019s room for the unfinished ones, too.<\/p><\/div><button class=\"

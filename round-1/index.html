x}\n.themes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}\n.themes button{min-height:44px;padding:0 14px 0 10px;border-radius:22px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-size:14px;background:var(--surface)}\n.themes button i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(128,128,128,.5)}\n.themes button[aria-pressed=\"true\"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}\ninput[type=range]{accent-color:var(--accent);width:150px;height:44px}\n\n/* ---------- Nav ---------- */\nnav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px 14px;\n  background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);transition:background-color .7s}\nnav button{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:600}\nnav button[aria-current=\"page\"]{color:var(--accent)}\nbody[data-screen=\"still\"] nav{display:none}\n\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}\n}\n<\/style>\n<\/head>\n<body data-screen=\"today\">\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-sun\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4\"/><\/symbol>\n  <symbol id=\"i-book\" viewBox=\"0 0 24 24\"><path d=\"M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5v13\"/><\/symbol>\n  <symbol id=\"i-ask\" viewBox=\"0 0 24 24\"><path d=\"M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 3.5V17A2.5 2.5 0 0 1 4 14.5z\"/><\/symbol>\n  <symbol id=\"i-path\" viewBox=\"0 0 24 24\"><path d=\"M3 15c3 0 3-6 6-6s3 6 6 6 3-6 6-6\"/><circle cx=\"9\" cy=\"9\" r=\"1.2\"/><circle cx=\"15\" cy=\"15\" r=\"1.2\"/><\/symbol>\n  <symbol id=\"i-mark\" viewBox=\"0 0 24 24\"><path d=\"M7 4h10v16l-5-4-5 4z\"/><\/symbol>\n  <symbol id=\"i-pray\" viewBox=\"0 0 24 24\"><path d=\"M12 4v16M7.5 9h9\"/><\/symbol>\n  <symbol id=\"i-pen\" viewBox=\"0 0 24 24\"><path d=\"M5 19l1-4L16.5 4.5l3 3L9 18zM14.5 6.5l3 3\"/><\/symbol>\n  <symbol id=\"i-still\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><circle cx=\"12\" cy=\"12\" r=\"3.5\"/><\/symbol>\n  <symbol id=\"i-chev\" viewBox=\"0 0 24 24\"><path d=\"M7 10l5 5 5-5\"/><\/symbol>\n  <symbol id=\"i-left\" viewBox=\"0 0 24 24\"><path d=\"M14 6l-6 6 6 6\"/><\/symbol>\n  <symbol id=\"i-right\" viewBox=\"0 0 24 24\"><path d=\"M10 6l6 6-6 6\"/><\/symbol>\n  <symbol id=\"i-up\" viewBox=\"0 0 24 24\"><path d=\"M12 19V6M6.5 11.5 12 6l5.500 5.500\"/><\/symbol>\n  <symbol id=\"i-lock\" viewBox=\"0 0 24 24\"><rect x=\"5.500\" y=\"10.500\" width=\"13\" height=\"9\" rx=\"2\"/><path d=\"M8.500 10.500V8a3.500 3.500 0 0 1 7 0v2.500\"/><\/symbol>\n<\/svg>\n\n<!-- ================= TODAY ================= -->\n<main class=\"screen on\" id=\"today\">\n  <div class=\"sky\"><\/div>\n  <div class=\"top\">\n    <div>\n      <p class=\"eyebrow\" id=\"date\">Thursday, 19 November<\/p>\n      <h1 id=\"greet\">Good morning<\/h1>\n    <\/div>\n    <button class=\"iconbtn\" aria-label=\"Saved verses\" onclick=\"go('journey')\"><svg class=\"ic\"><use href=\"#i-mark\"/><\/svg><\/button>\n  <\/div>\n\n  <div class=\"arc\" aria-hidden=\"true\">\n    <svg viewBox=\"0 0 358 86\">\n      <line class=\"hz\" x1=\"0\" y1=\"58\" x2=\"358\" y2=\"58\"/>\n      <path class=\"path\" d=\"M0 66 C18 62 30 50 44.750 44 S100 16 134.250 16 S198 28 223.750 44 S282 72 313.250 72 S346 66 358 62\"/>\n      <circle class=\"halo\" id=\"halo\" cx=\"44.750\" cy=\"44\" r=\"15\"/>\n      <circle class=\"node\" cx=\"44.750\" cy=\"44\" r=\"5\"/>\n      <circle class=\"node\" cx=\"134.250\" cy=\"16\" r=\"5\"/>\n      <circle class=\"node\" cx=\"223.750\" cy=\"44\" r=\"5\"/>\n      <circle class=\"node\" cx=\"313.250\" cy=\"72\" r=\"5\"/>\n    <\/svg>\n  <\/div>\n  <div class=\"hours\" role=\"group\" aria-label=\"The hours of the day\">\n    <button data-h=\"morning\"><b>Morning<\/b><span>Receive<\/span><\/button>\n    <button data-h=\"midday\"><b>Midday<\/b><span>Read<\/span><\/button>\n    <button data-h=\"evening\"><b>Evening<\/b><span>Reflect<\/span><\/button>\n    <button data-h=\"night\"><b>Night<\/b><span>Rest<\/span><\/button>\n  <\/div>\n  <p class=\"hint\">The app follows your clock. Tap an hour to see the others.<\/p>\n\n  <section class=\"verse\">\n    <p class=\"eyebrow\">Today's verse<\/p>\n    <blockquote style=\"margin-top:10px\">Be still, and know that I&nbsp;am&nbsp;God.<\/blockquote>\n    <div class=\"ref\"><span>Psalm 46:10<\/span>\n      <button onclick=\"openStudy(10)\">Look closer <svg class=\"ic\" style=\"width:18px;height:18px\"><use href=\"#i-right\"/><\/svg><\/button><\/div>\n  <\/section>\n\n  <section class=\"next\" aria-live=\"polite\">\n    <p class=\"eyebrow\" id=\"nEyebrow\"><\/p>\n    <h2 id=\"nTitle\"><\/h2>\n    <p id=\"nSub\"><\/p>\n    <div class=\"acts\" id=\"nActs\"><\/div>\n  <\/section>\n\n  <section class=\"bless\">\n    <p class=\"eyebrow\">A blessing to carry<\/p>\n    <div class=\"heb\" lang=\"he\">\n      <span>\u05d9\u05b0\u05d1\u05b8\u05e8\u05b6\u05db\u05b0\u05da\u05b8 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05d5\u05b0\u05d9\u05b4\u05e9\u05b0\u05c1\u05de\u05b0\u05e8\u05b6\u05da\u05b8<\/span>\n      <span>\u05d9\u05b8\u05d0\u05b5\u05e8 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05e4\u05b8\u05bc\u05e0\u05b8\u05d9\u05d5 \u05d0\u05b5\u05dc\u05b6\u05d9\u05da\u05b8 \u05d5\u05b4\u05d9\u05d7\u05bb\u05e0\u05b6\u05bc\u05da\u05b8\u05bc<\/span>\n      <span>\u05d9\u05b4\u05e9\u05b8\u05bc\u05c2\u05d0 \u05d9\u05b0\u05d4\u05d5\u05b8\u05d4 \u05e4\u05b8\u05bc\u05e0\u05b8\u05d9\u05d5 \u05d0\u05b5\u05dc\u05b6\u05d9\u05da\u05b8 \u05d5\u05b0\u05d9\u05b8\u05e9\u05b5\u05c2\u05dd \u05dc\u05b0\u05da\u05b8 \u05e9\u05b8\u05c1\u05dc\u05d5\u05b9\u05dd<\/span>\n    <\/div>\n    <div class=\"en\">\n      <span>The Lord bless you and keep you.<\/span>\n      <span>The Lord make his face shine on you and be gracious to you.<\/span>\n      <span>The Lord lift up his face toward you and give you peace.<\/span>\n    <\/div>\n    <small>Numbers 6:24\u201326. In Hebrew the lines grow: three words, then five, then seven.<\/small>\n  <\/section>\n\n  <div class=\"rule\"><\/div>\n  <div class=\"also\">\n    <button onclick=\"go('prayer')\"><svg class=\"ic\"><use href=\"#i-pray\"/><\/svg>Prayer<\/button>\n    <button onclick=\"go('journal')\"><svg class=\"ic\"><use href=\"#i-pen\"/><\/svg>Journal<\/button>\n    <button onclick=\"go('still')\"><svg class=\"ic\"><use href=\"#i-still\"/><\/svg>Stillness<\/button>\n  <\/div>\n  <button class=\"askline\" onclick=\"go('ask')\"><svg class=\"ic\"><use href=\"#i-ask\"/><\/svg>Ask a question about faith<\/button>\n<\/main>\n\n<!-- ================= BIBLE ================= -->\n<main class=\"screen\" id=\"bible\">\n  <div class=\"rhead\">\n    <button class=\"where\" onclick=\"sheet(true)\" aria-label=\"Psalms chapter 46, change book or chapter\">Psalms 46 <svg class=\"ic\" style=\"width:18px;height:18px\"><use href=\"#i-chev\"/><\/svg><small>WEB<\/small><\/button>\n    <button class=\"switch\" id=\"studySw\" role=\"switch\" aria-checked=\"false\" onclick=\"setStudy(!studyOn)\">Study <i><\/i><\/button>\n  <\/div>\n  <h2 class=\"ptitle\">Psalm 46<\/h2>\n  <p class=\"psub\">For the sons of Korah. A song.<\/p>\n  <p class=\"studynote\">Tap any verse. A dot marks one with notes underneath it.<\/p>\n\n  <div class=\"text\" id=\"text\">\n    <div class=\"stanza\">\n      <span class=\"v has\" data-v=\"1\"><sup>1<\/sup>God is our refuge and strength, a very present help in trouble. <\/span>\n      <span class=\"v\" data-v=\"2\"><sup>2<\/sup>Therefore we won't be afraid, though the earth changes, though the mountains are shaken into the heart of the seas; <\/span>\n      <span class=\"v\" data-v=\"3\"><sup>3<\/sup>though its waters roar and are troubled, though the mountains tremble with their swelling. <span class=\"selah\">Selah.<\/span> <\/span>\n    <\/div>\n    <div class=\"stanza\">\n      <span class=\"v\" data-v=\"4\"><sup>4<\/sup>There is a river, the streams of which make the city of God glad, the holy place of the tabernacles of the Most High. <\/span>\n      <span class=\"v has\" data-v=\"5\"><sup>5<\/sup>God is within her. She shall not be moved. God will help her at dawn. <\/span>\n      <span class=\"v\" data-v=\"6\"><sup>6<\/sup>The nations raged. The kingdoms were moved. He lifted his voice and the earth melted. <\/span>\n      <span class=\"v\" data-v=\"7\"><sup>7<\/sup>Yahweh of Armies is with us. The God of Jacob is our refuge. <span class=\"selah\">Selah.<\/span> <\/span>\n    <\/div>\n    <div class=\"stanza\">\n      <span class=\"v\" data-v=\"8\"><sup>8<\/sup>Come, see Yahweh's works, what desolations he has made in the earth. <\/span>\n      <span class=\"v\" data-v=\"9\"><sup>9<\/sup>He makes wars cease to the end of the earth. He breaks the bow, and shatters the spear. He burns the chariots in the fire. <\/span>\n      <span class=\"v has\" data-v=\"10\"><sup>10<\/sup>\"Be still, and know that I am God. I will be exalted among the nations. I will be exalted in the earth.\" <\/span>\n      <span class=\"v\" data-v=\"11\"><sup>11<\/sup>Yahweh of Armies is with us. The God of Jacob is our refuge. <span class=\"selah\">Selah.<\/span> <\/span>\n    <\/div>\n  <\/div>\n\n  <div class=\"panel\" id=\"panel\">\n    <div id=\"layersWrap\">\n      <div class=\"layers\" role=\"tablist\">\n        <button role=\"tab\" data-l=\"context\">Context<\/button>\n        <button role=\"tab\" data-l=\"meaning\">Meaning<\/button>\n        <button role=\"tab\" data-l=\"lens\">Deeper Lens<\/button>\n      <\/div>\n      <div class=\"layer\" id=\"layer\"><\/div>\n    <\/div>\n    <div class=\"vacts\">\n      <button class=\"chip\" onclick=\"go('ask')\"><svg class=\"ic\"><use href=\"#i-ask\"/><\/svg>Ask<\/button>\n      <button class=\"chip\" onclick=\"go('prayer')\"><svg class=\"ic\"><use href=\"#i-pray\"/><\/svg>Pray<\/button>\n      <button class=\"chip\" onclick=\"go('journal')\"><svg class=\"ic\"><use href=\"#i-pen\"/><\/svg>Journal<\/button>\n      <button class=\"chip\" id=\"saveBtn\" onclick=\"toggleSave(this)\" aria-pressed=\"false\"><svg class=\"ic\"><use href=\"#i-mark\"/><\/svg><span>Save<\/span><\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"pager\">\n    <button><svg class=\"ic\" style=\"width:18px;height:18px\"><use href=\"#i-left\"/><\/svg>Psalm 45<\/button>\n    <button>Psalm 47<svg class=\"ic\" style=\"width:18px;height:18px\"><use href=\"#i-right\"/><\/svg><\/button>\n  <\/div>\n<\/main>\n\n<div class=\"scrim\" id=\"scrim\" onclick=\"sheet(false)\"><\/div>\n<div class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-label=\"Choose book and chapter\">\n  <div class=\"grab\"><\/div>\n  <p class=\"eyebrow\">Book<\/p>\n  <div class=\"books\">\n    <button class=\"chip\">Job<\/button><button class=\"chip on\">Psalms<\/button><button class=\"chip\">Proverbs<\/button>\n    <button class=\"chip\">Ecclesiastes<\/button><button class=\"chip\">Song of Songs<\/button><button class=\"chip\">Isaiah<\/button>\n    <button class=\"chip\">All 66 books<\/button>\n  <\/div>\n  <p class=\"eyebrow\">Chapter<\/p>\n  <div class=\"chs\" id=\"chs\"><\/div>\n<\/div>\n\n<!-- ================= ASK ================= -->\n<main class=\"screen\" id=\"ask\">\n  <h2 class=\"h\" style=\"padding-top:22px\">Ask<\/h2>\n  <p class=\"lede\">A guide that answers from Scripture and shows you where.<\/p>\n  <div class=\"q\">How do I forgive someone who isn't sorry?<\/div>\n  <div class=\"answer\" id=\"answer\">\n    <p>That is one of the hardest things Jesus asks, and Scripture does not pretend otherwise.<\/p>\n    <p>It helps to separate two things the Bible treats differently. Forgiveness is a debt you release before God. Reconciliation is a relationship two people rebuild, and that part does wait on repentance <button class=\"refc\">Luke 17:3<\/button>. You can begin the first without the second.<\/p>\n    <p>Jesus prayed \"Father, forgive them\" while the people hurting him were still at it <button class=\"refc\">Luke 23:34<\/button>. And Paul puts justice in God's hands, not yours: \"Don't seek revenge yourselves\" <button class=\"refc\">Romans 12:19<\/button>. Forgiving is not saying it didn't matter. It is handing the account to the One who judges rightly.<\/p>\n    <p>It is rarely done once. Peter asked how many times, and Jesus answered \"seventy times seven\" <button class=\"refc\">Matthew 18:21\u201322<\/button>. Some days forgiveness is simply praying it again.<\/p>\n  <\/div>\n  <div class=\"forming\" id=\"forming\"><i><\/i>Forming an answer<\/div>\n  <div class=\"after\" id=\"after\">\n    <div class=\"vacts\">\n      <button class=\"chip\" onclick=\"go('prayer')\"><svg class=\"ic\"><use href=\"#i-pray\"/><\/svg>Pray about this<\/button>\n      <button class=\"chip\" onclick=\"go('journal')\"><svg class=\"ic\"><use href=\"#i-pen\"/><\/svg>Keep in journal<\/button>\n      <button class=\"chip\"><svg class=\"ic\"><use href=\"#i-book\"/><\/svg>Read Matthew 18<\/button>\n    <\/div>\n    <small>A guide, not a pastor. Tap any reference to read it in full and weigh the answer against it.<\/small>\n  <\/div>\n<\/main>\n<div class=\"composer\">\n  <input type=\"text\" placeholder=\"Ask a follow-up\" aria-label=\"Ask a follow-up\">\n  <button aria-label=\"Send\"><svg class=\"ic\"><use href=\"#i-up\"/><\/svg><\/button>\n<\/div>\n\n<!-- ================= PRAYER ================= -->\n<main class=\"screen\" id=\"prayer\">\n  <button class=\"back\" onclick=\"back()\"><svg class=\"ic\"><use href=\"#i-left\"/><\/svg>Back<\/button>\n  <h2 class=\"h\">What is on your heart?<\/h2>\n  <p class=\"lede\">Say it plainly. A prayer will be written from your words.<\/p>\n  <textarea class=\"field\" id=\"share\" aria-label=\"What you want to pray about\">Anxious about Thursday's presentation. I keep rehearsing everything that could go wrong.<\/textarea>\n  <div style=\"margin-top:14px\"><button class=\"btn\" id=\"prayBtn\" onclick=\"writePrayer()\">Write my prayer<\/button><\/div>\n  <div class=\"prayer\" id=\"prayerOut\">\n    <p class=\"eyebrow\" style=\"margin-bottom:12px\">A prayer for you<\/p>\n    <p>Father, you already see Thursday. I bring you the rehearsing, the what-ifs, the tightness in my chest.<\/p>\n    <p>You tell me to be anxious in nothing and to bring you everything, so here it is, all of it. Give me clear words and a quiet mind. Let me do the work faithfully and leave the outcome with you.<\/p>\n    <p>Guard my heart with the peace that is beyond my understanding. In Jesus' name, amen.<\/p>\n    <button class=\"tied\" style=\"margin-top:14px\"><svg class=\"ic\"><use href=\"#i-book\"/><\/svg>Drawn from Philippians 4:6\u20137<\/button>\n    <div class=\"vacts\">\n      <button class=\"chip\" onclick=\"go('journal')\"><svg class=\"ic\"><use href=\"#i-pen\"/><\/svg>Keep in journal<\/button>\n      <button class=\"chip\" onclick=\"go('still')\"><svg class=\"ic\"><use href=\"#i-still\"/><\/svg>Sit with it<\/button>\n    <\/div>\n  <\/div>\n<\/main>\n\n<!-- ================= JOURNAL ================= -->\n<main class=\"screen\" id=\"journal\">\n  <button class=\"back\" onclick=\"back()\"><svg class=\"ic\"><use href=\"#i-left\"/><\/svg>Back<\/button>\n  <h2 class=\"h\">Journal<\/h2>\n  <p class=\"private\"><svg class=\"ic\"><use href=\"#i-lock\"/><\/svg>Private. Yours alone.<\/p>\n  <textarea class=\"field\" style=\"min-height:96px\" placeholder=\"What stayed with you today?\" aria-label=\"New journal entry\"><\/textarea>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:10px\">\n    <button class=\"tied\"><svg class=\"ic\"><use href=\"#i-book\"/><\/svg>Tied to Psalm 46:10<\/button>\n    <button class=\"btn\" style=\"min-height:44px\">Keep<\/button>\n  <\/div>\n  <div style=\"margin-top:18px;border-top:1px solid var(--line)\">\n    <article class=\"entry\"><time>WEDNESDAY 18 NOVEMBER \u00b7 EVENING<\/time>\n      <p>Felt anxious about work today, read Philippians 4:6 and sat with it.<\/p>\n      <button class=\"tied\"><svg class=\"ic\"><use href=\"#i-book\"/><\/svg>Philippians 4:6<\/button><\/article>\n    <article class=\"entry\"><time>SUNDAY 15 NOVEMBER \u00b7 NIGHT<\/time>\n      <p>The blessing again before bed. \"Give you peace\" landed differently after this week.<\/p>\n      <button class=\"tied\"><svg class=\"ic\"><use href=\"#i-book\"/><\/svg>Numbers 6:26<\/button><\/article>\n    <article class=\"entry\"><time>THURSDAY 12 NOVEMBER \u00b7 MORNING<\/time>\n      <p>Asked about forgiveness. I am not there yet, but I prayed it once today.<\/p>\n      <button class=\"tied\"><svg class=\"ic\"><use href=\"#i-book\"/><\/svg>Matthew 18:21\u201322<\/button><\/article>\n  <\/div>\n<\/main>\n\n<!-- ================= STILLNESS ================= -->\n<main class=\"screen\" id=\"still\">\n  <button class=\"back\" style=\"align-self:flex-start;margin-left:-14px\" onclick=\"stopStill();back()\"><svg class=\"ic\"><use href=\"#i-left\"/><\/svg>Leave quietly<\/button>\n  <div class=\"breath\" id=\"breath\"><i><\/i><i><\/i><span id=\"breathLbl\">Five breaths<\/span><\/div>\n  <p class=\"mantra\" id=\"mantra\">Be still, and know that I am God.<\/p>\n  <div class=\"steps\" id=\"steps\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/div>\n  <button class=\"btn\" id=\"stillBtn\" onclick=\"startStill()\">Begin<\/button>\n  <p class=\"lede\" style=\"margin-top:18px;max-width:28ch\" id=\"stillNote\">Each breath, the verse lets go of a few words, until only one is left.<\/p>\n<\/main>\n\n<!-- ================= JOURNEY ================= -->\n<main class=\"screen\" id=\"journey\">\n  <h2 class=\"h\" style=\"padding-top:22px\">Journey<\/h2>\n  <p class=\"lede\" id=\"jSummary\"><\/p>\n  <div class=\"sec\" style=\"margin-top:22px\">\n    <h3>The last four weeks<\/h3>\n    <div class=\"grid28\" id=\"grid\"><\/div>\n    <div class=\"legend\"><span>Each column is a day: morning, midday, evening, night.<\/span><\/div>\n    <p class=\"lede\" style=\"margin-top:10px;max-width:none;font-size:14px\">No streak to break. An empty day is just a rest in the music.<\/p>\n  <\/div>\n  <div class=\"sec\">\n    <h3>Where you have read<\/h3>\n    <div class=\"bar\"><div><span>Psalms<\/span><span>46 of 150<\/span><\/div><u><b style=\"width:30.7%\"><\/b><\/u><\/div>\n    <div class=\"bar\"><div><span>John<\/span><span>9 of 21<\/span><\/div><u><b style=\"width:42.9%\"><\/b><\/u><\/div>\n    <div class=\"bar\"><div><span>Philippians<\/span><span>4 of 4<\/span><\/div><u><b style=\"width:100%\"><\/b><\/u><\/div>\n  <\/div>\n  <div class=\"sec\">\n    <h3>Saved verses<\/h3>\n    <button class=\"saved\" onclick=\"openStudy(10)\"><q>Be still, and know that I am God.<\/q><span>Psalm 46:10<\/span><\/button>\n    <button class=\"saved\"><q>In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God.<\/q><span>Philippians 4:6<\/span><\/button>\n  <\/div>\n  <div class=\"sec\">\n    <h3>Look<\/h3>\n    <div class=\"themes\" id=\"themes\">\n      <button data-t=\"auto\"><i style=\"background:conic-gradient(#F2C4A8 0 25%,#CFE3DC 0 50%,#DDB3C2 0 75%,#22305A 0)\"><\/i>Follow the hour<\/button>\n      <button data-t=\"dawn\"><i style=\"background:#F2C4A8\"><\/i>Dawn<\/button>\n      <button data-t=\"day\"><i style=\"background:#CFE3DC\"><\/i>Day<\/button>\n      <button data-t=\"dusk\"><i style=\"background:#DDB3C2\"><\/i>Dusk<\/button>\n      <button data-t=\"night\"><i style=\"background:#22305A\"><\/i>Night<\/button>\n    <\/div>\n    <div class=\"row\" style=\"margin-top:8px\"><label for=\"size\">Text size<\/label><input id=\"size\" type=\"range\" min=\"90\" max=\"130\" step=\"5\" value=\"100\"><\/div>\n    <div class=\"row\"><span>High contrast<\/span><button class=\"switch\" id=\"hcSw\" role=\"switch\" aria-checked=\"false\" aria-label=\"High contrast\" onclick=\"setHC()\"><i><\/i><\/button><\/div>\n  <\/div>\n  <div class=\"sec\">\n    <h3>Reminders<\/h3>\n    <div class=\"row\"><span>Morning verse<small>7:00<\/small><\/span><button class=\"switch\" role=\"switch\" aria-checked=\"true\" aria-label=\"Morning reminder\" onclick=\"flip(this)\"><i><\/i><\/button><\/div>\n    <div class=\"row\"><span>Evening reflection<small>21:00<\/small><\/span><button class=\"switch\" role=\"switch\" aria-checked=\"true\" aria-label=\"Evening reminder\" onclick=\"flip(this)\"><i><\/i><\/button><\/div>\n    <div class=\"row\"><span>Midday reading<small>Off<\/small><\/span><button class=\"switch\" role=\"switch\" aria-checked=\"false\" aria-label=\"Midday reminder\" onclick=\"flip(this)\"><i><\/i><\/button><\/div>\n  <\/div>\n<\/main>\n\n<nav aria-label=\"Main\">\n  <button data-go=\"today\" aria-current=\"page\"><svg class=\"ic\"><use href=\"#i-sun\"/><\/svg>Today<\/button>\n  <button data-go=\"bible\"><svg class=\"ic\"><use href=\"#i-book\"/><\/svg>Bible<\/button>\n  <button data-go=\"ask\"><svg class=\"ic\"><use href=\"#i-ask\"/><\/svg>Ask<\/button>\n  <button data-go=\"journey\"><svg class=\"ic\"><use href=\"#i-path\"/><\/svg>Journey<\/button>\n<\/nav>\n\n<script>\nconst $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];\nconst root=document.documentElement;\nconst reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ---------- navigation ---------- */\nlet cur='today', prev='today';\nfunction go(id){\n  if(id===cur) return;\n  if(cur==='still') stopStill();\n  prev=cur; cur=id;\n  $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));\n  document.body.dataset.screen=id;\n  $$('nav button').forEach(b=>{ if(b.dataset.go===id) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });\n  scrollTo(0,0);\n  if(id==='ask') stream();\n  if(id==='still') resetStill();\n}\nfunction back(){ go(['prayer','journal','still'].includes(prev)?'today':prev); }\n$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));\n\n/* ---------- the hours ---------- */\nconst HOURS=['morning','midday','evening','night'];\nconst THEME={morning:'dawn',midday:'day',evening:'dusk',night:'night'};\nconst NODE=[[44.75,44],[134.25,16],[223.75,44],[313.25,72]];\nconst H={\n  morning:{greet:'Good morning',eye:'This morning \u00b7 Receive',title:'Read Psalm 46',\n    sub:'Eleven verses, about two minutes. Today\u2019s verse is waiting near the end.',\n    acts:[['Open the psalm',()=>{setStudy(false);go('bible')}]]},\n  midday:{greet:'Good afternoon',eye:'At midday \u00b7 Read',title:'Look closer at verse 10',\n    sub:'Three layers: what was happening, what it means, and what the Hebrew says.',\n    acts:[['Study the verse',()=>openStudy(10)]]},\n  evening:{greet:'Good evening',eye:'This evening \u00b7 Reflect',title:'What did you carry today?',\n    sub:'Write a few lines, or share it and have a prayer written from your words.',\n    acts:[['Write in journal',()=>go('journal')],['Write a prayer',()=>go('prayer')]]},\n  night:{greet:'Good night',eye:'Tonight \u00b7 Rest',title:'One quiet minute',\n    sub:'Five slow breaths through the verse before you sleep.',\n    acts:[['Begin stillness',()=>go('still')]]}\n};\nlet hour='morning', pinned='auto';\nfunction setHour(h){\n  hour=h; const i=HOURS.indexOf(h), d=H[h];\n  root.dataset.hour=h; applyTheme();\n  $('#greet').textContent=d.greet; $('#nEyebrow').textContent=d.eye;\n  $('#nTitle').textContent=d.title; $('#nSub').textContent=d.sub;\n  const a=$('#nActs'); a.innerHTML='';\n  d.acts.forEach(([t,fn],k)=>{const b=document.createElement('button');b.className='btn'+(k?' alt':'');b.textContent=t;b.onclick=fn;a.appendChild(b)});\n  $$('.hours button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.h===h));\n  $$('.arc .node').forEach((n,k)=>{n.classList.toggle('done',k<i);n.classList.toggle('now',k===i);n.setAttribute('r',k===i?7:5)});\n  $('#halo').setAttribute('cx',NODE[i][0]); $('#halo').setAttribute('cy',NODE[i][1]);\n}\nfunction applyTheme(){ root.dataset.theme = pinned==='auto' ? THEME[hour] : pinned;\n  $$('#themes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===pinned)); }\n$$('.hours button').forEach(b=>b.onclick=()=>setHour(b.dataset.h));\n$$('#themes button').forEach(b=>b.onclick=()=>{pinned=b.dataset.t;applyTheme()});\n(function(){const n=new Date(),hr=n.getHours();\n  $('#date').textContent=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});\n  setHour(hr>=5&&hr<11?'morning':hr<16&&hr>=11?'midday':hr>=16&&hr<21?'evening':'night');})();\n\n/* ---------- reader + study ---------- */\nconst NOTES={\n 1:{context:'<p>The heading gives this song to the sons of Korah, a guild of temple singers. It was written to be sung by many voices, by people who knew what it was to have a city threatened.<\/p><p>Centuries later it gave Martin Luther the opening of \"A Mighty Fortress Is Our God\".<\/p>',\n    meaning:'<p>The psalm starts with its conclusion. Before any trouble is named, the singer says where they stand. Everything after this line is fear being measured against it.<\/p>',\n    heb:[['\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd','Elohim','God','The psalm\u2019s first word. In Hebrew, God comes before the trouble does.'],\n         ['\u05dc\u05b8\u05e0\u05d5\u05bc','lanu','for us','Not \"a refuge\" in general. Ours. The whole psalm is sung in the plural.'],\n         ['\u05de\u05b7\u05d7\u05b2\u05e1\u05b6\u05d4','machaseh','refuge','A shelter you run to, from chasah, to flee for protection. Think of a rock overhang in a storm.'],\n         ['\u05d5\u05b8\u05e2\u05b9\u05d6','va\u2019oz','and strength','Shelter is where you hide. Oz is what lets you stand up again.']],\n    note:'In Hebrew Bibles the heading counts as verse 1, so this is verse 2 there.'},\n 5:{context:'<p>Ancient cities were attacked at first light. The singer says that is exactly when help arrives.<\/p><p>The phrase echoes the Exodus, where the sea turned back on Egypt \"when the morning appeared\" (Exodus 14:27).<\/p>',\n    meaning:'<p>The city holds because of who is inside it, not because of its walls. And the help comes at the turn of the night, which means the night is real, and it ends.<\/p>',\n    heb:[['\u05d9\u05b7\u05e2\u05b0\u05d6\u05b0\u05e8\u05b6\u05d4\u05b8','ya\u2019zereha','will help her','From azar, to come alongside with aid. The same root is in the name Ebenezer, \"stone of help\".'],\n         ['\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd','Elohim','God','The helper is named in the middle of the phrase, between the need and the hour.'],\n         ['\u05dc\u05b4\u05e4\u05b0\u05e0\u05d5\u05b9\u05ea','lifnot','at the turning of','From panah, to turn. Literally the moment morning turns its face toward you.'],\n         ['\u05d1\u05b9\u05bc\u05e7\u05b6\u05e8','boker','morning','Daybreak. The exact pair of words, lifnot boker, is used of the sea in Exodus 14:27.']],\n    note:'Verse 6 in Hebrew numbering.'},\n 10:{context:'<p>The psalm has been loud: seas roaring, mountains falling, nations in uproar. Then, for the first time, God speaks.<\/p><p>His words are aimed first at the warring nations of verse 6. It is a command to cease fire before it is a comfort.<\/p>',\n    meaning:'<p>Less \"be calm\" and more \"stop\". Stillness here is surrender: setting down what you have been gripping, because the one who ends wars (verse 9) is the one speaking.<\/p><p>Knowing follows letting go. The order matters.<\/p>',\n    heb:[['\u05d4\u05b7\u05e8\u05b0\u05e4\u05bc\u05d5\u05bc','harpu','let go','From rapah: to slacken, sink, let your hands drop. A command in the plural, spoken to many at once.'],\n         ['\u05d5\u05bc\u05d3\u05b0\u05e2\u05d5\u05bc','u\u2019de\u2019u','and know','From yada: knowing by experience and relationship, the way you know a person rather than a fact.'],\n         ['\u05db\u05b4\u05bc\u05d9\u05be\u05d0\u05b8\u05e0\u05b9\u05db\u05b4\u05d9','ki anokhi','that I','Anokhi is the weightier form of \"I\", the same word that opens the Ten Commandments (Exodus 20:2).'],\n         ['\u05d0\u05b1\u05dc\u05b9\u05d4\u05b4\u05d9\u05dd','Elohim','am God','Hebrew needs no \"am\" here. The sentence simply sets \"I\" beside \"God\".']],\n    note:'Verse 11 in Hebrew numbering.'}\n};\nlet studyOn=false, selV=null, layerName='context', wordIx=0;\nconst panel=$('#panel'), text=$('#text');\nfunction setStudy(on){\n  studyOn=on; $('#bible').classList.toggle('study',on); $('#studySw').setAttribute('aria-checked',on);\n  if(!on){ selV=null; $$('.v').forEach(v=>v.classList.remove('sel')); panel.classList.remove('open'); }\n}\nfunction selectVerse(n){\n  const el=text.querySelector('.v[data-v=\"'+n+'\"]');\n  if(selV===n){ selV=null; el.classList.remove('sel'); panel.classList.remove('open'); return; }\n  selV=n; $$('.v').forEach(v=>v.classList.toggle('sel',v===el));\n  el.after(panel); panel.classList.remove('open'); void panel.offsetWidth; panel.classList.add('open');\n  $('#layersWrap').style.display=NOTES[n]?'':'none';\n  $('#saveBtn').setAttribute('aria-pressed',n===10); $('#saveBtn span').textContent=n===10?'Saved':'Save';\n  if(NOTES[n]){ wordIx=0; setLayer(layerName); }\n}\nfunction setLayer(l){\n  layerName=l; const N=NOTES[selV], box=$('#layer');\n  $$('.layers button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===l));\n  if(l!=='lens'){ box.innerHTML=N[l]; return; }\n  box.innerHTML='<div class=\"hebline\" lang=\"he\">'+N.heb.map((w,i)=>'<button data-i=\"'+i+'\" aria-pressed=\"'+(i===wordIx)+'\">'+w[0]+'<\/button>').join('')+\n    '<\/div><div class=\"gloss\"><\/div><p class=\"muted\" style=\"font-size:13px;margin-top:10px\">Tap a word. Hebrew reads right to left. '+N.note+'<\/p>';\n  box.querySelectorAll('.hebline button').forEach(b=>b.onclick=()=>{wordIx=+b.dataset.i;setLayer('lens')});\n  const w=N.heb[wordIx]; box.querySelector('.gloss').innerHTML='<b>'+w[1]+'<\/b><em>'+w[2]+'<\/em><p>'+w[3]+'<\/p>';\n}\n$$('.layers button').forEach(b=>b.onclick=()=>setLayer(b.dataset.l));\ntext.addEventListener('click',e=>{ if(!studyOn) return; if(e.target.closest('#panel')) return;\n  const v=e.target.closest('.v'); if(v) selectVerse(+v.dataset.v); });\nfunction openStudy(n){\n  setStudy(true); go('bible'); selV=null; layerName='context'; selectVerse(n);\n  setTimeout(()=>{const el=text.querySelector('.v[data-v=\"'+n+'\"]');\n    scrollTo({top:el.getBoundingClientRect().top+scrollY-90,behavior:reduce?'auto':'smooth'})},80);\n}\nfunction toggleSave(b){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.querySelector('span').textContent=on?'Saved':'Save'}\nfunction sheet(on){$('#sheet').classList.toggle('on',on);$('#scrim').classList.toggle('on',on)}\n$('#chs').innerHTML=Array.from({length:18},(_,i)=>i+37).map(n=>'<button class=\"'+(n===46?'on':'')+'\" onclick=\"sheet(false)\">'+n+'<\/button>').join('');\n\n/* ---------- ask: the answer forms word by word ---------- */\nlet streamed=false;\nfunction stream(){\n  if(streamed) return; streamed=true;\n  const units=[];\n  $('#answer').querySelectorAll('p').forEach(p=>{\n    [...p.childNodes].forEach(n=>{\n      if(n.nodeType===3){ const f=document.createDocumentFragment();\n        n.textContent.split(/(\\s+)/).forEach(t=>{ if(!t) return;\n          if(/^\\s+$/.test(t)) f.appendChild(document.createTextNode(t));\n          else{const s=document.createElement('span');s.className='w';s.textContent=t;f.appendChild(s);units.push(s)} });\n        p.replaceChild(f,n);\n      } else { n.classList.add('w'); units.push(n); }\n    });\n  });\n  const done=()=>{$('#forming').style.display='none';$('#after').classList.add('on')};\n  if(reduce){units.forEach(u=>u.classList.add('in'));done();return}\n  let i=0; const t=setInterval(()=>{ if(i>=units.length){clearInterval(t);done();return} units[i++].classList.add('in'); },42);\n}\n\n/* ---------- prayer ---------- */\nfunction writePrayer(){ const b=$('#prayBtn'); b.textContent='Writing\u2026'; b.disabled=true;\n  setTimeout(()=>{ $('#prayerOut').classList.add('on'); b.textContent='Write it another way'; b.disabled=false;\n    $('#prayerOut').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}); }, reduce?0:900); }\n\n/* ---------- stillness ---------- */\nconst MANTRA=['Be still, and know that I am God.','Be still, and know that I am.','Be still, and know.','Be still.','Be.'];\nlet stillT=null, stillI=0;\nfunction showMantra(t){const m=$('#mantra'); m.style.opacity=0; setTimeout(()=>{m.textContent=t;m.style.opacity=1},reduce?0:700)}\nfunction resetStill(){ stopStill(); stillI=0; $('#mantra').textContent=MANTRA[0]; $('#mantra').style.opacity=1;\n  $$('#steps i').forEach(i=>i.classList.remove('on')); $('#stillBtn').style.display=''; $('#stillBtn').textContent='Begin';\n  $('#breathLbl').textContent='Five breaths'; $('#stillNote').style.visibility='visible'; }\nfunction startStill(){\n  if($('#stillBtn').textContent!=='Begin'){ resetStill(); go('today'); return; }\n  $('#stillBtn').style.display='none'; $('#stillNote').style.visibility='hidden';\n  $('#breath').classList.add('go'); stillI=0; $$('#steps i')[0].classList.add('on'); cue();\n  stillT=setInterval(()=>{ stillI++;\n    if(stillI>=MANTRA.length){ stopStill(); showMantra('Amen.'); $('#breathLbl').textContent='';\n      $('#stillBtn').textContent='Return to today'; $('#stillBtn').style.display=''; return; }\n    $$('#steps i')[stillI].classList.add('on'); showMantra(MANTRA[stillI]); cue(); },10000);\n}\nlet cueT=null;\nfunction cue(){ $('#breathLbl').textContent='Breathe in'; clearTimeout(cueT); cueT=setTimeout(()=>{$('#breathLbl').textContent='Breathe out'},4000) }\nfunction stopStill(){ clearInterval(stillT); clearTimeout(cueT); stillT=null; $('#breath').classList.remove('go'); }\n\n/* ---------- journey ---------- */\nconst DAYS=['1010','1011','1000','0000','1110','1001','1010', '1010','0000','1011','1110','1000','0000','1001',\n            '1010','1110','0010','1011','0000','1000','1011', '1110','1010','0000','1011','1010','1010','1000'];\n(function(){\n  const g=$('#grid'); let html='MTWTFSS'.split('').map(d=>'<span class=\"dow\">'+d+'<\/span>').join('');\n  const TODAY=24; /* Thursday of the fourth week */\n  DAYS.forEach((d,i)=>{ html+='<div class=\"day'+(i===TODAY?' today':'')+'\"'+(i>TODAY?' style=\"opacity:.35\"':'')+'>'+\n    [...d].map(c=>'<i class=\"'+(c==='1'&&i<=TODAY?'f':'')+'\"><\/i>').join('')+'<\/div>'; });\n  g.innerHTML=html;\n  const past=DAYS.slice(0,TODAY+1), kept=past.filter(d=>d.includes('1')).length;\n  const sums=[0,1,2,3].map(k=>past.filter(d=>d[k]==='1').length), best=sums.indexOf(Math.max(...sums));\n  $('#jSummary').textContent='You showed up on '+kept+' of the last '+past.length+' days. '+\n    ['Mornings are','Midday is','Evenings are','Nights are'][best]+' your steadiest hour.';\n})();\n\n/* ---------- settings ---------- */\n$('#size').oninput=e=>root.style.setProperty('--scale',e.target.value/100);\nfunction setHC(){const on=!root.classList.contains('hc');root.classList.toggle('hc',on);$('#hcSw').setAttribute('aria-checked',on)}\nfunction flip(b){b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true')}\n<\/script>\n<\/body>\n<\/html>\n<!--\nIdea: the app keeps the hours. Instead of a menu of eight features, the day has four beats (morning receive, midday read,\nevening reflect, night rest); Home, its colours and its one prompt change with the clock, and Journey shows a rhythm, not a streak.\nStudy mode is not a separate screen: the psalm opens in place and context, meaning and the Hebrew unfold under the verse you tap.\n-->\n"}, {"letter": "B", "seat": "flash", "file": "mockup.html", "html": "<!-- Model: Gemini 3.8 Flash -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n  <title>Eliana's Rhythm - Devotional Companion<\/title>\n  <style>\n    :root {\n      /* Theme: Parchment Dawn (Default) */\n      --bg-page: #fbf9f5;\n      --bg-card: #ffffff;\n      --bg-card-subtle: #f4efe6;\n      --bg-accent-soft: #efe8dc;\n      --border-color: #e8e0d2;\n      --text-main: #24211e;\n      --text-muted: #6b645c;\n      --text-faint: #9c9388;\n      --accent: #8b5e34;\n      --accent-rgb: 139, 94, 52;\n      --accent-gold: #c29b38;\n      --accent-sage: #5b7058;\n      --hebrew-color: #7a3e1d;\n      --hebrew-font: \"SBL Hebrew\", \"David\", \"Times New Roman\", serif;\n      --serif: \"Georgia\", \"Iowan Old Style\", \"Palatino\", serif;\n      --sans: -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Segoe UI\", Roboto, sans-serif;\n      --font-scale: 1;\n      --shadow-sm: 0 2px 8px rgba(36, 33, 30, 0.04);\n      --shadow-md: 0 6px 20px rgba(36, 33, 30, 0.08);\n      --bottom-nav-bg: rgba(251, 249, 245, 0.92);\n    }\n\n    /* Sabbath Night Theme */\n    body.theme-night {\n      --bg-page: #131518;\n      --bg-card: #1c1f24;\n      --bg-card-subtle: #242930;\n      --bg-accent-soft: #2d333d;\n      --border-color: #313742;\n      --text-main: #f0ede8;\n      --text-muted: #a4abb8;\n      --text-faint: #6e7687;\n      --accent: #d4a366;\n      --accent-rgb: 212, 163, 102;\n      --accent-gold: #e2ba6d;\n      --accent-sage: #88a883;\n      --hebrew-color: #e5b376;\n      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);\n      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.45);\n      --bottom-nav-bg: rgba(19, 21, 24, 0.94);\n    }\n\n    /* Olive Grove Theme */\n    body.theme-olive {\n      --bg-page: #f5f6f2;\n      --bg-card: #ffffff;\n      --bg-card-subtle: #eaede4;\n      --bg-accent-soft: #dce2d4;\n      --border-color: #d2dbca;\n      --text-main: #20271e;\n      --text-muted: #596654;\n      --text-faint: #899684;\n      --accent: #496342;\n      --accent-rgb: 73, 99, 66;\n      --accent-gold: #b38b32;\n      --accent-sage: #526f4c;\n      --hebrew-color: #496342;\n      --bottom-nav-bg: rgba(245, 246, 242, 0.94);\n    }\n\n    /* High Contrast Accessibility Theme */\n    body.theme-contrast {\n      --bg-page: #000000;\n      --bg-card: #121212;\n      --bg-card-subtle: #1e1e1e;\n      --bg-accent-soft: #2a2a2a;\n      --border-color: #ffffff;\n      --text-main: #ffffff;\n      --text-muted: #e0e0e0;\n      --text-faint: #bbbbbb;\n      --accent: #ffdb70;\n      --accent-rgb: 255, 219, 112;\n      --accent-gold: #ffe082;\n      --accent-sage: #81c784;\n      --hebrew-color: #ffd54f;\n      --bottom-nav-bg: #000000;\n    }\n\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n      -webkit-tap-highlight-color: transparent;\n    }\n\n    body {\n      background-color: var(--bg-page);\n      color: var(--text-main);\n      font-family: var(--sans);\n      display: flex;\n      justify-content: center;\n      align-items: flex-start;\n      min-height: 100vh;\n      overflow-x: hidden;\n      transition: background-color 0.3s ease, color 0.3s ease;\n    }\n\n    /* Phone Shell (390 x 844 target) */\n    .phone-container {\n      width: 100%;\n      max-width: 390px;\n      min-height: 844px;\n      height: 100vh;\n      position: relative;\n      display: flex;\n      flex-direction: column;\n      background-color: var(--bg-page);\n      overflow: hidden;\n      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);\n    }\n\n    @media (max-width: 420px) {\n      .phone-container {\n        height: 100vh;\n        max-width: 100%;\n        box-shadow: none;\n      }\n    }\n\n    /* Status Bar */\n    .status-bar {\n      height: 44px;\n      padding: 12px 24px 0 24px;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      font-size: 14px;\n      font-weight: 600;\n      letter-spacing: -0.2px;\n      color: var(--text-main);\n      z-index: 50;\n      flex-shrink: 0;\n    }\n\n    .status-icons {\n      display: flex;\n      gap: 6px;\n      align-items: center;\n    }\n\n    .status-icons svg {\n      width: 16px;\n      height: 16px;\n      fill: currentColor;\n    }\n\n    /* Top Bar Controls */\n    .top-header {\n      padding: 4px 18px 10px 18px;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      flex-shrink: 0;\n      z-index: 40;\n    }\n\n    .brand-mark {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n    }\n\n    .brand-badge {\n      width: 28px;\n      height: 28px;\n      border-radius: 9px;\n      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-gold) 100%);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      color: #fff;\n      font-family: var(--serif);\n      font-weight: bold;\n      font-size: 15px;\n      box-shadow: 0 2px 6px rgba(var(--accent-rgb), 0.35);\n    }\n\n    .brand-title {\n      font-family: var(--serif);\n      font-size: 17px;\n      font-weight: 600;\n      color: var(--text-main);\n      letter-spacing: -0.3px;\n    }\n\n    .header-actions {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n    }\n\n    .header-btn {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      color: var(--text-muted);\n      width: 32px;\n      height: 32px;\n      border-radius: 50%;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      cursor: pointer;\n      transition: all 0.2s;\n    }\n\n    .header-btn:active {\n      transform: scale(0.92);\n      background: var(--bg-accent-soft);\n    }\n\n    .header-btn svg {\n      width: 16px;\n      height: 16px;\n      stroke: currentColor;\n      fill: none;\n      stroke-width: 2;\n    }\n\n    /* Screen Viewport */\n    .screens-wrapper {\n      flex: 1;\n      position: relative;\n      overflow-y: auto;\n      overflow-x: hidden;\n      padding-bottom: 96px; /* space for bottom dock */\n      -webkit-overflow-scrolling: touch;\n      scroll-behavior: smooth;\n    }\n\n    .screens-wrapper::-webkit-scrollbar {\n      display: none;\n    }\n\n    .screen {\n      display: none;\n      padding: 12px 18px 24px 18px;\n      animation: fadeIn 0.25s ease-out;\n    }\n\n    .screen.active {\n      display: block;\n    }\n\n    @keyframes fadeIn {\n      from { opacity: 0; transform: translateY(6px); }\n      to { opacity: 1; transform: translateY(0); }\n    }\n\n    /* Typography & Utilities */\n    .serif-title {\n      font-family: var(--serif);\n      font-weight: 500;\n      color: var(--text-main);\n      line-height: 1.25;\n    }\n\n    .sub-caption {\n      font-size: 12px;\n      text-transform: uppercase;\n      letter-spacing: 1px;\n      color: var(--accent);\n      font-weight: 600;\n      margin-bottom: 6px;\n      display: flex;\n      align-items: center;\n      gap: 6px;\n    }\n\n    /* Card System */\n    .sanctuary-card {\n      background-color: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 20px;\n      padding: 20px;\n      margin-bottom: 16px;\n      box-shadow: var(--shadow-sm);\n      position: relative;\n      transition: transform 0.2s, box-shadow 0.2s;\n    }\n\n    /* Time & Diurnal Rhythm Bar */\n    .rhythm-bar {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      background: var(--bg-card-subtle);\n      border-radius: 14px;\n      padding: 8px 14px;\n      margin-bottom: 16px;\n      border: 1px solid var(--border-color);\n    }\n\n    .rhythm-time-node {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      font-size: 13px;\n      font-weight: 500;\n      color: var(--text-muted);\n    }\n\n    .rhythm-pulse-dot {\n      width: 8px;\n      height: 8px;\n      border-radius: 50%;\n      background-color: var(--accent-sage);\n      box-shadow: 0 0 0 3px rgba(91, 112, 88, 0.2);\n      animation: pulse 2.5s infinite;\n    }\n\n    @keyframes pulse {\n      0% { box-shadow: 0 0 0 0 rgba(91, 112, 88, 0.4); }\n      70% { box-shadow: 0 0 0 6px rgba(91, 112, 88, 0); }\n      100% { box-shadow: 0 0 0 0 rgba(91, 112, 88, 0); }\n    }\n\n    .rhythm-phase-badge {\n      font-size: 11px;\n      padding: 3px 8px;\n      border-radius: 10px;\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      font-weight: 600;\n      color: var(--accent);\n    }\n\n    /* Daily Verse Highlight Hero Card */\n    .daily-verse-hero {\n      position: relative;\n      background: linear-gradient(175deg, var(--bg-card) 0%, var(--bg-card-subtle) 100%);\n      border: 1px solid var(--border-color);\n      border-radius: 24px;\n      padding: 24px 22px 20px 22px;\n      box-shadow: var(--shadow-md);\n      margin-bottom: 16px;\n      overflow: hidden;\n    }\n\n    .daily-verse-hero::after {\n      content: \"\u05f4\";\n      position: absolute;\n      right: 14px;\n      top: -15px;\n      font-size: 110px;\n      font-family: var(--serif);\n      color: var(--accent);\n      opacity: 0.08;\n      pointer-events: none;\n    }\n\n    .verse-text-hero {\n      font-family: var(--serif);\n      font-size: 21px;\n      line-height: 1.5;\n      color: var(--text-main);\n      font-style: italic;\n      margin-bottom: 12px;\n      position: relative;\n      z-index: 2;\n    }\n\n    .verse-ref-row {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      border-top: 1px solid var(--border-color);\n      padding-top: 14px;\n      margin-top: 12px;\n    }\n\n    .verse-reference {\n      font-size: 14px;\n      font-weight: 600;\n      color: var(--accent);\n      letter-spacing: -0.2px;\n    }\n\n    .verse-actions-pill {\n      display: flex;\n      gap: 6px;\n    }\n\n    .icon-action-btn {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      color: var(--text-muted);\n      padding: 6px 10px;\n      border-radius: 20px;\n      font-size: 12px;\n      display: flex;\n      align-items: center;\n      gap: 5px;\n      cursor: pointer;\n      transition: all 0.2s;\n    }\n\n    .icon-action-btn:active {\n      transform: scale(0.95);\n      background: var(--bg-accent-soft);\n    }\n\n    .icon-action-btn svg {\n      width: 14px;\n      height: 14px;\n      stroke: currentColor;\n      fill: none;\n      stroke-width: 2;\n    }\n\n    /* The Priestly Blessing Card */\n    .blessing-card {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 20px;\n      padding: 20px;\n      margin-bottom: 16px;\n      position: relative;\n    }\n\n    .blessing-header {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      margin-bottom: 12px;\n    }\n\n    .hebrew-toggle-btn {\n      font-size: 11px;\n      padding: 4px 10px;\n      border-radius: 12px;\n      background: var(--bg-card-subtle);\n      border: 1px solid var(--border-color);\n      color: var(--accent);\n      font-weight: 600;\n      cursor: pointer;\n      display: flex;\n      align-items: center;\n      gap: 4px;\n    }\n\n    .hebrew-scripture-box {\n      direction: rtl;\n      font-family: var(--hebrew-font);\n      font-size: 21px;\n      line-height: 1.8;\n      color: var(--hebrew-color);\n      background: var(--bg-card-subtle);\n      padding: 14px 16px;\n      border-radius: 14px;\n      margin-bottom: 12px;\n      border-right: 3px solid var(--accent-gold);\n      letter-spacing: 0.5px;\n      transition: all 0.3s ease;\n    }\n\n    .blessing-english {\n      font-family: var(--serif);\n      font-size: 15px;\n      line-height: 1.6;\n      color: var(--text-main);\n      margin-bottom: 10px;\n    }\n\n    .blessing-foot {\n      font-size: 12px;\n      color: var(--text-muted);\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n    }\n\n    /* The Gentle Next Step Card */\n    .gentle-prompt-card {\n      background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.08) 0%, var(--bg-card) 100%);\n      border: 1px solid rgba(var(--accent-rgb), 0.25);\n      border-radius: 20px;\n      padding: 18px 20px;\n      margin-bottom: 16px;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      cursor: pointer;\n      transition: all 0.2s;\n    }\n\n    .gentle-prompt-card:active {\n      transform: scale(0.98);\n    }\n\n    .gentle-left {\n      display: flex;\n      align-items: center;\n      gap: 14px;\n    }\n\n    .gentle-icon-bubble {\n      width: 44px;\n      height: 44px;\n      border-radius: 14px;\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      color: var(--accent);\n      flex-shrink: 0;\n      box-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.15);\n    }\n\n    .gentle-icon-bubble svg {\n      width: 22px;\n      height: 22px;\n      stroke: currentColor;\n      fill: none;\n      stroke-width: 2;\n    }\n\n    .gentle-title {\n      font-size: 15px;\n      font-weight: 600;\n      color: var(--text-main);\n      margin-bottom: 2px;\n    }\n\n    .gentle-desc {\n      font-size: 12px;\n      color: var(--text-muted);\n    }\n\n    .gentle-arrow {\n      color: var(--accent);\n    }\n\n    /* Quick Cadence Grid */\n    .cadence-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 12px;\n      margin-bottom: 20px;\n    }\n\n    .cadence-card {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 16px;\n      padding: 14px;\n      cursor: pointer;\n      transition: all 0.2s;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      min-height: 96px;\n    }\n\n    .cadence-card:active {\n      transform: scale(0.97);\n      background: var(--bg-card-subtle);\n    }\n\n    .cadence-card-top {\n      display: flex;\n      justify-content: space-between;\n      align-items: flex-start;\n      margin-bottom: 10px;\n    }\n\n    .cadence-icon {\n      width: 32px;\n      height: 32px;\n      border-radius: 10px;\n      background: var(--bg-card-subtle);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      color: var(--accent);\n    }\n\n    .cadence-icon svg {\n      width: 17px;\n      height: 17px;\n      stroke: currentColor;\n      fill: none;\n      stroke-width: 2;\n    }\n\n    .cadence-badge {\n      font-size: 10px;\n      font-weight: 600;\n      padding: 2px 6px;\n      border-radius: 6px;\n      background: var(--bg-accent-soft);\n      color: var(--accent);\n    }\n\n    .cadence-name {\n      font-size: 13px;\n      font-weight: 600;\n      color: var(--text-main);\n      margin-bottom: 2px;\n    }\n\n    .cadence-hint {\n      font-size: 11px;\n      color: var(--text-faint);\n    }\n\n    /* ============================================================\n       BIBLE READER & STUDY MODE SCREEN\n       ============================================================ */\n    .reader-toolbar {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 18px;\n      padding: 8px 14px;\n      margin-bottom: 16px;\n      box-shadow: var(--shadow-sm);\n      position: sticky;\n      top: 0;\n      z-index: 30;\n    }\n\n    .passage-picker-btn {\n      display: flex;\n      align-items: center;\n      gap: 6px;\n      background: none;\n      border: none;\n      font-family: var(--serif);\n      font-size: 17px;\n      font-weight: 600;\n      color: var(--text-main);\n      cursor: pointer;\n    }\n\n    .passage-picker-btn svg {\n      width: 14px;\n      height: 14px;\n      stroke: var(--accent);\n      fill: none;\n      stroke-width: 2.5;\n    }\n\n    /* Study Mode Switcher (Tactile Toggle) */\n    .study-switch-wrapper {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      background: var(--bg-card-subtle);\n      padding: 4px 6px 4px 10px;\n      border-radius: 20px;\n      border: 1px solid var(--border-color);\n    }\n\n    .study-label {\n      font-size: 11px;\n      font-weight: 700;\n      letter-spacing: 0.5px;\n      text-transform: uppercase;\n      color: var(--text-muted);\n      transition: color 0.2s;\n    }\n\n    .study-label.active-label {\n      color: var(--accent);\n    }\n\n    .toggle-pill {\n      position: relative;\n      width: 44px;\n      height: 24px;\n      background: #cfc8bd;\n      border-radius: 12px;\n      cursor: pointer;\n      transition: background 0.3s;\n    }\n\n    .toggle-pill.checked {\n      background: var(--accent);\n    }\n\n    .toggle-knob {\n      position: absolute;\n      top: 2px;\n      left: 2px;\n      width: 20px;\n      height: 20px;\n      background: #fff;\n      border-radius: 50%;\n      box-shadow: 0 1px 4px rgba(0,0,0,0.25);\n      transition: transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);\n    }\n\n    .toggle-pill.checked .toggle-knob {\n      transform: translateX(20px);\n    }\n\n    /* Study Mode Active Indicator Banner */\n    .study-banner {\n      display: none;\n      background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.12), transparent);\n      border-left: 3px solid var(--accent);\n      padding: 8px 12px;\n      border-radius: 8px;\n      font-size: 12px;\n      color: var(--accent);\n      margin-bottom: 14px;\n      animation: fadeIn 0.3s;\n    }\n\n    .study-banner.visible {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n    }\n\n    /* Bible Text Styling */\n    .bible-viewport {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 24px;\n      padding: 26px 20px;\n      box-shadow: var(--shadow-sm);\n      margin-bottom: 20px;\n      position: relative;\n    }\n\n    .chapter-header {\n      text-align: center;\n      margin-bottom: 20px;\n      border-bottom: 1px solid var(--border-color);\n      padding-bottom: 14px;\n    }\n\n    .chapter-super {\n      font-size: 11px;\n      letter-spacing: 2px;\n      text-transform: uppercase;\n      color: var(--text-faint);\n      margin-bottom: 4px;\n    }\n\n    .chapter-main-title {\n      font-family: var(--serif);\n      font-size: 22px;\n      color: var(--text-main);\n      font-weight: normal;\n    }\n\n    .scripture-flow {\n      font-family: var(--serif);\n      font-size: calc(18px * var(--font-scale));\n      line-height: 1.85;\n      color: var(--text-main);\n      transition: font-size 0.2s ease;\n    }\n\n    .verse-segment {\n      position: relative;\n      padding: 3px 4px;\n      border-radius: 6px;\n      transition: all 0.2s;\n      cursor: pointer;\n      display: inline;\n    }\n\n    .verse-num {\n      font-family: var(--sans);\n      font-size: 10px;\n      font-weight: 700;\n      color: var(--accent);\n      vertical-align: super;\n      margin-right: 3px;\n      opacity: 0.75;\n      user-select: none;\n    }\n\n    /* Study Mode Highlights & Hotspots */\n    .study-mode-on .verse-segment.has-study {\n      background: rgba(var(--accent-rgb), 0.08);\n      border-bottom: 2px solid var(--accent);\n      margin: 0 1px;\n      padding-bottom: 1px;\n    }\n\n    .study-mode-on .verse-segment.has-study:hover,\n    .study-mode-on .verse-segment.has-study.selected-verse {\n      background: rgba(var(--accent-rgb), 0.18);\n    }\n\n    .study-tag-glyph {\n      display: none;\n      font-family: var(--sans);\n      font-size: 9px;\n      font-weight: 800;\n      color: #ffffff;\n      background: var(--accent);\n      border-radius: 4px;\n      padding: 1px 4px;\n      margin-left: 4px;\n      vertical-align: middle;\n      cursor: pointer;\n    }\n\n    .study-mode-on .study-tag-glyph {\n      display: inline-block;\n    }\n\n    /* Inline Study Drawer / Deeper Lens Sheet */\n    .study-drawer {\n      display: none;\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 20px;\n      margin-top: 14px;\n      padding: 18px;\n      box-shadow: var(--shadow-md);\n      animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);\n    }\n\n    .study-drawer.open {\n      display: block;\n    }\n\n    @keyframes slideDown {\n      from { opacity: 0; transform: translateY(-10px); }\n      to { opacity: 1; transform: translateY(0); }\n    }\n\n    .study-drawer-header {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 14px;\n      border-bottom: 1px solid var(--border-color);\n      padding-bottom: 10px;\n    }\n\n    .study-verse-title {\n      font-family: var(--serif);\n      font-size: 16px;\n      font-weight: 600;\n      color: var(--accent);\n    }\n\n    .study-tabs-nav {\n      display: flex;\n      gap: 6px;\n      background: var(--bg-card-subtle);\n      padding: 3px;\n      border-radius: 12px;\n      margin-bottom: 14px;\n    }\n\n    .study-tab-btn {\n      flex: 1;\n      text-align: center;\n      font-size: 12px;\n      font-weight: 600;\n      padding: 6px 4px;\n      border-radius: 9px;\n      background: none;\n      border: none;\n      color: var(--text-muted);\n      cursor: pointer;\n      transition: all 0.2s;\n    }\n\n    .study-tab-btn.active {\n      background: var(--bg-card);\n      color: var(--text-main);\n      box-shadow: 0 1px 4px rgba(0,0,0,0.06);\n    }\n\n    .study-tab-content {\n      display: none;\n      font-size: 13.5px;\n      line-height: 1.65;\n      color: var(--text-main);\n    }\n\n    .study-tab-content.active {\n      display: block;\n    }\n\n    /* Deeper Hebrew Lens Card */\n    .hebrew-word-card {\n      background: var(--bg-card-subtle);\n      border: 1px solid var(--border-color);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 10px;\n    }\n\n    .hebrew-word-header {\n      display: flex;\n      justify-content: space-between;\n      align-items: baseline;\n      margin-bottom: 6px;\n    }\n\n    .hebrew-lemma {\n      font-family: var(--hebrew-font);\n      font-size: 26px;\n      color: var(--hebrew-color);\n      direction: rtl;\n    }\n\n    .hebrew-translit {\n      font-family: var(--serif);\n      font-style: italic;\n      font-size: 14px;\n      color: var(--text-muted);\n    }\n\n    .hebrew-definition {\n      font-size: 13px;\n      color: var(--text-main);\n      margin-bottom: 8px;\n    }\n\n    .hebrew-deeper-insight {\n      font-size: 12px;\n      color: var(--text-muted);\n      background: var(--bg-card);\n      padding: 10px 12px;\n      border-radius: 10px;\n      border-left: 3px solid var(--accent-gold);\n      line-height: 1.55;\n    }\n\n    /* ============================================================\n       ASK / CHAT SCREEN (Faith Guide)\n       ============================================================ */\n    .chat-header-banner {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 18px;\n      padding: 16px;\n      margin-bottom: 16px;\n      display: flex;\n      align-items: center;\n      gap: 12px;\n    }\n\n    .companion-avatar {\n      width: 44px;\n      height: 44px;\n      border-radius: 50%;\n      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-gold) 100%);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      color: #fff;\n    }\n\n    .companion-avatar svg {\n      width: 22px;\n      height: 22px;\n      stroke: currentColor;\n      fill: none;\n      stroke-width: 2;\n    }\n\n    .chat-messages {\n      display: flex;\n      flex-direction: column;\n      gap: 14px;\n      margin-bottom: 16px;\n    }\n\n    .chat-bubble {\n      max-width: 86%;\n      padding: 14px 16px;\n      border-radius: 18px;\n      font-size: 14px;\n      line-height: 1.55;\n      position: relative;\n    }\n\n    .chat-bubble.user {\n      align-self: flex-end;\n      background: var(--accent);\n      color: #ffffff;\n      border-bottom-right-radius: 4px;\n    }\n\n    .chat-bubble.assistant {\n      align-self: flex-start;\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      color: var(--text-main);\n      border-bottom-left-radius: 4px;\n      box-shadow: var(--shadow-sm);\n    }\n\n    .scripture-pill-link {\n      display: inline-flex;\n      align-items: center;\n      gap: 4px;\n      background: var(--bg-card-subtle);\n      border: 1px solid var(--border-color);\n      color: var(--accent);\n      font-size: 11px;\n      font-weight: 600;\n      padding: 3px 8px;\n      border-radius: 12px;\n      margin-top: 8px;\n      margin-right: 4px;\n      cursor: pointer;\n    }\n\n    .suggested-questions-row {\n      display: flex;\n      flex-direction: column;\n      gap: 8px;\n      margin-bottom: 16px;\n    }\n\n    .suggest-chip {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 14px;\n      padding: 10px 14px;\n      font-size: 12.5px;\n      color: var(--text-muted);\n      cursor: pointer;\n      text-align: left;\n      transition: all 0.2s;\n    }\n\n    .suggest-chip:active {\n      transform: scale(0.98);\n      border-color: var(--accent);\n      color: var(--text-main);\n    }\n\n    .chat-input-bar {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 24px;\n      padding: 6px 8px 6px 16px;\n      box-shadow: var(--shadow-sm);\n    }\n\n    .chat-input-field {\n      flex: 1;\n      border: none;\n      background: transparent;\n      font-size: 14px;\n      color: var(--text-main);\n      outline: none;\n      font-family: inherit;\n    }\n\n    .chat-send-btn {\n      width: 36px;\n      height: 36px;\n      border-radius: 50%;\n      background: var(--accent);\n      border: none;\n      color: #fff;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      cursor: pointer;\n      transition: transform 0.2s;\n    }\n\n    .chat-send-btn:active {\n      transform: scale(0.9);\n    }\n\n    .chat-send-btn svg {\n      width: 16px;\n      height: 16px;\n      stroke: currentColor;\n      fill: none;\n      stroke-width: 2.2;\n    }\n\n    /* ============================================================\n       JOURNAL & PRAYER SCREEN\n       ============================================================ */\n    .journal-entry-card {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 20px;\n      padding: 18px;\n      margin-bottom: 14px;\n      box-shadow: var(--shadow-sm);\n    }\n\n    .journal-date-tag {\n      font-size: 11px;\n      font-weight: 700;\n      text-transform: uppercase;\n      letter-spacing: 0.5px;\n      color: var(--accent);\n      margin-bottom: 6px;\n    }\n\n    .journal-body-text {\n      font-family: var(--serif);\n      font-size: 15px;\n      line-height: 1.6;\n      color: var(--text-main);\n      margin-bottom: 12px;\n    }\n\n    .journal-verse-anchor {\n      display: flex;\n      align-items: center;\n      gap: 6px;\n      background: var(--bg-card-subtle);\n      padding: 6px 12px;\n      border-radius: 12px;\n      font-size: 12px;\n      color: var(--text-muted);\n      border: 1px solid var(--border-color);\n    }\n\n    .prayer-maker-card {\n      background: linear-gradient(145deg, var(--bg-card), var(--bg-card-subtle));\n      border: 1px dashed var(--accent);\n      border-radius: 20px;\n      padding: 18px;\n      margin-bottom: 16px;\n    }\n\n    .prayer-result-box {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 14px;\n      padding: 14px;\n      margin-top: 12px;\n      font-family: var(--serif);\n      font-style: italic;\n      font-size: 14px;\n      line-height: 1.65;\n      color: var(--text-main);\n    }\n\n    /* ============================================================\n       JOURNEY / PROGRESS SCREEN\n       ============================================================ */\n    .journey-stat-row {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 10px;\n      margin-bottom: 18px;\n    }\n\n    .stat-box {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 16px;\n      padding: 14px 10px;\n      text-align: center;\n    }\n\n    .stat-num {\n      font-family: var(--serif);\n      font-size: 22px;\n      font-weight: bold;\n      color: var(--accent);\n      margin-bottom: 2px;\n    }\n\n    .stat-label {\n      font-size: 11px;\n      color: var(--text-muted);\n      text-transform: uppercase;\n      letter-spacing: 0.5px;\n    }\n\n    .rhythm-wave-card {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      border-radius: 20px;\n      padding: 18px;\n      margin-bottom: 16px;\n    }\n\n    .week-dots-row {\n      display: flex;\n      justify-content: space-between;\n      margin-top: 14px;\n    }\n\n    .day-dot-item {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      gap: 6px;\n    }\n\n    .day-circle {\n      width: 32px;\n      height: 32px;\n      border-radius: 50%;\n      background: var(--bg-card-subtle);\n      border: 1px solid var(--border-color);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-size: 11px;\n      font-weight: 600;\n      color: var(--text-muted);\n    }\n\n    .day-circle.filled {\n      background: var(--accent);\n      color: #fff;\n      border-color: var(--accent);\n    }\n\n    .day-circle.today {\n      border: 2px solid var(--accent-gold);\n    }\n\n    .day-label {\n      font-size: 10px;\n      color: var(--text-faint);\n    }\n\n    /* ============================================================\n       STILLNESS SCREEN (Guided Quiet Moment)\n       ============================================================ */\n    .stillness-container {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      min-height: 480px;\n      text-align: center;\n      padding: 20px 10px;\n    }\n\n    .breath-orb-wrap {\n      position: relative;\n      width: 220px;\n      height: 220px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      margin-bottom: 28px;\n    }\n\n    .breath-outer-ring {\n      position: absolute;\n      width: 210px;\n      height: 210px;\n      border-radius: 50%;\n      border: 1.5px dashed var(--accent-gold);\n      opacity: 0.4;\n      animation: slowRotate 30s linear infinite;\n    }\n\n    @keyframes slowRotate {\n      from { transform: rotate(0deg); }\n      to { transform: rotate(360deg); }\n    }\n\n    .breath-orb {\n      width: 150px;\n      height: 150px;\n      border-radius: 50%;\n      background: radial-gradient(circle at 35% 35%, var(--accent-gold) 0%, var(--accent) 70%, var(--bg-card) 100%);\n      box-shadow: 0 0 35px rgba(var(--accent-rgb), 0.35);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      color: #ffffff;\n      font-family: var(--serif);\n      font-size: 16px;\n      font-weight: 500;\n      letter-spacing: 0.5px;\n      transition: transform 4s cubic-bezier(0.4, 0, 0.2, 1);\n    }\n\n    .breath-orb.inhale {\n      transform: scale(1.3);\n      box-shadow: 0 0 60px rgba(var(--accent-rgb), 0.55);\n    }\n\n    .breath-orb.exhale {\n      transform: scale(0.9);\n      box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.2);\n    }\n\n    .stillness-scripture-anchor {\n      font-family: var(--serif);\n      font-size: 20px;\n      font-style: italic;\n      color: var(--text-main);\n      margin-bottom: 8px;\n      max-width: 300px;\n    }\n\n    .stillness-subtitle {\n      font-size: 13px;\n      color: var(--text-muted);\n      margin-bottom: 24px;\n    }\n\n    .breath-controls {\n      display: flex;\n      gap: 12px;\n    }\n\n    .breath-btn {\n      background: var(--bg-card);\n      border: 1px solid var(--border-color);\n      color: var(--text-main);\n      padding: 10px 22px;\n      border-radius: 24px;\n      font-size: 13px;\n      font-weight: 600;\n      cursor: pointer;\n      display: flex;\n      align-items: center;\n      gap: 6px;\n      box-shadow: var(--shadow-sm);\n      transition: all 0.2s;\n    }\n\n    .breath-btn.primary {\n      background: var(--accent);\n      color: #fff;\n      border-color: var(--accent);\n    }\n\n    /* ============================================================\n       SETTINGS / THEME DRAWER (MODAL OVERLAY)\n       ============================================================ */\n    .settings-modal {\n      display: none;\n      position: absolute;\n      inset: 0;\n      background: rgba(0, 0, 0, 0.5);\n      backdrop-filter: blur(4px);\n      z-index: 100;\n      align-items: flex-end;\n    }\n\n    .settings-modal.open {\n      display: flex;\n    }\n\n    .settings-sheet {\n      width: 100%;\n      background: var(--bg-card);\n      border-top-left-radius: 28px;\n      border-top-right-radius: 28px;\n      padding: 24px 20px 32px 20px;\n      border: 1px solid var(--border-color);\n      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.25);\n      animation: sheetUp 0.25s ease-out;\n    }\n\n    @keyframes sheetUp {\n      from { transform: translateY(100%); }\n      to { transform: translateY(0); }\n    }\n\n    .sheet-handle {\n      width: 36px;\n      height: 4px;\n      background: var(--border-color);\n      border-radius: 2px;\n      margin: 0 auto 18px auto;\n    }\n\n    .sheet-title {\n      font-family: var(--serif);\n      font-size: 18px;\n      margin-bottom: 16px;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n    }\n\n    .theme-selector-grid {\n      display: grid;\n      grid-template-columns: repeat(4, 1fr);\n      gap: 8px;\n      margin-bottom: 20px;\n    }\n\n    .theme-chip {\n      padding: 10px 6px;\n      border-radius: 14px;\n      border: 2px solid var(--border-color);\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      gap: 6px;\n      cursor: pointer;\n      font-size: 11px;\n      font-weight: 600;\n      background: var(--bg-card-subtle);\n      color: var(--text-muted);\n    }\n\n    .theme-chip.active {\n      border-color: var(--accent);\n      color: var(--text-main);\n      background: var(--bg-card);\n    }\n\n    .theme-color-dot {\n      width: 22px;\n      height: 22px;\n      border-radius: 50%;\n      border: 1px solid rgba(0,0,0,0.15);\n    }\n\n    .font-size-slider-wrap {\n      display: flex;\n      align-items: center;\n      gap: 12px;\n      margin-bottom: 18px;\n    }\n\n    .font-size-slider-wrap input[type=\"range\"] {\n      flex: 1;\n      accent-color: var(--accent);\n    }\n\n    /* ============================================================\n       BOTTOM DOCK / PERSISTENT NAVIGATION\n       ============================================================ */\n    .bottom-nav-dock {\n      position: absolute;\n      bottom: 0;\n      left: 0;\n      right: 0;\n      height: 78px;\n      background: var(--bottom-nav-bg);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      border-top: 1px solid var(--border-color);\n      display: flex;\n      justify-content: space-around;\n      align-items: center;\n      padding: 0 8px 10px 8px;\n      z-index: 50;\n    }\n\n    .nav-item {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      gap: 4px;\n      background: none;\n      border: none;\n      color: var(--text-muted);\n      cursor: pointer;\n      padding: 6px 12px;\n      border-radius: 16px;\n      transition: all 0.2s;\n    }\n\n    .nav-item.active {\n      color: var(--accent);\n    }\n\n    .nav-item svg {\n      width: 20px;\n      height: 20px;\n      stroke: currentColor;\n      fill: none;\n      stroke-width: 2;\n      transition: transform 0.2s;\n    }\n\n    .nav-item.active svg {\n      transform: translateY(-2px);\n      stroke-width: 2.3;\n    }\n\n    .nav-label {\n      font-size: 10px;\n      font-weight: 600;\n      letter-spacing: 0.2px;\n    }\n  <\/style>\n<\/head>\n<body>\n\n<div class=\"phone-container\" id=\"appRoot\">\n\n  <!-- Status Bar (iOS standard 44px) -->\n  <div class=\"status-bar\">\n    <span id=\"liveClock\">9:41<\/span>\n    <div class=\"status-icons\">\n      <!-- Cellular Signal -->\n      <svg viewBox=\"0 0 24 24\"><path d=\"M2 20h2v-4H2v4zm4 0h2v-8H6v8zm4 0h2v-12h-2v12zm4 0h2V4h-2v16z\"/><\/svg>\n      <!-- WiFi -->\n      <svg viewBox=\"0 0 24 24\"><path d=\"M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.8 0 7.23 1.54 9.72 4.03L12 19.3 2.28 11.53C4.77 9.04 8.2 7.5 12 7.5z\"/><\/svg>\n      <!-- Battery -->\n      <svg viewBox=\"0 0 24 24\"><path d=\"M17 6H4c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h13c1.1 0 2-.9 2-2v-1h1c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1h-1V8c0-1.1-.9-2-2-2zm0 10H4V8h13v8z\"/><\/svg>\n    <\/div>\n  <\/div>\n\n  <!-- Top Header Bar -->\n  <header class=\"top-header\">\n    <div class=\"brand-mark\">\n      <div class=\"brand-badge\">\u05d0<\/div>\n      <div>\n        <div class=\"brand-title\">Eliana\u2019s Rhythm<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"header-actions\">\n      <!-- Audio listen quick-toggle -->\n      <button class=\"header-btn\" title=\"Audio Chime / Spoken Word\" id=\"audioChime
